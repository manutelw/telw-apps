<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":98,"localNo":9,"title":"Buying and Selling","aim":"Handle purchases, returns and complaints, compare options, and explain advantages and disadvantages clearly.","keyPoints":[{"label":"Purchasing language","heading":"Talk through a purchase from order to refund","chips":["place an order","confirm","dispatch","deliver","invoice","refund","exchange","cancel"],"teach":"Learn purchasing language as a process. One action normally leads to another: order, confirmation, dispatch, delivery, and sometimes return, exchange or refund.","model":"I placed the order on Monday, received confirmation the same day, and asked for a refund when the item arrived damaged.","listenFor":"Listen for the stages of the purchase and the problem that changes the process.","notice":"Use verbs for actions and nouns when you name the stage: confirm/confirmation, deliver/delivery, cancel/cancellation, refund/refund.","passage":[{"speaker":"Customer","text":"Hi. I placed an order three days ago, but I have not received a dispatch message."},{"speaker":"Agent","text":"Let me check. Yes, your payment was confirmed, but the item has not left our warehouse yet."},{"speaker":"Customer","text":"Can I cancel it before it is sent?"},{"speaker":"Agent","text":"Yes. I can cancel the order now and arrange a full refund."},{"speaker":"Customer","text":"How long will the refund take?"},{"speaker":"Agent","text":"Usually three to five working days. You will get an email confirmation today."},{"speaker":"Customer","text":"Great. Please go ahead."},{"speaker":"Agent","text":"Done. The cancellation has been recorded and the refund is being processed."}]},{"label":"Pros and cons","heading":"Signal positive and negative points","chips":["one advantage is","a good thing is","one drawback is","the trouble is","however","nevertheless"],"teach":"Good speakers signpost whether a point is positive or negative before they explain it. This helps the listener follow the argument.","model":"One advantage of buying online is convenience. However, the trouble is that you cannot examine the product first.","listenFor":"Listen for the phrase that introduces each positive or negative point.","notice":"Do not simply list ideas. Use signposts such as one advantage, a good thing, one drawback, the trouble is, however and nevertheless.","passage":[{"speaker":"Nikhil","text":"I still prefer buying electronics in a physical store."},{"speaker":"Pooja","text":"Why? One advantage of shopping online is that prices are easy to compare."},{"speaker":"Nikhil","text":"True, but one drawback is that I cannot test the product before paying."},{"speaker":"Pooja","text":"A good thing about online stores is the wider choice."},{"speaker":"Nikhil","text":"However, returns can be inconvenient if the seller is slow."},{"speaker":"Pooja","text":"That is fair. Nevertheless, I like being able to shop without travelling."}]},{"label":"Comparing options","heading":"Show big and small differences","chips":["much cheaper","far better","a little easier","slightly more expensive","by far the best"],"teach":"Comparisons become more useful when you show the size of the difference. A tiny difference and a large difference should not sound the same.","model":"The older model is much cheaper, but the new one is slightly easier to use.","listenFor":"Listen for words that make a comparison stronger or weaker.","notice":"Use much and far for large differences; a little and slightly for small differences; by far before a superlative for a very clear difference.","passage":[{"speaker":"Riya","text":"Which laptop are you thinking of buying?"},{"speaker":"Sameer","text":"The basic model is much cheaper, but the battery life is shorter."},{"speaker":"Riya","text":"Is the premium one far better?"},{"speaker":"Sameer","text":"For performance, yes. But it is only slightly lighter."},{"speaker":"Riya","text":"So which gives better value?"},{"speaker":"Sameer","text":"For my work, the mid-range model is by far the best balance of price and performance."}]}],"tasks":[{"prompt":"Describe the last thing you bought online or in a shop. Explain the process from choosing it to receiving it."},{"prompt":"A product arrives damaged. Explain clearly what you want the seller to do.","support":"Use return, exchange or refund."},{"prompt":"Explain the difference between cancelling an order and returning an item."},{"prompt":"Role-play a short customer-service request about a delayed delivery."},{"prompt":"Explain one purchasing problem you have experienced or could realistically face and how you would solve it."},{"prompt":"Give two advantages of buying online and signpost each one clearly."},{"prompt":"Give two disadvantages of buying online and signpost each one clearly."},{"prompt":"Compare online shopping with shopping in a physical store. Give one positive and one negative point for each."},{"prompt":"Respond to this: 'Convenience matters more than price.' Give your view and one counterpoint."},{"prompt":"Speak for 30 seconds on which products you would never buy without seeing them first, and why."},{"prompt":"Compare a cheaper and a more expensive version of the same kind of product."},{"prompt":"Make three comparisons: one big difference, one small difference and one superlative."},{"prompt":"A friend has ₹50,000 for a laptop. Compare two options and recommend one, using comparison language."},{"prompt":"Explain why 'cheaper' does not always mean 'better value'."},{"prompt":"Final task: give a 45–60 second buying recommendation. Compare two options, explain pros and cons, and end with a clear choice."}]};</script><script src="./b1b-new-renderer.js?v=20260918a"></script></body></html>
