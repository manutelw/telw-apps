<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":103,"localNo":14,"title":"Talking About Yourself","aim":"Use reflexive language naturally when talking about behaviour, self-image, effort and situations you experience personally.","keyPoints":[{"label":"Reflexive meaning","heading":"Use myself, yourself and themselves when the action returns to the same person","chips":["myself","yourself","himself","herself","ourselves","themselves"],"teach":"Use a reflexive form when the subject and object are the same person. Do not add one just because you are talking about yourself.","model":"I taught myself to use the software, and my colleagues taught themselves the new reporting system.","listenFor":"Listen for who performs the action and who receives it.","notice":"I taught myself means I was both the teacher and the learner. Compare: I taught my colleague. The second sentence does not need a reflexive form.","passage":[{"speaker":"Mina","text":"Did you take a course to learn video editing?"},{"speaker":"Arjun","text":"No, I taught myself using short tutorials and a lot of practice."},{"speaker":"Mina","text":"Was that difficult?"},{"speaker":"Arjun","text":"At first. I kept giving myself small projects instead of trying to learn everything at once."},{"speaker":"Mina","text":"Did anyone help you?"},{"speaker":"Arjun","text":"A friend checked my work, but I did most of the learning myself."},{"speaker":"Mina","text":"That must feel satisfying."},{"speaker":"Arjun","text":"It does. Now I trust myself more when I start something unfamiliar."}]},{"label":"Useful reflexive chunks","heading":"Learn whole expressions, not a grammar list","chips":["help yourself","behave yourself","find yourself","see yourself as","apply yourself","content yourself with"],"teach":"Some reflexive forms commonly appear inside fixed expressions. Their meaning is clearer when you learn the whole chunk.","model":"If you apply yourself to the task, you may find yourself enjoying work you once avoided.","listenFor":"Listen for the chunk and work out its meaning from the situation.","notice":"Help yourself = take what is offered. Behave yourself = act properly. Find yourself + -ing = unexpectedly be in a situation. See yourself as = think of your identity or role. Apply yourself = make a serious effort.","passage":[{"speaker":"Host","text":"Please help yourself to tea before we begin."},{"speaker":"Guest","text":"Thanks. I always need one before an evening workshop."},{"speaker":"Host","text":"You said you once saw yourself as someone who hated public speaking."},{"speaker":"Guest","text":"Absolutely. Then I found myself leading a client meeting when my manager was absent."},{"speaker":"Host","text":"What changed after that?"},{"speaker":"Guest","text":"I applied myself to practising. I stopped avoiding opportunities and became much more comfortable."},{"speaker":"Host","text":"So one unexpected situation changed how you saw yourself."},{"speaker":"Guest","text":"Exactly. I still get nervous, but I no longer define myself by that nervousness."}]},{"label":"Self-image and effort","heading":"Talk about who you are becoming","chips":["see myself as","push myself","remind myself","prepare myself","enjoy myself"],"teach":"Reflexive language is useful when you describe self-management and personal development. Keep the examples real and specific.","model":"I see myself as a careful speaker, but I still push myself to answer more quickly in meetings.","listenFor":"Listen for a present self-view, a challenge and an action the speaker takes.","notice":"Use see myself as for identity, push myself for effort, remind myself for self-instruction, prepare myself for readiness, and enjoy myself for having a good experience.","passage":[{"speaker":"Coach","text":"How do you see yourself as a communicator now?"},{"speaker":"Rhea","text":"I see myself as clear but sometimes too cautious."},{"speaker":"Coach","text":"What do you do when you hesitate?"},{"speaker":"Rhea","text":"I remind myself that a short clear answer is better than waiting for a perfect one."},{"speaker":"Coach","text":"How are you preparing yourself for interviews?"},{"speaker":"Rhea","text":"I practise aloud every day and push myself to answer unfamiliar questions without notes."}]}],"tasks":[{"prompt":"Say two things you can do by yourself and one thing you prefer to do with help."},{"prompt":"Describe something you taught yourself to do."},{"prompt":"Make three correct sentences using myself, yourself and themselves."},{"prompt":"Explain a situation where someone could hurt themselves, teach themselves or prepare themselves."},{"prompt":"Correct this aloud: 'I myself learned the software by myself' so that it sounds natural and not repetitive."},{"prompt":"Use 'help yourself' in a short situation where you are welcoming a guest."},{"prompt":"Describe a time you found yourself doing something you had not planned."},{"prompt":"Complete and expand: 'I see myself as someone who…'"},{"prompt":"Explain one task you need to apply yourself to more seriously."},{"prompt":"Use two reflexive chunks in one connected answer about work, study or daily life."},{"prompt":"Say how you see yourself as a communicator today."},{"prompt":"Describe one situation where you push yourself beyond your comfort zone."},{"prompt":"What do you remind yourself before a difficult conversation, presentation or interview?"},{"prompt":"Explain how you prepare yourself for an important professional situation."},{"prompt":"Final task: speak for 45–60 seconds about how you have changed in one area. Say how you used to see yourself, what happened, what you did, and how you see yourself now."}]};</script><script src="./b1b-new-renderer.js?v=20260916a"></script></body></html>
