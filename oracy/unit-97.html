<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":97,"localNo":8,"title":"Predictions","aim":"Speak about the future with clear degrees of certainty, describe likely weather, and explain simple future scenarios.","keyPoints":[{"label":"Degrees of certainty","heading":"Say how sure you are","chips":["definitely","probably","maybe","may","might","possibly"],"teach":"A prediction is your best view of what may happen. Your words should show how certain you are. Strong certainty and weak certainty should not sound the same.","model":"Sales will probably rise next quarter, but they might fall if demand weakens.","listenFor":"Listen for how the speakers move from strong to weak certainty.","notice":"Use definitely and certainly for strong confidence; probably for a likely result; may, might, maybe and possibly when you are less sure.","passage":[{"speaker":"Asha","text":"Do you think electric cars will become much more common in the next five years?"},{"speaker":"Rohan","text":"Yes, they probably will. Prices are falling and charging is getting easier."},{"speaker":"Asha","text":"Will petrol cars disappear completely?"},{"speaker":"Rohan","text":"Definitely not that soon. They may remain common outside big cities."},{"speaker":"Asha","text":"What about public transport?"},{"speaker":"Rohan","text":"It might improve, especially where cities invest in cleaner buses and trains."},{"speaker":"Asha","text":"So travel will certainly change, but not in one single way."},{"speaker":"Rohan","text":"Exactly. Some changes are very likely; others are only possible."}]},{"label":"Weather language","heading":"Describe weather clearly","chips":["heavy rain","strong winds","dense fog","clear skies","boiling hot","freezing cold"],"teach":"Weather descriptions become more natural when common words travel together. Learn the whole chunk, not one word at a time.","model":"Tomorrow will be cold and windy, with heavy rain in the evening.","listenFor":"Listen for weather chunks and the speaker's level of confidence.","notice":"Say heavy rain, strong winds, dense fog, clear skies, boiling hot and freezing cold. Then add a prediction with will, may or might.","passage":[{"speaker":"Presenter","text":"Good morning. The day will begin with clear skies in most places."},{"speaker":"Presenter","text":"By late morning, strong winds are likely along the coast."},{"speaker":"Presenter","text":"There may be heavy rain after lunch in the western districts."},{"speaker":"Presenter","text":"Drivers could also meet dense fog on higher roads tonight."},{"speaker":"Presenter","text":"The north will stay freezing cold, especially after sunset."},{"speaker":"Presenter","text":"In the south, it will be much warmer and may even feel boiling hot in sheltered areas."}]},{"label":"Forecasts and scenarios","heading":"Use will and going to without sounding repetitive","chips":["will","going to","if","could","scenario"],"teach":"Will and going to can both appear in forecasts. In spoken English, use them naturally and avoid repeating one form in every sentence. If you are discussing a possible chain of events, make the cause and result clear.","model":"It is going to stay dry tomorrow. If the wind changes, temperatures will fall quickly.","listenFor":"Listen for a forecast, then a possible scenario caused by changing conditions.","notice":"Use will or going to for a forecast. Use if to connect a condition with a result. Could is useful when the result is possible rather than certain.","passage":[{"speaker":"Meera","text":"The forecast says it is going to stay warm until Friday."},{"speaker":"Dev","text":"That sounds good, but the wind will change at the weekend."},{"speaker":"Meera","text":"What happens if the colder air arrives early?"},{"speaker":"Dev","text":"Temperatures will drop, and the hills could get snow."},{"speaker":"Meera","text":"So the forecast is fairly clear for the next two days, but less certain after that."},{"speaker":"Dev","text":"Right. The further ahead we look, the more the scenario can change."}]}],"tasks":[{"prompt":"Make three predictions about your work, studies or city: one very certain, one likely and one uncertain.","support":"Use definitely, probably and might."},{"prompt":"You hear that a company is launching a new product. Predict what may happen in the first month.","support":"Give one likely result and one possible problem."},{"prompt":"Predict one change in technology that you think will affect daily life.","support":"Show clearly how sure you are."},{"prompt":"Say two predictions about your own next twelve months.","support":"Do not use the same certainty word twice."},{"prompt":"Challenge yourself: make a prediction, then add a reason that makes it more or less certain."},{"prompt":"Describe today's weather and predict how it may change by evening.","support":"Use at least two weather chunks."},{"prompt":"Give a 20-second weather forecast for tomorrow in your city.","support":"Use will or going to naturally."},{"prompt":"Explain how heavy rain or dense fog can affect work, travel or business."},{"prompt":"Compare two kinds of weather you enjoy or dislike and explain why."},{"prompt":"Imagine a sudden storm is expected. Give practical advice to someone travelling tomorrow."},{"prompt":"Give a short forecast using both will and going to.","support":"Make it sound natural, not like a grammar exercise."},{"prompt":"Create an if-scenario about transport, weather or technology.","support":"State the condition, then the result."},{"prompt":"Explain a chain of three possible events: if X happens, Y may happen, and then Z could happen."},{"prompt":"Respond to this: 'The future is easy to predict.' Agree or disagree and give two reasons."},{"prompt":"Final task: speak for 45–60 seconds about one change you expect in the next five years. Separate what is likely from what is only possible."}]};</script><script src="./b1b-new-renderer.js?v=20260916a"></script></body></html>
