<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening ORACY</title><style>body{font-family:Arial,sans-serif;background:#edf3f7;color:#17324f;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:28px;max-width:520px;box-shadow:0 14px 40px rgba(20,50,80,.12)}button{background:#17324f;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.msg{margin-top:14px;color:#6b7a89}</style></head><body><div class="card"><h1>ORACY Admin</h1><p>Open the full ORACY course index with administrator access.</p><button id="open">Open ORACY Index</button><div id="msg" class="msg"></div></div><script>function getAdmin(){for(const k of ['ascent_admin_master_session','ascent_trainer_session']){try{const x=JSON.parse(localStorage.getItem(k)||'null');if(x&&x.sessionToken&&String(x.role||'').toUpperCase()==='ADMIN')return x}catch{}}return null}function openIndex(){const s=getAdmin();if(!s){location.href='/ascent/admin-login.html';return}document.getElementById('msg').textContent='Opening ORACY index…';const f=document.createElement('form');f.method='POST';f.action='/oracy/admin-handoff';const i=document.createElement('input');i.type='hidden';i.name='ascent_session_token';i.value=s.sessionToken;f.appendChild(i);document.body.appendChild(f);f.submit()}document.getElementById('open').onclick=openIndex;</script></body></html>
