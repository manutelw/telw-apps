<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening ORACY</title><style>body{font-family:Arial,sans-serif;background:#edf3f7;color:#17324f;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:28px;max-width:520px;box-shadow:0 14px 40px rgba(20,50,80,.12)}button{background:#17324f;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.msg{margin-top:14px;color:#6b7a89}</style></head><body><div class="card"><h1>ORACY Admin Preview</h1><p>Open B1 Unit 1 without a learner login.</p><button id="open">Open B1 Unit 1</button><div id="msg" class="msg"></div></div><script>document.getElementById('open').onclick=async()=>{const msg=document.getElementById('msg');let s=null;for(const k of ['ascent_admin_master_session','ascent_trainer_session']){try{const x=JSON.parse(localStorage.getItem(k)||'null');if(x&&x.sessionToken&&String(x.role||'').toUpperCase()==='ADMIN'){s=x;break}}catch{}}if(!s){location.href='/ascent/admin-login.html';return}msg.textContent='Opening…';const r=await fetch('/oracy/admin-preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ascent_session_token:s.sessionToken,unit_no:1})});if(r.redirected){location.href=r.url;return}if(r.ok){const d=await r.json().catch(()=>({}));location.href=d.url||'/oracy/unit-1.html';return}msg.textContent='Admin preview could not be opened.'};</script></body></html>
