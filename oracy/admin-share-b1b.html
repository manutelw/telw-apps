<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORACY · B1B New Share</title><style>:root{--navy:#17324f;--gold:#d1972b;--bg:#edf3f7;--line:#d8e2ea;--muted:#6b7a89;--green:#18794e;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#20364b}.top{background:var(--navy);color:#fff}.shell{max-width:900px;margin:auto;padding:22px}.brand{font-size:26px;font-weight:800}.brand small{display:block;color:#f0c56d;font-size:12px;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 15px 45px rgba(18,42,66,.09);margin-top:18px}h1{color:var(--navy)}.muted{color:var(--muted);line-height:1.55}.units{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.unit{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf4fb;color:var(--navy)}.field{max-width:260px;margin-top:18px}.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}.field select,.result input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}.status{margin-top:10px;min-height:20px;color:var(--muted)}.success{color:var(--green)}.error{color:var(--red)}.result{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f7fafc}@media(max-width:600px){.units{grid-template-columns:1fr}.shell{padding:16px}}</style></head><body><header class="top"><div class="shell"><div class="brand">ORACY<small>Administrator · B1B New secure sharing</small></div></div></header><main class="shell"><section class="card"><h1>Share B1B New</h1><p class="muted">Choose one or more B1B New units. The link is private, single-use and time-bound.</p><label class="unit"><input id="all" type="checkbox"> <b>Select all B1B New units</b></label><div id="units" class="units"></div><div class="field"><label for="duration">Free access period</label><select id="duration"><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="5">5 days</option><option value="6">6 days</option><option value="7" selected>7 days</option></select></div><div class="actions"><button id="create" class="btn primary" type="button">Create shareable link</button><a class="btn secondary" href="/oracy/">Back to ORACY</a></div><div id="status" class="status"></div><div id="result" class="result" hidden><input id="url" readonly><div class="actions"><button id="copy" class="btn secondary" type="button">Copy link</button></div></div></section></main><script>const API='/oracy/share-api';const UNITS=[['97','Unit 8 · Predictions'],['98','Unit 9 · Buying and Selling'],['99','Unit 10 · Leisure'],['100','Unit 11 · Lifestyle and Healthy Living'],['101','Unit 12 · Forces of Nature'],['102','Unit 13 · On the Road'],['103','Unit 14 · Talking About Yourself']];function admin(){for(const k of ['ascent_admin_master_session','ascent_trainer_session']){try{const s=JSON.parse(localStorage.getItem(k)||'null');if(s&&s.sessionToken&&String(s.role||'').toUpperCase()==='ADMIN')return s}catch{}}return null}const session=admin();if(!session)location.replace('/ascent/admin-login.html');const box=document.getElementById('units');box.innerHTML=UNITS.map(([v,l])=>`<label class="unit"><input class="part" type="checkbox" value="${v}"> ${l}</label>`).join('');const all=document.getElementById('all');all.onchange=()=>document.querySelectorAll('.part').forEach(x=>x.checked=all.checked);document.querySelectorAll('.part').forEach(x=>x.onchange=()=>{const p=[...document.querySelectorAll('.part')];all.checked=p.every(y=>y.checked);all.indeterminate=!all.checked&&p.some(y=>y.checked)});function setStatus(m,c=''){const s=document.getElementById('status');s.textContent=m;s.className='status '+c}async function call(payload){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,ascent_session_token:session.sessionToken})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw new Error(d.message||'Request failed.');return d}document.getElementById('create').onclick=async()=>{const selected=[...document.querySelectorAll('.part:checked')].map(x=>x.value);if(!selected.length)return setStatus('Choose at least one unit.','error');const b=document.getElementById('create');b.disabled=true;setStatus('Creating secure shareable link…');document.getElementById('result').hidden=true;try{const d=await call({action:'ADMIN_CREATE',delivery:'whatsapp',selected_levels:[],selected_units:selected,duration_days:Number(document.getElementById('duration').value)}),r=d.results?.[0];if(!r?.ok||!r.share_url)throw new Error(r?.error||'Secure link could not be created.');document.getElementById('url').value=r.share_url;document.getElementById('result').hidden=false;setStatus('Shareable link created.','success')}catch(e){setStatus(e.message,'error')}finally{b.disabled=false}};document.getElementById('copy').onclick=async()=>{const i=document.getElementById('url');try{await navigator.clipboard.writeText(i.value)}catch{i.select();document.execCommand('copy')}setStatus('Link copied.','success')};</script></body></html>
