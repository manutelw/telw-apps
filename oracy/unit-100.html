<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":100,"localNo":11,"title":"Lifestyle and Healthy Living","aim":"Talk about time pressure and healthy routines, give practical advice, and explore unreal lifestyle choices.","keyPoints":[{"label":"Talking about time","heading":"Describe pressure, routine and free time","chips":["all the time","from time to time","most of the time","take your time","time off","run off your feet"],"teach":"Time expressions help you show frequency, pressure and freedom. Use them inside a real description of your day rather than as isolated phrases.","model":"I am run off my feet most weekdays, so I try to take some time off at the weekend.","listenFor":"Listen for how two people describe very different relationships with time.","notice":"Use all the time for something continuous, from time to time for something occasional, most of the time for something usual, and take your time when there is no need to rush.","passage":[{"speaker":"Anita","text":"You look exhausted. Busy week?"},{"speaker":"Vikram","text":"Very. I have been run off my feet most of the time."},{"speaker":"Anita","text":"Do you get any time off?"},{"speaker":"Vikram","text":"Not much during the week, but I switch off from work from time to time in the evening."},{"speaker":"Anita","text":"I used to rush through everything. Now I try to take my time with important tasks."},{"speaker":"Vikram","text":"That sounds healthier. I need to stop treating every job as urgent."}]},{"label":"Giving advice","heading":"Make suggestions that sound useful, not bossy","chips":["should","shouldn't","it's a good idea to","it helps to","it's better to","avoid"],"teach":"Advice works best when you give one clear action and a reason. You can make the tone softer with phrases such as it's a good idea to or it helps to.","model":"You should plan the important jobs first. It also helps to avoid checking messages every few minutes.","listenFor":"Listen for different ways of giving advice and the reason behind each suggestion.","notice":"Use should and shouldn't for direct advice. Use it's a good idea to, it helps to and it's better to for a softer recommendation. Avoid is followed by an -ing form.","passage":[{"speaker":"Coach","text":"What is making your day difficult?"},{"speaker":"Maya","text":"I start many jobs but finish very few. Messages keep interrupting me."},{"speaker":"Coach","text":"You should choose two important tasks before you open your inbox."},{"speaker":"Maya","text":"That sounds possible."},{"speaker":"Coach","text":"It also helps to avoid switching tasks every few minutes."},{"speaker":"Maya","text":"And what about exercise? I keep postponing it."},{"speaker":"Coach","text":"It's a good idea to start small. A short walk you actually do is better than a perfect plan you never start."}]},{"label":"Imaginary scenarios","heading":"Talk about unreal or unlikely choices","chips":["if I could","I would","if I had","I'd","if I changed"],"teach":"Use the second conditional when you imagine a situation that is unreal, unlikely or simply different from your present life.","model":"If I could choose my working hours, I would start earlier and finish before the evening traffic.","listenFor":"Listen for an imagined change and the result it would create.","notice":"Use if + past form for the imagined condition and would for the result: If I worked fewer evenings, I would exercise more regularly.","passage":[{"speaker":"Ravi","text":"If you could change one part of your routine, what would it be?"},{"speaker":"Leena","text":"If I could choose, I would work from home two days a week."},{"speaker":"Ravi","text":"What difference would that make?"},{"speaker":"Leena","text":"I would save travel time and probably cook more often."},{"speaker":"Ravi","text":"Would you exercise more too?"},{"speaker":"Leena","text":"I think so. If I had an extra hour in the morning, I'd go for a walk before work."}]}],"tasks":[{"prompt":"Describe a normal working or study day and say when you feel most under pressure."},{"prompt":"Use three time expressions to describe your week."},{"prompt":"Explain one thing you do all the time and one thing you do only from time to time."},{"prompt":"Say how you protect your time when you are very busy."},{"prompt":"Describe what a good day off looks like for you."},{"prompt":"Give advice to someone who keeps letting jobs pile up."},{"prompt":"Give two practical tips for reducing interruptions while working."},{"prompt":"A friend says, 'I never have time to exercise.' Respond with useful advice."},{"prompt":"Give one healthy-living recommendation about food, movement or sleep and explain why it is realistic."},{"prompt":"Say one thing people should avoid if they want a more balanced routine."},{"prompt":"If you could change your working hours, what would you choose and why?"},{"prompt":"If you had one extra free hour every day, how would you use it?"},{"prompt":"Imagine you could remove one unhealthy habit from your routine. What would change?"},{"prompt":"Respond to this: 'A healthy life needs a strict routine.' Give your view using an imaginary example."},{"prompt":"Final task: speak for 45–60 seconds about one lifestyle change you would make. Explain the present problem, your advice, and the result you would expect."}]};</script><script src="./b1b-new-renderer.js?v=20260916a"></script></body></html>
