<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":101,"localNo":12,"title":"Forces of Nature","aim":"Describe natural environments, explain how simple systems work, and use position and movement language clearly.","keyPoints":[{"label":"Natural environments","heading":"Describe places and natural resources","chips":["forest","desert","plain","mountain stream","coast","renewable energy"],"teach":"When you describe a natural place, connect the feature to what it provides or makes possible. This turns a list of geography words into a useful explanation.","model":"A sunny desert can support solar power, while a windy plain can be suitable for wind turbines.","listenFor":"Listen for the natural feature and the resource or activity linked to it.","notice":"Build pairs: forests provide wood; deserts receive strong sunlight; plains can be windy; mountain streams can provide moving water; coasts can support wind and tidal systems.","passage":[{"speaker":"Host","text":"Why are some regions better for renewable energy than others?"},{"speaker":"Engineer","text":"Geography matters. A dry desert may receive strong sunlight for most of the year."},{"speaker":"Host","text":"So that is useful for solar power."},{"speaker":"Engineer","text":"Exactly. Open plains can also be valuable because steady winds are easier to capture there."},{"speaker":"Host","text":"And what about mountains?"},{"speaker":"Engineer","text":"Fast-moving streams can support small hydro systems where the terrain is suitable."},{"speaker":"Host","text":"So natural features can become economic resources."},{"speaker":"Engineer","text":"Yes, if the system is designed for the place rather than forced onto it."}]},{"label":"Describing systems","heading":"Use the passive when the process matters more than the actor","chips":["is used","is generated","is produced","was invented","is pumped","is connected"],"teach":"Use the passive when your listener needs to understand the system or process and the person doing the action is not important.","model":"Water is pumped through the pipes, and heat is transferred into the building.","listenFor":"Listen for passive forms that keep attention on the process.","notice":"Compare: Engineers use turbines to generate electricity. Turbines are used to generate electricity. The second sentence keeps the system at the centre.","passage":[{"speaker":"Guide","text":"This building uses a simple ground-heating system."},{"speaker":"Visitor","text":"How does it work?"},{"speaker":"Guide","text":"A network of pipes is installed below the ground beside the building."},{"speaker":"Visitor","text":"What happens inside the pipes?"},{"speaker":"Guide","text":"Water is pumped through them and heat is absorbed from the ground."},{"speaker":"Visitor","text":"Then how is the house warmed?"},{"speaker":"Guide","text":"The heat is carried back to the building and transferred to the indoor system."},{"speaker":"Visitor","text":"So the process uses natural heat without burning fuel inside the house."}]},{"label":"Position and movement","heading":"Explain where things are and how they move","chips":["above","below","beside","inside","outside","through","along","beneath"],"teach":"Position words tell us where something is. Movement words tell us how something travels. Use both when you explain a route, a system or a space.","model":"The pipes run beneath the garden, pass through the outside wall, and continue along the corridor.","listenFor":"Listen for each change of position and direction.","notice":"Use above/below and inside/outside for position; through for movement via an opening or enclosed space; along for movement following a line; beneath for a more formal alternative to under.","passage":[{"speaker":"Sara","text":"Where is the storage room in this underground house?"},{"speaker":"Omar","text":"Walk through the entrance and continue along the main corridor."},{"speaker":"Sara","text":"Is it beside the kitchen?"},{"speaker":"Omar","text":"No, it is beneath the living area, just below the stairs."},{"speaker":"Sara","text":"And where does the air come from?"},{"speaker":"Omar","text":"Fresh air comes in through a shaft above us and moves through vents inside the rooms."}]}],"tasks":[{"prompt":"Describe three natural features in your country or region and say what each one is useful for."},{"prompt":"Choose a desert, forest, coast or mountain area and describe its main physical features."},{"prompt":"Explain which natural conditions are useful for solar, wind or hydro power."},{"prompt":"Compare two places that would be suitable for different kinds of renewable energy."},{"prompt":"Give a 30-second description of a landscape without simply listing nouns."},{"prompt":"Explain how a simple system works using at least three passive forms."},{"prompt":"Turn this idea into a process explanation: 'People use solar panels to produce electricity.' Then add two more stages."},{"prompt":"Describe how water is collected, moved and used in a building or farm system."},{"prompt":"Explain one everyday process where the actor is less important than the process itself."},{"prompt":"Give a short 'how it works' explanation of a wind turbine, water filter or cooling system."},{"prompt":"Describe the position of five objects around you using above, below, beside, inside or outside."},{"prompt":"Give directions through a building using through, along and beside."},{"prompt":"Explain the route of water, electricity or air through a simple system."},{"prompt":"Describe an unusual home or workplace and explain where its main spaces are."},{"prompt":"Final task: speak for 45–60 seconds about a natural-energy system. Describe the place, explain the process, and use clear position or movement language."}]};</script><script src="./b1b-new-renderer.js?v=20260918a"></script></body></html>
