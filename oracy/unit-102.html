<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":102,"localNo":13,"title":"On the Road","aim":"Talk about roads and driving, explain rules clearly, and handle practical car-rental situations.","keyPoints":[{"label":"Road and car language","heading":"Name places, road features and basic controls","chips":["junction","roundabout","motorway","parking area","steering wheel","gear lever","pedal"],"teach":"Road language is easier to remember when you connect the word to the action or situation in which you use it.","model":"At a roundabout, I slow down, watch the traffic from the right, and steer into the correct lane.","listenFor":"Listen for the road situation and the part of the car the driver mentions.","notice":"Use junction/intersection for places where roads meet, roundabout/traffic circle for a circular junction, and motorway/freeway for a high-speed road. Different countries may prefer different terms.","passage":[{"speaker":"Nina","text":"Was it difficult driving in another country for the first time?"},{"speaker":"Paul","text":"The motorway was fine, but the roundabouts felt strange."},{"speaker":"Nina","text":"Was the car different too?"},{"speaker":"Paul","text":"Yes. The steering wheel was on the other side, so the gear lever felt unfamiliar at first."},{"speaker":"Nina","text":"What was the hardest situation?"},{"speaker":"Paul","text":"Busy junctions. I had to think carefully about which lane to enter."},{"speaker":"Nina","text":"Did it get easier?"},{"speaker":"Paul","text":"Much easier after a day. Parking still took more concentration, though."}]},{"label":"Explaining rules","heading":"Say what is required, allowed and forbidden","chips":["must","mustn't","have to","don't have to","can","can't","allowed to"],"teach":"Road rules need precise language. Separate obligation, prohibition, permission and lack of obligation.","model":"You must wear a seat belt. You mustn't use a handheld phone. You don't have to drive at the speed limit if conditions are unsafe.","listenFor":"Listen for what the driver is required to do and what is only permitted.","notice":"Must/have to = obligation. Mustn't/can't/not allowed to = prohibition. Can/allowed to = permission. Don't have to = no obligation; it does not mean forbidden.","passage":[{"speaker":"Instructor","text":"Before we start, you must adjust your seat and mirrors."},{"speaker":"Learner","text":"Do I have to switch on the lights in daylight?"},{"speaker":"Instructor","text":"Not today. You don't have to because visibility is good."},{"speaker":"Learner","text":"Can I move into the next lane here?"},{"speaker":"Instructor","text":"Yes, you can, but you must check the mirror and signal first."},{"speaker":"Learner","text":"And I can't cross that solid line, right?"},{"speaker":"Instructor","text":"Correct. You are not allowed to cross it here."}]},{"label":"Rental arrangements","heading":"Ask the practical questions before you drive away","chips":["deposit","damage","fuel","insurance","licence","mileage","return"],"teach":"When you rent a vehicle, practical questions protect you from misunderstandings. Ask about money, damage, fuel, documents and return conditions before leaving.","model":"Is there a security deposit? What fuel does the car use, and is there a mileage limit?","listenFor":"Listen for the checks the renter makes before accepting the car.","notice":"Use clear question forms: Is there...? Do I need...? What happens if...? How much...? When should I...?","passage":[{"speaker":"Renter","text":"Before I take the car, can I check a few things?"},{"speaker":"Agent","text":"Of course."},{"speaker":"Renter","text":"Is there a security deposit, and what does the insurance cover?"},{"speaker":"Agent","text":"The deposit is blocked on your card. The basic insurance covers accidental damage, but there is an excess."},{"speaker":"Renter","text":"I can see a scratch on the rear bumper. Is that already recorded?"},{"speaker":"Agent","text":"Yes, but take a photo as well. It is a good idea to keep your own record."},{"speaker":"Renter","text":"What fuel does the car use, and how full should the tank be when I return it?"},{"speaker":"Agent","text":"Petrol. Please return it with the same fuel level."}]}],"tasks":[{"prompt":"Describe the roads you use most often and name two common road features."},{"prompt":"Explain which driving situation would be hardest for you in an unfamiliar country and why."},{"prompt":"Compare driving on a small road with driving on a motorway."},{"prompt":"Describe the basic controls you use when starting and moving a car."},{"prompt":"Give simple directions through a junction or roundabout."},{"prompt":"State three road rules using must, mustn't and can."},{"prompt":"Explain the difference between 'mustn't' and 'don't have to' using a road example."},{"prompt":"Tell a visitor two things they have to do and two things they are not allowed to do on local roads."},{"prompt":"A friend says, 'The speed limit is 80, so I have to drive at 80.' Correct the misunderstanding."},{"prompt":"Explain one road-safety rule you think is especially important and why."},{"prompt":"Ask four useful questions before renting a car."},{"prompt":"You notice damage before driving away. Explain what you would say to the rental agent."},{"prompt":"Explain why checking fuel, insurance and documents matters before a trip."},{"prompt":"Role-play returning a rental car when the agent says the fuel level is too low."},{"prompt":"Final task: speak for 45–60 seconds as if advising a friend who is renting and driving a car abroad for the first time."}]};</script><script src="./b1b-new-renderer.js?v=20260916a"></script></body></html>
