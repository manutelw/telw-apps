<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELW Audio Studio</title><style>body{font:16px system-ui;background:#f5f7fb;color:#112c49}main{max-width:850px;margin:35px auto;padding:30px;background:white;border-radius:15px}textarea{width:100%;height:310px;box-sizing:border-box;padding:15px;font:15px/1.6 system-ui}button,a{background:#112c49;color:white;border:0;border-radius:7px;padding:12px 18px;font-weight:bold}audio{width:100%;margin-top:20px}#status{white-space:pre-wrap;margin:15px 0}</style><main><h1>TELW Audio Studio</h1><p>ORACY voices: Maya (marin) and Guest (cedar). MP3 download. Administrator sign-in required.</p><textarea id="script">Maya: [warmly] Welcome to Bella Vista Café! Lovely to see you.
Guest: [a little rushed] Hello. I've got a bit of time before a meeting.
Maya: [friendly, easy] Of course. Are you popping in for coffee, or would you like something to eat?
Guest: [relaxed] Just a coffee, thanks. [softer] Somewhere quiet, if possible.
Maya: Certainly. There's a quiet corner table free. [inviting] Shall I show you over?
Guest: [relieved] That would be great. [slight exhale] This bag's rather heavy.
Maya: [kindly] I can take care of your bag while you get settled, if you'd like.
Guest: [grateful] That's very kind, thank you.
Maya: [cheerful] My pleasure. I'll be straight back with a menu.</textarea><p><button id="go">Generate audio</button> <a id="dl" hidden download="TELW_ICA_Unit_1A_Exercise_6.mp3">Download MP3</a></p><div id="status"></div><audio id="player" controls hidden></audio><small>Uses existing authenticated ORACY service. Does not modify lessons. Speech incurs normal API charges.</small></main><script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script><script>
const $=x=>document.getElementById(x);let url;
function unusedWav(chunks,rate){let n=chunks.reduce((s,x)=>s+x.length,0),a=new ArrayBuffer(44+n*2),v=new DataView(a),put=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};put(0,'RIFF');v.setUint32(4,36+n*2,true);put(8,'WAVE');put(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);put(36,'data');v.setUint32(40,n*2,true);let o=44;for(const b of chunks)for(let s of b){s=Math.max(-1,Math.min(1,s));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}return new Blob([a],{type:'audio/wav'})}
$('go').onclick=async()=>{let ctx;$('go').disabled=true;$('dl').hidden=true;$('player').hidden=true;try{const lines=$('script').value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length||lines.length>30)throw Error('Enter 1–30 lines');ctx=new AudioContext();const rate=24000,chunks=[];for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(Maya|Guest):\s*(.+)$/i);if(!m)throw Error('Line '+(i+1)+' must begin Maya: or Guest:');$('status').textContent='Generating '+(i+1)+' of '+lines.length;const pieces=[...m[2].matchAll(/(?:\\[([^\\]]+)\\])?([^\\[]+)/g)].map(x=>({direction:(x[1]||'').trim(),text:(x[2]||'').trim()})).filter(x=>x.text);if(!pieces.length)throw Error('Line '+(i+1)+' has no spoken words');for(const piece of pieces){const voice=m[1].toLowerCase()==='maya'?'marin':'cedar';const style=piece.direction||'natural, attentive';const instructions='Speak as a real person in a sophisticated but natural London English accent. Emotion and delivery: '+style+'. Make this emotion clearly audible without exaggeration. Keep a warm, conversational café atmosphere. Never speak the bracketed stage directions or speaker names.';const r=await fetch('/oracy/session',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'tts',unit_no:1,text:piece.text,voice,instructions})});if(!r.ok)throw Error('ORACY service HTTP '+r.status+': '+(await r.text()).slice(0,160));if(!(r.headers.get('content-type')||'').includes('audio'))throw Error('Service returned non-audio data');const d=await ctx.decodeAudioData(await r.arrayBuffer());const offline=new OfflineAudioContext(1,Math.ceil(d.duration*rate),rate);const src=offline.createBufferSource();src.buffer=d;src.connect(offline.destination);src.start();const rendered=await offline.startRendering();chunks.push(rendered.getChannelData(0).slice(),new Float32Array(Math.round(rate*.12)))}chunks.push(new Float32Array(Math.round(rate*.3)))}if(!window.lamejs)throw Error('MP3 encoder did not load. Check your internet connection.');const encoder=new lamejs.Mp3Encoder(1,rate,128),frames=[];let count=0;for(const segment of chunks)count+=segment.length;const samples=new Int16Array(count);let offset=0;for(const segment of chunks){for(let i=0;i<segment.length;i++){const s=Math.max(-1,Math.min(1,segment[i]));samples[offset+i]=s<0?s*32768:s*32767}offset+=segment.length}for(let p=0;p<samples.length;p+=1152){const data=encoder.encodeBuffer(samples.subarray(p,p+1152));if(data.length)frames.push(new Uint8Array(data))}const last=encoder.flush();if(last.length)frames.push(new Uint8Array(last));const blob=new Blob(frames,{type:'audio/mpeg'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('player').src=url;$('player').hidden=false;$('dl').href=url;$('dl').hidden=false;$('status').textContent='Recording ready.'}catch(e){$('status').textContent='Could not generate audio: '+e.message}finally{$('go').disabled=false;if(ctx)await ctx.close().catch(()=>{})}};
</script></html>
