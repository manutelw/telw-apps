<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./oracy.css"></head><body><div id="unitRoot"></div><script>window.B1B_NEW_UNIT={"unitNo":99,"localNo":10,"title":"Leisure","aim":"Talk naturally about free time, preferences and experiences, and describe how activities make you feel.","keyPoints":[{"label":"Free-time chunks","heading":"Talk about what you do in your spare time","chips":["stay in","go out","go for a walk","have friends over","go away","a night out"],"teach":"Free-time English often uses short verb-and-particle chunks. Learn them together so your speech sounds natural.","model":"After a busy week, I usually stay in on Friday and go out with friends on Saturday.","listenFor":"Listen for the chunks the speaker uses to contrast work and leisure.","notice":"Say stay in, go out, go for a walk, have friends over, go away for a few days and have a night out. Avoid translating each word separately.","passage":[{"speaker":"Tara","text":"What do you normally do at the weekend?"},{"speaker":"Imran","text":"Friday is usually quiet. I stay in and watch something at home."},{"speaker":"Tara","text":"And Saturday?"},{"speaker":"Imran","text":"I often go out for lunch or have friends over in the evening."},{"speaker":"Tara","text":"Do you ever go away?"},{"speaker":"Imran","text":"Yes, every few months. Even one night away makes the weekend feel longer."},{"speaker":"Tara","text":"What if you have had a stressful week?"},{"speaker":"Imran","text":"Then I go for a long walk. I need fresh air more than noise."}]},{"label":"Likes and dislikes","heading":"Show the strength of your preference","chips":["love","really enjoy","enjoy","don't mind","don't really enjoy","can't stand"],"teach":"A good answer does more than say like or dislike. Show how strong the feeling is and give a reason.","model":"I really enjoy cooking, but I can't stand washing up afterwards.","listenFor":"Listen for strong, neutral and negative preferences.","notice":"Use love and really enjoy for strong positive feelings, don't mind for neutral feelings, and can't stand for a strong negative feeling.","passage":[{"speaker":"Neha","text":"Do you like team sports?"},{"speaker":"Arun","text":"I really enjoy badminton, but I don't really enjoy football."},{"speaker":"Neha","text":"Why not?"},{"speaker":"Arun","text":"I don't mind watching it, but I can't stand playing for ninety minutes in the heat."},{"speaker":"Neha","text":"What about board games?"},{"speaker":"Arun","text":"I love strategy games because they make people talk and argue in a fun way."}]},{"label":"Feelings and experiences","heading":"Separate the experience from the feeling","chips":["interesting/interested","boring/bored","exciting/excited","tiring/tired","relaxing/relaxed"],"teach":"Use -ing words for the thing or experience and -ed words for how a person feels.","model":"The trek was tiring, but I felt excited when we reached the top.","listenFor":"Listen for the difference between describing an activity and describing a person's reaction.","notice":"A film can be boring; a viewer can be bored. A trip can be exciting; a traveller can feel excited.","passage":[{"speaker":"Kavya","text":"How was the company off-site?"},{"speaker":"Joel","text":"Much better than I expected. The morning activity was challenging but interesting."},{"speaker":"Kavya","text":"Were you nervous?"},{"speaker":"Joel","text":"At first, yes. I was a little worried because I did not know my group well."},{"speaker":"Kavya","text":"And later?"},{"speaker":"Joel","text":"The games were tiring, but everyone was relaxed by dinner. I came home tired but happy."}]}],"tasks":[{"prompt":"Describe your usual weekend in three or four sentences.","support":"Use at least two free-time chunks."},{"prompt":"Say what you do when you want quiet time and what you do when you want company."},{"prompt":"Explain one leisure activity that helps you recover from work or study."},{"prompt":"Tell ORACY about the last time you had friends over or went out with friends."},{"prompt":"Plan an ideal free evening using three natural leisure chunks."},{"prompt":"Rank three activities from favourite to least favourite and explain your choices."},{"prompt":"Talk about one activity you love, one you don't mind and one you can't stand."},{"prompt":"Compare watching a sport with playing it. Which do you prefer, and why?"},{"prompt":"Respond to this: 'A hobby should be useful.' Give your view."},{"prompt":"Recommend a leisure activity to someone who spends all week at a desk."},{"prompt":"Describe an experience that was interesting but tiring."},{"prompt":"Describe something that was exciting at first but became boring later."},{"prompt":"Correct yourself aloud: make one sentence with an -ing adjective and one with the matching -ed adjective."},{"prompt":"Tell a short story about an activity that changed how you felt."},{"prompt":"Final task: speak for 45–60 seconds about how you use leisure time well. Include activities, preferences and feelings."}]};</script><script src="./b1b-new-renderer.js?v=20260916a"></script></body></html>
