<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClarionPrep · Live Mock Interview</title><style>:root{--n:#143a60;--b:#27679d;--g:#c67b00;--t:#24364a;--m:#687a8d;--l:#d7e1eb;--bg:#eef3f7;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#102a46,#214d79);color:var(--t);min-height:100vh;padding:22px}.shell{max-width:860px;margin:auto}.top,.card{background:#fff;border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.18)}.top{padding:16px 20px;margin-bottom:18px}.top h1{margin:0;color:var(--n);font-size:24px}.top p{margin:4px 0 0;color:var(--g);font-size:12px;font-weight:800}.card{padding:28px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--g)}.question{margin:10px 0 20px;padding:18px;border-radius:14px;background:#edf4fb;color:var(--n);font-size:20px;font-weight:800;line-height:1.5}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}.btn.red{background:var(--bad)}.btn.secondary{background:#edf3f7;color:var(--n)}.btn:disabled{opacity:.45}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:14px;color:var(--m);line-height:1.5}.turns{margin-top:18px}.turn{border-top:1px solid var(--l);padding:12px 0;line-height:1.55}.turn b{color:var(--n)}.feedback{margin-top:18px;padding:18px;border-radius:14px;background:#f4fbf7;border:1px solid #cfe5d8}.score{font-size:42px;font-weight:900;color:var(--n)}.meter{height:10px;background:#e6edf2;border-radius:99px;overflow:hidden}.meter div{height:100%;background:var(--b);width:0}.usage{font-size:12px;color:var(--m);margin-top:6px}[hidden]{display:none!important}</style></head><body><div class="shell"><header class="top"><h1>Live AI Mock Interview</h1><p>ClarionPrep · adaptive spoken interview</p></header><main class="card"><div class="eyebrow" id="stage">Ready</div><div id="question" class="question">Checking access…</div><div class="row"><button id="hear" class="btn secondary" disabled>Hear question</button><button id="record" class="btn" disabled>Answer</button><button id="stop" class="btn red" disabled>Stop & send</button><button id="restart" class="btn secondary" hidden>New mock</button></div><div id="status" class="status"></div><div class="meter" style="margin-top:18px"><div id="meter"></div></div><div id="usage" class="usage"></div><div id="turns" class="turns"></div><section id="feedback" class="feedback" hidden><div class="eyebrow">Interview feedback</div><div id="score" class="score"></div><p><strong>Strongest point:</strong> <span id="strong"></span></p><p><strong>Evidence:</strong> <span id="evidence"></span></p><p><strong>Priority improvement:</strong> <span id="priority"></span></p><p><strong>Improved sample:</strong></p><div id="sample"></div></section></main></div><script>const API='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-live-mock',$=id=>document.getElementById(id),q=new URLSearchParams(location.search);let token=q.get('clarion_token')||localStorage.getItem('clarion_entitlement_LIVE_MOCK')||'',device=q.get('clarion_device')||localStorage.getItem('clarion_device_v1')||'',question='',audio64='',turn=1,history=[],rec=null,stream=null,chunks=[],started=0,mime='audio/webm';async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,entitlement_token:token,device_id:device,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.message||'Live Mock could not continue.');return d}function setStatus(m){$('status').textContent=m||''}function setUsage(u){if(!u)return;const lim=Number(u.usage_limit||1200),used=Number(u.usage_used||0),rem=Math.max(0,lim-used);$('meter').style.width=Math.min(100,used/lim*100)+'%';$('usage').textContent=`${Math.floor(rem/60)}h ${rem%60}m remaining · access ends ${new Date(u.expires_at).toLocaleDateString('en-IN')}`}function playAudio(){if(!audio64)return;const bin=atob(audio64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);new Audio(URL.createObjectURL(new Blob([a],{type:'audio/mpeg'}))).play().catch(()=>{})}function add(role,text){history.push({role,text});const d=document.createElement('div');d.className='turn';d.innerHTML='<b>'+(role==='interviewer'?'Interviewer':'You')+':</b> '+String(text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('turns').appendChild(d)}async function startMock(){turn=1;history=[];$('turns').innerHTML='';$('feedback').hidden=true;$('restart').hidden=true;setStatus('Preparing interviewer…');try{const d=await call('START');question=d.question;audio64=d.audio_base64;$('question').textContent=question;$('stage').textContent='Question 1 of 6';$('hear').disabled=false;$('record').disabled=false;setUsage(d.usage);add('interviewer',question);playAudio();setStatus('Answer naturally.')}catch(e){setStatus(e.message)}}async function record(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.onstop=send;started=Date.now();rec.start(400);$('record').disabled=true;$('hear').disabled=true;$('stop').disabled=false;setStatus('Listening…')}catch{setStatus('Microphone access is required.')}}function stop(){if(rec&&rec.state!=='inactive')rec.stop()}function b64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(blob)})}async function send(){const blob=new Blob(chunks,{type:mime});stream?.getTracks().forEach(t=>t.stop());$('stop').disabled=true;setStatus('Interviewer is thinking…');try{const d=await call('TURN',{turn,history,audio_base64:await b64(blob),audio_mime:mime,duration_seconds:Math.max(1,Math.round((Date.now()-started)/1000))});add('candidate',d.answer);setUsage(d.usage);if(d.complete){const f=d.feedback||{};$('question').textContent=f.closing_message||'Interview complete.';$('stage').textContent='Complete';$('hear').disabled=true;$('record').disabled=true;$('score').textContent=(f.score??'—')+'/100';$('strong').textContent=f.strongest_point||'';$('evidence').textContent=f.evidence||'';$('priority').textContent=f.priority_improvement||'';$('sample').textContent=f.improved_sample||'';$('feedback').hidden=false;$('restart').hidden=false;setStatus('Feedback ready.');return}turn++;question=d.next_question;audio64=d.audio_base64;add('interviewer',question);$('question').textContent=question;$('stage').textContent='Question '+turn+' of 6';$('hear').disabled=false;$('record').disabled=false;playAudio();setStatus('Answer the follow-up question.')}catch(e){setStatus(e.message);$('record').disabled=false;$('hear').disabled=false}}$('hear').onclick=playAudio;$('record').onclick=record;$('stop').onclick=stop;$('restart').onclick=startMock;(async()=>{if(!token||!device){location.replace('/subscribe/?product=LIVE_MOCK');return}localStorage.setItem('clarion_entitlement_LIVE_MOCK',token);localStorage.setItem('clarion_device_v1',device);history.replaceState(null,'',location.pathname);await startMock()})();</script></body></html>
