<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASCENT · Practice</title>
  <style>
    :root{--navy:#143a60;--blue:#27679d;--gold:#c67b00;--border:#d7e1eb;--text:#24364a;--muted:#5f7184}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102a46;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column}
    .live-mock-strip{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:13px 24px;
      border-bottom:1px solid #c8d7e5;
      background:linear-gradient(90deg,#f8fbfe,#eef5fb);
      box-shadow:0 3px 12px rgba(0,0,0,.08);
      color:var(--text);
      z-index:2;
    }
    .live-mock-copy{min-width:0}
    .live-mock-kicker{margin:0 0 3px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
    .live-mock-title{margin:0;color:var(--navy);font-size:18px;font-weight:800;line-height:1.25}
    .live-mock-text{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
    .live-mock-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .live-mock-primary,.live-mock-more,.coach-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:9px;padding:9px 13px;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}
    .live-mock-primary{background:var(--navy);color:#fff}
    .live-mock-primary:hover{background:#102b47}
    .live-mock-more{border:1px solid var(--border);background:#fff;color:var(--navy)}
    .coach-link{border:1px solid #d5ad58;background:#fff8e8;color:#805400}
    .coach-link:hover{background:#fff1c9}
    #practiceFrame{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:#fff}
    @media(max-width:900px){
      .live-mock-strip{align-items:flex-start;padding:11px 13px;gap:10px;flex-wrap:wrap}
      .live-mock-title{font-size:16px}
      .live-mock-text{font-size:11px}
      .live-mock-actions{width:100%;flex-wrap:wrap}
      .live-mock-primary,.live-mock-more,.coach-link{flex:1 1 160px;text-align:center;white-space:normal}
    }
  </style>
</head>
<body>
  <section class="live-mock-strip" aria-label="ASCENT learner tools">
    <div class="live-mock-copy">
      <div class="live-mock-kicker">Practice with ASCENT</div>
      <h2 class="live-mock-title">Practice, interview live, or ask ASCENT Coach</h2>
      <p class="live-mock-text">Record your answers, handle adaptive interview follow-ups, or ask ASCENT Coach what to work on next.</p>
    </div>
    <div class="live-mock-actions">
      <a class="coach-link" href="./coach.html">Ask ASCENT Coach</a>
      <a class="live-mock-primary" href="./live-mock-info.html">Live AI Mock Interview</a>
      <a class="live-mock-more" href="./live-mock-info.html">More information, pricing &amp; access</a>
    </div>
  </section>

  <iframe id="practiceFrame" src="./practice-core.html?v=20260823-live-mock" title="ASCENT Practice"></iframe>

  <script>
    const frame=document.getElementById('practiceFrame');
    frame.addEventListener('load',function(){
      try{
        const childDocument=frame.contentDocument;
        if(!childDocument)return;
        if(!childDocument.getElementById('ascentPracticeAccessV2')){
          const script=childDocument.createElement('script');
          script.id='ascentPracticeAccessV2';
          script.src='./practice-access-v2.js?v=20260823';
          childDocument.body.appendChild(script);
        }
      }catch(error){console.error('ASCENT practice controller could not load:',error);}
    });
  </script>
</body>
</html>
