<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>E-Portfolio · ASCENT</title><style>
:root{--navy:#143a60;--gold:#c67b00;--text:#24364a;--muted:#65778a;--border:#d7e1eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f7;color:var(--text)}header{padding:18px 24px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--navy);font-size:20px}.brand small{display:block;color:var(--gold);font-size:11px;margin-top:3px}.wrap{max-width:1180px;margin:26px auto;padding:0 18px 45px}.intro{display:grid;grid-template-columns:140px 1fr auto;gap:22px;align-items:center;padding:28px;border-radius:20px;background:#fff;border:1px solid var(--border);margin-bottom:20px}.intro img{width:120px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}.intro h1{margin:0 0 8px;color:var(--navy);font-size:38px}.intro p{margin:0;color:var(--muted);font-size:18px;line-height:1.5}.logoStrip{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}.logoCard{width:76px;height:56px;padding:7px;border:1px solid var(--border);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}.logoCard img{max-width:100%;max-height:100%;object-fit:contain}.logoCard span{font-size:11px;font-weight:800;color:var(--navy);text-align:center}.slides{display:grid;gap:20px}.slide{min-height:410px;padding:34px;border-radius:20px;background:linear-gradient(145deg,#102b47,#1e5688);color:#fff;box-shadow:0 18px 45px rgba(16,43,71,.14);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:28px}.slide:nth-child(even){background:#fff;color:var(--text);border:1px solid var(--border)}.num{font-size:12px;font-weight:800;color:#ffd58b;letter-spacing:.7px}.slide:nth-child(even) .num,.slide:nth-child(even) .highlight,.slide:nth-child(even) .visualTitle,.slide:nth-child(even) .racLabel{color:#9a6500}.slide h2{font-size:34px;line-height:1.1;margin:10px 0 8px}.slide:nth-child(even) h2{color:var(--navy)}.sub{font-size:18px;line-height:1.45;color:rgba(255,255,255,.78);margin-bottom:18px}.slide:nth-child(even) .sub{color:var(--muted)}ul{font-size:18px;line-height:1.5;margin:10px 0;padding-left:26px}.highlight{margin-top:22px;color:#ffd58b;font-size:15px;font-weight:800}.visual{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center}.slide:nth-child(even) .visual{background:#f7fafc;border-color:var(--border)}.visualTitle{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#ffd58b;margin-bottom:14px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:16px;border-radius:12px;background:#fff;color:var(--navy);min-height:95px}.kpi strong{display:block;font-size:27px;line-height:1;margin-bottom:8px}.kpi span{font-size:13px;line-height:1.3;color:#52677a}.bars{display:grid;gap:12px}.barRow{display:grid;grid-template-columns:100px 1fr 72px;gap:10px;align-items:center;font-size:13px}.barTrack{height:18px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}.slide:nth-child(even) .barTrack{background:#e3edf5}.barFill{height:100%;background:#ffd58b;border-radius:999px}.slide:nth-child(even) .barFill{background:#27679d}.barVal{text-align:right;font-weight:800}.pieWrap{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.pie{width:170px;height:170px;border-radius:50%;margin:auto}.legend{display:grid;gap:9px}.legendRow{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px}.legendDot{width:12px;height:12px;border-radius:3px;background:currentColor}.steps,.matrix{display:grid;gap:10px}.step,.matrixItem{padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.1);line-height:1.35;font-size:15px}.slide:nth-child(even) .step,.slide:nth-child(even) .matrixItem{background:#edf4f9}.matrix{grid-template-columns:1fr 1fr}.companyHead{display:grid;grid-template-columns:86px 1fr;gap:16px;align-items:center;margin:10px 0 18px}.companyLogo{width:82px;height:68px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:11px;font-weight:800;text-align:center}.companyLogo img{max-width:100%;max-height:100%;object-fit:contain}.companyName{font-size:31px;font-weight:800;line-height:1.08}.slide:nth-child(even) .companyName{color:var(--navy)}.roleLine{margin-top:6px;font-size:16px;color:rgba(255,255,255,.74)}.slide:nth-child(even) .roleLine{color:var(--muted)}.rac{display:grid;gap:10px}.racCard{padding:14px 15px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13)}.slide:nth-child(even) .racCard{background:#f5f9fc;border-color:var(--border)}.racLabel{font-size:11px;font-weight:800;letter-spacing:.7px;color:#ffd58b;margin-bottom:6px}.racText{font-size:16px;line-height:1.4}.state{padding:40px;background:#fff;border:1px solid var(--border);border-radius:18px;text-align:center;color:var(--muted);font-size:18px}@media(max-width:850px){.intro,.slide{grid-template-columns:1fr}.intro{text-align:center}.intro img{margin:auto}.logoStrip{justify-content:center;max-width:none}}@media(max-width:560px){.slide{padding:26px;min-height:360px}.slide h2{font-size:28px}.intro h1{font-size:32px}.matrix,.kpis,.pieWrap{grid-template-columns:1fr}.barRow{grid-template-columns:80px 1fr 58px}}
</style></head><body><header><div class="brand">ASCENT<small>E-Portfolio</small></div><div>Professional evidence, clearly presented.</div></header><main class="wrap"><section id="state" class="state">Loading portfolio…</section><section id="content" style="display:none"><div class="intro"><img id="photo" alt="Professional portrait"><div><h1 id="name"></h1><p id="headline"></p></div><div id="headLogos" class="logoStrip"></div></div><div id="slides" class="slides"></div></section></main><script>
const ENDPOINT='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/eportfolio-builder';let portfolio=null;const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const logoUrl=d=>d?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128`:'';function org(n){return (portfolio?.organisations||[]).find(o=>String(o.name).toLowerCase()===String(n).toLowerCase())||null}function logoNode(name,domain,cls='logoCard'){const d=document.createElement('div');d.className=cls;if(domain){const im=document.createElement('img');im.src=logoUrl(domain);im.alt=name+' logo';im.onerror=()=>{d.innerHTML=`<span>${esc(name)}</span>`};d.appendChild(im)}else d.innerHTML=`<span>${esc(name)}</span>`;return d}function pal(i){return ['#27679d','#c67b00','#57a773','#8a6fb6','#d55e5e'][i%5]}
function visual(v){const box=document.createElement('div');box.className='visual';const t=document.createElement('div');t.className='visualTitle';t.textContent=v?.title||'Result evidence';box.appendChild(t);const type=v?.type||'none',ms=v?.metrics||[];if(type==='kpi'&&ms.length){const g=document.createElement('div');g.className='kpis';ms.forEach(m=>{const k=document.createElement('div');k.className='kpi';k.innerHTML=`<strong>${esc(m.display_value)}</strong><span>${esc(m.label)}</span>`;g.appendChild(k)});box.appendChild(g)}else if(type==='bar'&&ms.length>1){const vals=ms.map(m=>Math.max(0,Number(m.numeric_value)||0)),max=Math.max(...vals,1),g=document.createElement('div');g.className='bars';ms.forEach((m,i)=>{const r=document.createElement('div');r.className='barRow';r.innerHTML=`<span>${esc(m.label)}</span><div class="barTrack"><div class="barFill" style="width:${Math.max(4,vals[i]/max*100)}%"></div></div><span class="barVal">${esc(m.display_value)}</span>`;g.appendChild(r)});box.appendChild(g)}else if(type==='pie'&&ms.length>1){const vals=ms.map(m=>Math.max(0,Number(m.numeric_value)||0)),sum=vals.reduce((a,b)=>a+b,0);if(sum>0){let acc=0,stops=[];vals.forEach((v,i)=>{const a=acc/sum*360;acc+=v;stops.push(`${pal(i)} ${a}deg ${acc/sum*360}deg`)});const w=document.createElement('div');w.className='pieWrap';w.innerHTML=`<div class="pie" style="background:conic-gradient(${stops.join(',')})"></div>`;const l=document.createElement('div');l.className='legend';ms.forEach((m,i)=>{const r=document.createElement('div');r.className='legendRow';r.innerHTML=`<span class="legendDot" style="color:${pal(i)}"></span><span>${esc(m.label)}</span><b>${esc(m.display_value)}</b>`;l.appendChild(r)});w.appendChild(l);box.appendChild(w)}}else if((type==='process'||type==='timeline')&&v.items?.length){const g=document.createElement('div');g.className='steps';v.items.forEach((x,i)=>{const d=document.createElement('div');d.className='step';d.innerHTML=`<b>${i+1}</b> ${esc(x)}`;g.appendChild(d)});box.appendChild(g)}else if(type==='matrix'&&v.items?.length){const g=document.createElement('div');g.className='matrix';v.items.forEach(x=>{const d=document.createElement('div');d.className='matrixItem';d.textContent=x;g.appendChild(d)});box.appendChild(g)}return box}
function experience(s){const a=document.createElement('article');a.className='slide';const left=document.createElement('div'),n=document.createElement('div');n.className='num';n.textContent='SCREEN '+s.number;const head=document.createElement('div');head.className='companyHead';const o=org(s.company_name)||{name:s.company_name||s.title,domain:s.company_domain||''};head.appendChild(logoNode(o.name||'Organisation',o.domain||s.company_domain,'companyLogo'));const tx=document.createElement('div');tx.innerHTML=`<div class="companyName">${esc(s.company_name||s.title)}</div><div class="roleLine">${esc(s.role_line||s.subtitle)}</div>`;head.appendChild(tx);const rac=document.createElement('div');rac.className='rac';[['RESULT',s.rac?.result],['ACTION',s.rac?.action],['CONTEXT',s.rac?.context]].forEach(([lab,val])=>{const c=document.createElement('div');c.className='racCard';c.innerHTML=`<div class="racLabel">${lab}</div><div class="racText">${esc(val)}</div>`;rac.appendChild(c)});left.append(n,head,rac);a.append(left,visual(s.visual||{}));return a}
function standard(s){const a=document.createElement('article');a.className='slide';const left=document.createElement('div');left.innerHTML=`<div class="num">SCREEN ${s.number}</div><h2>${esc(s.title)}</h2><div class="sub">${esc(s.subtitle)}</div><ul>${(s.bullets||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="highlight">${esc(s.highlight)}</div>`;a.append(left,visual(s.visual||{}));return a}
async function load(){const slug=new URLSearchParams(location.search).get('id')||'';if(!slug){document.getElementById('state').textContent='This portfolio link is incomplete.';return}try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'GET_PUBLIC',slug})});const d=await r.json();if(!r.ok||!d.portfolio)throw new Error('Portfolio not found.');portfolio=d.portfolio;document.title=(portfolio.name||'E-Portfolio')+' · E-Portfolio';document.getElementById('name').textContent=portfolio.name||'Professional E-Portfolio';document.getElementById('headline').textContent=portfolio.headline||portfolio.target_role||'';const ph=document.getElementById('photo');if(portfolio.photo_data_url)ph.src=portfolio.photo_data_url;else ph.style.display='none';const hs=document.getElementById('headLogos');(portfolio.organisations||[]).slice(0,4).forEach(o=>hs.appendChild(logoNode(o.name,o.domain)));const box=document.getElementById('slides');(portfolio.slides||[]).forEach(s=>box.appendChild(s.kind==='experience'||(s.number>=3&&s.number<=5)?experience(s):standard(s)));document.getElementById('state').style.display='none';document.getElementById('content').style.display='block'}catch(e){document.getElementById('state').textContent=e.message||'Portfolio not found.'}}load();
</script></body></html>
