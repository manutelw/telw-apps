<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>E-Portfolio · ASCENT</title><style>
:root{--navy:#143a60;--gold:#c67b00;--text:#24364a;--muted:#65778a;--border:#d7e1eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f7;color:var(--text)}header{padding:18px 24px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--navy);font-size:20px}.brand small{display:block;color:var(--gold);font-size:11px;margin-top:3px}.wrap{max-width:1180px;margin:26px auto;padding:0 18px 45px}.intro{padding:28px;border-radius:20px;background:#fff;border:1px solid var(--border);margin-bottom:20px;display:grid;grid-template-columns:1fr 150px;gap:24px;align-items:center}.intro h1{margin:0 0 8px;color:var(--navy);font-size:38px}.intro p{margin:0;color:var(--muted);font-size:18px;line-height:1.5}.portrait{width:140px;height:170px;object-fit:cover;border-radius:12px;border:1px solid var(--border);background:#fff;justify-self:end}.slides{display:grid;gap:20px}.slide{min-height:410px;padding:38px 42px;border-radius:20px;background:linear-gradient(145deg,#102b47,#1e5688);color:#fff;box-shadow:0 18px 45px rgba(16,43,71,.14);display:flex;flex-direction:column}.slide:nth-child(even){background:#fff;color:var(--text);border:1px solid var(--border)}.num{font-size:12px;font-weight:800;color:#ffd58b;letter-spacing:.7px}.slide:nth-child(even) .num,.slide:nth-child(even) .highlight{color:#9a6500}.slide h2{font-size:34px;line-height:1.1;margin:10px 0 8px}.slide:nth-child(even) h2{color:var(--navy)}.slide .sub{font-size:18px;line-height:1.5;color:rgba(255,255,255,.78);margin-bottom:18px}.slide:nth-child(even) .sub{color:var(--muted)}ul{font-size:20px;line-height:1.55;margin:10px 0;padding-left:26px}.highlight{margin-top:auto;color:#ffd58b;font-size:16px;font-weight:800;padding-top:18px}.state{padding:40px;background:#fff;border:1px solid var(--border);border-radius:18px;text-align:center;color:var(--muted);font-size:18px}@media(max-width:650px){.intro{grid-template-columns:1fr}.portrait{justify-self:start}.slide{padding:26px;min-height:360px}.slide h2{font-size:28px}ul{font-size:17px}.intro h1{font-size:32px}}</style></head><body><header><div class="brand">ASCENT<small>E-Portfolio</small></div><div>Professional evidence, clearly presented.</div></header><main class="wrap"><section id="state" class="state">Loading portfolio…</section><section id="content" style="display:none"><div class="intro"><div><h1 id="name"></h1><p id="headline"></p></div><img id="portrait" class="portrait" alt="Professional profile photograph"></div><div id="slides" class="slides"></div></section></main><script>
const ENDPOINT='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/eportfolio-builder';const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const slug=new URLSearchParams(location.search).get('id')||'';if(!slug){document.getElementById('state').textContent='This portfolio link is incomplete.';return}try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'GET_PUBLIC',slug})});const d=await r.json();if(!r.ok||!d.portfolio)throw new Error('Portfolio not found.');const p=d.portfolio;document.title=(p.name||'E-Portfolio')+' · E-Portfolio';document.getElementById('name').textContent=p.name||'Professional E-Portfolio';document.getElementById('headline').textContent=p.headline||p.target_role||'';const portrait=document.getElementById('portrait');if(p.photo_data_url)portrait.src=p.photo_data_url;else portrait.style.display='none';const box=document.getElementById('slides');box.innerHTML='';(p.slides||[]).forEach(s=>{const a=document.createElement('article');a.className='slide';a.innerHTML=`<div class="num">SCREEN ${s.number}</div><h2>${esc(s.title)}</h2><div class="sub">${esc(s.subtitle)}</div><ul>${(s.bullets||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="highlight">${esc(s.highlight)}</div>`;box.appendChild(a)});document.getElementById('state').style.display='none';document.getElementById('content').style.display='block'}catch(e){document.getElementById('state').textContent=e.message||'Portfolio not found.'}}load();
</script></body></html>
