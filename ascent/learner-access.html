<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ASCENT · Learner Access</title>
<style>
:root{--navy:#143a60;--blue:#27679d;--soft:#edf4fb;--gold:#c67b00;--text:#24364a;--muted:#6c7b8d;--border:#d7e1eb;--white:#fff;--green:#18794e;--red:#b42318;--shadow:0 22px 65px rgba(0,0,0,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at top right,rgba(244,201,107,.9) 0,rgba(244,201,107,.25) 18%,transparent 40%),linear-gradient(145deg,#102a46,#214d79)}.shell{max-width:1250px;margin:auto}.top,.card{background:#fff;border-radius:18px;box-shadow:var(--shadow)}.top{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:13px}.mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;font-size:22px;font-weight:800}.brand h1{margin:0;color:var(--navy);font-size:24px}.brand p{margin:4px 0 0;color:var(--gold);font-size:12px;font-weight:800}.back{padding:10px 13px;border:1px solid var(--border);border-radius:9px;text-decoration:none;color:var(--navy);font-weight:800}.card{margin-top:18px;padding:25px}.card h2{margin:0 0 7px;color:var(--navy);font-size:27px}.card>p{margin:0 0 18px;color:var(--muted);line-height:1.55}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;min-width:220px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.status{min-height:20px;margin:10px 0;color:var(--muted);font-size:13px}.status.error{color:var(--red)}.table{overflow:auto;border:1px solid var(--border);border-radius:13px}.row{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(125px,.6fr));align-items:center;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row.head{background:var(--soft);color:var(--navy);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.cell{padding:13px 12px}.student strong{display:block;color:var(--navy)}.student span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}.toggle{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;color:var(--navy)}.toggle input{width:19px;height:19px}.empty{padding:26px;text-align:center;color:var(--muted)}@media(max-width:850px){.row{grid-template-columns:1fr}.row.head{display:none}.cell{border-bottom:1px dashed #dfe7ef}.cell:last-child{border-bottom:0}.toggle{justify-content:flex-start}.student{background:#fbfdff}.tools{display:block}.tools input,.tools .btn{width:100%;margin-bottom:8px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><div class="mark">A</div><div><h1>ASCENT</h1><p>Learner Access Control</p></div></div><a class="back" href="./trainer.html">Back to Trainer Portal</a></header><main class="card"><h2>GD & PI Learner Access</h2><p>Switch access on only for the learners who should receive each Lab or practice bank. Changes take effect the next time the learner opens or refreshes ASCENT.</p><div class="tools"><input id="search" placeholder="Search by name, roll number or email"><button id="searchBtn" class="btn" type="button">Search</button></div><div id="status" class="status"></div><div class="table"><div class="row head"><div class="cell">Learner</div><div class="cell">GD Lab</div><div class="cell">PI Lab</div><div class="cell">GD Bank</div><div class="cell">PI Bank</div></div><div id="rows"><div class="empty">Loading learners…</div></div></div></main></div>
<script>
const KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',BASE='https://vtqatrhwfvzyodiftvkc.supabase.co/rest/v1/rpc/',SESSION_KEY='ascent_trainer_session';
const rows=document.getElementById('rows'),statusBox=document.getElementById('status'),search=document.getElementById('search');
function session(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');const exp=new Date(s?.expiresAt||s?.expires_at).getTime();if(!s?.sessionToken&&!s?.session_token)throw 0;if(!Number.isFinite(exp)||exp<=Date.now())throw 0;s.sessionToken=s.sessionToken||s.session_token;return s}catch{location.replace('./trainer-login.html');return null}}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
async function rpc(name,body){const r=await fetch(BASE+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d?.ok===false)throw Error(d?.message||d?.code||'Request failed');return d}
const s=session();
function render(list){if(!Array.isArray(list)||!list.length){rows.innerHTML='<div class="empty">No learners found.</div>';return}rows.innerHTML=list.map(st=>`<div class="row"><div class="cell student"><strong>${esc(st.fullName)}</strong><span>${esc(st.studentId)}${st.email?' · '+esc(st.email):''}${st.batch?' · '+esc(st.batch):''}</span></div>${toggle(st,'GD_LAB','gdLab','GD Lab')}${toggle(st,'PI_LAB','piLab','PI Lab')}${toggle(st,'GD_BANK','gdBank','GD Bank')}${toggle(st,'PI_BANK','piBank','PI Bank')}</div>`).join('');rows.querySelectorAll('input[data-feature]').forEach(input=>input.addEventListener('change',()=>save(input)))}
function toggle(st,code,key,label){return `<div class="cell"><label class="toggle"><input type="checkbox" data-student="${esc(st.studentUuid)}" data-feature="${code}" ${st[key]?'checked':''}><span>${label}</span></label></div>`}
async function load(){if(!s)return;statusBox.className='status';statusBox.textContent='Loading…';try{const d=await rpc('ascent_trainer_student_feature_access_list',{p_session_token:s.sessionToken,p_search:search.value.trim()});render(d.students||[]);statusBox.textContent=''}catch(e){statusBox.className='status error';statusBox.textContent=e.message}}
async function save(input){input.disabled=true;statusBox.className='status';statusBox.textContent='Saving…';try{await rpc('ascent_trainer_set_student_feature_access',{p_session_token:s.sessionToken,p_student_uuid:input.dataset.student,p_feature_code:input.dataset.feature,p_enabled:input.checked});statusBox.textContent='Saved.'}catch(e){input.checked=!input.checked;statusBox.className='status error';statusBox.textContent=e.message}finally{input.disabled=false}}
document.getElementById('searchBtn').onclick=load;search.addEventListener('keydown',e=>{if(e.key==='Enter')load()});if(s)load();
</script></body></html>
