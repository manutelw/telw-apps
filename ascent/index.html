<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASCENT · Speaking Practice</title>

  <meta
    name="description"
    content="ASCENT speaking practice and feedback platform"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, #f4c96b 0, transparent 35%),
        linear-gradient(145deg, #12243a, #20466e);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.97);
      color: #17263a;
      border-radius: 24px;
      padding: 42px 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .brand {
      display: inline-block;
      padding: 7px 15px;
      margin-bottom: 22px;
      border-radius: 999px;
      background: #e9f0f8;
      color: #1b4a75;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: clamp(38px, 9vw, 58px);
      line-height: 1;
      letter-spacing: 2px;
      color: #173d62;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 19px;
      font-weight: 700;
      color: #bf7a12;
      margin-bottom: 24px;
    }

    .description {
      font-size: 16px;
      line-height: 1.65;
      color: #536174;
      margin-bottom: 30px;
    }

    .status {
      border: 1px solid #d6e2ee;
      background: #f4f8fc;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #244e73;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #8190a1;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 34px 22px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">CLARIONPREP.COM</div>

    <h1>ASCENT</h1>

    <div class="subtitle">
      Speak. Improve. Move Forward.
    </div>

    <p class="description">
      ASCENT is the speaking-practice platform for LUM,
      personal interview and group discussion responses.
    </p>

    <div class="status">
      The ASCENT student application is being prepared.
    </div>

    <div class="footer">
      A separate application within ClarionPrep
    </div>
  </main>
</body>
</html>
