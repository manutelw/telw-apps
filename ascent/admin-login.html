<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      --navy:#143a60;
      --blue:#27679d;
      --text:#24364a;
      --muted:#6c7b8d;
      --border:#cfdbe6;
      --danger:#b42318;
      --danger-soft:#fff0ee;
      --success:#18794e;
      --success-soft:#eaf8f1;
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0;
      min-height:100vh;
      padding:20px;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:#f4f7fa;
    }
    button,input { font:inherit; }
    .admin-box {
      width:100%;
      max-width:330px;
      padding:20px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      box-shadow:0 10px 28px rgba(20,58,96,.12);
    }
    h1 {
      margin:0 0 5px;
      color:var(--navy);
      font-size:20px;
    }
    .intro {
      margin:0 0 17px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .form-group { margin-bottom:13px; }
    label {
      display:block;
      margin-bottom:6px;
      font-size:12px;
      font-weight:700;
    }
    .password-wrap { position:relative; }
    input {
      width:100%;
      min-height:42px;
      padding:9px 11px;
      border:1px solid #aec2d3;
      border-radius:8px;
      color:var(--text);
      background:#fff;
    }
    .password-wrap input { padding-right:60px; }
    input:focus {
      outline:3px solid rgba(39,103,157,.14);
      border-color:var(--blue);
    }
    .show-password {
      position:absolute;
      top:6px;
      right:6px;
      min-height:30px;
      padding:0 8px;
      border:0;
      border-radius:6px;
      color:var(--navy);
      background:#e8f0f7;
      font-size:11px;
      font-weight:700;
      cursor:pointer;
    }
    .login-button {
      width:100%;
      min-height:43px;
      border:0;
      border-radius:8px;
      color:#fff;
      background:var(--navy);
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }
    .login-button:disabled { opacity:.65; cursor:wait; }
    .status {
      display:none;
      margin-top:12px;
      padding:9px 10px;
      border-radius:7px;
      font-size:12px;
      line-height:1.4;
    }
    .status.error {
      display:block;
      color:var(--danger);
      background:var(--danger-soft);
    }
    .status.success {
      display:block;
      color:var(--success);
      background:var(--success-soft);
    }
    .back-link {
      display:inline-block;
      margin-top:13px;
      color:var(--muted);
      font-size:11px;
      text-decoration:none;
    }
    .back-link:hover { color:var(--navy); }
  </style>
</head>
<body>
  <main class="admin-box">
    <h1>Administrator Login</h1>
    <p class="intro">Authorised administrator access only.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="adminEmail">Email address</label>
        <input
          id="adminEmail"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="password-wrap">
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          >
          <button
            id="showPasswordButton"
            class="show-password"
            type="button"
          >
            Show
          </button>
        </div>
      </div>

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        Open Admin
      </button>

      <div
        id="statusMessage"
        class="status"
        role="status"
        aria-live="polite"
      ></div>
    </form>

    <a class="back-link" href="./">Return to ASCENT</a>
  </main>

  <script>
    const SUPABASE_URL =
      "https://vtqatrhwfvzyodiftvkc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643";

    const LOGIN_RPC_URL =
      SUPABASE_URL +
      "/rest/v1/rpc/ascent_trainer_login";

    const SESSION_STORAGE_KEY =
      "ascent_trainer_session";

    const ADMIN_MASTER_SESSION_KEY =
      "ascent_admin_master_session";

    const form =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("adminEmail");

    const passwordInput =
      document.getElementById("adminPassword");

    const loginButton =
      document.getElementById("loginButton");

    const statusMessage =
      document.getElementById("statusMessage");

    const showPasswordButton =
      document.getElementById(
        "showPasswordButton"
      );

    function showStatus(message,type) {
      statusMessage.className =
        "status" +
        (type ? " " + type : "");

      statusMessage.textContent =
        message || "";
    }

    showPasswordButton.addEventListener(
      "click",
      function () {
        const hidden =
          passwordInput.type === "password";

        passwordInput.type =
          hidden ? "text" : "password";

        showPasswordButton.textContent =
          hidden ? "Hide" : "Show";
      }
    );

    form.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        showStatus("","");

        if (!email || !password) {
          showStatus(
            "Enter the administrator email and password.",
            "error"
          );
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent =
          "Checking…";

        try {
          const response = await fetch(
            LOGIN_RPC_URL,
            {
              method:"POST",
              headers:{
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,
                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY,
                "Content-Type":
                  "application/json"
              },
              body:JSON.stringify({
                p_email:email,
                p_password:password
              })
            }
          );

          if (!response.ok) {
            throw new Error(
              "Administrator login could not be checked."
            );
          }

          const payload =
            await response.json();

          if (
            !Array.isArray(payload) ||
            payload.length === 0
          ) {
            throw new Error(
              "Incorrect administrator email or password."
            );
          }

          const account = payload[0];

          if (
            String(
              account.role || ""
            ).toUpperCase() !== "ADMIN"
          ) {
            throw new Error(
              "This account does not have administrator access."
            );
          }

          const session = {
            sessionToken:
              account.session_token,
            trainerUuid:
              account.trainer_uuid,
            fullName:
              account.full_name,
            email:account.email,
            role:account.role,
            expiresAt:
              account.expires_at
          };

          localStorage.setItem(
            SESSION_STORAGE_KEY,
            JSON.stringify(session)
          );

          localStorage.setItem(
            ADMIN_MASTER_SESSION_KEY,
            JSON.stringify(session)
          );

          showStatus(
            "Administrator verified.",
            "success"
          );

          window.setTimeout(
            function () {
              window.location.href =
                "./admin-settings.html";
            },
            350
          );
        } catch (error) {
          passwordInput.value = "";
          passwordInput.focus();
          showStatus(
            error.message ||
            "Administrator login failed.",
            "error"
          );
        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "Open Admin";
        }
      }
    );
  </script>
</body>
</html>
