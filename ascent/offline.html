<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143a60">
  <title>ASCENT · Internet connection needed</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #24364a;
      background: #edf4fb;
    }
    main {
      width: min(520px, 100%);
      padding: 34px;
      text-align: center;
      background: #fff;
      border: 1px solid #d7e1eb;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(20, 58, 96, .14);
    }
    h1 { margin: 0 0 12px; color: #143a60; }
    p { line-height: 1.6; }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #143a60;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>ASCENT needs an internet connection to load questions, submit recordings and return feedback.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
