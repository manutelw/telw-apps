<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening CV Builder…</title><style>body{font-family:Arial,sans-serif;background:#f6f8fa;color:#17395d;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:28px;max-width:520px;box-shadow:0 14px 36px rgba(23,57,93,.08)}.error{color:#a43d3d}</style></head><body><div class="card"><h2>Opening CV Builder &amp; Evaluator…</h2><p id="status">Checking administrator access.</p></div><script>
const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/clarion-tool-admin-handoff';
function session(){for(const k of ['ascent_admin_master_session','ascent_trainer_session']){try{const s=JSON.parse(localStorage.getItem(k)||'null');const token=s?.sessionToken||s?.session_token,role=String(s?.role||'').toUpperCase(),exp=new Date(s?.expiresAt||s?.expires_at||0).getTime();if(token&&role==='ADMIN'&&Number.isFinite(exp)&&exp>Date.now())return token}catch{}}return''}
(async()=>{const t=session();if(!t){location.replace('./admin-login.html');return}try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_token:t,product_code:'CV_BUILDER'})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw new Error(d.message||'Administrator handoff failed.');location.replace('https://profile-review.manutelw.workers.dev/?access='+encodeURIComponent(d.entitlement_token))}catch(e){const s=document.getElementById('status');s.className='error';s.textContent=e.message||'Could not open CV Builder.'}})();
</script></body></html>
