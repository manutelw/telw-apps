<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ASCENT · Opening Professional Communication Module 1</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3f8;font-family:Arial,Helvetica,sans-serif;color:#21364a}.box{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #d9e3ed;border-radius:18px;padding:30px;box-shadow:0 16px 44px rgba(17,44,70,.12);text-align:center}h1{margin:0 0 10px;color:#143a60;font-size:25px}p{margin:0;color:#66788b;line-height:1.6;font-size:16px}.error{color:#b42318;margin-top:16px}.btn{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:10px;background:#143a60;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>Opening Professional Communication Module 1</h1>
<p id="status">Checking your trainer preview access…</p>
<div id="error" class="error"></div>
<a id="login" class="btn" href="./trainer-login.html" hidden>Return to Trainer Login</a>
</div>
<script>
const TRAINER_KEY='ascent_trainer_session';
const STUDENT_KEY='ascent_student_session';
const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/ascent-pcl-trainer-preview-session';
const KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643';
const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),loginEl=document.getElementById('login');
function fail(message){statusEl.textContent='Preview could not be opened.';errorEl.textContent=message;loginEl.hidden=false;}
(async()=>{
  let trainer=null;
  try{trainer=JSON.parse(localStorage.getItem(TRAINER_KEY)||'null')}catch{}
  if(!trainer?.sessionToken){fail('Your trainer session is not available. Please log in to the Trainer Portal again.');return;}
  if(trainer.expiresAt&&new Date(trainer.expiresAt)<=new Date()){fail('Your trainer session has expired. Please log in again.');return;}
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({trainer_session_token:trainer.sessionToken})});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.message||'Preview access was not granted.');
    const preview={sessionToken:d.session_token,expiresAt:d.expires_at,studentUuid:'2d17930a-9370-43c5-91b2-7bb7e0a85f70',fullName:'Admin Institutional Demo',isPclTrainerPreview:true};
    sessionStorage.setItem('ascent_pcl_previous_student_session',localStorage.getItem(STUDENT_KEY)||'');
    localStorage.setItem(STUDENT_KEY,JSON.stringify(preview));
    statusEl.textContent='Preview access confirmed. Opening Module 1…';
    location.replace('./professional-communication-module-1.html?trainer_preview=1');
  }catch(e){fail(e?.message||'ASCENT could not create the preview session.');}
})();
</script>
</body>
</html>
