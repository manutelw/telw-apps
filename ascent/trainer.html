<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCENT · Trainer Portal</title>
  <meta name="description" content="ASCENT trainer and administrator portal">
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" onerror="this.onerror=null;this.src='https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';"></script>
  <style>
    :root {
      --navy:#143a60; --navy-dark:#102b47; --blue:#27679d; --blue-soft:#edf4fb;
      --gold:#c67b00; --gold-light:#f4c96b; --text:#24364a; --muted:#6c7b8d;
      --border:#d7e1eb; --white:#fff; --danger:#b42318; --danger-soft:#fff0ee;
      --success:#18794e; --success-soft:#eaf8f1; --warning:#9a6700; --warning-soft:#fff7db;
      --shadow:0 22px 65px rgba(0,0,0,.2);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body {
      min-height:100vh; font-family:Arial,Helvetica,sans-serif; color:var(--text); padding:20px;
      background:radial-gradient(circle at top right,rgba(244,201,107,.75) 0,rgba(244,201,107,.18) 18%,transparent 40%),linear-gradient(145deg,#102a46,#214d79);
    }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .app-shell { width:100%; max-width:1480px; margin:0 auto; }
    .topbar {
      display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:18px;
      padding:16px 20px; border-radius:18px; background:rgba(255,255,255,.98); box-shadow:var(--shadow);
    }
    .brand-wrap { display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; cursor:pointer; }
    .brand-mark { width:46px; height:46px; display:grid; place-items:center; border-radius:13px; background:linear-gradient(145deg,var(--navy),var(--blue)); color:#fff; font-size:22px; font-weight:800; }
    .brand-text h1 { color:var(--navy); font-size:24px; letter-spacing:1.3px; line-height:1; margin-bottom:5px; }
    .brand-text p { color:var(--gold); font-size:13px; font-weight:700; }
    .topbar-actions { display:flex; align-items:center; gap:12px; }
    .user-summary { text-align:right; cursor:pointer; }
    .user-name { color:var(--navy); font-size:14px; font-weight:800; }
    .user-role { margin-top:3px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
    .secondary-button,.home-button,.logout-button,.small-button {
      border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--navy); font-weight:700;
    }
    .home-button,.logout-button { padding:10px 14px; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .secondary-button { min-height:44px; padding:0 16px; font-size:14px; }
    .small-button { padding:7px 10px; font-size:12px; }
    .secondary-button:hover,.home-button:hover,.logout-button:hover,.small-button:hover { background:var(--blue-soft); }
    .danger-button { border-color:#efb6b0; color:var(--danger); }
    .main-layout { display:grid; grid-template-columns:240px minmax(0,1fr); gap:18px; }
    .sidebar,.workspace { border-radius:20px; background:rgba(255,255,255,.98); box-shadow:var(--shadow); }
    .sidebar { padding:22px 16px; height:max-content; position:sticky; top:16px; }
    .sidebar-title { margin:0 10px 14px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; }
    .nav-list { display:grid; gap:8px; }
    .nav-item { width:100%; border:0; border-radius:11px; padding:12px 14px; background:transparent; color:#4a6075; font-size:14px; font-weight:700; text-align:left; }
    .nav-item.active { background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; }
    .nav-item:not(.active):hover { background:var(--blue-soft); color:var(--navy); }
    .workspace { min-height:700px; padding:28px; overflow:hidden; }
    .section-panel { display:none; }
    .section-panel.active { display:block; }
    .workspace-header { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:24px; }
    .workspace-header h2 { color:var(--navy); font-size:28px; margin-bottom:8px; }
    .workspace-header p { color:var(--muted); font-size:14px; line-height:1.55; }
    .header-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .status-pill { flex:0 0 auto; padding:8px 12px; border-radius:999px; background:var(--success-soft); color:var(--success); font-size:12px; font-weight:800; }
    .card-grid { display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:14px; margin-bottom:20px; }
    .summary-card { padding:17px; border:1px solid var(--border); border-radius:15px; background:#fbfdff; }
    .summary-label { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; margin-bottom:9px; }
    .summary-value { color:var(--navy); font-size:27px; font-weight:800; line-height:1; }
    .panel { padding:20px; border:1px solid var(--border); border-radius:16px; background:#fbfdff; margin-bottom:18px; }
    .panel-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .panel h3 { color:var(--navy); font-size:18px; margin-bottom:5px; }
    .panel-subtitle { color:var(--muted); font-size:12px; line-height:1.5; }
    .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .reminder-switch-row { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    .reminder-state { display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.04em; }
    .reminder-state.on { color:#087443; background:#e6f7ef; border:1px solid #a8dec5; }
    .reminder-state.off { color:#6b7785; background:#f1f4f7; border:1px solid #d7dfe7; }
    .reminder-state-dot { width:9px; height:9px; border-radius:50%; background:currentColor; }
    .reminder-note { margin-top:14px; padding:14px 16px; border-radius:10px; background:#fff8e8; border:1px solid #eab24d; color:#765000; font-size:13px; line-height:1.5; }
    .chart-box { min-height:270px; }
    .completion-bar { height:34px; display:flex; overflow:hidden; border-radius:10px; background:#e9eef3; margin:28px 0 18px; }
    .completion-segment { min-width:0; transition:width .2s ease; }
    .completion-segment.completed { background:#2e8b68; }
    .completion-segment.not-attempted { background:#d48c24; }
    .completion-segment.other { background:#9eafbd; }
    .chart-legend { display:flex; gap:14px; flex-wrap:wrap; color:#4a6075; font-size:12px; }
    .legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .legend-dot.completed { background:#2e8b68; } .legend-dot.not-attempted { background:#d48c24; } .legend-dot.other { background:#9eafbd; }
    .criterion-chart { display:grid; gap:10px; margin-top:15px; }
    .criterion-row { display:grid; grid-template-columns:minmax(120px,1.4fr) 3fr 44px; gap:10px; align-items:center; font-size:12px; }
    .criterion-name { color:#40586e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .criterion-track { height:12px; border-radius:999px; background:#e6edf4; overflow:hidden; }
    .criterion-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--navy),var(--blue)); }
    .criterion-value { text-align:right; color:var(--navy); font-weight:800; }
    .line-chart { width:100%; height:230px; display:block; }
    .line-empty { height:220px; display:grid; place-items:center; color:var(--muted); font-size:13px; }
    .filter-grid,.form-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .form-group { margin-bottom:15px; }
    .form-group.full-width { grid-column:1/-1; }
    .form-group.two-wide { grid-column:span 2; }
    .form-group label { display:block; margin-bottom:7px; color:var(--text); font-size:12px; font-weight:800; }
    .form-group input,.form-group select,.form-group textarea {
      width:100%; border:1px solid var(--border); border-radius:10px; outline:none; background:#fff; color:var(--text); font-size:14px;
    }
    .form-group input,.form-group select { min-height:44px; padding:0 12px; }
    .form-group textarea { min-height:210px; padding:12px; resize:vertical; line-height:1.5; }
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus { border-color:#4d83b5; box-shadow:0 0 0 4px rgba(77,131,181,.13); }
    .form-note { color:var(--muted); font-size:11px; line-height:1.5; margin-top:6px; }
    .inline-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .primary-button { min-height:46px; border:0; border-radius:11px; padding:0 18px; background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; font-size:14px; font-weight:800; }
    .primary-button:disabled { opacity:.6; cursor:wait; }
    .form-status { min-height:22px; margin-top:12px; font-size:13px; line-height:1.5; }
    .form-status.error,.form-status.success,.form-status.warning { padding:11px 12px; border-radius:10px; }
    .form-status.error { background:var(--danger-soft); color:var(--danger); }
    .form-status.success { background:var(--success-soft); color:var(--success); }
    .form-status.warning { background:var(--warning-soft); color:var(--warning); }
    .student-picker { border:1px solid var(--border); border-radius:10px; background:#fff; overflow:hidden; }
    .student-picker input { border:0; border-bottom:1px solid var(--border); border-radius:0; }
    .student-options { max-height:220px; overflow:auto; padding:8px; }
    .student-option { display:flex; align-items:flex-start; gap:8px; padding:8px; border-radius:8px; }
    .student-option:hover { background:var(--blue-soft); }
    .student-option input { width:auto; min-height:auto; margin-top:2px; }
    .student-option span { font-size:12px; line-height:1.35; color:#40586e; }
    .question-count { display:inline-block; padding:6px 9px; border-radius:999px; background:var(--blue-soft); color:var(--navy); font-size:11px; font-weight:800; }
    .bank-selection-strip { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:13px 14px; margin-bottom:16px; border:1px solid #bfd3e6; border-radius:12px; background:var(--blue-soft); }
    .bank-selection-text { color:var(--navy); font-size:13px; font-weight:800; }
    .checkbox-line { display:flex; align-items:center; gap:8px; min-height:44px; padding:0 2px; color:#40586e; font-size:12px; font-weight:700; }
    .checkbox-line input { width:auto; min-height:auto; }
    .bank-editor { border-color:#b9cee2; background:#f7fbff; }
    .compact-textarea { min-height:96px !important; }
    .bank-question-check { width:17px; height:17px; }
    .bank-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .bank-meta { margin-top:5px; color:var(--muted); font-size:10px; line-height:1.35; }
    .difficulty-pill { display:inline-block; padding:5px 8px; border-radius:999px; background:#f1f4f7; color:#40586e; font-size:10px; font-weight:800; white-space:nowrap; }
    .difficulty-1 { background:#eaf8f1; color:#18794e; }
    .difficulty-2 { background:#edf4fb; color:#27679d; }
    .difficulty-3 { background:#fff7db; color:#8a6200; }
    .difficulty-4 { background:#fff0df; color:#a55200; }
    .difficulty-5 { background:#fff0ee; color:#b42318; }
    .read-only-note { padding:11px 12px; margin-bottom:14px; border-radius:10px; background:var(--blue-soft); color:var(--navy); font-size:12px; line-height:1.5; }
    .table-wrap { width:100%; overflow:auto; border:1px solid var(--border); border-radius:12px; background:#fff; }
    table { width:100%; border-collapse:collapse; min-width:900px; }
    th,td { padding:11px 12px; border-bottom:1px solid #e7edf3; text-align:left; vertical-align:top; font-size:12px; }
    th { position:sticky; top:0; z-index:1; background:#edf4fb; color:var(--navy); font-size:10px; letter-spacing:.5px; text-transform:uppercase; }
    td { color:#40586e; line-height:1.4; }
    tr:last-child td { border-bottom:0; }
    .question-cell { max-width:360px; min-width:250px; }
    .status-badge { display:inline-block; padding:5px 8px; border-radius:999px; font-size:10px; font-weight:800; white-space:nowrap; }
    .status-completed { background:var(--success-soft); color:var(--success); }
    .status-not-started,.status-not-attempted { background:var(--warning-soft); color:var(--warning); }
    .status-scheduled { background:var(--blue-soft); color:var(--blue); }
    .status-withdrawn { background:var(--danger-soft); color:var(--danger); }
    .empty-state { padding:28px; text-align:center; color:var(--muted); font-size:13px; }
    .student-profile { display:grid; gap:18px; }
    .student-profile-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap; }
    .student-profile-head h3 { margin:0 0 5px; color:var(--navy); font-size:23px; }
    .student-detail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .student-detail { padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:#f8fbfd; }
    .student-detail strong { display:block; margin-bottom:4px; color:var(--muted); font-size:10px; letter-spacing:.45px; text-transform:uppercase; }
    .student-detail span { color:var(--navy); font-size:13px; font-weight:700; }
    .student-progress-grid { display:grid; grid-template-columns:minmax(0,2fr) minmax(180px,1fr); gap:18px; }
    .completion-ring-wrap { display:grid; place-items:center; min-height:190px; }
    .completion-ring { width:160px; height:160px; border-radius:50%; display:grid; place-items:center; position:relative; }
    .completion-ring::after { content:""; width:112px; height:112px; border-radius:50%; background:#fff; position:absolute; }
    .completion-ring-copy { position:relative; z-index:1; text-align:center; color:var(--navy); font-weight:800; }
    .completion-ring-copy strong { display:block; font-size:23px; }
    .completion-ring-copy span { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:700; }
    .student-question-table td { vertical-align:top; }
    .loading-overlay { display:none; position:fixed; inset:0; z-index:999; background:rgba(11,35,58,.35); place-items:center; }
    .loading-overlay.active { display:grid; }
    .loading-card { padding:20px 24px; border-radius:14px; background:#fff; color:var(--navy); font-weight:800; box-shadow:var(--shadow); }
    .footer { margin-top:18px; color:rgba(255,255,255,.72); font-size:12px; line-height:1.5; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:1200px) { .card-grid { grid-template-columns:repeat(3,1fr); } .form-grid,.filter-grid { grid-template-columns:repeat(2,1fr); } }
