<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClarionPrep · Buy</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>:root{--n:#17395d;--b:#4d78a4;--g:#d2a04d;--t:#243b53;--m:#6b7c8e;--l:#dce5ec;--bg:#f6f8fa;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:#fff;border-bottom:1px solid var(--l);padding:22px 20px}.brand{font-size:25px;font-weight:800;color:var(--n);text-decoration:none}.brand span{color:var(--g)}.shell{width:min(760px,calc(100% - 30px));margin:auto}.card{margin:34px auto;background:#fff;border:1px solid var(--l);border-radius:18px;padding:28px;box-shadow:0 16px 42px rgba(23,57,93,.08)}.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:900;color:var(--g)}h1{margin:7px 0 6px;color:var(--n)}.price{font-size:38px;font-weight:900;color:var(--n);margin:16px 0 6px}.meta{color:var(--m);line-height:1.6}.who{margin-top:18px;padding:14px;border-radius:12px;background:#f7fafc;color:var(--m);font-size:13px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font:inherit}.note{font-size:13px;color:var(--m);line-height:1.55;margin-top:14px}.btn{display:inline-block;border:0;border-radius:10px;padding:13px 16px;background:var(--n);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;font:inherit;font-weight:800}.btn.gold{background:linear-gradient(135deg,#e0b35c,#c99234);color:#17283c}.btn.soft{background:#edf3f8;color:var(--n)}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.status{min-height:20px;margin-top:12px;font-size:13px;line-height:1.5}.error{color:var(--bad)}.success{color:var(--ok)}.soon{font-size:24px;font-weight:900;color:var(--g);margin:16px 0 8px}.link{color:var(--b);font-size:13px;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}.box{margin-top:16px;padding:14px;border:1px solid #f0d9a8;background:#fffaf0;border-radius:12px;font-size:13px;line-height:1.55}</style></head>
<body><header><div class="shell"><a class="brand" href="/">Clarion<span>Prep</span></a></div></header>
<main class="shell"><section class="card">
<div class="eyebrow">Secure checkout</div><h1 id="name">Loading…</h1><div id="price" class="price">—</div><div id="meta" class="meta"></div><div id="soon" class="soon hidden">Coming soon</div>
<div id="who" class="who hidden"></div>
<div id="device" class="box hidden"></div>
<form id="form" class="hidden" autocomplete="on" onsubmit="return false">
 <label for="fName">Full name</label><input id="fName" autocomplete="name" required>
 <label for="fEmail">Email address</label><input id="fEmail" type="email" autocomplete="email" required>
 <label for="fMobile">Mobile number</label><input id="fMobile" type="tel" autocomplete="tel" required>
 <div class="note">No account or password needed. Pay, and your product opens straight away.</div>
</form>
<div id="exists" class="box hidden">This email already has a ClarionPrep account. Enter its password to continue.
 <label for="fPass">Password</label><input id="fPass" type="password" autocomplete="current-password">
 <div class="note">Don't know the password? Use a different email address.</div></div>
<div class="actions"><button id="pay" class="btn gold" type="button" disabled>Pay</button><a class="btn soft" href="/">Back</a></div>
<div id="status" class="status"></div>
<div class="note"><button id="other" class="link hidden" type="button">Not you? Use a different email</button></div>
</section></main>
<script>
const MULTI=['DIALOGUE_LAB','PCL','PI_PRACTICE','GD_PRACTICE','PI_LAB','GD_LAB','LIVE_MOCK','PLACEMENT_PASS'];
const COMMERCE='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-commerce',AUTH='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-auth',$=id=>document.getElementById(id),wanted=(new URLSearchParams(location.search).get('product')||'').toUpperCase();
let product=null,user=null,needPassword=false;
function deviceId(){let d=localStorage.getItem('clarion_device_v1');if(!d){const a=new Uint8Array(24);crypto.getRandomValues(a);d=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('clarion_device_v1',d)}return d}
function status(msg,type=''){const e=$('status');e.textContent=msg||'';e.className='status'+(type?' '+type:'')}
async function call(url,action,body={}){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.message||'Request failed.');return d}
async function secureSession(session){const r=await fetch('/access/public-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_token:session,device_id:deviceId()})});if(!r.ok)throw Error('Please log in again.')}
async function store(d){localStorage.setItem('clarion_public_session',d.session_token);localStorage.setItem('clarion_public_user',JSON.stringify(d.user||{}));await secureSession(d.session_token)}
function forget(){localStorage.removeItem('clarion_public_session');localStorage.removeItem('clarion_public_user');user=null}
function randomPassword(){const a=new Uint8Array(24);crypto.getRandomValues(a);return 'Cp-'+[...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,30)+'!9'}
async function launch(url,token){localStorage.setItem('clarion_entitlement_'+product.code,token);if(product.code==='CAT_SIMULATOR'){const u=new URL(url,location.origin);u.searchParams.set('clarion_token',token);u.searchParams.set('clarion_device',deviceId());u.searchParams.set('clarion_product',product.code);location.href=u.toString();return}const r=await fetch('/access/public-entitlement',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product_code:product.code,entitlement_token:token,device_id:deviceId()})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw Error(d.message||'Your secure app access could not be opened.');location.href=new URL(d.launch_url||url,location.origin).toString()}
function description(p){if(p.code==='CAT_SIMULATOR')return 'One full attempt.';if(p.code==='WCT')return 'One assessment and report.';if(p.code==='PI_PRACTICE'||p.code==='GD_PRACTICE'||p.code==='DIALOGUE_LAB')return p.duration_days+' days or '+p.usage_limit+' completed sessions, whichever comes first.';if(p.code==='PI_LAB'||p.code==='GD_LAB')return '3 complete lab sessions.';if(p.code==='LIVE_MOCK')return 'One complete AI mock interview and report.';if(p.code==='PCL')return '30 days access. Modules included.';if(p.code==='PLACEMENT_PASS')return 'One WCT · one CAT attempt · 10 PI practices · 10 GD practices · one AI Live Mock · 30-day validity.';return p.duration_days+' days access.'}
function showWho(){$('who').textContent='Buying as '+user.full_name+' · '+user.email;$('who').classList.remove('hidden');$('form').classList.add('hidden');$('exists').classList.add('hidden');$('other').classList.remove('hidden')}
function showForm(){$('who').classList.add('hidden');$('form').classList.remove('hidden');$('other').classList.add('hidden')}
$('other').onclick=()=>{forget();showForm();status('')};
async function ensureUser(){
 if(user)return;
 const full_name=$('fName').value.trim(),email=$('fEmail').value.trim(),mobile=$('fMobile').value.trim();
 if(full_name.length<2)throw Error('Please enter your full name.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Please enter a valid email address.');
 if(mobile.replace(/\D/g,'').length<10)throw Error('Please enter a valid mobile number.');
 if(needPassword){const d=await call(AUTH,'LOGIN',{email,password:$('fPass').value,device_id:deviceId()});await store(d);user=d.user;return}
 try{
  const d=await call(AUTH,'REGISTER',{full_name,roll_number:'IND-'+crypto.randomUUID().replaceAll('-','').slice(0,12).toUpperCase(),institution_name:'Individual',email,mobile,password:randomPassword(),device_id:deviceId()});
  await store(d);user=d.user||{full_name,email,mobile};
 }catch(e){
  if(/already|exist|registered|in use/i.test(e.message)){needPassword=true;$('exists').classList.remove('hidden');$('fPass').focus();throw Error('')}
  throw e}
}
async function load(){
 const session=localStorage.getItem('clarion_public_session');
 if(session){try{await secureSession(session);const s=await call(AUTH,'SESSION',{session_token:session,device_id:deviceId()});user=s.user}catch{forget()}}
 try{
  if(wanted==='PRESENTATION'){document.title='ClarionPrep · Presentation Skills';$('name').textContent='Presentation Skills';$('price').textContent='';$('meta').textContent='Public access will open when the course is ready.';$('soon').classList.remove('hidden');$('pay').classList.add('hidden');return}
  const d=await call(COMMERCE,'CATALOG');product=(d.products||[]).find(x=>x.code===wanted);if(!product)throw Error('This product is not currently available.');
  const rupees='₹'+(product.amount_paise/100).toLocaleString('en-IN');document.title='ClarionPrep · '+product.display_name;
  $('name').textContent=product.display_name;$('price').textContent=rupees;$('meta').textContent=description(product);$('pay').textContent='Pay '+rupees;$('pay').disabled=false;
  $('device').innerHTML=MULTI.includes(product.code)?'<b>Important: this device only.</b> Your access works only on the device and browser you pay on. Use the same device and browser every time until your sessions or days are used up. Access cannot be moved to another device, and clearing your browser data removes it.':'<b>Use this device.</b> Take your attempt on the same device and browser you pay on. Access cannot be moved to another device.';$('device').classList.remove('hidden');
  if(user)showWho();else showForm();
 }catch(e){status(e.message,'error')}
}
$('pay').onclick=async()=>{
 if(!product)return;status('');$('pay').disabled=true;
 try{
  status('Getting things ready…');await ensureUser();status('Opening secure payment…');
  const o=await call(COMMERCE,'CREATE_ORDER',{product_code:product.code,full_name:user.full_name,email:user.email,mobile:user.mobile||'',device_id:deviceId(),account_session:localStorage.getItem('clarion_public_session')});
  const rz=new Razorpay({key:o.razorpay_key_id,amount:o.amount_paise,currency:o.currency,name:'ClarionPrep',description:o.display_name||product.display_name,order_id:o.razorpay_order_id,prefill:{name:user.full_name,email:user.email,contact:user.mobile||''},
   handler:async p=>{try{status('Payment verified. Opening your app…','success');const v=await call(COMMERCE,'VERIFY',{payment_order_uuid:o.payment_order_uuid,razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature});await launch(v.launch_url,v.entitlement_token)}catch(e){status(e.message+' If money was taken, message TELW on WhatsApp at +91 9717 116 831.','error')}}});
  rz.on('payment.failed',()=>status('Payment was not completed.','error'));rz.open();
  if(user)showWho();status('');
 }catch(e){if(e.message)status(e.message,'error')}
 finally{$('pay').disabled=false}
};
load();
</script></body></html>
