<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FIIB PCL Access</title><style>:root{--navy:#153f68;--gold:#d79c2f;--line:#d8e1e9;--muted:#607181}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(140deg,#102e49,#285d87);color:#20364b}.card{width:min(470px,100%);padding:30px;background:#fff;border-radius:22px;box-shadow:0 26px 70px #07172688}.brand{font-size:25px;font-weight:900;color:var(--navy)}.brand span{color:var(--gold)}h1{font-size:32px;line-height:1.1;margin:28px 0 8px;color:var(--navy)}p{line-height:1.55;color:var(--muted)}label{display:block;margin:15px 0 6px;font-size:12px;font-weight:800;color:var(--navy)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#b42318;font-weight:700;font-size:13px}.back{display:block;margin-top:20px;text-align:center;color:var(--navy);font-weight:700}</style></head><body><main class="card"><div class="brand">CLARION<span>PREP</span></div><h1>FIIB PCL access</h1><p>Sign in with your FIIB ASCENT roll number or email address and password. Your existing institutional PCL permission will be checked.</p><form id="form"><label for="identity">FIIB roll number or email</label><input id="identity" autocomplete="username" required><label for="password">ASCENT password</label><input id="password" type="password" autocomplete="current-password" required><button>Open PCL</button><div id="status" class="status" aria-live="polite"></div></form><a class="back" href="/">Back to PCL</a></main><script>const KEY='pcl_fiib_device';function device(){let d=localStorage.getItem(KEY);if(!d){d=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(KEY,d)}return d}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),s=document.getElementById('status');b.disabled=true;s.textContent='Checking FIIB access…';try{const r=await fetch('/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identity:document.getElementById('identity').value,password:document.getElementById('password').value,device_id:device()})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'Access could not be opened.');location.replace('/')}catch(x){s.textContent=x.message||'Access could not be opened.';b.disabled=false}};</script></body></html>
