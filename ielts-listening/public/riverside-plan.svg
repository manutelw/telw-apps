<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Riverside Discovery Centre plan</title><desc id="desc">North is at the top. Eight buildings labelled A to H surround a central courtyard. The main gate is on the south side between G and H. The river is along the east side.</desc>
