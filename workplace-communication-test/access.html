<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ClarionPrep · WCT Access</title><style>:root{--navy:#143a60;--navy2:#0d2943;--soft:#eef5fb;--gold:#c67b00;--text:#24364a;--muted:#687a8d;--border:#d7e1eb;--ok:#176b44;--bad:#a43d3d;--shadow:0 18px 50px rgba(20,58,96,.10)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fb;color:var(--text)}header{background:linear-gradient(145deg,var(--navy2),#1d5688);color:#fff;padding:26px 0}.shell{width:min(1100px,calc(100% - 30px));margin:auto}h1{margin:0 0 7px}.lead{color:rgba(255,255,255,.8);margin:0}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;margin:22px 0;box-shadow:var(--shadow)}h2{color:var(--navy);margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.gold{background:var(--gold)}.btn.soft{background:var(--soft);color:var(--navy)}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.message{min-height:22px;margin-top:10px;font-weight:700}.error{color:var(--bad)}.success{color:var(--ok)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left}th{background:var(--soft);color:var(--navy);font-size:12px;text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800}.badge.on{background:#e7f5ee;color:var(--ok)}.small{font-size:13px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:14px 0 28px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="shell"><h1>Workplace Communication Test</h1><p class="lead">Access control · ClarionPrep</p></div></header><main class="shell">
<section id="loginCard" class="card"><h2>Sign in</h2><p>Use the ClarionPrep account that has been authorised for WCT.</p><form id="loginForm" class="grid"><div class="field"><label for="identity">Email, username or Student ID</label><input id="identity" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div><button id="loginBtn" class="btn gold" type="submit">Continue</button></div></form><div id="loginMessage" class="message"></div></section>
<section id="home" class="hidden"><div class="card"><h2 id="welcome">WCT access</h2><p id="accessCopy"></p><div class="actions"><a id="openFullTest" class="btn gold" href="./">Open Full Test</a><a id="evaluator" class="btn soft hidden" href="./evaluator.html?dashboard=1">Evaluator Dashboard</a><a id="portalLink" class="btn soft" href="/portal/trainer/">Admin / Trainer Portal</a><button id="logoutBtn" class="btn soft">Sign out</button></div></div><div id="manageCard" class="card hidden"><h2>Manage WCT access</h2><p id="manageCopy" class="small"></p><div id="manageMessage" class="message"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>ID / Email</th><th>WCT access</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<div class="footer">Powered by <strong>telw.co.in</strong></div></main><script>
const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/wct-access';let token='',profile=null,role='',actorType='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
async function request(body,useToken=true){const headers={'Content-Type':'application/json'};if(useToken&&token)headers.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'WCT access service error.');return d}
function enter(d){token=d.session_token||token;profile=d.profile||profile;role=String(d.role||profile?.role||role).toUpperCase();actorType=String(d.actor_type||actorType).toUpperCase();sessionStorage.setItem('WCT_SESSION_TOKEN',token);window.WCT_ACCESS_TOKEN=token;$('loginCard').classList.add('hidden');$('home').classList.remove('hidden');$('welcome').textContent=`Welcome, ${profile?.full_name||profile?.email||'user'}`;$('accessCopy').textContent=role==='ADMIN'?'You have unrestricted administrator access to the complete WCT.':role==='TRAINER'?'Your administrator has enabled WCT access. You may grant or revoke access for students in your assigned ClarionPrep cohort.':'Your WCT access is active.';$('evaluator').classList.toggle('hidden',role!=='ADMIN');$('portalLink').classList.toggle('hidden',actorType==='STUDENT');if(['ADMIN','TRAINER'].includes(role))loadManage();}
async function login(e){e.preventDefault();const raw=$('identity').value.trim(),identity=raw.toLowerCase()==='manu'?'manutelw@gmail.com':raw,msg=$('loginMessage');msg.className='message';msg.textContent='Checking access…';$('loginBtn').disabled=true;try{const d=await request({action:'login',identity,password:$('password').value},false);enter(d)}catch(err){sessionStorage.removeItem('WCT_SESSION_TOKEN');token='';msg.className='message error';msg.textContent=err.message||'Access denied.'}finally{$('loginBtn').disabled=false}}
function existingAdminSession(){for(const key of ['ascent_admin_master_session','ascent_trainer_session']){try{const s=JSON.parse(localStorage.getItem(key)||'null'),t=s?.sessionToken||s?.session_token,r=String(s?.role||'').toUpperCase(),expires=new Date(s?.expiresAt||s?.expires_at||0).getTime();if(t&&r==='ADMIN'&&Number.isFinite(expires)&&expires>Date.now())return t}catch(_){}}return''}
async function restore(){const saved=sessionStorage.getItem('WCT_SESSION_TOKEN');if(saved){token=saved;try{const d=await request({action:'status'});enter({...d,session_token:saved});return}catch{sessionStorage.removeItem('WCT_SESSION_TOKEN');token=''}}const adminToken=existingAdminSession();if(!adminToken)return;token=adminToken;try{const d=await request({action:'status'});if(String(d.role||d.profile?.role||'').toUpperCase()!=='ADMIN')throw new Error('Administrator access required.');enter({...d,session_token:adminToken})}catch{token=''}}
function openFullTest(e){e.preventDefault();if(!token)return;sessionStorage.setItem('WCT_SESSION_TOKEN',token);window.location.assign('./#wct='+encodeURIComponent(token))}
async function loadManage(){$('manageCard').classList.remove('hidden');$('manageCopy').textContent=role==='ADMIN'?'You can enable or revoke WCT access for trainers and students. An enabled trainer can then manage WCT access for students in that trainer’s assigned cohort.':'You can enable or revoke WCT access only for students in your assigned ClarionPrep cohort.';const d=await request({action:'list'});$('rows').innerHTML=(d.profiles||[]).map(p=>`<tr><td><strong>${esc(p.full_name||'Unnamed')}</strong></td><td>${esc(p.role||p.subject_type)}</td><td>${esc(p.student_id||p.email||p.batch||'—')}</td><td><button class="btn ${p.wct_access?'soft':'gold'} access-btn" data-type="${esc(p.subject_type)}" data-id="${esc(p.subject_uuid)}" data-active="${p.wct_access?'1':'0'}">${p.wct_access?'Revoke':'Enable'}</button> <span class="badge ${p.wct_access?'on':''}">${p.wct_access?'Enabled':'Not enabled'}</span></td></tr>`).join('')||'<tr><td colspan="4">No eligible accounts found.</td></tr>';document.querySelectorAll('.access-btn').forEach(b=>b.addEventListener('click',()=>setAccess(b)))}
async function setAccess(btn){const next=btn.dataset.active!=='1',msg=$('manageMessage');btn.disabled=true;msg.className='message';msg.textContent='Saving…';try{await request({action:'set',subject_type:btn.dataset.type,subject_uuid:btn.dataset.id,active:next});msg.className='message success';msg.textContent='Access updated.';await loadManage()}catch(e){msg.className='message error';msg.textContent=e.message}finally{btn.disabled=false}}
function logout(){sessionStorage.removeItem('WCT_SESSION_TOKEN');token='';profile=null;role='';actorType='';$('home').classList.add('hidden');$('manageCard').classList.add('hidden');$('loginCard').classList.remove('hidden');$('password').value=''}
$('loginForm').addEventListener('submit',login);$('openFullTest').addEventListener('click',openFullTest);$('logoutBtn').addEventListener('click',logout);restore();
</script></body></html>
