<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--card:#FAFAF8;--border:#E8E4DC;--border2:#D4CEC2;
  --ink:#1A1714;--ink2:#3D3830;--muted:#8C8578;--dim:#C4BEB4;
  --gold:#8B6914;--gold-bg:#FDF6E3;--gold-lt:#F5E9C0;
  --green:#2D6A4F;--green-bg:#EBF5EF;
  --red:#9B2335;--red-bg:#FBEAEC;
  --blue:#1A3C5E;--blue-bg:#EBF0F7;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"DM Sans",system-ui,sans-serif;
  --mono:"DM Mono","Courier New",monospace;
  --r:8px;--shadow:0 2px 12px rgba(26,23,20,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);position:relative;overflow:hidden}
#auth::before{content:"CLARION";font-family:var(--serif);font-size:clamp(80px,15vw,160px);font-weight:300;color:rgba(255,255,255,.03);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;letter-spacing:.2em;pointer-events:none}
.auth-box{width:min(400px,92vw);background:var(--surface);border-radius:12px;padding:clamp(28px,5vw,44px);position:relative;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.auth-box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#C4960A);border-radius:12px 12px 0 0}
.auth-logo{font-family:var(--serif);font-size:2.2rem;font-weight:300;letter-spacing:.15em;color:var(--ink);margin-bottom:2px;text-transform:uppercase}
.auth-tag{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:28px}
.f-label{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:5px;margin-top:12px}
.f-input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-size:.9rem;color:var(--ink);outline:none;transition:border-color .2s;font-family:var(--sans)}
.f-input:focus{border-color:var(--gold)}
.btn-auth{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-size:.9rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:.2s;margin-top:14px;font-family:var(--sans)}
.btn-auth:hover{background:#2A2520}

.role-sw{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px;margin-bottom:20px}
.role-btn{padding:8px;font-size:.78rem;font-weight:500;color:var(--muted);background:transparent;border:none;border-radius:4px;cursor:pointer;transition:.2s;font-family:var(--sans)}
.role-btn.on{background:var(--ink);color:#fff}

/* APP SHELL */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{height:52px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tb-logo{font-family:var(--serif);font-size:1.3rem;font-weight:300;letter-spacing:.18em;color:#fff;text-transform:uppercase;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none;}
.tb-logo em{color:var(--gold);font-style:normal}
.tb-r{display:flex;align-items:center;gap:12px}
.tb-user{font-family:var(--mono);font-size:.7rem;color:rgba(255,255,255,.4)}
.tb-badge{font-family:var(--mono);font-size:.62rem;padding:2px 8px;border-radius:20px;letter-spacing:.1em;text-transform:uppercase}
.badge-admin{background:rgba(139,105,20,.2);color:#D4A843;border:1px solid rgba(139,105,20,.3)}
.badge-student{background:rgba(45,106,79,.2);color:#5BAA84;border:1px solid rgba(45,106,79,.3)}
.btn-out{background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-family:var(--mono);font-size:.65rem;padding:3px 9px;border-radius:var(--r);cursor:pointer}
.btn-out:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.shell{flex:1;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:196px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto}
.nav-grp{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);padding:0 16px;margin:18px 0 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:.85rem;font-weight:500;color:var(--muted);border-left:2px solid transparent;transition:.15s;cursor:pointer;user-select:none}
.nav-item:hover{color:var(--ink);background:rgba(26,23,20,.03)}
.nav-item.on{color:var(--ink);border-left-color:var(--gold);background:rgba(139,105,20,.05)}
.nav-ic{width:18px;text-align:center;font-size:.95rem;flex-shrink:0}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:clamp(18px,3vw,36px) clamp(16px,3vw,40px)}
.ph{margin-bottom:24px}
.ph-title{font-family:var(--serif);font-size:1.8rem;font-weight:300;letter-spacing:-.01em;margin-bottom:2px}
.ph-sub{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}

/* QUESTION DISPLAY */
.q-hero{background:var(--ink);border-radius:10px;padding:clamp(20px,3vw,30px);margin-bottom:16px;position:relative;overflow:hidden}
.q-hero::before{content:'"';font-family:var(--serif);font-size:120px;color:rgba(255,255,255,.04);position:absolute;top:-15px;left:12px;line-height:1;pointer-events:none}
.q-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:3px;margin-bottom:12px}
.q-pi{background:rgba(139,105,20,.15);color:#D4A843;border:1px solid rgba(139,105,20,.2)}
.q-gd{background:rgba(74,144,226,.15);color:#7AB3E8;border:1px solid rgba(74,144,226,.2)}
.q-text{font-family:var(--serif);font-size:clamp(1.1rem,2.2vw,1.45rem);font-weight:300;line-height:1.5;color:#F5F2EC;position:relative;z-index:1;margin-bottom:14px}
.q-inst{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.q-inst-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:7px}
.q-inst-item{font-family:var(--mono);font-size:.7rem;color:rgba(255,255,255,.4);padding:2px 0;display:flex;gap:7px}
.q-inst-item::before{content:"—";color:rgba(255,255,255,.2)}
.q-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-family:var(--mono);font-size:.67rem;color:rgba(255,255,255,.3)}

/* RECORDER */
.recorder{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.rec-state{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;min-height:18px}
.wv{display:flex;align-items:center;justify-content:center;gap:3px;height:36px;margin-bottom:14px}
.wv-b{width:3px;background:var(--gold);border-radius:2px;animation:wv .6s ease-in-out infinite}
@keyframes wv{0%,100%{height:3px}50%{height:26px}}
.wv.idle .wv-b{animation:none;height:3px;background:var(--border2)}
.rec-timer{font-family:var(--serif);font-size:3.2rem;font-weight:300;color:var(--ink);line-height:1;margin-bottom:10px;letter-spacing:-.04em;transition:color .3s}
.rec-timer.warn{color:var(--gold)}.rec-timer.danger{color:var(--red)}
.rec-track{height:2px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.rec-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 1s linear,background .3s}
.rec-fill.danger{background:var(--red)}
.rec-btns{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.btn-circle{width:54px;height:54px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:.2s;flex-shrink:0}
.btn-rec{background:var(--red);color:#fff;box-shadow:0 4px 18px rgba(155,35,53,.3)}
.btn-rec:hover{transform:scale(1.05)}
.btn-stop{background:var(--ink);color:#fff}
.btn-play{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,106,79,.2)}
.hidden{display:none!important}
.rdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;animation:rdot 1s infinite}
@keyframes rdot{0%,100%{opacity:1}50%{opacity:.2}}
.btn-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.btn-secondary{padding:9px 16px;background:var(--bg);border:1px solid var(--border);color:var(--ink);font-size:.82rem;font-weight:500;border-radius:var(--r);cursor:pointer;transition:.2s;font-family:var(--sans)}
.btn-secondary:hover{border-color:var(--border2)}
.btn-primary{padding:10px 24px;background:var(--green);color:#fff;border:none;font-size:.85rem;font-weight:600;border-radius:var(--r);cursor:pointer;transition:.2s;font-family:var(--sans)}
.btn-primary:hover{background:#235840}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-gold{padding:9px 18px;background:var(--gold-bg);border:1px solid var(--gold-lt);color:var(--gold);font-size:.82rem;font-weight:600;border-radius:var(--r);cursor:pointer;font-family:var(--sans)}
.rec-note{font-family:var(--mono);font-size:.67rem;color:var(--dim);margin-top:12px;line-height:1.6}

/* SCORE */
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.sc-head{background:var(--ink);padding:18px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.sc-num{font-family:var(--serif);font-size:3.2rem;font-weight:300;color:var(--gold);line-height:1;letter-spacing:-.03em}
.sc-denom{font-family:var(--mono);font-size:.7rem;color:rgba(255,255,255,.3)}
.sc-flag{display:inline-block;font-family:var(--mono);font-size:.62rem;padding:3px 9px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.flag-pass{background:rgba(45,106,79,.25);color:#5BAA84;border:1px solid rgba(45,106,79,.3)}
.flag-needs{background:rgba(155,35,53,.25);color:#D4758A;border:1px solid rgba(155,35,53,.3)}
.sc-body{padding:18px 22px}
.crit-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.crit-row:last-child{border:none}
.crit-name{font-size:.82rem;font-weight:500;color:var(--ink);flex:0 0 160px}
.crit-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.crit-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.crit-pts{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:28px;text-align:right}
.fb-box{margin-top:14px;padding:14px;background:var(--bg);border-radius:var(--r);border-left:3px solid var(--gold)}
.fb-lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fb-txt{font-size:.88rem;color:var(--ink2);line-height:1.65}
.imp-box{margin-top:10px;padding:12px;background:var(--blue-bg);border-radius:var(--r);border-left:3px solid var(--blue)}
.cando-box{margin-top:10px;padding:12px;background:var(--green-bg);border-radius:var(--r);border-left:3px solid var(--green)}

/* STRUCTURED FEEDBACK */
.fb-structured{margin-top:14px}
.fb-crit-block{padding:11px 0;border-bottom:1px solid var(--border)}
.fb-crit-block:last-child{border:none}
.fb-crit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fb-crit-title{font-size:.82rem;font-weight:600;color:var(--ink)}
.fb-crit-score{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.fb-crit-row{font-family:var(--mono);font-size:.72rem;color:var(--ink2);padding:2px 0;display:flex;gap:6px;line-height:1.5}
.fb-crit-row .fb-ic{flex-shrink:0;width:14px}
.fb-cando-block{margin-top:14px;padding:12px 14px;background:var(--green-bg);border-radius:var(--r);border-left:3px solid var(--green)}
.fb-cando-lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.fb-cando-txt{font-size:.85rem;color:var(--green);font-weight:500;line-height:1.5}
.fb-notice{margin-top:10px;padding:8px 12px;background:var(--gold-bg);border:1px solid var(--gold-lt);border-radius:var(--r);font-family:var(--mono);font-size:.65rem;color:var(--gold);line-height:1.5}
.fb-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-dl{padding:9px 18px;background:var(--ink);color:#fff;border:none;font-size:.82rem;font-weight:600;border-radius:var(--r);cursor:pointer;font-family:var(--sans);transition:.2s;display:flex;align-items:center;gap:6px}
.btn-dl:hover{background:#2A2520}
.btn-cp{padding:9px 16px;background:var(--bg);border:1px solid var(--border);color:var(--ink);font-size:.82rem;font-weight:500;border-radius:var(--r);cursor:pointer;font-family:var(--sans);transition:.2s}
.btn-cp:hover{border-color:var(--border2)}

/* BANNERS */
.banner{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;border-radius:var(--r);margin-bottom:16px}
.banner-ok{background:var(--green-bg);border:1px solid rgba(45,106,79,.2)}
.banner-info{background:var(--blue-bg);border:1px solid rgba(26,60,94,.15)}
.banner-warn{background:var(--gold-bg);border:1px solid rgba(139,105,20,.2)}
.banner-ic{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.banner-title{font-size:.88rem;font-weight:600;margin-bottom:2px}
.banner-sub{font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.5}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat-lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.stat-val{font-family:var(--serif);font-size:2.2rem;font-weight:300;color:var(--ink);line-height:1;letter-spacing:-.02em}
.stat-hint{font-family:var(--mono);font-size:.65rem;color:var(--dim);margin-top:2px}

/* TABLE */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--card);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:rgba(26,23,20,.015)}
.pill{display:inline-block;font-family:var(--mono);font-size:.67rem;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-hi{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,106,79,.2)}
.pill-mid{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(139,105,20,.2)}
.pill-lo{background:var(--red-bg);color:var(--red);border:1px solid rgba(155,35,53,.2)}
.pill-na{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.tag{font-family:var(--mono);font-size:.6rem;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.tag-pi{background:var(--gold-bg);color:var(--gold)}
.tag-gd{background:var(--blue-bg);color:var(--blue)}
.tag-lum{background:rgba(45,106,79,.1);color:var(--green)}
.tag-diag{background:rgba(100,60,160,.1);color:#7c3aed}

/* PRACTICE BANK */
.pb-filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.pb-filter{padding:5px 12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:.68rem;border-radius:20px;cursor:pointer;transition:.15s;font-weight:500}
.pb-filter.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pb-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;box-shadow:var(--shadow);transition:border-color .15s}
.pb-item:hover{border-color:var(--border2)}
.pb-q{font-size:.92rem;line-height:1.5;color:var(--ink);flex:1}
.pb-meta{font-family:var(--mono);font-size:.65rem;color:var(--dim);margin-top:5px}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px}
.spinner{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-txt{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.05em}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:clamp(20px,3vw,28px);width:min(540px,92vw);max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-title{font-family:var(--serif);font-size:1.5rem;font-weight:300;margin-bottom:3px}
.modal-sub{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-bottom:18px}
.modal-x{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:4px}
.modal-x:hover{background:var(--bg);color:var(--ink)}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);border-left:3px solid var(--gold);color:#fff;font-family:var(--mono);font-size:.75rem;padding:11px 16px;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(20px);opacity:0;transition:.3s cubic-bezier(.4,0,.2,1);z-index:999;max-width:280px;pointer-events:none}
.toast.on{transform:translateY(0);opacity:1;pointer-events:auto}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}

/* READINESS BARS */
.readiness{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ready-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ready-lbl{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ready-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:5px}
.ready-fill{height:100%;border-radius:3px;transition:width 1s ease}
.ready-pct{font-family:var(--serif);font-size:1.6rem;font-weight:300;color:var(--ink)}

@media(max-width:900px){.sidebar{display:none}.stats{grid-template-columns:1fr 1fr}.readiness{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.crit-name{flex:0 0 110px;font-size:.75rem}}

/* ── Mobile hamburger button ─────────────────────────────── */
.hamburger{
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  width:36px;height:36px;
  background:none;border:none;cursor:pointer;
  padding:0;margin-right:8px;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.hamburger span{
  display:block;width:20px;height:2px;
  background:rgba(255,255,255,.75);
  border-radius:2px;
  transition:transform .22s ease, opacity .18s ease;
}
/* × state */
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* ── Mobile drawer ───────────────────────────────────────── */
.drawer-backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(26,23,20,.45);
  z-index:299;
  -webkit-tap-highlight-color:transparent;
}
.drawer-backdrop.open{display:block;}

@media(max-width:900px){
  .hamburger{display:flex;}
  /* Sidebar becomes a slide-in drawer on mobile */
  .sidebar{
    display:block !important;   /* override the hide rule above */
    position:fixed;
    top:0;left:0;
    width:220px;height:100%;
    z-index:300;
    transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 24px rgba(0,0,0,.18);
    padding-top:56px;           /* clear the topbar */
    overflow-y:auto;
  }
  .sidebar.drawer-open{
    transform:translateX(0);
  }
}

/* ── TELW BRANDING ─────────────────────────────────────────── */

/* Auth box: widen slightly to give the brand row room */
.auth-box{width:min(460px,94vw)}

/* Brand header row: CLARION left | gold rule | TELW block right */
.ab-brand{
  display:flex;
  align-items:center;
  gap:0;
  margin-bottom:0;
}
.ab-clarion{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding-right:20px;
}
.ab-clarion-title{
  font-family:var(--serif);
  font-size:2.4rem;
  font-weight:300;
  letter-spacing:.18em;
  color:var(--ink);
  text-transform:uppercase;
  line-height:1;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}
.ab-clarion-sub{
  font-family:'Arial',sans-serif;
  font-size:.56rem;
  font-weight:400;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}
.ab-rule{
  width:1px;
  height:56px;
  background:linear-gradient(to bottom,transparent,var(--gold) 30%,var(--gold) 70%,transparent);
  flex-shrink:0;
  margin:0 20px 0 0;
}
.ab-telw{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}
.ab-telw-logo{
  width:52px;
  height:52px;
  object-fit:contain;
}
.ab-telw-name{
  font-family:'Arial Black','Arial',sans-serif;
  font-size:.85rem;
  font-weight:900;
  letter-spacing:.18em;

  try { const s=localStorage.getItem('clarion_diag_'+email); return s?JSON.parse(s):{}; } catch(e){return {};}
}
function putDiagSub(email, id, data) {
  const all=getDiagSubs(email);
  all[id]={...data, _stored: new Date().toISOString()};
  localStorage.setItem('clarion_diag_'+email, JSON.stringify(all));
}
function purgeStaleDiagSubs(email){
  const all=getDiagSubs(email);
  const cutoff=Date.now()-7*24*60*60*1000;
  let changed=false;
  Object.keys(all).forEach(function(k){
    const s=all[k];
    if(s&&s._stored&&new Date(s._stored).getTime()<cutoff){delete all[k];changed=true;}
  });
  if(changed) localStorage.setItem('clarion_diag_'+email,JSON.stringify(all));
}

  loadRegistry();

// Count how many unique calendar days a student has submitted 'daily_*' entries
function countPracticeDays(email){
  const subs = getSubs(email);
  const days = new Set();
  Object.keys(subs).forEach(function(k){
    if(k.startsWith('daily_')){ days.add(k.slice(6)); }
  });
  return days.size;

// Priority: explicit startDate field → earliest submission date → today.
function getStudentStartDate(email){
  const st = getStudents()[email];
  if(st && st.startDate) return st.startDate;
  const subs = getSubs(email);
  const days = [];
  Object.keys(subs).forEach(function(k){
    if(k.startsWith('daily_')){ days.push(k.slice(6)); }
  });
  if(days.length){ return days.sort()[0]; }
  return toDateStr(new Date());
}

// Core per-student sequencing.
// Position = number of distinct daily-practice days already completed.
// A new student (0 submissions) sees Question 1 (idx=0) on their first day.
// Each day they submit, they advance one position in the bank.
function getTodayQuestion(email) {
  const today = new Date();
  const day   = today.getDay();
  const isPIday = [1,2,3,4].includes(day);

  const piBank = QUESTION_BANK.filter(q => q.telw === '1.0');
  const gdBank = QUESTION_BANK.filter(q => q.telw === '2.0');
  const bank   = isPIday ? piBank : gdBank;
  if(!bank.length) return { q: null, type: isPIday ? 'PI' : 'GD', idx: 0, bankLen: 0 };

  let idx = 0;
  if(email){
    const completedDays = countPracticeDays(email);
    idx = completedDays % bank.length;
  } else {
    // Fallback for admin preview: calendar-based
    const msDay = 86400000;
    const daysSince = Math.max(0, Math.floor((today - PROGRAM_START) / msDay));
    idx = daysSince % bank.length;
  }
  return { q: bank[idx], type: isPIday ? 'PI' : 'GD', idx, bankLen: bank.length };
}

// Fetch config from cloud and populate localStorage + live state.
// Silent: never toasts on success or failure — callers decide what to show.
// Uses localStorage AutoOps URL if set; falls back to DEFAULT_AUTOOPS_URL so
// new devices bootstrap without any manual URL entry.
async function _cloudConfigLoad(){
  const aoUrl = localStorage.getItem(AUTOOPS_CONFIG_KEY) || DEFAULT_AUTOOPS_URL;
  if(!aoUrl) return { ok:false, reason:'no_autoops_url' };
  try{
    const res  = await fetch(aoUrl + (aoUrl.includes('?')?'&':'?') + 'action=getConfig',
                             {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'getConfig failed');

    // Persist the working AutoOps URL so _autoOpsUrl() and autoOpsSyncNow() can use it
    // even if it came from the hardcoded default rather than localStorage.
    if(!localStorage.getItem(AUTOOPS_CONFIG_KEY)){
      localStorage.setItem(AUTOOPS_CONFIG_KEY, aoUrl);
    }
    // NOTE: clarion_admin_script_url is NOT written here.
    // The Admin Auth script is a separate deployment from AutoOps.
    // It defaults to DEFAULT_ADMIN_AUTH_URL and must never be overwritten with the AutoOps URL.
    // Populate localStorage and live state from cloud, but only overwrite if
    // the cloud has a non-empty value (preserves local overrides when cloud is blank)
    if(data.aiScoringUrl){
      localStorage.setItem(CLARION_SCORING_URL_KEY, data.aiScoringUrl);
    }
    if(data.audioUploadUrl){
      localStorage.setItem('clarion_drive_url', data.audioUploadUrl);
      S.driveUrl = data.audioUploadUrl;
    }
    if(data.sheetUrl){
      localStorage.setItem('clarion_sheet_url', data.sheetUrl);
      S.sheetUrl = data.sheetUrl;
    }
    return { ok:true, data };
  }catch(e){
    console.warn('[CLARION] Cloud config load failed:', e.message);
    return { ok:false, reason:e.message };
  }
}

// Push one or more config fields to the cloud.
// fields: { aiScoringUrl?, audioUploadUrl?, sheetUrl? }

  if(!aoUrl) return { ok:false, reason:'no_autoops_url' };

  const exists = actions.some(function(a){
    return !a.resolved && a.email === email && a.issue === issue;

  actions.push({
    id:       Date.now() + '_' + Math.random().toString(36).slice(2,6),
    ts:       new Date().toISOString(),
    email:    email || '',
    name:     name  || '',
    issue:    issue || 'Unknown issue',
    source:   source || 'autoops',

    resolvedAt: null
  });

function _seedStudentsIfEmpty(){
  // Seeds EMBEDDED_STUDENTS on a fresh device (no localStorage data).
  // For existing devices: only fills in keys that are completely absent.
  // NEVER overwrites password or studentId for a record that was written by
  // AutoOps sync (_autoOpsSynced===true or lastSyncedAt present) — those
  // records are the source of truth for credentials.
  try{
    const raw = localStorage.getItem(STUDENT_STORE_KEY);

   if(!raw || raw === '{}' || raw === 'null'){
  // Fresh device — no embedded demo students. Synced students come from AutoOps.
  localStorage.setItem(STUDENT_STORE_KEY, JSON.stringify({}));
  return;
}

    // Existing data — only patch non-synced embedded students
    try{
      const stored = JSON.parse(raw);
      var changed = false;
      Object.entries(EMBEDDED_STUDENTS).forEach(function([key, embStu]){
        if(stored[key]){
          const isSynced = stored[key]._autoOpsSynced || stored[key].lastSyncedAt;

          // Synced students are authoritative — never overwrite them
          if(isSynced) return;

          if(stored[key].password !== embStu.password){
            stored[key].password = embStu.password;
            changed = true;
          }

          if(stored[key].studentId !== embStu.studentId){
            stored[key].studentId = embStu.studentId;
            changed = true;
          }

        } else {
          // Key completely absent — add embedded student
          stored[key] = Object.assign({}, embStu);
          changed = true;
        }
      });
      if(changed) localStorage.setItem(STUDENT_STORE_KEY, JSON.stringify(stored));
    }catch(e2){ console.warn('[CLARION] seed merge error:', e2); }
  }catch(e){ console.warn('[CLARION] seed error:', e); }
}

// Maps the sheet's Access column value to CLARION's internal accessType.
// Sheet values: LUM / GD / PI / DEMO / NONE
// CLARION values: lum / placement / diagnostic / demo
function _sheetAccessToType(raw){
  const v=(raw||'').trim().toUpperCase();
  if(v==='LUM')  return 'lum';
  if(v==='GD')   return 'placement';
  if(v==='PI')   return 'placement';
  if(v==='DEMO') return 'demo';
  if(v==='DIAGNOSTIC') return 'diagnostic';
  // NONE or unrecognised → lum access, marked inactive by caller
  return 'lum';
}

// ── Student ID generation — AAA001/YY format ─────────────────────────────────
// prefix  : 3-letter institution prefix (e.g. "FII", "SUS", "IND", "UNK")
// batch   : raw batch/year string (e.g. "2025-2027", "2026", "MBA 2025-27")
// existing: current students object — used to find the highest serial for this prefix
//
// Returns : e.g. "FII003/27"
//
// Rules:
//  • Serial is per-prefix and independent of other prefixes.
//  • Year suffix is the last two digits of the end year extracted from batch string.
//  • If no year can be extracted, falls back to current calendar year % 100.
//  • Never overwrites an existing ID — caller must check before calling.

function _institutionPrefix(institutionRaw){
  var inst = (institutionRaw || '').trim();
  if(!inst) return 'UNK';

  // Detect independent / direct students
  var lower = inst.toLowerCase();
  if(lower === 'independent' || lower === 'direct' ||
     lower === 'self' || lower === 'na' || lower === 'n/a' || lower === '-'){
    return 'IND';
  }

  // Take first 3 letters of alphabetic characters (ignore leading punctuation/spaces)
  var letters = inst.replace(/[^a-zA-Z]/g, '');
  if(!letters) return 'UNK';
  return letters.substring(0, 3).toUpperCase();
}

function _yearSuffix(batchRaw){
  var b = (batchRaw || '').trim();

  // Try patterns: "2025-2027", "2025-27", "2025/2027", "2025/27"
  var rangeMatch = b.match(/\b20(\d{2})[\/\-–](?:20)?(\d{2})\b/);
  if(rangeMatch) return rangeMatch[2].padStart(2, '0');  // end year last 2 digits

  // Single year: "2027", "27"
  var singleFull = b.match(/\b20(\d{2})\b/g);
  if(singleFull && singleFull.length){
    // Take the last year mentioned (usually the graduation year)
    var last = singleFull[singleFull.length - 1];
    return last.slice(-2);
  }

  // Two-digit year: "27", "28"
  var twoDigit = b.match(/\b(\d{2})\b/);
  if(twoDigit) return twoDigit[1];

  // Fallback: current year
  return String(new Date().getFullYear()).slice(-2);
}

function _nextSerialForPrefix(prefix, yearSuffix, existing){
  // Find the highest serial number already used for this prefix+year combination
  // Pattern: prefix + digits + "/" + yearSuffix   e.g. "FII003/27"
  var maxSerial = 0;
  var pattern = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\d+)\\/' + yearSuffix + '$', 'i');
  Object.values(existing).forEach(function(s){
    var id = String(s.studentId || '');
    var m = id.match(pattern);
    if(m){
      var n = parseInt(m[1], 10);
      if(n > maxSerial) maxSerial = n;
    }
  });
  return maxSerial + 1;
}

function _generateClarionStudentId(institutionRaw, batchRaw, existing){
  var prefix = _institutionPrefix(institutionRaw);
  var year   = _yearSuffix(batchRaw);
  var serial = _nextSerialForPrefix(prefix, year, existing);
  return prefix + String(serial).padStart(3, '0') + '/' + year;
}

// Legacy shim: used by Add Student form (manual adds).
// Falls back to simple sequential numeric ID for manually-added students without institution data.
function _generateStudentId(existing){
  var maxNum = 0;
  Object.values(existing).forEach(function(s){
    var id = String(s.studentId || '');
    var m = id.match(/(\d+)$/);
    if(m){
      var n = parseInt(m[1], 10);
      if(n > maxNum) maxNum = n;
    }
  });
  return String(maxNum + 1).padStart(3, '0');
}

// Fetch students from the Google Sheet via the Apps Script reader URL.
// Uses Email ID as the primary matching key.
// - Rows where status !== 'Accepted'/'Approved' are skipped.
// - If email already exists in CLARION: update name, batch, programme, accessType, active,
//   institution, groupCode. Password and studentId are NEVER overwritten.
// - If email is new: use sheet-supplied studentId if present, otherwise generate one
//   using the AAA001/YY format from institution + batch data.
// - Rows with no email AND no name are skipped with a warning.
// Returns: { added: N, updated: N, skipped: N, total: N, ts } or throws on failure.
async function syncFromSheet(sheetUrl){
  if(!sheetUrl) throw new Error('No Sheet Reader URL configured');

  console.log('[CLARION] Sheet sync started → URL:', sheetUrl);
  const fetchUrl = sheetUrl + (sheetUrl.includes('?') ? '&' : '?') + 'action=students';

  let res;
  try{
    res = await fetch(fetchUrl, { method: 'GET' });
  }catch(netErr){
    throw new Error('Network error reaching Sheet Reader: ' + netErr.message);
  }
  if(!res.ok) throw new Error('Sheet fetch HTTP ' + res.status);

  const data = await res.json();
  if(data.error) throw new Error('Sheet reader error: ' + data.error);

  const rows = data.students || [];
  console.log('[CLARION] Rows fetched from sheet:', rows.length);

  const existing = getStudents();

  // Build reverse lookup: email → storageKey, for matching existing records
  const emailToKey = {};
  Object.entries(existing).forEach(function([key, s]){
    if(s._email) emailToKey[s._email.toLowerCase()] = key;
  });

  let added = 0, updated = 0, skipped = 0;

  rows.forEach(function(row){
    const name        = (row.name||'').trim();
    const email       = (row.email||'').trim();
    const batch       = (row.batch||'Batch A').trim();
    const programme   = (row.programme||'').trim();
    const status      = (row.status||'').trim().toLowerCase();
    const access      = (row.access||'LUM').trim();
    // New fields — flexible: sheet may or may not supply these
    const institution = (row.institution || row.institute || row.college || '').trim();
    const sheetSid    = (row.studentId   || row.student_id || row.id || '').trim();
    const groupCode   = (row.groupCode   || row.group      || row.group_code || '').trim();

    // Skip rows with no usable identity
    if(!email && !name){
      console.warn('[CLARION] Skipped row — no email and no name:', row);
      skipped++;
      return;
    }

    // Accept rows where status is 'accepted' OR 'approved' (case-insensitive)
    const statusOk = status === 'accepted' || status === 'approved';
    if(!statusOk){
      console.log('[CLARION] Skipped row (status="'+row.status+'")', email||name);
      skipped++;
      return;
    }

    const accessType = _sheetAccessToType(access);
    const active     = access.trim().toUpperCase() !== 'NONE';
    const emailLower = email.toLowerCase();

    // Try to find existing student by email
    const existingKey = emailLower ? emailToKey[emailLower] : null;

    if(existingKey && existing[existingKey]){
      // ── Update existing student ──────────────────────────────────────────
      existing[existingKey].name        = name        || existing[existingKey].name;
      existing[existingKey].batch       = batch;
      existing[existingKey].programme   = programme;
      existing[existingKey].accessType  = accessType;
      existing[existingKey].active      = active;
      existing[existingKey]._email      = email;
      existing[existingKey]._sheetSynced = true;
      if(institution) existing[existingKey].institution = institution;
      // Update groupCode only if not already set manually
      if(groupCode && !existing[existingKey].groupCode)
        existing[existingKey].groupCode = groupCode;
      // Student ID and password are NEVER overwritten on update
      console.log('[CLARION] Updated student:', existing[existingKey].studentId,
        '|', name, '|', email);
      updated++;
    } else {
      // ── Create new student ───────────────────────────────────────────────
      // Prefer the Student ID supplied by the sheet (generated server-side).
      // If not supplied, generate one client-side using institution + batch.
      let newId;
      if(sheetSid){
        // Use the sheet-supplied ID — verify it isn't already taken
        const isDupe = Object.values(existing).some(function(s){
          return String(s.studentId||'').toLowerCase() === sheetSid.toLowerCase();
        });
        newId = isDupe ? _generateClarionStudentId(institution, batch, existing) : sheetSid;
        if(isDupe) console.warn('[CLARION] Duplicate sheet ID "'+sheetSid+'" — generated new ID:', newId);
      } else {
        newId = _generateClarionStudentId(institution, batch, existing);
      }

      // Derive groupCode from prefix if not supplied by sheet
      const derivedGroup = groupCode || _institutionPrefix(institution);

      const newPw  = generatePassword();
      const newKey = newId;  // storage key = student ID

      existing[newKey] = {
        studentId:    newId,
        name:         name,
        password:     newPw,
        batch:        batch,
        programme:    programme,
        active:       active,
        accessType:   accessType,
        institution:  institution,
        groupCode:    derivedGroup,
        _email:       email,
        _sheetSynced: true
      };

      // Register email→key so subsequent rows in same sync don't double-add
      if(emailLower) emailToKey[emailLower] = newKey;

      console.log('[CLARION] Inserted new student:', newId, '|', name, '|', email,
        '| group:', derivedGroup);
      added++;
    }
  });

  putStudents(existing);
  loadRegistry();

  const ts = new Date().toLocaleString();
  localStorage.setItem('clarion_sheet_last_sync', ts);
  localStorage.setItem('clarion_sheet_url', sheetUrl);

  console.log('[CLARION] Sheet sync success — added:', added, 'updated:', updated,
    'skipped:', skipped, 'total rows:', rows.length);

  return { added, updated, skipped, total: rows.length, ts };
}

// Convenience wrapper: run sync and report result to UI without blocking
function triggerSheetSync(silent){
  const url = S.sheetUrl || localStorage.getItem('clarion_sheet_url') || '';
  if(!url) return;
  syncFromSheet(url).then(function(r){
    if(!silent) toast('Sync complete: +'+r.added+' added, '+r.updated+' updated ✓','ok');
    if(S.page==='adm-setup') renderSetup();
  }).catch(function(e){
    console.error('[CLARION] Sheet sync failed:', e.message);
    if(!silent) toast('Sheet sync failed: '+e.message,'err');
  });
}

// It handles 5 actions: students, actions, health, processPending, resendCredentials.
// All calls are fire-and-forget safe — failures create Action items, never crash the app.

var _autoOpsTimer = null;   // interval handle for periodic auto-sync

function _autoOpsUrl(){
  return localStorage.getItem(AUTOOPS_CONFIG_KEY) || DEFAULT_AUTOOPS_URL;
}

// ── Core fetch helper ─────────────────────────────────────────────────────────
async function _autoOpsFetch(action, extra){
  const base = _autoOpsUrl();
  if(!base) throw new Error('AutoOps Script URL not configured');
  const sep  = base.includes('?') ? '&' : '?';
  const params = extra ? Object.entries(extra).map(function([k,v]){ return k+'='+encodeURIComponent(v); }).join('&') : '';
  const url = base + sep + 'action=' + action + (params ? '&'+params : '');
  const res = await fetch(url, { method:'GET', cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

// ── AutoOps full sync: fetches active students + open actions ─────────────────
async function autoOpsSyncNow(silent){
  const url = _autoOpsUrl();
  if(!url){
    if(!silent) toast('AutoOps Script URL not configured in Setup.','err');
    return { ok:false, reason:'no_url' };
  }

  let studentsResult = { added:0, updated:0, skipped:0, total:0 };
  let openActions = 0;

  // ── 1. Fetch and import active students ───────────────────────────────────
  try{
    const data = await _autoOpsFetch('students');
    if(data.error) throw new Error(data.error);

const rows = data.students || [];
    console.log('[AutoOps] sync URL used:', url);
    console.log('[AutoOps] rows fetched:', rows.length);
    const existing = getStudents();
    const emailToKey = {};
    Object.entries(existing).forEach(function([key,s]){
      if(s._email) emailToKey[s._email.toLowerCase()] = key;
    });

    const seenKeys = {};
    let added=0, updated=0, skipped=0;
    rows.forEach(function(row){
      const name        = (row.name||'').trim();
      const email       = (row.email||'').trim();
      const batch       = (row.batch||'').trim();
      const programme   = (row.programme||'').trim();
      const access      = (row.access||'LUM').trim();
      const institution = (row.institution||row.institute||row.college||'').trim();
      const sheetSid    = (row.studentId||row.student_id||'').trim();
      const groupCode   = (row.groupCode||row.group||'').trim();
      const sheetRowNum = row.sheetRow || row.rowNumber || null;

      if(!email && !name){ skipped++; return; }

      const accessType = _sheetAccessToType(access);
      const active     = access.trim().toUpperCase() !== 'NONE';
      const emailLower = email.toLowerCase();
      const existingKey = emailLower ? emailToKey[emailLower] : null;

      if(existingKey && existing[existingKey]){
        // Update — never overwrite studentId, password
        existing[existingKey].name       = name || existing[existingKey].name;
        existing[existingKey].batch      = batch || existing[existingKey].batch;
        existing[existingKey].programme  = programme || existing[existingKey].programme;
        existing[existingKey].accessType = accessType;
        existing[existingKey].active     = active;
        existing[existingKey]._email     = email;
        existing[existingKey]._autoOpsSynced = true;
        existing[existingKey].lastSyncedAt   = new Date().toISOString();
        if(institution) existing[existingKey].institution = institution;
        if(groupCode && !existing[existingKey].groupCode) existing[existingKey].groupCode = groupCode;
      if(sheetRowNum) existing[existingKey].sheetRowNumber = sheetRowNum;
        seenKeys[existingKey] = true;
        updated++;
     } else {
        // No email match yet — decide the Student ID for this row.
        let newId;
        if(sheetSid){
          // Sheet provided an explicit Student ID — use it EXACTLY; never generate.
          let idKey = null;
          Object.keys(existing).forEach(function(k){
            if(String(existing[k].studentId||'').toLowerCase() === sheetSid.toLowerCase()) idKey = k;
          });
          console.log('[AutoOps] sheet student ID:', sheetSid, '| email:', email||'(none)', '| existing key match:', idKey||'(none)');
          if(idKey){
            const existingEmail = String(existing[idKey]._email||'').toLowerCase();
            if(emailLower && emailLower === existingEmail){
              // Same Student ID AND same email → same person: update in place, preserve password & ID.
              console.log('[AutoOps] duplicate conflict: no | final student ID used:', existing[idKey].studentId);
              existing[idKey].name       = name || existing[idKey].name;
              existing[idKey].batch      = batch || existing[idKey].batch;
              existing[idKey].programme  = programme || existing[idKey].programme;
              existing[idKey].accessType = accessType;
              existing[idKey].active     = active;
              existing[idKey]._email     = email;
              existing[idKey]._autoOpsSynced = true;
              existing[idKey].lastSyncedAt   = new Date().toISOString();
              if(institution) existing[idKey].institution = institution;
              if(groupCode && !existing[idKey].groupCode) existing[idKey].groupCode = groupCode;
              if(sheetRowNum) existing[idKey].sheetRowNumber = sheetRowNum;
              if(emailLower) emailToKey[emailLower] = idKey;
              seenKeys[idKey] = true;
              updated++;
              return;
            }
            // Same Student ID but a DIFFERENT email → real duplicate-ID conflict: skip, never generate.
            console.warn('[AutoOps] duplicate conflict: yes | sheet student ID:', sheetSid,
              '| sheet email:', email||'(none)', '| already used by:', existing[idKey]._email||'(unknown email)',
              '— row skipped, no new ID generated, existing record preserved');
            seenKeys[idKey] = true;
            skipped++;
            return;
          }
          // No existing student uses this ID — accept the sheet's exact Student ID.
          newId = sheetSid;
          console.log('[AutoOps] duplicate conflict: no | final student ID used:', newId);
        } else {
          // Blank Student ID cell → auto-generate.
          newId = _generateClarionStudentId(institution, batch, existing);
          console.log('[AutoOps] sheet student ID: (blank) | email:', email||'(none)', '| existing key match: (none) | duplicate conflict: no | final student ID used (generated):', newId);
        }
        const derivedGroup = groupCode || _institutionPrefix(institution);
        const newPw = row.password || generatePassword();
        existing[newId] = {
          studentId:       newId,
          name:            name,
          password:        newPw,
          batch:           batch,
          programme:       programme,
          active:          active,
          accessType:      accessType,
          institution:     institution,
          groupCode:       derivedGroup,
          _email:          email,
          _autoOpsSynced:  true,
          autoOpsSource:   'autoops',
          sheetRowNumber:  sheetRowNum,
          emailSent:       row.emailSent || false,
          lastSyncedAt:    new Date().toISOString(),
          syncStatus:      'synced'
        };
         if(emailLower) emailToKey[emailLower] = newId;
        seenKeys[newId] = true;
        added++;
      }
    });

    // Remove stale AutoOps students absent from the latest accepted sheet response.
    // Manually-created (non-AutoOps) students are preserved.
    let staleRemoved=0;
    Object.keys(existing).forEach(function(key){
      const isAutoOps = existing[key]._autoOpsSynced === true;
      if(isAutoOps && !seenKeys[key]){
        delete existing[key];
        staleRemoved++;
      }
    });

    putStudents(existing);
    loadRegistry();
    const finalCount = Object.keys(existing).length;
    console.log('[AutoOps] added:', added);
    console.log('[AutoOps] updated:', updated);
    console.log('[AutoOps] stale removed:', staleRemoved);
    console.log('[AutoOps] final count:', finalCount);
    studentsResult = { added, updated, skipped, staleRemoved, total: rows.length, finalCount };
  } catch(err){
    console.error('[AutoOps] students fetch failed:', err.message);
    addAction('', 'System', 'AutoOps student sync failed: ' + err.message, 'autoops-sync');
    localStorage.setItem(AUTOOPS_LAST_STATUS_KEY, 'error: ' + err.message);
    if(!silent) toast('AutoOps sync failed: ' + err.message, 'err');
    return { ok:false, reason:err.message };
  }

  // ── 2. Fetch open action items from script ────────────────────────────────
  try{
    const actData = await _autoOpsFetch('actions');
    const remoteActions = actData.actions || [];
    remoteActions.forEach(function(ra){
      addAction(ra.email||'', ra.name||'', ra.issue||ra.problem||'Unknown', 'autoops-remote');
    });
    openActions = getActions().filter(function(a){ return !a.resolved; }).length;
  } catch(err){
    console.warn('[AutoOps] actions fetch failed (non-fatal):', err.message);
  }

  const ts = new Date().toLocaleString();
  localStorage.setItem(AUTOOPS_LAST_SYNC_KEY, ts);
  localStorage.setItem(AUTOOPS_LAST_STATUS_KEY, 'ok');

  _updateActionBadge();
  if(S.page==='adm-setup') renderSetup();
  if(S.page==='adm-actions') renderActionPanel();

  if(!silent){
    toast('AutoOps sync ✓ — +'+studentsResult.added+' added, '+studentsResult.updated+' updated'+(openActions?' · '+openActions+' action items':''), 'ok');
  }
  return { ok:true, ...studentsResult, openActions };
}

// ── Start / stop periodic auto-sync ──────────────────────────────────────────
function autoOpsStartTimer(){
  autoOpsStopTimer();
  const intervalMin = parseInt(localStorage.getItem('clarion_autoops_interval') || '0', 10);
  if(intervalMin > 0){
    _autoOpsTimer = setInterval(function(){
      autoOpsSyncNow(true);
    }, intervalMin * 60 * 1000);

    '<div class="ph"><div class="ph-title">Admin Actions</div>'+
    '<div class="ph-sub" id="autoops-open-count">'+open.length+'</div>'+
    '<div style="font-size:.78rem;color:var(--muted);margin-top:2px">unresolved items</div></div>'+

    (open.length===0 ?
      '<div class="banner" style="border-left:4px solid var(--green);margin-bottom:16px"><span class="banner-ic">✓</span><div>'+
      '<div class="banner-title">All clear — no open action items</div></div></div>'
    :
      '<div class="banner banner-warn" style="margin-bottom:16px"><span class="banner-ic">⚠</span><div>'+
      '<div class="banner-title">'+open.length+' item'+(open.length!==1?'s':'')+' need attention</div>'+
      '<div class="banner-sub">Review and resolve each item below. Resolved items move to the history section.</div>'+
      '</div></div>')+

    (open.length > 0 ?
    '<div class="card">'+
      '<div class="card-lbl" style="margin-bottom:10px">Open Action Items</div>'+
      '<div style="display:flex;gap:9px;margin-bottom:10px;flex-wrap:wrap">'+
        (S.role==='admin' ?
          '<button class="btn-secondary" style="font-size:.78rem" onclick="autoOpsSyncNow(false)">↻ Sync Now</button>'+
          '<button class="btn-secondary" style="font-size:.78rem" onclick="autoOpsProcessPending()">⚙ Process Pending</button>'+
          '<button class="btn-secondary" style="font-size:.78rem" onclick="autoOpsResendFailed()">📧 Resend Failed</button>'
        :'')+
      '</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
        '<th>Name</th><th>Email</th><th>Issue</th><th>Time</th><th>Source</th><th>Action</th>'+
      '</tr></thead><tbody>'+
      open.map(function(a){ return rowHtml(a, true); }).join('')+
      '</tbody></table></div>'+
    '</div>' : '')+

    (done.length > 0 ?
    '<div class="card" style="margin-top:8px">'+
      '<details><summary style="font-family:var(--mono);font-size:.72rem;color:var(--muted);cursor:pointer;user-select:none">'+
        'Resolved items ('+done.length+')</summary>'+
      '<div style="overflow-x:auto;margin-top:10px"><table class="tbl"><thead><tr>'+
        '<th>Name</th><th>Email</th><th>Issue</th><th>Raised</th><th>Source</th><th>Resolved</th>'+
      '</tr></thead><tbody>'+
      done.slice().reverse().map(function(a){ return rowHtml(a, false); }).join('')+
      '</tbody></table></div></details>'+
    '</div>' : '')
  );
}

// ── Hidden Admin Entry ────────────────────────────────────────────────────────
// PRIMARY:  Long-press CLARION logo for 3 seconds (touch + pointer events)
// FALLBACK: 5 taps within 4 seconds (original behaviour)
// Both targets: auth-screen logo (#clarion-auth-logo)
//               topbar logo      (#clarion-topbar-logo, trainer-only)
// ─────────────────────────────────────────────────────────────────────────────

var _adminTapCount = 0;
var _adminTapTimer = null;
var _adminPressTimer = null;   // long-press hold timer
var _adminPressActive = false; // true while finger/pointer is down

// ── Tap-count fallback (unchanged behaviour) ──────────────────────────────────
function handleLogoBrand(){
  _adminTapCount++;
  if(_adminTapTimer) clearTimeout(_adminTapTimer);
  _adminTapTimer = setTimeout(function(){ _adminTapCount = 0; }, 4000);
  if(_adminTapCount >= 5){
    _adminTapCount = 0;
    clearTimeout(_adminTapTimer);
    _showAdminLoginPanel();
  }
}

// ── Long-press engine ─────────────────────────────────────────────────────────
var ADMIN_LONG_PRESS_MS = 3000;

function _adminPressStart(e){
  // Ignore if the admin panel is already open
  var overlay = document.getElementById('overlay');
  if(overlay && overlay.classList.contains('on')) return;

  // Prevent the native context menu / callout on long-press (mobile)
  e.preventDefault();

  // Guard against spurious double-fires (pointerdown + touchstart on same gesture)
  if(_adminPressActive) return;
  _adminPressActive = true;

  // Clear any stale timer
  if(_adminPressTimer) clearTimeout(_adminPressTimer);

  _adminPressTimer = setTimeout(function(){
    if(_adminPressActive){
      _adminPressActive = false;
      _adminTapCount = 0;          // reset tap counter so fallback doesn't double-fire
      clearTimeout(_adminTapTimer);
      _showAdminLoginPanel();
    }
  }, ADMIN_LONG_PRESS_MS);
}

function _adminPressEnd(e){
  // Cancel the long-press if the finger/pointer lifted before the threshold
  _adminPressActive = false;
  if(_adminPressTimer){ clearTimeout(_adminPressTimer); _adminPressTimer = null; }
}

function _adminPressCancel(e){
  // Cancel on scroll or drag (pointermove with movement, or pointercancel)
  _adminPressActive = false;
  if(_adminPressTimer){ clearTimeout(_adminPressTimer); _adminPressTimer = null; }
}

// ── Attach triggers to a logo element ────────────────────────────────────────
// Uses pointer events as primary (works on both desktop and mobile).
// Touch events added as redundancy for older iOS/Android WebViews.
// Both sets share the same handlers — _adminPressActive guards double-fire.
function _attachAdminTrigger(el, trainerOnly){
  if(!el) return;

  // Pointer events (modern — desktop mouse + mobile touch unified)
  el.addEventListener('pointerdown',  function(e){
    if(trainerOnly && S.role !== 'trainer') return;
    _adminPressStart(e);
  }, {passive:false});
  el.addEventListener('pointerup',    _adminPressEnd,    {passive:true});
  el.addEventListener('pointerleave', _adminPressCancel, {passive:true});
  el.addEventListener('pointercancel',_adminPressCancel, {passive:true});

  // Touch events — fallback for older WebViews that don't support Pointer Events
  el.addEventListener('touchstart', function(e){
    if(trainerOnly && S.role !== 'trainer') return;
    // Only act if pointerdown hasn't already started the timer
    if(!_adminPressActive) _adminPressStart(e);
  }, {passive:false});
  el.addEventListener('touchend',    _adminPressEnd,    {passive:true});
  el.addEventListener('touchcancel', _adminPressCancel, {passive:true});

  // contextmenu fires on long-press on Android — suppress it entirely
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {passive:false});

  // Keep tap-count fallback working via click (desktop) — but only for the
  // auth logo where any role can trigger it.  On the topbar logo the
  // tap fallback already checked S.role === 'trainer' in the old inline code;
  // we replicate that here.
  el.addEventListener('click', function(){
    if(trainerOnly && S.role !== 'trainer') return;
    handleLogoBrand();
  });
}

async function doAdminLogin(){
  var pw = (document.getElementById('admin-login-pw')||{}).value || '';
  // Sanitise invisible Unicode and smart-punctuation that mobile keyboards insert silently
  pw = pw.replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
         .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
         .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
         .replace(/^[\r\n]+|[\r\n]+$/g,'');

  var errEl  = document.getElementById('admin-login-err');
  var diagEl = document.getElementById('admin-login-diag');
  var btn    = document.querySelector('#modal-body .btn-primary');

  function showErr(msg){
    if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; }
    if(btn){ btn.textContent = 'Enter Admin Mode'; btn.disabled = false; }
  }

  function showDiag(lines){
    if(!diagEl) return;
    diagEl.innerHTML = lines.map(function(l){
      return '<div>'+l+'</div>';
    }).join('');
    diagEl.style.display = 'block';
  }

  if(!pw){ showErr('Please enter the admin password.'); return; }

  // Resolve admin auth URL. Uses _adminAuthUrl() which always falls back to
  // DEFAULT_ADMIN_AUTH_URL — NEVER falls back to the AutoOps script URL.
  var scriptUrl  = _adminAuthUrl();
  var urlSource  = 'forced-default';

  // ── PATH A: central verification ──────────────────────────────────────────
  if(btn){ btn.textContent = 'Verifying…'; btn.disabled = true; }
  if(errEl) errEl.style.display = 'none';
  if(diagEl) diagEl.style.display = 'none';

  var ok          = false;
  var networkFail = false;
  var httpStatus  = '';
  var rawResponse = '';

  try{
    var verifyUrl = scriptUrl + (scriptUrl.includes('?') ? '&' : '?') +
                    'action=verifyAdmin&pw=' + encodeURIComponent(pw);
    console.log('[CLARION] Admin auth URL:', scriptUrl, '| source:', urlSource);
    var res = await fetch(verifyUrl, {method:'GET', cache:'no-store'});
    httpStatus = String(res.status);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    rawResponse = JSON.stringify(data);
    ok = data.ok === true;
    console.log('[CLARION] Admin verify response:', rawResponse);
  } catch(err){
    console.warn('[CLARION] Admin verify error:', err.message);
    networkFail = true;
    rawResponse = err.message;
  }

  if(ok){
    _finishAdminLogin(false);
    return;
  }

  // Show diagnostic whenever login fails so the admin can see what happened
  showDiag([
    'Auth URL: ' + scriptUrl.substring(0, 72) + '…',
    'URL source: ' + urlSource,
    'Backend reached: ' + (!networkFail ? 'yes (HTTP ' + httpStatus + ')' : 'no — ' + rawResponse),
    'Backend ok: ' + (networkFail ? 'n/a' : String(ok)),
  ]);

  // Backend responded and rejected the password — hard stop, no fallback
  if(!networkFail){
    showErr('Incorrect admin password.');
    return;
  }

  // Network failure — only allow bootstrap if emergency flag is active
  var emergencyUntil = parseInt(localStorage.getItem('clarion_admin_emergency') || '0', 10);
  if(emergencyUntil <= Date.now()){
    showErr('Admin verification unavailable — backend unreachable. ' +
            'If needed, enable emergency access from Setup.');
    return;
  }

  // Emergency flag active — fall through to PATH B
  console.warn('[CLARION] Emergency bootstrap active — network auth failed');

  // ── PATH B: emergency bootstrap — backend unreachable + emergency flag ─────
  localStorage.removeItem('clarion_admin_emergency');  // single-use
  if(pw !== BOOTSTRAP_PASSWORD){
    showErr('Incorrect emergency password.');
    return;
  }
  _finishAdminLogin(true);   // bootstrap mode — restricted to adm-setup
}

// ── Apply remembered login to the form (without wiping the pre-filled ID) ───
// ── Remember me — single source of truth ─────────────────────────────────────
// clarion_rem    : JSON {role, id}  — username/ID for trainer OR student
// clarion_rem_pw : trainer password string — only written when trainer logs in
//                  with Remember Me; never written for students
//
// ── Credential persistence — student only ────────────────────────────────────
// Storage keys:
//   clarion_rem    = {role:'student', id}      — student ID
//   clarion_rem_pw = btoa(student password)    — student password only
//
// Trainer: username 'manu' always shown; password NEVER saved or restored.
// Student: both ID and password saved when Remember Me checked.

function _showRememberRow(visible){
  var row = document.getElementById('remember-row');
  if(row) row.style.display = visible ? 'flex' : 'none';
}

function saveStudentCredentials(id, pw){
  // Both keys use localStorage — persists across browser close/reopen/device restart.
  // Password stored as encodeURIComponent (handles all Unicode, no deprecated fns).
  try{
    localStorage.setItem('clarion_rem',    JSON.stringify({role:'student', id: id}));
    localStorage.setItem('clarion_rem_pw', encodeURIComponent(pw));
  }catch(e){ console.warn('saveStudentCredentials error', e); }
}

function clearStudentCredentials(){
  try{ localStorage.removeItem('clarion_rem');    }catch(e){}
  try{ localStorage.removeItem('clarion_rem_pw'); }catch(e){}
}

function getStudentCredentials(){
  // Returns {id, pw} if valid student credentials are stored, otherwise null.
  // Handles both new format (encodeURIComponent) and old base64 format gracefully.
  try{
    var raw = localStorage.getItem('clarion_rem');
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || parsed.role !== 'student' || !parsed.id) return null;

    var enc = localStorage.getItem('clarion_rem_pw');
    var pw = '';
    if(enc){
      // Try new percent-encoding format first
      try{
        pw = decodeURIComponent(enc);
      }catch(e1){
        // Fall back to old base64 format for existing stored sessions
        try{
          pw = decodeURIComponent(escape(atob(enc)));
        }catch(e2){
          pw = '';  // corrupt value — treat as blank, user will re-enter
          console.warn('[CLARION] Could not decode stored password — cleared');
          localStorage.removeItem('clarion_rem_pw');
        }
      }
    }
    return {id: parsed.id, pw: pw};
  }catch(e){
    console.warn('[CLARION] getStudentCredentials error:', e);
    return null;
  }
}

function applyRememberedLogin(){
  // Only restores student credentials. Trainer tab always starts with 'manu' + blank pw.
  var creds = getStudentCredentials();
  if(!creds) return;   // nothing stored — leave form as-is (trainer default)

}

function loginLegacy(){
  // ── Read inputs ───────────────────────────────────────────────────────────
  // Sanitise the login ID: trim whitespace and strip any Unicode zero-width /
  // smart-punctuation characters that mobile keyboards can silently insert.
  function sanitiseId(v){
    return v
      .trim()
      // Strip zero-width spaces, non-breaking spaces, BOM, soft-hyphens, etc.
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      // Normalise fancy apostrophes / quotes to plain ASCII (just in case)
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"');
  }
  // For the password we strip only the invisible Unicode junk that mobile can
  // add silently, but we do NOT trim whitespace — a legitimate password could
  // start or end with a space, and trimming was the root cause of the mobile bug.
  function sanitisePass(v){
    return v
      // Strip invisible/zero-width chars mobile keyboards silently insert
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      // Normalise smart apostrophes/quotes → plain ASCII
      // iOS autocorrect replaces ' with ’ and " with ” silently
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
      // Normalise non-breaking and other typographic spaces → regular space
      .replace(/[\u00A0\u202F\u2009\u2008\u2007\u2006\u2005\u2004\u2003\u2002\u2001]/g,' ')
      // Strip leading/trailing CR/LF that Android 'Done' key can append
      .replace(/^[\r\n]+|[\r\n]+$/g,'');
  }

  const rawLogin = document.getElementById('a-email').value;
  const rawPass  = document.getElementById('a-pass').value;
  const loginVal = sanitiseId(rawLogin);
  const pass     = sanitisePass(rawPass);
  const key      = document.getElementById('a-key').value.trim();
  const btn      = document.querySelector('.btn-auth');
  const rememberMe = !!(document.getElementById('a-remember') && document.getElementById('a-remember').checked);
  const fail=(m)=>{toast(m,'err');if(btn){btn.textContent='Sign in →';btn.disabled=false;}};
  if(btn){btn.textContent='Signing in…';btn.disabled=true;}

  if(key){S.apiKey=key;sessionStorage.setItem('clarion_key',key);}
  else{const k=sessionStorage.getItem('clarion_key');if(k)S.apiKey=k;}
  // Restore Google Drive Web App URL
  try{const du=localStorage.getItem('clarion_drive_url');if(du)S.driveUrl=du;}catch(e){}
  // Restore Sheet Reader URL
  try{const su=localStorage.getItem('clarion_sheet_url');if(su)S.sheetUrl=su;}catch(e){}

  // ── Route by selected role tab — prevents cross-contamination ─────────────
  // authRole is set by the Student / Trainer toggle and is the authoritative
  // signal of which credential set to check. We no longer rely on the login
  // value format alone to pick the branch.

  if(authRole === 'trainer'){
    // Demo login (trainer tab — demo is a trainer-side credential)
    if(loginVal===DEMO_EMAIL){
      if(pass!==DEMO_PASSWORD){fail('Incorrect demo password.');return;}
      // Demo logins are never remembered — ephemeral session only
      S.user={email:loginVal,name:'Demo Mode',role:'demo',id:'DEMO',batch:'Client Demo'};S.role='demo';finishLogin();return;
    }

    // Trainer login
    const trainerPw = sanitisePass(localStorage.getItem('clarion_trainer_pw')||TRAINER_PASSWORD);
    const loginMatchesTrainer = loginVal.toLowerCase()===TRAINER_EMAIL;
    if(!loginMatchesTrainer){ fail('Trainer email not recognised.');return; }
    if(pass!==trainerPw){fail('Incorrect trainer password.');return;}
    
    // Trainer credentials are NEVER saved to storage — password must be typed each time
    // Clear any stale trainer-role remember-me data from old sessions
    try{
      var _rem = localStorage.getItem('clarion_rem');
      if(_rem){ var _p = JSON.parse(_rem); if(_p && _p.role === 'trainer') clearStudentCredentials(); }
    }catch(e){}
    S.user={email:TRAINER_EMAIL,name:TRAINER_NAME,role:'trainer',id:'T001',batch:''};S.role='trainer';
    finishLogin();
    // Background sync from sheet on every trainer login — keeps student list fresh
    setTimeout(function(){ triggerSheetSync(false); }, 800);
    return;
  }

  // ── Student branch ────────────────────────────────────────────────────────
// Read directly from localStorage — bypasses _seedStudentsIfEmpty's
// EMBEDDED_STUDENTS overwrite so synced passwords reach the comparison.
loadRegistry();

const _rawStore = localStorage.getItem(STUDENT_STORE_KEY);

const _syncedAny =
  _rawStore &&
  Object.values(JSON.parse(_rawStore)).some(function(s){
    return s._autoOpsSynced || s.lastSyncedAt;
  });

// If synced students exist read raw store directly.
// Otherwise use normal getStudents().
const allStudents = (_syncedAny ? JSON.parse(_rawStore) : getStudents());

const _allKeys = Object.keys(allStudents);

const _syncedKeys = _allKeys.filter(function(k){
  return allStudents[k]._autoOpsSynced || allStudents[k].lastSyncedAt;
});

const _dsSource =
  _syncedAny
    ? 'localStorage[synced]'
    : 'getStudents()[embedded/local]';

console.log(
  '[CLARION auth] source:',
  _dsSource,
  '| total:',
  _allKeys.length,
  '| synced:',
  _syncedKeys.length
);

console.log(
  '[CLARION auth] entered:"' +
  rawLogin +
  '" normalised:"' +
  loginVal +
  '"'
);

let st = null,
    foundKey = null;

// 1. Match by studentId (case-insensitive)
for(const [key, s] of Object.entries(allStudents)){
  if((s.studentId || '').toLowerCase() === loginVal.toLowerCase()){
    st = s;
    foundKey = key;
    break;
  }
}

// 2. Legacy fallback: email key
if(!st && loginVal.includes('@')){
  const emailLower = loginVal.toLowerCase();

  if(allStudents[emailLower]){
    st = allStudents[emailLower];
    foundKey = emailLower;
  }
}

console.log(
  '[CLARION auth] ID match:',
  st
    ? ('YES key=' + foundKey)
    : 'NO'
);

// Debug panel helper
const _dbgEl = document.getElementById('auth-debug');

const _showDbg = function(reason, pwMatch){

  if(!_dbgEl) return;

  const top5 = _allKeys
    .slice(0,5)
    .map(function(k){
      return allStudents[k].studentId || k;
    })
    .join(', ');

  _dbgEl.textContent = [
    'source      : ' + _dsSource,
    'dataset size: ' + _allKeys.length,
    'entered ID  : ' + rawLogin,
    'normalised  : ' + loginVal,
    'ID match    : ' + (st ? 'YES' : 'NO'),
    'pw match    : ' + (
      pwMatch === undefined
        ? 'n/a'
        : (pwMatch ? 'YES' : 'NO')
    ),
    'failure     : ' + reason,
    'first 5 IDs : ' + top5
  ].join('\n');

  _dbgEl.style.display = 'block';
};

if(!st){
  _showDbg('no student record matches entered ID');
  fail('Incorrect Student ID or password.');
  return;
}

if(!st.active){
  _showDbg('account inactive');
  fail('Account inactive. Contact your trainer.');
  return;
}

const storedPw = sanitisePass(String(st.password || ''));
const pwMatch = (storedPw === pass);

);

if(!pwMatch){
  _showDbg('password mismatch', false);
  fail('Incorrect Student ID or password.');
  return;
}

// Hide debug panel on success
if(_dbgEl){
  _dbgEl.style.display = 'none';
}

if(rememberMe){
  saveStudentCredentials(
    st.studentId || foundKey,
    pass
  );
} else {
  clearStudentCredentials();
}

const accessType = st.accessType || 'lum';

S.user = {
  email: foundKey,
  name: st.name,
  role: 'student',
  id: st.studentId || foundKey,
  batch: st.batch || 'Batch A',
  accessType
};

S.role = 'student';

finishLogin();

console.log(
  '[CLARION auth] SUCCESS user="' +
  S.user.name +
  '"'
);

setTimeout(function(){
  triggerSheetSync(true);
}, 1500);
}
async function _clarionStudentAuthEmail(studentCode){
  // Use the complete student ID. Do not assume any college,
  // programme, year, slash or numbering format.
  const canonicalCode = String(studentCode || '')
    .normalize('NFC')
    .trim()
    .toUpperCase();

  const encoded = new TextEncoder().encode(canonicalCode);

  const hashBuffer = await crypto.subtle.digest(
    'SHA-256',
    encoded
  );

  const hashHex = Array.from(
    new Uint8Array(hashBuffer)
  ).map(function(byte){
    return byte.toString(16).padStart(2, '0');
  }).join('');

  return (
    'sid-' +
    hashHex.slice(0, 24) +
    '@students.clarionprep.com'
  );
}


async function login(){

  // Public Demo continues to use the existing working login.
  if(authRole === 'demo'){
    return loginLegacy();
  }

  const rawLogin = String(
    document.getElementById('a-email').value || ''
  ).trim();

  const password = String(
    document.getElementById('a-pass').value || ''
  );

  const rememberBox =
    document.getElementById('a-remember');

  const rememberMe =
    authRole === 'student' &&
    !!(rememberBox && rememberBox.checked);

  const btn =
    document.querySelector('.btn-auth');


  function resetButton(){
    if(btn){
      btn.textContent = 'Sign in →';
      btn.disabled = false;
    }
  }


  function fail(message){
    resetButton();
    toast(message, 'err');
  }


  if(!rawLogin || !password){
    fail('Enter your login details.');
    return;
  }


  if(btn){
    btn.textContent = 'Signing in…';
    btn.disabled = true;
  }


  try{

    let authEmail = '';
    let enteredStudentCode = '';

    /*
      TRAINER LOGIN
      The visible username "manu" maps to the secure
      Supabase authentication email.
    */
    if(authRole === 'trainer'){

      authEmail =
        rawLogin.toLowerCase() === 'manu'
          ? 'manutelw@gmail.com'
          : rawLogin.toLowerCase();

    /*
      STUDENT LOGIN
      The student continues to enter their normal Student ID.
      The complete ID is converted into the hidden Supabase
      authentication email.
    */
    }else if(authRole === 'student'){

      enteredStudentCode = rawLogin
        .normalize('NFC')
        .trim()
        .toUpperCase();

      authEmail =
        await _clarionStudentAuthEmail(
          enteredStudentCode
        );

    }else{

      resetButton();
      return loginLegacy();
    }


    const authResult =
      await clarionSupabase.auth.signInWithPassword({
        email: authEmail,
        password: password
      });


    /*
      During migration, students who have not yet been added
      to Supabase continue through the existing login system.
      This prevents the current working student app from breaking.
    */
    if(authResult.error){

      if(authRole === 'student'){
        resetButton();
        return loginLegacy();
      }

      throw authResult.error;
    }


    const user =
      authResult.data &&
      authResult.data.user;


    if(!user){
      throw new Error(
        'Login could not be completed.'
      );
    }


    const profileResult =
      await clarionSupabase
        .from('profiles')
        .select(
          'id, student_code, full_name, email, role, batch_id, access_type, active'
        )
        .eq('id', user.id)
        .single();


    if(profileResult.error){
      await clarionSupabase.auth.signOut();
      throw profileResult.error;
    }


    const profile =
      profileResult.data;


    if(!profile || profile.active === false){
      await clarionSupabase.auth.signOut();
      throw new Error(
        'Account inactive. Contact your trainer.'
      );
    }


    /*
      TRAINER OR ADMIN PROFILE
    */
    if(authRole === 'trainer'){

      if(
        profile.role !== 'trainer' &&
        profile.role !== 'admin'
      ){
        await clarionSupabase.auth.signOut();

        throw new Error(
          'This account does not have trainer access.'
        );
      }


      S.user = {
        email: profile.email || authEmail,
        name: profile.full_name || 'Trainer',
        role: 'trainer',
        id: profile.id,
        batch: '',
        accessType:
          profile.access_type || 'trainer',
        supabaseId: profile.id,
        authEmail: authEmail
      };

      S.role = 'trainer';
      S.supabaseUser = user;

      finishLogin();
      return;
    }


    /*
      STUDENT PROFILE
    */
    if(profile.role !== 'student'){
      await clarionSupabase.auth.signOut();

      throw new Error(
        'This account does not have student access.'
      );
    }


    const profileStudentCode = String(
      profile.student_code || ''
    )
      .normalize('NFC')
      .trim()
      .toUpperCase();


    if(
      !profileStudentCode ||
      profileStudentCode !== enteredStudentCode
    ){
      await clarionSupabase.auth.signOut();

      throw new Error(
        'Student ID does not match this account.'
      );
    }


    /*
      Read only the existing local metadata needed to keep the
      current question banks, batch and access screens working
      during migration. The password is not checked locally.
    */
    loadRegistry();

    const allStudents = getStudents();

    let localStudent = null;
    let foundKey = null;


    for(
      const [key, student]
      of Object.entries(allStudents)
    ){

      const localCode = String(
        student.studentId || ''
      )
        .normalize('NFC')
        .trim()
        .toUpperCase();


      if(localCode === enteredStudentCode){
        localStudent = student;
        foundKey = key;
        break;
      }
    }


    if(rememberMe){

      saveStudentCredentials(
        enteredStudentCode,
        password
      );

    }else{

      clearStudentCredentials();
    }


    S.user = {
      email:
        foundKey ||
        profile.email ||
        authEmail,

      authEmail: authEmail,

      name:
        profile.full_name ||
        (localStudent && localStudent.name) ||
        enteredStudentCode,

      role: 'student',

      id: profile.student_code,

      studentId: profile.student_code,

      batch:
        (localStudent && localStudent.batch) ||

      accessType:
        (
          localStudent &&
          localStudent.accessType
        ) ||
        profile.access_type ||
        'normal',

      supabaseId: profile.id
    };


    S.role = 'student';
    S.supabaseUser = user;

    finishLogin();


  }catch(error){

    console.error(
      '[CLARION Supabase login]',
      error
    );

    fail(
      error && error.message
        ? error.message
        : 'Unable to sign in.'
    );
  }
}

function logout(){
  // Stop any active recording and release microphone before clearing state
  if(S.recording || (S.mediaRec && S.mediaRec.state !== 'inactive')){
    clearInterval(S.recTimer);
    try{
      if(S.mediaRec && S.mediaRec.state !== 'inactive') S.mediaRec.stop();
      // Release mic stream tracks
      if(S.mediaRec && S.mediaRec.stream){
        S.mediaRec.stream.getTracks().forEach(function(t){ t.stop(); });
      }
    }catch(e){}
  }
  // Revoke any blob URL to free memory
  if(S.audioEl && S.audioEl.src && S.audioEl.src.startsWith('blob:')){
    try{ URL.revokeObjectURL(S.audioEl.src); }catch(e){}
  }
  S.user=null;S.role=null;S._publicDemo=false;S._bootstrapMode=false;
  localStorage.removeItem('clarion_admin_emergency');  // emergency flag must never survive logout
  autoOpsStopTimer();
  clearInterval(S.recTimer);
  document.getElementById('app').classList.remove('on');
  // Reset to trainer tab — username 'manu' shown, password blank, Remember Me hidden
  const emailInput=document.getElementById('a-email');
  const loginLabel=document.getElementById('a-login-label');

  if(emailInput){emailInput.value=TRAINER_EMAIL;emailInput.type='text';}
  if(loginLabel){loginLabel.textContent='Username';}
  if(passInput){passInput.value='';passInput.type='password';}

  _showRememberRow(false);

  const toggleBtn=document.getElementById('toggle-pw');

  // Activate Trainer tab
  document.querySelectorAll('.role-btn').forEach(function(b){ b.classList.remove('on'); });
  var trainerBtn = document.querySelector('.role-btn:last-child');
  if(trainerBtn) trainerBtn.classList.add('on');
  authRole = 'trainer';
  document.getElementById('auth').style.display='flex';
}
