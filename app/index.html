function _safeDefaultPage(){
  // Returns the correct fallback page for the current role, never a protected one.
  if(!S.role || !S.user){
    // Not logged in — show auth screen and stop
    document.getElementById('app').classList.remove('on');
    document.getElementById('auth').style.display='flex';
    return null;
  }
  if(S.role==='admin' || S.role==='trainer')  return 'adm-dash';
  if(S.role==='demo')   return 'stu-demo';
  // student — same logic as sidebar
  const acc = S.user?.accessType||'lum';
  if(acc==='diagnostic') return 'stu-diag';
  return 'stu-home';
}

function nav(id){
  // ── Role guard ──────────────────────────────────────────────────────────────
  if(!S.role || !S.user){
    // Not authenticated — abort and show login
    document.getElementById('app').classList.remove('on');
    document.getElementById('auth').style.display='flex';
    return;
  }

  // ── Bootstrap guard ─────────────────────────────────────────────────────────
  // While S._bootstrapMode is true the admin has not yet configured the central
  // Script URL. Lock navigation to adm-setup only.
  if(S._bootstrapMode && id !== 'adm-setup'){
    toast('Configure the Admin Script URL first.', 'err');
    // Fall through to render adm-setup instead
    id = 'adm-setup';
  }
  const page = PAGES[id];
  if(!page || !page.roles.includes(S.role)){
    // Requested page is not allowed for this role.
    if(S.role === 'trainer'){
      // Show access restricted message instead of silent redirect
      set('<div class="ph"><div class="ph-title">Access Restricted</div><div class="ph-sub">Admin permission required</div></div>'+
        '<div class="banner banner-warn"><span class="banner-ic">🔒</span><div>'+
        '<div class="banner-title">Access restricted. Admin permission required.</div>'+
        '<div class="banner-sub">This section is only accessible to admins. Contact your administrator if you need access.</div>'+
        '</div></div>');
      return;
    }
    console.warn('[CLARION] nav blocked: role='+S.role+' tried id='+id);
    const safe = _safeDefaultPage();
    if(safe && safe !== id) nav(safe);
    return;
  }
  // Access-type guard: 'stu-bank' is only for non-LUM student roles
  if(id==='stu-bank' && S.role==='student'){
    const acc = S.user?.accessType||'lum';
    if(acc==='lum' || acc==='diagnostic'){
      console.warn('[CLARION] nav blocked: accessType='+acc+' tried stu-bank');
      const safe = _safeDefaultPage();
      if(safe && safe !== id) nav(safe);
      return;
    }
  }
  // Demo role (or student with demo accessType) may only access stu-demo
  const _isDemoAccess = S.role==='demo' ||
    (S.role==='student' && (S.user?.accessType||'') === 'demo');
  if(_isDemoAccess && id !== 'stu-demo' && id !== 'stu-dash'){
    console.warn('[CLARION] nav blocked: demo access tried '+id);
    nav('stu-demo');
    return;
  }
  // ── Authorised ─────────────────────────────────────────────────────────────
  S.page = id;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('on'));
  const el = document.getElementById('ni-'+id);
  if(el) el.classList.add('on');
  page.render();
  closeDrawer();
}

// ── Placement schedule helper ────────────────────────────────────────────────
function getPlacementTask(email){
  // Mon–Thu (1-4): PI from PLACEMENT_PI_BANK
  // Fri (5): GD from PLACEMENT_GD_BANK
  // Sat–Sun (6,0): LUM/daily from QUESTION_BANK
  const day=new Date().getDay();
  if([1,2,3,4].includes(day)){
    if(!PLACEMENT_PI_BANK.length) return {type:'PI',mode:'empty'};
    let idx=0;
    if(email){
      const subs=getSubs(email);
      const piDays=new Set();
      Object.keys(subs).forEach(function(k){ if(k.startsWith('placement_ppi_')) piDays.add(k.slice(14)); });
      idx=piDays.size % PLACEMENT_PI_BANK.length;
    } else {
      const msDay=86400000;
      idx=Math.max(0,Math.floor((new Date()-PROGRAM_START)/msDay))%PLACEMENT_PI_BANK.length;
    }
    return {type:'PI',mode:'placement',bank:'ppi',q:PLACEMENT_PI_BANK[idx],dayLabel:'Mon–Thu · PI'};
  } else if(day===5){
    if(!PLACEMENT_GD_BANK.length) return {type:'GD',mode:'empty'};
    let idx=0;
    if(email){
      const subs=getSubs(email);
      const gdDays=new Set();
      Object.keys(subs).forEach(function(k){ if(k.startsWith('placement_pgd_')) gdDays.add(k.slice(14)); });
      idx=gdDays.size % PLACEMENT_GD_BANK.length;
    } else {
      const msDay=86400000;
      idx=Math.max(0,Math.floor((new Date()-PROGRAM_START)/msDay))%PLACEMENT_GD_BANK.length;
    }
    return {type:'GD',mode:'placement',bank:'pgd',q:PLACEMENT_GD_BANK[idx],dayLabel:'Friday · GD'};
  } else {
    return {type:'LUM',mode:'lum'};
  }
}

// ── submitPlacementDaily: scores placement PI/GD task from home page ─────────
async function submitPlacementDaily(){
  if(!S.user || !S.user.email){ toast('Session expired. Please log in again.','err'); return; }
  if(!S.recorded&&S.recSecs===0){toast('Record your response first','err');return;}
  const q=S.currentQ; const bank=S.currentBank; if(!q||!bank)return;
  const today=new Date().toISOString().split('T')[0];
  const subKey='placement_'+bank+'_'+today;
  const btn=document.getElementById('btn-submit');if(btn)btn.disabled=true;
  const proc=document.getElementById('proc-area');
  const typeLabel=bank==='ppi'?'PI':'GD';

  await _runSubmit({
    proc,

function buildFeedbackText(sub){
  const CRIT_LABELS={
    structure_clarity:'Structure & Clarity',
    content_depth:'Content Depth & Evidence',
    business_thinking:'Business Thinking',
    comm_professionalism:'Communication & Professionalism',
    composure:'Composure Under Pressure'
  };
  const CRIT_ORDER=['structure_clarity','content_depth','business_thinking','comm_professionalism','composure'];
  const c=sub.criteria||{};
  const fb=sub.feedback||{};
  let lines=[];
  lines.push('CLARION — PI Feedback');
  lines.push('Question: '+(sub.qtext||''));
  lines.push('Date: '+(sub.date||''));
  lines.push('Type: '+(sub.type||'')+'  |  Duration: '+(sub.duration||'')+'s');
  lines.push('');
  lines.push('Total Score: '+sub.score+'/10  ['+(parseFloat(sub.score)>=6?'PASS':'DEVELOPING')+']');
  lines.push('');
  CRIT_ORDER.forEach(function(k,i){
    const lbl=CRIT_LABELS[k]||k;
    const pts=c[k]||0;
    const f=fb[k]||{};
    lines.push((i+1)+'. '+lbl+' — '+pts+'/2');
    lines.push('   ✓ Worked:  '+(f.worked||'—'));
    lines.push('   ✗ Weak:    '+(f.weak||'—'));
    lines.push('   → Fix:     '+(f.fix||'—'));
    lines.push('');
  });
  lines.push('Can-do: '+(sub.cando||'—'));
  lines.push('');
  lines.push('─────────────────────────────────────');
  lines.push('Feedback is temporary and will not be stored permanently.');
  lines.push('Please download or copy it for your records.');
  return lines.join('\n');
}

function downloadFeedback(sub){
  const text=buildFeedbackText(sub);
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='CLARION_PI_Feedback_'+(sub.date||'')+'_Q'+(sub.qno||sub.qnum||'')+(sub.type?'_'+sub.type:'')+'.txt';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  toast('Feedback downloaded','ok');
}

function copyFeedback(sub){
  const text=buildFeedbackText(sub);
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast('Feedback copied','ok')).catch(()=>fallbackCopy(text));
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Feedback copied','ok');}catch(e){toast('Copy failed — please download instead','err');}
  document.body.removeChild(ta);
}

function startRec(limit){
    console.log('[PROBE] startRec called | limit=', limit, '| recording=', S.recording);
  __clarionProbe('startRec');
  // Guard: don't start a second recording if one is already running
  if(S.recording){ return; }
  S.recSecs=0;S.recLimit=limit;S.recording=true;
  document.getElementById('btn-go').classList.add('hidden');
  document.getElementById('btn-stop').classList.remove('hidden');
  const wv=document.getElementById('wv');if(wv)wv.classList.remove('idle');
  tickRec();
  S.recTimer=setInterval(()=>{S.recSecs++;tickRec();if(S.recSecs>=S.recLimit)stopRec();},1000);
  if(navigator.mediaDevices?.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
      S.mediaRec=new MediaRecorder(stream,{mimeType:mime});
      const chunks=[]; S._recChunks=chunks;
      S.mediaRec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
     S.mediaRec.onstop=()=>{
               console.log('[PROBE] onstop FIRED | chunks=', chunks.length);
                 __clarionProbe('onstop', {chunks: (S._recChunks && S._recChunks.length) || 0});
  // Final recorded Blob — build once, then assign to the SAME field the scoring path reads (S.audioBlob).
  const finalBlob = new Blob(chunks, {type: S.mediaRec.mimeType});
  console.log('[CLARION] recorder final blob:', finalBlob.size+'B', 'type='+finalBlob.type, 'chunks='+chunks.length);
  S.audioBlob = finalBlob;
  window.CLARION_LAST_AUDIO_BLOB = finalBlob;
  console.log('[CLARION] S.audioBlob assigned:', !!S.audioBlob, S.audioBlob ? (S.audioBlob.size+'B type='+S.audioBlob.type) : 'null');
  // Safe external debug handle (window.S is intentionally not global).
  window.__clarionAudioDebug = { hasBlob: !!S.audioBlob, size: S.audioBlob?S.audioBlob.size:0, type: S.audioBlob?S.audioBlob.type:'', updatedAt: new Date().toISOString() };
  S.audioEl=new Audio(URL.createObjectURL(S.audioBlob));
  stream.getTracks().forEach(t=>t.stop());

  document.getElementById('btn-play')?.classList.remove('hidden');
  document.getElementById('btn-rerec')?.classList.remove('hidden');

  const submitBtn=document.getElementById('btn-submit');
  if(submitBtn) submitBtn.disabled=false;

  const st=document.getElementById('rec-state');
  if(st)st.textContent='Recorded — '+S.recSecs+'s. Review or submit.';

  console.log('[CLARION] Audio blob ready:', S.audioBlob.size+'B type='+S.audioBlob.type);
};
      S.mediaRec.start(100);
    }).catch(()=>toast('Mic access denied — demo mode','err'));
  }
}
function tickRec(){
  const rem=S.recLimit-S.recSecs;
  const m=Math.floor(S.recSecs/60),s=S.recSecs%60;
  const bigEl=document.getElementById('rec-timer');
  const fillEl=document.getElementById('rec-fill');
  const stEl=document.getElementById('rec-state');
  if(!bigEl)return;
  bigEl.textContent=m+':'+(s<10?'0':'')+s;
  bigEl.className='rec-timer'+(rem<=5?' danger':rem<=12?' warn':'');
  if(fillEl){fillEl.style.width=(S.recSecs/S.recLimit*100)+'%';fillEl.className='rec-fill'+(rem<=5?' danger':'');}
  if(stEl)stEl.innerHTML='<span class="rdot"></span>Recording — '+rem+'s remaining';
}
function stopRec(){
  console.log('[PROBE] stopRec called | mediaRec=', !!S.mediaRec, '| state=', S.mediaRec && S.mediaRec.state, '| recSecs=', S.recSecs);
  if(typeof __clarionProbe === 'function') __clarionProbe('stopRec');

  clearInterval(S.recTimer);
  S.recording=false;
  S.recorded=true;

  const wv=document.getElementById('wv');
  if(wv) wv.classList.add('idle');

  const stopBtn=document.getElementById('btn-stop');
  const playBtn=document.getElementById('btn-play');
  const rerecBtn=document.getElementById('btn-rerec');
  const submitBtn=document.getElementById('btn-submit');
  const st=document.getElementById('rec-state');

  if(stopBtn) stopBtn.classList.add('hidden');
  if(submitBtn) submitBtn.disabled=true;
  if(st) st.textContent='Finalising recording…';

  try{
    if(S.mediaRec && S.mediaRec.state!=='inactive'){
      try{
        if(typeof S.mediaRec.requestData==='function') S.mediaRec.requestData();
      }catch(e){
        console.warn('[CLARION] requestData failed:', e.message);
      }
      S.mediaRec.stop();
    }
  }catch(e){
    console.error('[CLARION] mediaRec.stop failed:', e);
    if(typeof __clarionProbe === 'function') __clarionProbe('err',{msg:'mediaRec.stop failed: '+e.message});
  }

  // ACTIVE-path guarantee: after Stop, ensure the final Blob exists even if
  // MediaRecorder.onstop is delayed or unreliable on mobile.
  setTimeout(function(){
    try{
      if(!S.audioBlob && window.CLARION_LAST_AUDIO_BLOB){
        S.audioBlob = window.CLARION_LAST_AUDIO_BLOB;
      }

      if(!S.audioBlob && S._recChunks && S._recChunks.length){
        const mime = (S.mediaRec && S.mediaRec.mimeType) || 'audio/webm';
        const finalBlob = new Blob(S._recChunks, {type:mime});

        S.audioBlob = finalBlob;
        window.CLARION_LAST_AUDIO_BLOB = finalBlob;
        window.__clarionAudioDebug = {
          hasBlob: true,
          size: finalBlob.size,
          type: finalBlob.type,
          chunks: S._recChunks.length,
          updatedAt: new Date().toISOString()
        };

        try{
          S.audioEl = new Audio(URL.createObjectURL(finalBlob));
        }catch(e){}
      }

      if(S.audioBlob){
        if(playBtn) playBtn.classList.remove('hidden');
        if(rerecBtn) rerecBtn.classList.remove('hidden');
        if(submitBtn) submitBtn.disabled=false;
        if(st) st.textContent='Recorded — '+S.recSecs+'s. Review or submit.';

        console.log('[CLARION] ACTIVE audio blob assigned:', S.audioBlob.size+'B', 'type='+S.audioBlob.type);

        if(typeof __clarionProbeRender === 'function') __clarionProbeRender();
      }else{
        if(rerecBtn) rerecBtn.classList.remove('hidden');
        if(submitBtn) submitBtn.disabled=true;
        if(st) st.textContent='Recording could not be finalised. Please re-record.';

        console.warn('[CLARION] ACTIVE recorder final blob: no audio chunks captured');
        if(typeof __clarionProbe === 'function') __clarionProbe('err',{msg:'No audio chunks captured after Stop'});
      }
    }catch(e){
      console.error('[CLARION] stopRec finalisation error:', e);
      if(typeof __clarionProbe === 'function') __clarionProbe('err',{msg:'stopRec finalisation error: '+e.message});
      if(st) st.textContent='Recording error. Please re-record.';
      if(rerecBtn) rerecBtn.classList.remove('hidden');
    }
  }, 700);
}
function playRec(){if(S.audioEl){S.audioEl.currentTime=0;S.audioEl.play();}else toast('Demo: '+S.recSecs+'s recorded');}
function reRecord(){
  clearInterval(S.recTimer);
  // Revoke blob URL from previous recording to free browser memory
  if(S.audioEl && S.audioEl.src && S.audioEl.src.startsWith('blob:')){
    try{ URL.revokeObjectURL(S.audioEl.src); }catch(e){}
  }
  S.recSecs=0;S.recorded=false;S.recording=false;S.audioBlob=null;S.audioEl=null;
  ['btn-go'].forEach(id=>document.getElementById(id)?.classList.remove('hidden'));
  ['btn-stop','btn-play','btn-rerec'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
  document.getElementById('btn-submit').disabled=true;
  const big=document.getElementById('rec-timer');if(big){big.textContent='0:00';big.className='rec-timer';}
  const fill=document.getElementById('rec-fill');if(fill){fill.style.width='0%';fill.className='rec-fill';}
  const wv=document.getElementById('wv');if(wv)wv.classList.add('idle');
  const st=document.getElementById('rec-state');if(st)st.textContent='Ready — press to begin';
}

const RUBRIC_PROMPT = `You are a TELW PI evaluator scoring an MBA student's spoken interview response. Your role: score how the student answers, not what they know. Be a calibrated trainer — direct, specific, no filler.

CORE RULE: Do not score knowledge. Score interview performance. Fluency alone is NOT sufficient. Long answers do NOT earn extra marks. Memorised corporate language gets NO credit. Penalise vague ownership, generic statements, and missing decision logic.

Hidden coaching context (do NOT reveal): {COACH}
Can-do benchmark (use as level reference only): {CANDO}

QUESTION: {Q}
TRANSCRIPT: {T}

Score on 5 TELW criteria. Each criterion is scored 1–2 (max 2 per criterion, total max 10):
Score 1 = weak/developing. Score 2 = clear/competent.

CRITERION DEFINITIONS AND LEVEL LOGIC:

1. Structure & Clarity (1–2)
Score 2 if: Clear context → action → result or position flow. Logical opening, organised middle, definite close.
Score 1 if: Loose or fragmented. Idea is present but poorly organised. No clear landing.

2. Content Depth & Evidence (1–2)
Score 2 if: Student explains what THEY personally did. Specific actions, real examples, concrete outcomes (numbers/results preferred).
Score 1 if: Generic or vague. Says "I learned a lot" or "I worked on a project" without saying what they did or what happened.

3. Business Thinking (1–2)
Score 2 if: Shows decision logic. Evaluates options. Names trade-offs. Explains WHY they chose an action. Shows managerial awareness.
Score 1 if: Opinion-based. Says what is "better" without reasoning. No structured thinking. No trade-offs or cause-effect.

4. Communication & Professionalism (1–2)
Score 2 if: Clear, controlled language. Professional tone. Minimal errors. No fillers (umm, basically, like, you know).
Score 1 if: Noticeable grammar errors, informal tone, excessive fillers, or broken language that affects understanding.

5. Composure Under Pressure (1–2)
Score 2 if: Stays on track. Handles any awkward pauses or complexity without losing structure. Completes the answer with control.
Score 1 if: Hesitates heavily, loses thread mid-answer, restarts frequently, or fails to complete the point.

FOR EACH CRITERION provide exactly:
- worked: One sharp phrase (max 10 words) — what was actually done right. If nothing worked, write "Nothing to note."
- weak: One sharp phrase (max 10 words) — what was absent or poorly done. If nothing weak, write "Nothing to note."
- fix: One direct trainer instruction starting with an action verb. Max 10 words. E.g. "Add one specific result with a number." / "Name the decision and explain why you chose it." / "Drop fillers — pause instead."

RULES:
- No motivational language. No "great job". No "you did well". No hedging.
- Each bullet is one punchy phrase — not a paragraph, not sub-clauses.
- Write like a trainer who has 8 seconds per criterion, not an AI generating an essay.
- If the student gave a generic or vague answer, say so plainly.
- cando: Write exactly one recruiter-facing can-do statement (max 15 words) that matches the student's actual demonstrated performance level. Do not aspire — reflect what was shown.
- flag: "pass" if total score >= 6, else "needs_improvement"

Return ONLY valid JSON — no markdown, no backticks, no extra text:
{
  "score": N.N,
  "criteria": {
    "structure_clarity": N,
    "content_depth": N,
    "business_thinking": N,
    "comm_professionalism": N,
    "composure": N
  },
  "feedback": {
    "structure_clarity":    {"worked":"...","weak":"...","fix":"..."},
    "content_depth":        {"worked":"...","weak":"...","fix":"..."},
    "business_thinking":    {"worked":"...","weak":"...","fix":"..."},
    "comm_professionalism": {"worked":"...","weak":"...","fix":"..."},
    "composure":            {"worked":"...","weak":"...","fix":"..."}
  },
  "cando": "...",
  "flag": "pass or needs_improvement"
}`;

async function doSubmitDaily(){

function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// ── Timeout wrapper ───────────────────────────────────────────────────────────
// Races a promise against a deadline. Rejects with a timeout error if exceeded.
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'Operation')+' timed out after '+ms+'ms')),ms))
  ]);
}

// Fire-and-forget POST of each scored submission to the central Apps Script store.
// Never blocks the student result screen; localStorage stays the local backup.

  const url =
    localStorage.getItem(CLARION_SUBMISSIONS_URL_KEY) ||
    'https://script.google.com/macros/s/AKfycbzQTMkK80MexLseHbEEaothUbi9gAjJDZzHuGWU9XsxbP6iSMsFbcJd38k_YY7gbLPKhQ/exec';

  if(!url){
    console.warn(
      '[CLARION] submission save skipped — no submissions URL configured'
    );
    return;
  }

  const payload = {
    action: 'saveSubmission',
    timestamp: new Date().toISOString(),

    studentId:
      sub.studentId ||
      (S.user && (S.user.studentId || S.user.id)) ||
      '',

    studentName:
      sub.studentName ||
      (S.user && S.user.name) ||
      '',

    email:
      (S.user && S.user.email) ||
      '',

    batch:
      (S.user && S.user.batch) ||
      '',

    moduleType:
      sub.moduleType ||
      sub.type ||
      'LUM',

    questionId:
      sub.qid ||
      sub.questionId ||
      '',

    question:
      sub.qtext ||
      sub.text ||
      '',

    score:
      sub.score !== undefined
        ? sub.score
        : '',

    maxScore:
      sub.maxScore ||
      '',

    criteria:
  JSON.stringify(
    sub.criteria || {}
  ),

criterionFeedback:
  JSON.stringify(
    sub.criterionFeedback || {}
  ),

feedback:
      sub.overallFeedback ||
      sub.feedback ||
      '',

    cando:
      sub.cando ||
      sub.cando_fb ||
      '',

    flag:
      sub.flag ||
      '',

    communicationBand:
      sub.communicationBand ||
      '',

    communicationReason:
      sub.communicationReason ||
      '',

    transcript:
      sub.transcript ||
      '',

    duration:

  console.log(

  fetch(url, {

// ── Google Drive audio upload ─────────────────────────────────────────────────// Uploads S.audioBlob to Google Drive via the configured Web App URL.
// Returns the public Drive file URL, or null on failure.
//
// Payload fields sent to the Apps Script doPost endpoint:
//   filename    — safe filename derived from studentId + taskId + timestamp
//   mimeType    — audio MIME type from the blob
//   data        — base64-encoded audio content
//   studentId   — the student's login ID (e.g. "003")
//   studentName — the student's display name (e.g. "Rahul Sharma")
//   taskId      — the task/question label (e.g. "daily_2025-06-01")
//   timestamp   — ISO 8601 submission time
//
// CORS note: Google Apps Script doPost does not handle the preflight OPTIONS
// request that browsers send before application/json fetches. Sending as
// text/plain bypasses the preflight (simple CORS request) while the Apps Script
// still receives the JSON string in e.postData.contents.
async function uploadToDrive(studentEmail, taskId){
  if(!S.audioBlob || !S.driveUrl) return null;
  try{
    const base64   = await blobToBase64(S.audioBlob);
    const mime     = S.audioBlob.type || 'audio/webm';
    const ext      = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
    const studentId   = S.user?.id   || S.user?.email || 'unknown';
    const studentName = S.user?.name || 'Unknown';
    const ts       = new Date().toISOString();
    const safeName = studentId.replace(/[^a-z0-9]/gi,'_')
                   + '_' + taskId.replace(/[^a-z0-9]/gi,'_')
                   + '_' + ts.replace(/[:.]/g,'-')
                   + '.' + ext;

    const payload = {
      filename:    safeName,
      mimeType:    mime,
      data:        base64,
      studentId:   studentId,
      studentName: studentName,
      taskId:      taskId,
      timestamp:   ts
    };

    // Send as text/plain to avoid CORS preflight (Apps Script limitation)
    const r = await fetch(S.driveUrl, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify(payload)
    });

    if(!r.ok) throw new Error('Upload HTTP ' + r.status);
    const d = await r.json();
    if(d.url) return d.url;
    throw new Error(d.error || 'No URL returned from Apps Script');
  }catch(e){
    console.warn('[CLARION] Drive upload failed:', e.message);
    return null;
  }
}

// ── Server-side AI scoring ────────────────────────────────────────────────────
// Sends the fully-built prompt and transcript to the AutoOps Apps Script.
// Uses Content-Type: text/plain to avoid CORS preflight — Apps Script does not
// handle OPTIONS, so application/json would be blocked by the browser before
// the request reaches the server.
//
// The Gemini key lives in Script Properties — never in the browser.
// Returns the parsed result object on success, or throws with a specific message.
async function _serverScore(opts){
  const scoringUrl = localStorage.getItem(CLARION_SCORING_URL_KEY) || '';
  if(!scoringUrl) throw new Error('no_scoring_url');

  // Substitute transcript into the prompt here on the frontend so the server
  // receives a ready-to-call prompt with no placeholders remaining.
  const rawPrompt = opts.prompt || '';
  const fullPrompt = rawPrompt.replace('{T}', opts.transcript || '');

  const body = {
    action:      'scoreResponse',
    studentId:   (S.user && (S.user.studentId || S.user.id)) || '',
    taskId:      (S.currentQ && S.currentQ.id) || '',
    moduleType:  opts.moduleType  || 'LUM',
    transcript:  opts.transcript  || '',
    audioBase64: opts.audioBase64 || '',
    audioMime:   opts.audioMime || '',
    prompt:      fullPrompt,          // fully substituted — no {T} or other placeholders remain
    maxScore:    opts.maxScore    || 10,
    diagMode:    opts.diagMode    || false,
  };

  // Encode as JSON string but send as text/plain — this avoids the CORS preflight
  // that Content-Type: application/json would trigger. Apps Script receives the
  // same e.postData.contents string regardless of which plain content-type is used.
  const res = await withTimeout(
    fetch(scoringUrl, {
      method:  'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body:    JSON.stringify(body),
    }),
    120000, 'Server scoring'
  );

  if(!res.ok){
    throw new Error('Server scoring HTTP ' + res.status + ' — check Apps Script deployment (Execute as Me, Access Anyone)');
  }

  let data;
  try{
    data = await res.json();
  } catch(parseErr){
    // Apps Script returned non-JSON — usually means the script threw an HTML error page
    const raw = await res.text().catch(()=>'(unreadable)');
    throw new Error('Server returned non-JSON. Apps Script may have crashed. First 200 chars: ' + raw.substring(0,200));
  }

  console.log('[CLARION] _serverScore raw response:', data);

  if(!data.ok){
  console.error('[CLARION] scoring backend returned ok:false — error:', data.error||'(none)', '| message:', data.message||'(none)', '| full:', data);
  if(data.error === 'no_key')         throw new Error('no_gemini_key');
    if(data.error === 'quota_exceeded') throw new Error('quota_exceeded');
    if(data.error === 'no_transcript')  throw new Error('no_transcript — send transcript or audio');
    throw new Error((data.message || data.error || 'Server scoring failed') + ' [server]');
  }
  return data;
}

// ── Server-side transcription ─────────────────────────────────────────────────
// Sends audio to the Apps Script for transcription only (no scoring).
// Uses text/plain to avoid CORS preflight — same reason as _serverScore.
async function _serverTranscribe(audioBlob){
  const scoringUrl = localStorage.getItem(CLARION_SCORING_URL_KEY) || '';
  if(!scoringUrl) throw new Error('no_scoring_url');

  const base64 = await blobToBase64(audioBlob);
  const body   = {
    action:         'scoreResponse',
    studentId:      (S.user && (S.user.studentId || S.user.id)) || '',
    transcribeOnly: true,
    audioBase64:    base64,
    audioMime:      audioBlob.type || 'audio/webm',
    transcript:     '',
    prompt:         '',
    maxScore:       0,
    diagMode:       false,
  };

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 20000);

  let res;
  try{
    res = await fetch(scoringUrl, {
      method:  'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body:    JSON.stringify(body),
      signal:  controller.signal
    });
  }catch(e){
    if(e.name === 'AbortError'){
      throw new Error('Server transcription timed out after 20 seconds');
    }
    throw new Error('Server transcription fetch failed: ' + e.message);
  }finally{
    clearTimeout(timer);
  }

  if(!res.ok) throw new Error('Transcription HTTP ' + res.status);

  let data;
  try{
    data = await res.json();
  }catch(e){
    const raw = await res.text().catch(()=>'(unreadable)');
    throw new Error('Transcription returned non-JSON: ' + raw.substring(0,160));
  }

  console.log('[CLARION] _serverTranscribe raw response:', data);

  if(data.error === 'no_key') throw new Error('no_gemini_key');
  if(!data.ok && data.error)  throw new Error(data.message || data.error);
  if(!data.transcript) throw new Error('empty_transcript_from_server');

  return data.transcript || '';
}

// ── AI health check ───────────────────────────────────────────────────────────
async function checkAiHealth(){
  const url = localStorage.getItem(CLARION_SCORING_URL_KEY) || '';
  if(!url){ toast('AI Scoring URL not configured.','err'); return; }

  const statusEl = document.getElementById('ai-health-status');
  if(statusEl){ statusEl.textContent = 'Checking…'; statusEl.style.color = 'var(--muted)'; }

  try{
    const res  = await fetch(url + (url.includes('?')?'&':'?') + 'action=aiHealth', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if(data.ok && data.keySet){
      // Connected and key is present on the server
      const msg = 'Connected ✓ — AI scoring key is set on server';
      toast(msg, 'ok');
      if(statusEl){ statusEl.textContent = msg; statusEl.style.color = 'var(--green)'; }
    } else if(data.ok && !data.keySet){
      // Endpoint reachable but Gemini key has not been stored yet
      const msg = 'Endpoint reachable — AI key not set on server yet';
      toast(msg, 'err');
      if(statusEl){ statusEl.textContent = msg; statusEl.style.color = 'var(--gold)'; }
    } else {
      // Server returned ok:false with an error field
      const msg = 'Server error: ' + (data.error || 'unknown');
      toast(msg, 'err');
      if(statusEl){ statusEl.textContent = msg; statusEl.style.color = 'var(--red)'; }
    }
  }catch(e){
    const msg = 'Cannot reach endpoint: ' + e.message;
    toast(msg, 'err');
    if(statusEl){ statusEl.textContent = msg; statusEl.style.color = 'var(--red)'; }
  }
}

  const pending    = opEmails.filter(e=>{const s=getSubs(e);return !s['daily_'+todayStr];});
  const allSubs    = opEmails.flatMap(e=>Object.values(getSubs(e)).filter(s=>s&&s.score!==undefined));
  const classAvg  = allSubs.length?(allSubs.reduce((a,s)=>a+parseFloat(s.score||0),0)/allSubs.length).toFixed(1):'—';
  const piSubs    = allSubs.filter(s=>s.type==='PI');
  const gdSubs    = allSubs.filter(s=>s.type==='GD');
  const piAvg     = piSubs.length?(piSubs.reduce((a,s)=>a+parseFloat(s.score||0),0)/piSubs.length).toFixed(1):'—';
  const gdAvg     = gdSubs.length?(gdSubs.reduce((a,s)=>a+parseFloat(s.score||0),0)/gdSubs.length).toFixed(1):'—';

  // ── Participation summary metrics ─────────────────────────────────────────
  const totalStudents  = opEmails.length;
  const submittedCount = submitted.length;
  const notSubmitted   = totalStudents - submittedCount;
  const completionRate = totalStudents ? Math.round(submittedCount / totalStudents * 100) : 0;

  // Low performers (needed for "Needs attention" card)
  const studentAvgs = opEmails.map(e=>{
    const s=getStudents()[e];
    const subs=Object.values(getSubs(e)).filter(x=>x&&x.score!==undefined);

    return {email:e,name:s?.name||e,subs:subs.length,avg};
  });
  const lowPerf = studentAvgs.filter(s=>s.avg!==null&&s.avg<6).slice(0,5);

  // At Risk: students with no submissions at all in the last 7 days
  const sevenDaysAgo = new Date(today); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 6);
  const atRisk = opEmails.filter(function(e){
    const subs = getSubs(e);
    for(var d = new Date(sevenDaysAgo); d <= today; d.setDate(d.getDate() + 1)){
      const k = 'daily_' + d.toISOString().split('T')[0];
      if(subs[k]) return false;
    }
    const allSubKeys = Object.keys(subs).filter(function(k){ return k.startsWith('daily_'); });
    return allSubKeys.length > 0;
  }).length;

  // Needs Review: students with any submission flagged 'needs_improvement'

  }).length;

  set('<div class="ph"><div class="ph-title">Dashboard</div><div class="ph-sub">'+dayLabel+'</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="stat-lbl">Submitted today</div><div class="stat-val">'+submittedCount+'<span style="font-family:var(--mono);font-size:1rem;color:var(--muted)">/'+totalStudents+'</span></div><div class="stat-hint">'+completionRate+'% rate</div></div>'+
      '<div class="stat"><div class="stat-lbl">Class Avg</div><div class="stat-val">'+classAvg+'</div><div class="stat-hint">out of 10</div></div>'+
      '<div class="stat"><div class="stat-lbl">PI Avg</div><div class="stat-val">'+piAvg+'</div><div class="stat-hint">'+piSubs.length+' responses</div></div>'+
      '<div class="stat"><div class="stat-lbl">GD Avg</div><div class="stat-val">'+gdAvg+'</div><div class="stat-hint">'+gdSubs.length+' responses</div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      '<div>'+
        '<div class="card"><div class="card-lbl">Today&#39;s question</div>'+
          '<div style="margin-bottom:8px"><span class="tag '+(info.type==='PI'?'tag-pi':'tag-gd')+'">'+info.type+' · TELW '+info.q.telw+'</span></div>'+
          '<div style="font-family:var(--serif);font-size:1rem;line-height:1.5;color:var(--ink2)">'+info.q.q+'</div>'+
        '</div>'+
        (lowPerf.length?'<div class="card"><div class="card-lbl" style="color:var(--red)">⚠ Needs attention (avg below 6)</div>'+lowPerf.map(s=>'<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:.85rem">'+s.name+'</span><span class="pill pill-lo">'+s.avg.toFixed(1)+'</span></div>').join('')+'</div>':'')+
      '</div>'+
      '<div>'+
        '<div class="card">'+
          '<div class="card-lbl" style="margin-bottom:14px">Participation Summary</div>'+
          '<div style="display:flex;flex-direction:column;gap:10px">'+
            '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'+
              '<span style="font-family:var(--mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Submitted Today</span>'+
              '<span style="font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--green)">'+submittedCount+' / '+totalStudents+'</span>'+
            '</div>'+

// ── Student Follow-Up List ────────────────────────────────────────────────────
function renderAdminFollowup(){
  if(S.role!=='admin' && S.role!=='trainer'){nav(_safeDefaultPage());return;}
  loadRegistry();
  const today     = new Date();
  const todayStr  = today.toISOString().split('T')[0];
  const students  = getStudents();

  // ── Helpers ────────────────────────────────────────────────────────────────
  // Completion %: unique days submitted / calendar days since startDate (min 1)
  function completionPct(e){
    var startStr = getStudentStartDate(e);
    var start    = new Date(startStr);
    var daysSince= Math.max(1, Math.round((today - start)/(1000*60*60*24)) + 1);
    var done     = countPracticeDays(e);
    return Math.min(100, Math.round(done / daysSince * 100));
  }

  // ── Build rows for operational students only (demo accounts excluded) ────
  const opEmails = ALL_STUDENT_EMAILS.filter(isOperationalStudent);
  const rows = opEmails.map(function(e){
    const st           = students[e] || {};
    const subs         = getSubs(e);
    const submittedToday = !!subs['daily_'+todayStr];
    const allDailySubs   = Object.values(subs).filter(function(s){return s&&s.score!==undefined;});
    const needsReview    = allDailySubs.some(function(s){return s.flag==='needs_improvement';});
    const pct            = completionPct(e);
    const totalDays      = countPracticeDays(e);
    const avgScore       = allDailySubs.length
      ? allDailySubs.reduce(function(a,s){return a+parseFloat(s.score||0);},0)/allDailySubs.length
      : null;

    // Last submission date — derived from submission date fields
    const allDates = Object.keys(subs)
      .filter(function(k){return k.startsWith('daily_');})
      .map(function(k){return k.slice(6);})   // 'daily_2026-05-01' → '2026-05-01'
      .sort();
    const lastDate       = allDates.length ? allDates[allDates.length-1] : null;
    const firstDate      = allDates.length ? allDates[0] : null;

    // Days since last submission (null = never submitted)
    var daysSinceLast = null;
    if(lastDate){
      var last = new Date(lastDate);
      daysSinceLast = Math.round((today - last) / (1000*60*60*24));
    }

    // Days since enrollment — use getStudentStartDate which falls back to first sub or today
    var enrollStr  = getStudentStartDate(e);
    var enrollDate = new Date(enrollStr);
    var daysSinceEnroll = Math.round((today - enrollDate) / (1000*60*60*24));

    // ── Differentiated classification ────────────────────────────────────
    // Each student gets exactly one primary status.
    //
    // Tiers (most urgent first):
    //  atRisk        — last sub > 14 days ago, OR pct < 25 with 7+ days enrolled
    //  neverSubbed   — no history at all AND enrolled 3+ days (not a grace-period new joiner)
    //  inactive      — last sub was 4–14 days ago (slipping but not critical)
    //  missedToday   — submitted within last 3 days but not today
    //  active        — submitted today or within 2 days (including today)

    var atRisk, neverSubbed, inactive, missedToday, active;

    if(daysSinceLast === null){
      // Never submitted
      neverSubbed = daysSinceEnroll >= 3;   // give new joiners a 3-day grace window
      atRisk      = false;
      inactive    = false;
      missedToday = false;
      active      = !neverSubbed;           // brand-new student still in grace period
    } else {
      neverSubbed = false;
      atRisk      = daysSinceLast > 14 || (pct < 25 && daysSinceEnroll >= 7);
      inactive    = !atRisk && daysSinceLast >= 4 && daysSinceLast <= 14;
      missedToday = !atRisk && !inactive && !submittedToday;
      active      = submittedToday || (!atRisk && !inactive && daysSinceLast <= 2);
    }

    // ── Status label, colour, row highlight ──────────────────────────────
    var statusLabel, statusCol, rowBg;
    if(atRisk){
      statusLabel='At Risk';            statusCol='var(--red)';   rowBg='background:rgba(155,35,53,.07)';
    } else if(neverSubbed){
      statusLabel='Never Submitted';    statusCol='var(--red)';   rowBg='background:rgba(155,35,53,.04)';
    } else if(inactive){
      statusLabel='Inactive';           statusCol='var(--gold)';  rowBg='background:rgba(201,149,0,.05)';
    } else if(missedToday){
      statusLabel='Missed Today';       statusCol='var(--ink2)';  rowBg='background:rgba(155,35,53,.03)';
    } else {
      statusLabel='Active';             statusCol='var(--green)'; rowBg='';
    }
    // Needs Review overlays the status label (takes visual priority over non-critical statuses)
    if(needsReview && !atRisk && !neverSubbed){
      statusLabel='Needs Review';       statusCol='var(--gold)';  rowBg='background:rgba(201,149,0,.05)';
    }

    // ── Priority ─────────────────────────────────────────────────────────
    var priorityLabel, priorityCol, priorityOrder;
    if(atRisk || neverSubbed){
      priorityLabel='High';   priorityCol='var(--red)';   priorityOrder=0;
    } else if(inactive || (needsReview && !active)){
      priorityLabel='Medium'; priorityCol='var(--gold)';  priorityOrder=1;
    } else if(missedToday || needsReview){
      priorityLabel='Low';    priorityCol='var(--gold)';  priorityOrder=2;
    } else {
      priorityLabel='—';      priorityCol='var(--muted)'; priorityOrder=3;
    }

    return {
      email:e,
      name:st.name||e,
      studentId:st.studentId||e,
      submittedToday, statusLabel, statusCol, rowBg,
      lastDate, pct, avgScore,
      priorityLabel, priorityCol, priorityOrder,
      needsReview, inactive, atRisk, neverSubbed, missedToday, active,
      daysSinceLast, daysSinceEnroll
    };
  });

  // Sort: High → Medium → Low, then alphabetical within group
  rows.sort(function(a,b){
    if(a.priorityOrder!==b.priorityOrder) return a.priorityOrder-b.priorityOrder;
    return (a.name||'').localeCompare(b.name||'');
  });

  // ── Summary counts for the sub-header ─────────────────────────────────────
  const cNotToday    = rows.filter(function(r){return !r.submittedToday;}).length;
  const cAtRisk      = rows.filter(function(r){return r.atRisk || r.neverSubbed;}).length;
  const cNeedsReview = rows.filter(function(r){return r.needsReview;}).length;
  const cInactive    = rows.filter(function(r){return r.inactive;}).length;

  // ── Build table rows ───────────────────────────────────────────────────────
  const tableHTML = rows.map(function(r){
    const pctCol = r.pct>=70?'var(--green)':r.pct>=40?'var(--gold)':'var(--red)';
    const avgDisp = r.avgScore!==null ? r.avgScore.toFixed(1)+'/10' : '—';
    const todayDisp = r.submittedToday
      ? '<span style="color:var(--green);font-family:var(--mono);font-size:.72rem">✓ Yes</span>'
      : '<span style="color:var(--red);font-family:var(--mono);font-size:.72rem">✗ No</span>';
    var filterKeys = [];
    if(r.missedToday || (!r.submittedToday && !r.atRisk && !r.neverSubbed && !r.inactive))
                              filterKeys.push('missed');
    if(r.atRisk || r.neverSubbed) filterKeys.push('atrisk');
    if(r.needsReview)         filterKeys.push('review');
    if(r.inactive || r.neverSubbed) filterKeys.push('inactive');
    return '<tr style="'+(r.rowBg)+'" data-name="'+r.name.toLowerCase()+'" data-id="'+r.studentId.toLowerCase()+'" data-filter="'+(filterKeys.join(' ')||'ok')+'" data-sort-priority="'+r.priorityOrder+'" data-sort-pct="'+r.pct+'" data-sort-last="'+(r.lastDate||'0000-00-00')+'" data-sort-name="'+r.name.toLowerCase()+'">' +
      '<td><div style="font-weight:600;font-size:.85rem">'+r.name+'</div>'+
           '<div style="font-family:var(--mono);font-size:.67rem;color:var(--muted)">'+r.studentId+'</div></td>'+
      '<td style="text-align:center">'+todayDisp+'</td>'+
      '<td style="font-family:var(--mono);font-size:.72rem;color:var(--muted)">'+
        (r.lastDate||'<span style="color:var(--dim)">Never</span>')+'</td>'+
      '<td>'+
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<div style="width:44px;height:4px;background:var(--border);border-radius:2px;overflow:hidden">'+
            '<div style="height:100%;width:'+r.pct+'%;background:'+pctCol+';border-radius:2px"></div>'+
          '</div>'+
          '<span style="font-family:var(--mono);font-size:.72rem;color:'+pctCol+'">'+r.pct+'%</span>'+
        '</div>'+
      '</td>'+
      '<td>'+
        '<span style="font-family:var(--mono);font-size:.72rem;color:'+r.statusCol+'">'+r.statusLabel+'</span>'+
        (r.needsReview&&r.statusLabel!=='Needs Review'?
          '<span style="font-family:var(--mono);font-size:.6rem;margin-left:6px;color:var(--gold)">+ Review</span>':'')+
      '</td>'+
      '<td>'+
        '<span style="font-family:var(--mono);font-size:.72rem;font-weight:600;color:'+r.priorityCol+'">'+r.priorityLabel+'</span>'+
      '</td>'+
    '</tr>';
  }).join('');

  const emptyRow = '<tr><td colspan="6" style="text-align:center;padding:28px;font-family:var(--mono);font-size:.75rem;color:var(--green)">All students submitted today ✓</td></tr>';

  // Initialise sort state (persists while page is mounted; resets on next full render)
  window._fuSortCol = window._fuSortCol || 'priority';
  window._fuSortDir = window._fuSortDir || 'asc';

  function thSort(col, label){
    var active = window._fuSortCol === col;
    var arrow  = active ? (window._fuSortDir==='asc' ? ' ↑' : ' ↓') : ' ↕';
    var wt     = active ? ';color:var(--ink)' : ';color:var(--muted)';
    return '<th style="cursor:pointer;user-select:none;white-space:nowrap'+wt+'" onclick="_fuSort(\''+col+'\')">'+
      label+'<span style="font-family:var(--mono);font-size:.65rem;margin-left:3px">'+arrow+'</span>'+
    '</th>';
  }

  set(
    '<div class="ph">'+
      '<button class="btn-secondary" style="margin-bottom:12px;font-size:.78rem" onclick="nav(\'adm-dash\')">← Back to Dashboard</button>'+
      '<div class="ph-title">Student Follow-Up List</div>'+
      '<div class="ph-sub">'+todayStr+
        ' &nbsp;·&nbsp; Not submitted: '+cNotToday+
        ' &nbsp;·&nbsp; At risk: '+cAtRisk+
        ' &nbsp;·&nbsp; Needs review: '+cNeedsReview+
        ' &nbsp;·&nbsp; Inactive: '+cInactive+
      '</div>'+
    '</div>'+
    '<div class="pb-filters" id="followup-filters">'+
      '<button class="pb-filter on" data-f="all"     onclick="_fuFilter(this)">All</button>'+
      '<button class="pb-filter"   data-f="missed"   onclick="_fuFilter(this)">Missed Today</button>'+
      '<button class="pb-filter"   data-f="atrisk"   onclick="_fuFilter(this)">At Risk</button>'+
      '<button class="pb-filter"   data-f="review"   onclick="_fuFilter(this)">Needs Review</button>'+
      '<button class="pb-filter"   data-f="inactive" onclick="_fuFilter(this)">Inactive</button>'+
    '</div>'+
    '<div style="margin-bottom:10px">'+
      '<input id="followup-search" class="f-input" type="text" placeholder="Search student name or ID…"'+
        ' style="padding:8px 12px;font-size:.82rem"'+
        ' oninput="_fuApply()">'+
    '</div>'+
    '<div class="tbl-wrap">'+
      '<table class="tbl">'+
        '<thead><tr>'+
          thSort('name','Student')+
          '<th style="text-align:center">Submitted Today</th>'+
          thSort('last','Last Submission')+
          thSort('pct','Completion %')+
          '<th>Status</th>'+
          thSort('priority','Priority')+
        '</tr></thead>'+
        '<tbody id="followup-tbody">'+(rows.length?tableHTML:emptyRow)+'</tbody>'+
      '</table>'+
    '</div>'
  );
}


// ── Follow-Up List: sort handler ─────────────────────────────────────────────
function _fuSort(col){
  if(window._fuSortCol === col){
    window._fuSortDir = window._fuSortDir==='asc' ? 'desc' : 'asc';
  } else {
    window._fuSortCol = col;
    window._fuSortDir = col==='name' ? 'asc' : (col==='pct' ? 'desc' : 'asc');
  }
  var tbody = document.getElementById('followup-tbody');
  if(!tbody) return;
  var trs = Array.prototype.slice.call(tbody.querySelectorAll('tr[data-sort-priority]'));
  var dir = window._fuSortDir==='asc' ? 1 : -1;
  trs.sort(function(a,b){
    var av, bv;
    if(col==='priority'){
      av=parseInt(a.dataset.sortPriority||9); bv=parseInt(b.dataset.sortPriority||9);
    } else if(col==='pct'){
      av=parseInt(a.dataset.sortPct||0);  bv=parseInt(b.dataset.sortPct||0);
    } else if(col==='last'){
      av=a.dataset.sortLast||''; bv=b.dataset.sortLast||'';
    } else {  // name
      av=a.dataset.sortName||''; bv=b.dataset.sortName||'';
    }
    if(av<bv) return -1*dir;
    if(av>bv) return  1*dir;
    return 0;
  });
  trs.forEach(function(tr){ tbody.appendChild(tr); });
  // Update header arrows by re-rendering the thead only
  var thead = tbody.previousElementSibling;
  if(thead){
    var ths = thead.querySelectorAll('th[onclick]');
    ths.forEach(function(th){
      var c = (th.getAttribute('onclick')||'').replace("_fuSort('","").replace("')","");
      var active = window._fuSortCol===c;
      var arrow  = active ? (window._fuSortDir==='asc'?' ↑':' ↓') : ' ↕';
      var sp = th.querySelector('span');
      if(sp) sp.textContent = arrow;
      th.style.color = active ? 'var(--ink)' : 'var(--muted)';
    });
  }
  _fuApply();   // re-apply current filter+search to the newly sorted rows
}

// ── Follow-Up List: filter tab handler ───────────────────────────────────────
function _fuFilter(btn){
  document.querySelectorAll('#followup-filters .pb-filter').forEach(function(b){
    b.classList.remove('on');
  });
  btn.classList.add('on');
  _fuApply();
}
// Combined filter + search — called by both the tab buttons and the search input
function _fuApply(){
  var activeBtn = document.querySelector('#followup-filters .pb-filter.on');
  var f   = activeBtn ? activeBtn.dataset.f : 'all';
  var q   = (document.getElementById('followup-search')||{}).value||'';
  q = q.toLowerCase();
  document.querySelectorAll('#followup-tbody tr[data-filter]').forEach(function(r){
    var filterPass = f==='all' || (r.dataset.filter||'').indexOf(f)!==-1;
    var searchPass = q==='' || r.dataset.name.indexOf(q)!==-1 || r.dataset.id.indexOf(q)!==-1;
    r.style.display = (filterPass && searchPass) ? '' : 'none';
  });
}

function viewStudent(email){
  const u=getStudents()[email]||{name:email};

  // Merge regular subs + diagnostic subs into a single sorted list
  const regSubs  = Object.entries(getSubs(email)).map(([k,v])=>({...v,_key:k}))
                   .filter(s=>s&&s.score!==undefined);
  const diagSubs = Object.entries(getDiagSubs(email)).map(([k,v])=>({...v,_key:k,_isDiag:true}))
                   .filter(s=>s&&s.score!==undefined);
  const subs = [...regSubs,...diagSubs].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const typeTag = function(s){
    const t = s.moduleType || s.type || (s._isDiag ? 'Diagnostics' : 'LUM');
    const cls = t==='PI'?'tag-pi':t==='GD'?'tag-gd':t==='Diagnostics'?'tag-diag':'tag-lum';
    return '<span class="tag '+cls+'">'+t+'</span>';
  };
  const scoreDisplay = function(s){
    const sc = parseFloat(s.score||0);
    const mx = parseFloat(s.maxScore||10);
    return scorePill(sc, mx);
  };
  const sourceTag = function(s){
    if(!s.scoringSource || s.scoringSource==='demo') return '';
    const c = s.scoringSource==='server-ai'?'var(--green)':s.scoringSource==='client-ai'?'var(--blue)':'var(--muted)';
    return ' <span style="font-family:var(--mono);font-size:.6rem;color:'+c+';vertical-align:middle">'+s.scoringSource+'</span>';
  };

  document.getElementById('modal-body').innerHTML=
    '<div class="modal-title">'+u.name+'</div>'+
    '<div class="modal-sub">ID: '+(u.studentId||email)+' · '+subs.length+' sessions</div>'+
    '<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr>'+
      '<th>Date</th><th>Type</th><th>Score</th><th>Source</th><th>Flag</th>'+
    '</tr></thead><tbody>'+
    subs.map(s=>
      '<tr>'+
      '<td style="font-family:var(--mono);font-size:.75rem">'+(s.date||'—')+'</td>'+
      '<td>'+typeTag(s)+'</td>'+
      '<td>'+scoreDisplay(s)+'</td>'+
      '<td style="font-family:var(--mono);font-size:.68rem;color:var(--muted)">'+(s.scoringSource||'—')+'</td>'+
      '<td style="font-family:var(--mono);font-size:.7rem;color:'+(s.flag==='pass'?'var(--green)':'var(--red)')+'">'+
        (s.flag||'—')+'</td>'+
      '</tr>'
    ).join('')+
    '</tbody></table></div>';
  document.getElementById('overlay').classList.add('on');
}

// Fetch all centrally-stored submissions and normalise them into the same shape
// the Review table/openReview already expect (criteria/feedback parsed to objects).
function _fetchReviewSubmissions(){
  const url = localStorage.getItem(CLARION_SUBMISSIONS_URL_KEY) || '';
  console.log('[CLARION] review fetch started; central URL configured:', !!url);
  if(!url) return Promise.resolve([]);
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action: 'listSubmissions' })
  })
  .then(function(r){ return r.json(); })
    .then(function(data){
      const rows = (data && (data.submissions||data.rows||data.data)) || [];
      return rows.map(function(r){
        let crit={}, fb={};
        try{ crit = typeof r.criteria==='string' ? JSON.parse(r.criteria||'{}') : (r.criteria||{}); }catch(_){}
        try{ fb   = typeof r.feedback==='string' ? JSON.parse(r.feedback||'{}') : (r.feedback||{}); }catch(_){}
        const mt = r.moduleType||r.type||'LUM';
        return { studentId:r.studentId||'', studentName:r.studentName||r.studentId||'(unknown)',
                 email:r.email||'', batch:r.batch||'',
                 date:String(r.timestamp||r.date||'').slice(0,10), score:r.score, maxScore:r.maxScore||10,
                 moduleType:mt, type:mt, _displayType:mt, _maxScore:parseFloat(r.maxScore||10),
                 duration:parseFloat(r.duration||0), _duration:parseFloat(r.duration||0),
                 qtext:r.question||r.qtext||'', transcript:r.transcript||'',
                 driveLink:r.driveLink||r.audioLink||'', scoringSource:r.scoringSource||'central',
                 criteria:crit, feedback:fb, cando:r.cando||'', flag:r.flag||'' };
      });
    });
}

function renderAdminReview(){  if(S.role!=='admin' && S.role!=='trainer'){nav(_safeDefaultPage());return;}
  loadRegistry();

  // Merge regular subs + diag subs across all students into one flat list
  const all = ALL_STUDENT_EMAILS.flatMap(email=>{
    const u = getStudents()[email]||{name:email};
    const reg = Object.values(getSubs(email))
      .filter(s=>s&&s.score!==undefined)
      .map(s=>({...s, studentName:u.name, email,
                _displayType: s.moduleType||s.type||'LUM',
                _maxScore: parseFloat(s.maxScore||10),
                _duration: s.duration||0 }));
    const diag = Object.values(getDiagSubs(email))
  .filter(s=>s&&s.score!==undefined)
  .map(s=>({...s, studentName:u.name, email,
            _isDiag:true,
            _displayType: s.moduleType||'Diagnostics',
            _maxScore: parseFloat(s.maxScore||10),
            _duration: s.duration||0 }));
const modules = [].concat(
    Object.values(getPPISubs(email)),
    Object.values(getPGDSubs(email)),
    Object.values(getAdvPISubs(email)))
  .filter(s=>s&&s.score!==undefined)
  .map(s=>({...s, studentName:u.name, email,
            _displayType: s.moduleType||s.type||'LUM',
            _maxScore: parseFloat(s.maxScore||10),
            _duration: s.duration||0 }));
return [...reg,...diag,...modules];
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const typeTag = function(s){
    const t = s._displayType;
    const cls = t==='PI'?'tag-pi':t==='GD'?'tag-gd':t==='Diagnostics'?'tag-diag':'tag-lum';
    return '<span class="tag '+cls+'">'+t+'</span>';
  };

  const _draw = function(rows, note){
    set('<div class="ph"><div class="ph-title">Review</div>'+
      '<div class="ph-sub">'+rows.length+' submissions across all students'+(note?' · '+note:'')+'</div></div>'+
      '<div style="display:flex;gap:10px;margin-bottom:16px">'+
        '<button class="btn-gold" onclick="pickRandom()">🎲 Random Sample</button>'+
      '</div>'+
      '<div class="tbl-wrap"><table><thead><tr>'+
        '<th>Student</th><th>Date</th><th>Type</th><th>Score</th><th>Source</th><th>Duration</th><th></th>'+
      '</tr></thead><tbody>'+
      rows.map(s=>'<tr>'+
        '<td style="font-weight:600;font-size:.85rem">'+s.studentName+'</td>'+
        '<td style="font-family:var(--mono);font-size:.75rem">'+(s.date||'—')+'</td>'+
        '<td>'+typeTag(s)+'</td>'+
        '<td>'+scorePill(parseFloat(s.score||0), s._maxScore)+'</td>'+
        '<td style="font-family:var(--mono);font-size:.68rem;color:var(--muted)">'+(s.scoringSource||'—')+'</td>'+
        '<td style="font-family:var(--mono);font-size:.75rem">'+(s._duration?s._duration+'s':'—')+'</td>'+
        '<td><button class="btn-secondary" style="font-size:.75rem;padding:5px 10px" '+
          'data-sub="'+encodeURIComponent(JSON.stringify(s))+'" onclick="openReview(this.dataset.sub)">View</button></td>'+
      '</tr>').join('')+'</tbody></table></div>');
  };

  // Read central backend first; render local cache immediately so the panel is never blank.
  _draw(all, 'local cache — syncing central store…');
  _fetchReviewSubmissions().then(function(backendRows){
    if(!backendRows || !backendRows.length){ _draw(all, 'central store empty/unavailable — local cache'); return; }
    // Trainer batch scoping — only applied when the trainer has an assigned batch; admin sees all.
    let bRows = backendRows;
    if(S.role==='trainer' && S.user && S.user.batch){
      bRows = bRows.filter(function(r){ return (r.batch||'')===S.user.batch; });
    }
    const key=function(s){return [s.studentId||s.email||'',(s.moduleType||s._displayType||s.type||''),(s.date||''),(s.score!==undefined?s.score:'')].join('|');};
    const seen={}; bRows.forEach(function(r){ seen[key(r)]=true; });
    const merged = bRows.concat(all.filter(function(s){ return !seen[key(s)]; }))
      .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    console.log('[CLARION] review fetch count:', bRows.length, '| merged total:', merged.length);
    _draw(merged, 'central store + local cache');
  }).catch(function(e){
    console.error('[CLARION] review fetch failure:', e.message);
    _draw(all, 'central fetch failed — local cache');
  });
}

const modules=[].concat(Object.values(getPPISubs(email)),Object.values(getPGDSubs(email)),Object.values(getAdvPISubs(email))).filter(s=>s&&s.score!==undefined)

function openReview(subStr){
  const s=JSON.parse(decodeURIComponent(subStr));
  const maxSc = parseFloat(s._maxScore || s.maxScore || 10);
  const displayType = s._displayType || s.moduleType || s.type || 'LUM';
  const duration = s._duration || s.duration;

  const audioSection=s.driveLink
    ? '<div style="margin-bottom:12px"><div class="card-lbl">Audio Recording</div>'+
      '<a href="'+s.driveLink+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:var(--blue);color:#fff;border-radius:var(--r);font-size:.82rem;font-family:var(--mono);text-decoration:none;margin-top:4px">'+
      '▶ Open in Google Drive</a></div>'
    : '<div style="margin-bottom:12px"><div class="card-lbl">Audio Recording</div>'+
      '<p style="font-size:.78rem;color:var(--muted);font-family:var(--mono);margin-top:4px">No audio link — Drive URL not configured or student used text-only.</p></div>';

  // Scoring source badge
  const srcColor = s.scoringSource==='server-ai'?'var(--green)':s.scoringSource==='client-ai'?'var(--blue)':'var(--muted)';
  const srcBadge = s.scoringSource
    ? ' <span style="font-family:var(--mono);font-size:.65rem;padding:1px 6px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:'+srcColor+'">'+s.scoringSource+'</span>'
    : '';

  // Diag-style text feedback (flat string) vs rubric-style (object)
  let feedbackHTML = '';
  if(typeof s.feedback === 'string' && s.feedback){
    feedbackHTML = '<div style="margin-bottom:12px"><div class="card-lbl">Feedback</div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:.82rem;line-height:1.6">'+s.feedback+'</div></div>';
  } else if(s.feedback && typeof s.feedback === 'object'){
    feedbackHTML = renderScoreHTML(s, false);
  }

  // Diagnostics-specific fields
  const diagExtras = (s.improvement
    ? '<div style="margin-bottom:12px"><div class="card-lbl" style="color:var(--blue)">Priority Improvement</div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:.82rem;color:var(--blue);line-height:1.6">'+s.improvement+'</div></div>'
    : '')+
    (s.cando_fb
    ? '<div style="margin-bottom:12px"><div class="card-lbl">Can-do Feedback</div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:.82rem;line-height:1.6">'+s.cando_fb+'</div></div>'
    : '');

  document.getElementById('modal-body').innerHTML=
    '<div class="modal-title">'+(s.studentName||'Review')+'</div>'+
    '<button class="btn-secondary" style="margin-bottom:12px;font-size:.78rem" data-nav="'+((S.role==='admin'||S.role==='trainer')?'adm-diag':'stu-diag')+'" onclick="nav(this.dataset.nav)">← Back to Diagnostic'+((S.role==='admin'||S.role==='trainer')?' Reports':'')+'</button>'+
'<div class="ph-title">Diagnostic Report</div>'+
    '<div style="margin-bottom:12px"><div class="card-lbl">Question</div>'+
      '<div style="font-family:var(--serif);font-size:1rem;line-height:1.5">'+(s.qtext||s.text||'—')+'</div></div>'+
    audioSection+
    '<div style="margin-bottom:12px"><div class="card-lbl">Transcript</div>'+
      '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-family:var(--mono);font-size:.75rem;line-height:1.7;max-height:160px;overflow-y:auto">'+
        (s.transcript||'<span style="color:var(--muted)">No transcript</span>')+
      '</div></div>'+
    feedbackHTML+
    diagExtras+
    '<div style="margin-top:14px"><div class="card-lbl">Trainer note</div>'+
      '<textarea style="width:100%;padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-family:var(--mono);font-size:.75rem;min-height:60px;outline:none;resize:vertical" placeholder="Add your evaluation note…"></textarea>'+
    '</div>';
  document.getElementById('overlay').classList.add('on');
}

      // ── Apps Script template for sheet reader ─────────────────────────────
      '<details style="margin-top:10px">'+
        '<summary style="font-family:var(--mono);font-size:.72rem;color:var(--muted);cursor:pointer;user-select:none">'+
          '📋 Apps Script — Sheet Reader + Student ID Generation template'+
        '</summary>'+
        '<div style="margin-top:10px;font-size:.78rem;color:var(--ink2);line-height:1.7">'+
          '<p style="margin-bottom:6px">Deploy this as a Web App (Execute as: Me · Access: Anyone) and paste the <code style="font-family:var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px">/exec</code> URL above.</p>'+
          '<p style="margin-bottom:6px">The script reads your Google Sheet, auto-generates a Student ID (<code style="font-family:var(--mono)">AAA001/YY</code> format) for any row where the Student ID cell is blank, writes it back to the sheet, then returns all Accepted/Approved rows to CLARION.</p>'+
          '<p style="margin-bottom:8px;color:var(--gold);font-weight:600">⚠ Set SHEET_NAME and SPREADSHEET_ID in the script constants before deploying.</p>'+
          '<div style="padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-family:var(--mono);font-size:.65rem;color:var(--muted);line-height:1.8;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow-y:auto">'+
'// ═══════════════════════════════════════════════\n'+
'// CLARION Sheet Reader + Student ID Generator\n'+
'// Deploy as: Web App · Execute as: Me · Access: Anyone\n'+
'// ═══════════════════════════════════════════════\n'+
'var SPREADSHEET_ID = "YOUR_SPREADSHEET_ID_HERE"; // ← replace\n'+
'var SHEET_NAME     = "Form responses 1";          // ← sheet tab name\n'+
'\n'+
'// Column header flexible matching — covers common variants\n'+
'var COL = {\n'+
'  timestamp:   ["timestamp","submitted","date"],\n'+
'  name:        ["student name","full name","name"],\n'+
'  email:       ["email","email id","email address"],\n'+
'  institution: ["institution","institute","college","university","school","organisation"],\n'+
'  batch:       ["batch","academic year","year","programme year","cohort"],\n'+
'  programme:   ["programme","program","domain","course","specialisation"],\n'+
'  status:      ["status","approval","approval status"],\n'+
'  access:      ["access","access type","package","plan"],\n'+
'  studentId:   ["student id","studentid","student_id","id"],\n'+
'};\n'+
'\n'+
'function doGet(e) {\n'+
'  var action = (e.parameter && e.parameter.action) || "";\n'+
'  if(action === "students") return getStudents_();\n'+
'  if(action === "generateIds") return generateMissing_();\n'+
'  return out({error: "unknown action"});\n'+
'}\n'+
'\n'+
'function getStudents_() {\n'+
'  var ss    = SpreadsheetApp.openById(SPREADSHEET_ID);\n'+
'  var sheet = ss.getSheetByName(SHEET_NAME);\n'+
'  if(!sheet) return out({error: "Sheet not found: " + SHEET_NAME});\n'+
'\n'+
'  var data    = sheet.getDataRange().getValues();\n'+
'  var headers = data[0].map(function(h){ return h.toString().toLowerCase().trim(); });\n'+
'  var colIdx  = mapColumns_(headers);\n'+
'\n'+
'  // Auto-generate missing Student IDs before returning rows\n'+
'  generateMissingInSheet_(sheet, data, headers, colIdx);\n'+
'  // Re-read after writes\n'+
'  data = sheet.getDataRange().getValues();\n'+
'\n'+
'  var rows = [];\n'+
'  for(var i = 1; i < data.length; i++) {\n'+
'    var r = data[i];\n'+
'    var status = get_(r, colIdx.status);\n'+
'    if(!status || (status.toLowerCase() !== "accepted" && status.toLowerCase() !== "approved")) continue;\n'+
'    rows.push({\n'+
'      timestamp:   get_(r, colIdx.timestamp),\n'+
'      name:        get_(r, colIdx.name),\n'+
'      email:       get_(r, colIdx.email),\n'+
'      institution: get_(r, colIdx.institution),\n'+
'      batch:       get_(r, colIdx.batch),\n'+
'      programme:   get_(r, colIdx.programme),\n'+
'      status:      status,\n'+
'      access:      get_(r, colIdx.access) || "LUM",\n'+
'      studentId:   get_(r, colIdx.studentId),\n'+
'      groupCode:   institutionPrefix_(get_(r, colIdx.institution)),\n'+
'    });\n'+
'  }\n'+
'  return out({students: rows});\n'+
'}\n'+
'\n'+
'function generateMissing_() {\n'+
'  var ss    = SpreadsheetApp.openById(SPREADSHEET_ID);\n'+
'  var sheet = ss.getSheetByName(SHEET_NAME);\n'+
'  if(!sheet) return out({error: "Sheet not found"});\n'+
'  var data    = sheet.getDataRange().getValues();\n'+
'  var headers = data[0].map(function(h){ return h.toString().toLowerCase().trim(); });\n'+
'  var colIdx  = mapColumns_(headers);\n'+
'  var n = generateMissingInSheet_(sheet, data, headers, colIdx);\n'+
'  return out({generated: n});\n'+
'}\n'+
'\n'+
'// Scans rows, generates IDs for blank Student ID cells, writes back to sheet.\n'+
'// Returns count of IDs written.\n'+
'function generateMissingInSheet_(sheet, data, headers, colIdx) {\n'+
'  if(colIdx.studentId < 0) return 0; // no Student ID column\n'+
'  var generated = 0;\n'+
'  // Build map of existing IDs to prevent duplicates\n'+
'  var usedIds = {};\n'+
'  for(var i = 1; i < data.length; i++) {\n'+
'    var sid = get_(data[i], colIdx.studentId).trim();\n'+
'    if(sid) usedIds[sid.toUpperCase()] = true;\n'+
'  }\n'+
'  for(var i = 1; i < data.length; i++) {\n'+
'    var r   = data[i];\n'+
'    var sid = get_(r, colIdx.studentId).trim();\n'+
'    if(sid) continue; // already has an ID\n'+
'    var inst  = get_(r, colIdx.institution).trim();\n'+
'    var batch = get_(r, colIdx.batch).trim();\n'+
'    var ts    = get_(r, colIdx.timestamp);\n'+
'    var newId = generateId_(inst, batch, usedIds);\n'+
'    usedIds[newId.toUpperCase()] = true;\n'+
'    sheet.getRange(i + 1, colIdx.studentId + 1).setValue(newId);\n'+
'    data[i][colIdx.studentId] = newId; // update in-memory copy too\n'+
'    generated++;\n'+
'  }\n'+
'  return generated;\n'+
'}\n'+
'\n'+
'function generateId_(institutionRaw, batchRaw, usedIds) {\n'+
'  var prefix = institutionPrefix_(institutionRaw);\n'+
'  var year   = yearSuffix_(batchRaw);\n'+
'  var serial = 1;\n'+
'  var candidate;\n'+
'  do {\n'+
'    candidate = prefix + pad_(serial, 3) + "/" + year;\n'+
'    serial++;\n'+
'  } while(usedIds[candidate.toUpperCase()]);\n'+
'  return candidate;\n'+
'}\n'+
'\n'+
'function institutionPrefix_(raw) {\n'+
'  var s = (raw || "").trim();\n'+
'  if(!s) return "UNK";\n'+
'  var lo = s.toLowerCase();\n'+
'  if(lo === "independent" || lo === "direct" || lo === "self" || lo === "na" || lo === "n/a" || lo === "-") return "IND";\n'+
'  var letters = s.replace(/[^a-zA-Z]/g, "");\n'+
'  if(!letters) return "UNK";\n'+
'  return letters.substring(0, 3).toUpperCase();\n'+
'}\n'+
'\n'+
'function yearSuffix_(raw) {\n'+
'  var b = (raw || "").trim();\n'+
'  var m = b.match(/\\b20(\\d{2})[\\/\\-\\u2013](?:20)?(\\d{2})\\b/);\n'+
'  if(m) return m[2];\n'+
'  var all = b.match(/\\b20(\\d{2})\\b/g);\n'+
'  if(all && all.length) return all[all.length-1].slice(-2);\n'+
'  var td = b.match(/\\b(\\d{2})\\b/);\n'+
'  if(td) return td[1];\n'+
'  return new Date().getFullYear().toString().slice(-2);\n'+
'}\n'+
'\n'+
'function pad_(n, len) { return String(n).padStart(len, "0"); }\n'+
'\n'+
'function mapColumns_(headers) {\n'+
'  var result = {};\n'+
'  for(var key in COL) {\n'+
'    result[key] = -1;\n'+
'    for(var j = 0; j < headers.length; j++) {\n'+
'      var h = headers[j];\n'+
'      for(var k = 0; k < COL[key].length; k++) {\n'+
'        if(h.indexOf(COL[key][k]) !== -1) { result[key] = j; break; }\n'+
'      }\n'+
'      if(result[key] !== -1) break;\n'+
'    }\n'+
'  }\n'+
'  return result;\n'+
'}\n'+
'\n'+
'function get_(row, idx) { return idx >= 0 && idx < row.length ? String(row[idx] || "").trim() : ""; }\n'+
'\n'+
'function out(obj) {\n'+
'  return ContentService.createTextOutput(JSON.stringify(obj))\n'+
'    .setMimeType(ContentService.MimeType.JSON);\n'+
'}'+
          '</div>'+

// ── Admin password change handlers ────────────────────────────────────────────
async function changeAdminPw(){
  // Sanitise — same invisible-character strip used everywhere in auth
  function san(v){
    return (v||'')
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
      .replace(/^[\r\n]+|[\r\n]+$/g,'');
  }
  var cur = san((document.getElementById('adm-sec-cur')||{}).value);
  var nw  = san((document.getElementById('adm-sec-new')||{}).value);
  var cfm = san((document.getElementById('adm-sec-cfm')||{}).value);

  // Local validation first (saves a network round-trip for obvious errors)
  if(nw.length < 8){
    toast('New password must be at least 8 characters.','err'); return;
  }
  if(nw !== cfm){
    toast('New password and confirmation do not match.','err'); return;
  }

  var scriptUrl = localStorage.getItem('clarion_admin_script_url') || '';
  if(!scriptUrl){
    toast('Admin Script URL not configured. Add it in Admin Security settings.','err'); return;
  }

  // Disable button during request
  var btn = document.getElementById('adm-sec-update-btn');
  if(btn){ btn.textContent = 'Updating…'; btn.disabled = true; }

  try{
    // Send current + new password to script for server-side validation and storage.
    // The script verifies `cur`, hashes `nw`, stores it in Script Properties.
    // Passwords travel over HTTPS only; nothing is stored client-side.
    var url = scriptUrl + (scriptUrl.includes('?') ? '&' : '?') +
              'action=changeAdmin' +
              '&cur=' + encodeURIComponent(cur) +
              '&nw='  + encodeURIComponent(nw);
    var res  = await fetch(url, {method:'GET', cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();

    if(data.ok){
      ['adm-sec-cur','adm-sec-new','adm-sec-cfm'].forEach(function(id){
        var el = document.getElementById(id); if(el) el.value = '';
      });
      toast('Admin password updated on all devices.','ok');
    } else {
      toast(data.error || 'Current password is incorrect.','err');
    }
  } catch(err){
    console.warn('[CLARION] changeAdminPw error:', err.message);
    toast('Admin verification unavailable. Please try again.','err');
  } finally {
    if(btn){ btn.textContent = 'Update Admin Password'; btn.disabled = false; }
  }
}

async function resetAdminPw(){
  // Reset requires the current password so it cannot be called anonymously.
  // On the script side, resetAdmin deletes the stored property — seedAdmin can then set a new one.
  var san = function(v){
    return (v||'')
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
      .replace(/^[\r\n]+|[\r\n]+$/g,'');
  };
  var cur = san((document.getElementById('adm-sec-cur')||{}).value);
  if(!cur){ toast('Enter the current admin password in the field above before resetting.','err'); return; }
  if(!confirm('Reset admin password on all devices? The stored password will be deleted from the central server. You will need to use the Initialise button to set a new one.')) return;

  var scriptUrl = localStorage.getItem('clarion_admin_script_url') || '';
  if(!scriptUrl){
    toast('Admin Script URL not configured.','err'); return;
  }

  var btn = document.getElementById('adm-sec-reset-btn');
  if(btn){ btn.textContent = 'Resetting…'; btn.disabled = true; }

  try{
    var url = scriptUrl + (scriptUrl.includes('?') ? '&' : '?') +
              'action=resetAdmin&cur=' + encodeURIComponent(cur);
    var res  = await fetch(url, {method:'GET', cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if(data.ok){
      ['adm-sec-cur','adm-sec-new','adm-sec-cfm'].forEach(function(id){
        var el = document.getElementById(id); if(el) el.value = '';
      });
      toast('Admin password deleted. Use Initialise to set a new one.','ok');
    } else {
      var errMap = {wrong_current:'Current password is incorrect.', not_initialised:'No password set — use Initialise.'};
      toast(errMap[data.error] || data.error || 'Reset failed.','err');
    }
  } catch(err){
    console.warn('[CLARION] resetAdminPw error:', err.message);
    toast('Admin verification unavailable. Please try again.','err');
  } finally {
    if(btn){ btn.textContent = 'Reset to Default'; btn.disabled = false; }
  }
}

async function seedAdminPw(){
  // Only works on a fresh script deployment where no password exists yet.
  // If a password is already set the script rejects this call.
  function san(v){
    return (v||'')
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
      .replace(/^[\r\n]+|[\r\n]+$/g,'');
  }
  var pw = san((document.getElementById('adm-sec-seed')||{}).value);
  if(pw.length < 8){ toast('Initial password must be at least 8 characters.','err'); return; }

  var scriptUrl = localStorage.getItem('clarion_admin_script_url') || '';
  if(!scriptUrl){ toast('Admin Script URL not configured.','err'); return; }

  var btn = document.getElementById('adm-sec-seed-btn');
  if(btn){ btn.textContent = 'Initialising…'; btn.disabled = true; }

  try{
    var url = scriptUrl + (scriptUrl.includes('?') ? '&' : '?') +
              'action=seedAdmin&pw=' + encodeURIComponent(pw);
    var res  = await fetch(url, {method:'GET', cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if(data.ok){
      var el = document.getElementById('adm-sec-seed'); if(el) el.value = '';
      toast('Admin password initialised on all devices. Use this password to log in.','ok');
    } else {
      var errMap = {already_set:'A password already exists — use Change Password above.', too_short:'Password too short (min 8 characters).'};
      toast(errMap[data.error] || data.error || 'Initialise failed.','err');
    }
  } catch(err){
    console.warn('[CLARION] seedAdminPw error:', err.message);
    toast('Admin verification unavailable. Please try again.','err');
  } finally {
    if(btn){ btn.textContent = 'Initialise'; btn.disabled = false; }
  }
}

function saveAdminScriptUrl(){
  var el  = document.getElementById('adm-sec-script-url');
  var url = (el ? el.value : '').trim();
  if(!url){ toast('Paste the Apps Script URL first.','err'); return; }
  if(!url.startsWith('https://')){ toast('URL must start with https://','err'); return; }
  localStorage.setItem('clarion_admin_script_url', url);

  // Clear the in-memory bootstrap flag — full navigation unlocks immediately.
  // Bootstrap path re-enables only if this URL is later cleared, which is intentional:
  // the admin must always have a route back in to reconfigure.
  S._bootstrapMode = false;

  // Also clear any active emergency flag — URL is configured now, normal auth works
  localStorage.removeItem('clarion_admin_emergency');

  toast('Admin Script URL saved. Central verification active — full admin access unlocked.','ok');
  renderSetup();   // re-render so warning banner disappears and status shows green
}

// ── Emergency bootstrap access ────────────────────────────────────────────────
// Sets a short-lived flag (default 15 min) that allows the bootstrap password to be
// accepted ONLY when the backend is also unreachable (network failure).
// Must be called from within an active admin session — never available to students.
// The flag is single-use: it is cleared immediately after bootstrap login succeeds.
function enableAdminEmergency(minutes){
  if(S.role !== 'admin'){ toast('Must be admin to enable emergency access.','err'); return; }
  var ms = (minutes || 15) * 60 * 1000;
  localStorage.setItem('clarion_admin_emergency', String(Date.now() + ms));
  toast('Emergency admin access enabled for ' + (minutes||15) + ' min. ' +
        'Only valid when backend is unreachable.', 'ok');
}

function clearAdminEmergency(){
  localStorage.removeItem('clarion_admin_emergency');
  toast('Emergency admin access cleared.', 'ok');
}

// ── Password generator ───────────────────────────────────────────────────────
function generatePassword(){
  // Strong but readable: 8-10 chars, mix of letters and digits, avoid O/0/I/l
  const letters='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ';
  const digits='23456789';
  const all=letters+digits;
  let pw='';
  // Ensure at least 2 digits and at least 2 uppercase
  const len=8+Math.floor(Math.random()*3); // 8-10
  const picks=[];
  picks.push(digits[Math.floor(Math.random()*digits.length)]);
  picks.push(digits[Math.floor(Math.random()*digits.length)]);
  picks.push('ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]);
  for(let i=picks.length;i<len;i++) picks.push(all[Math.floor(Math.random()*all.length)]);
  // Shuffle
  for(let i=picks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picks[i],picks[j]]=[picks[j],picks[i]];}
  return picks.join('');
}

function handleCSVFile(input){
  const file = input.files[0];
  if(!file) return;

  reader.onload = function(e){
    const text = e.target.result;
    const ta = document.getElementById('bulk-input');

      const lines = text.split(/\r?\n/).filter(function(l){return l.trim();});
