// ── Parse bulk input (CSV or paste) ──────────────────────────────────────────
// Format: studentId,name,password,batch,accessType
// password may be blank — auto-generated. accessType optional — defaults to lum.
function parseBulkInput(raw){
  const lines = raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  const results = [];
  lines.forEach(function(line, i){
    // Support comma or tab separated; strip surrounding quotes
    let parts;
    if(line.includes('\t')) parts = line.split('\t').map(function(p){return p.trim().replace(/^"|"$/g,'');});
    else parts = line.split(',').map(function(p){return p.trim().replace(/^"|"$/g,'');});

    if(parts.length < 2){
      results.push({_error:'Line '+(i+1)+': need at least 2 columns (studentId, name)'});
      return;
    }

    // Format: studentId, name [, password [, batch [, accessType]]]
    const studentId = (parts[0]||'').trim();
    const name      = (parts[1]||'').trim();
    let   password  = (parts[2]||'').trim();
    const batch     = (parts[3]||'Batch A').trim();
    let   accessType= (parts[4]||'lum').trim().toLowerCase();

    if(!studentId){
      results.push({_error:'Line '+(i+1)+': Student ID is required'});
      return;
    }
    if(!name){
      results.push({_error:'Line '+(i+1)+': name is required'});
      return;
    }
    // Auto-generate password if blank
    if(!password) password=generatePassword();

    // Normalise accessType — default to lum if missing or unrecognised
    if(accessType==='normal') accessType='lum';
    if(accessType==='diagnosticonly'||accessType==='diagnosticOnly') accessType='diagnostic';
    const validAccess=['lum','placement','diagnostic','demo'];
    if(!validAccess.includes(accessType)) accessType='lum';

    results.push({ studentId, name, password, batch, accessType });
  });
  return results;
}

// ── Bulk add ──────────────────────────────────────────────────────────────────
function bulkAdd(){
  const raw = document.getElementById('bulk-input')?.value.trim();
  if(!raw){ toast('Paste data or upload CSV first','err'); return; }
  const parsed = parseBulkInput(raw);
  const cur = getStudents();
  let added=0, skipped=0, errors=0;
  parsed.forEach(function(p){
    if(p._error){ errors++; return; }
    // Check studentId uniqueness
    const sidLower=p.studentId.toLowerCase();
    const exists=Object.values(cur).some(function(s){return (s.studentId||'').toLowerCase()===sidLower;});
    if(exists){ skipped++; return; }
    const storageKey=p.studentId;
    if(cur[storageKey]){ skipped++; return; }
    cur[storageKey] = { studentId:p.studentId, name:p.name, password:p.password, batch:p.batch, active:true, accessType:p.accessType||'lum' };
    added++;
  });
  if(added > 0){
    putStudents(cur);
    const el = document.getElementById('bulk-input'); if(el) el.value='';
    const prev = document.getElementById('bulk-preview'); if(prev) prev.innerHTML='';
    toast(added+' students imported ✓ — click Download Updated App', 'ok');
  } else {
    toast('No students added'+(skipped?' — '+skipped+' duplicates skipped':'')+(errors?' — '+errors+' errors':''), 'err');
  }
  renderSetup();
}

// ── Download Updated App ──────────────────────────────────────────────────────
function downloadUpdatedApp(){
  const all   = getStudents();
  const count = Object.keys(all).length;
  if(count===0){ toast('Add students first','err'); return; }
  const json = JSON.stringify(all);
  try{
    let src = '<!DOCTYPE html>'+document.documentElement.outerHTML;
    // Find the EMBEDDED_STUDENTS declaration and replace it entirely.
    // Uses find+splice so it works regardless of what is currently baked in —
    // empty {}, one student, or a hundred. JSON values never contain bare
    // semicolons, so the first ; after the declaration is always the terminator.
    const marker = 'let EMBEDDED_STUDENTS';
    const start  = src.indexOf(marker);
    if(start === -1){ toast('Export marker not found','err'); return; }
    const end = src.indexOf(';', start) + 1;
    if(end === 0){ toast('Export marker end not found','err'); return; }
    src = src.slice(0, start) + 'let EMBEDDED_STUDENTS  = ' + json + ';' + src.slice(end);
    const blob = new Blob([src],{type:'text/html'});
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'CLARION.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 200);
    toast(count+' students baked in \u2713 \u2014 drag CLARION.html to Netlify','ok');
  } catch(e){ toast('Download error: '+e.message,'err'); }
}



// ── Credential test ───────────────────────────────────────────────────────────
function credentialTest(){
  const key  = document.getElementById('cred-test-student')?.value;
  const pw   = (document.getElementById('cred-test-pw')?.value || '');
  const resEl= document.getElementById('cred-test-result');
  if(!resEl) return;
  if(!key){   resEl.innerHTML='<span style="color:var(--gold)">⚠ Select a student first.</span>'; return; }
  if(!pw){    resEl.innerHTML='<span style="color:var(--gold)">⚠ Enter a password to test.</span>'; return; }

  // Identical sanitiser to login() — must stay in sync
  function sanitise(v){
    return v
      .replace(/[\u00AD\u200B-\u200D\uFEFF\u2060]/g,'')
      .replace(/[\u2018\u2019\u201A\u201B]/g,"'")
      .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
      .replace(/[\u00A0\u202F\u2009\u2008\u2007\u2006\u2005\u2004\u2003\u2002\u2001]/g,' ')
      .replace(/^[\r\n]+|[\r\n]+$/g,'');
  }

  const all = getStudents();
  const s   = all[key];
  if(!s){ resEl.innerHTML='<span style="color:var(--red)">✗ Student not found in data store.</span>'; return; }

  const storedPw  = sanitise(String(s.password||''));
  const enteredPw = sanitise(pw);
  const match     = storedPw === enteredPw;

  const sid  = s.studentId || key;
  const name = s.name || key;

  if(match){
    resEl.innerHTML =
      '<span style="color:var(--green);font-weight:600">✓ LOGIN WOULD PASS</span>' +
      ' &nbsp;·&nbsp; <span style="color:var(--muted)">'+name+' ('+sid+') — password matches stored record</span>';
  } else {
    resEl.innerHTML =
      '<span style="color:var(--red);font-weight:600">✗ LOGIN WOULD FAIL</span>' +
      ' &nbsp;·&nbsp; <span style="color:var(--muted)">'+name+' ('+sid+')</span><br>' +
      '<span style="color:var(--muted)">Stored password length: '+storedPw.length+' &nbsp;·&nbsp; Entered length: '+enteredPw.length+'</span><br>' +
      '<span style="color:var(--muted)">Stored (visible): <code style="background:var(--bg);padding:1px 5px;border-radius:3px;border:1px solid var(--border)">'+s.password+'</code></span>';
  }
}

// ── Generate Missing Student IDs — admin utility ──────────────────────────────
// Scans all students in the local store. For any student whose studentId is blank,
// numeric-only, or missing the AAA001/YY format, generates a new ID from their
// institution + batch data. Never overwrites a valid existing ID.
// Shows a modal summary: processed / generated / skipped / errors.
function generateMissingStudentIds(){
  const existing = getStudents();
  const entries  = Object.entries(existing);

  var processed = 0, generated = 0, skipped = 0;
  var errors = [];
  // Work on a snapshot copy to avoid mutation during iteration
  var updated = JSON.parse(JSON.stringify(existing));

  // We need to pass the growing `updated` map to the ID generator so serial
  // numbers within this batch don't collide with each other.
  entries.forEach(function([key, s]){
    processed++;
    var sid = (s.studentId || '').trim();

    // Already has a properly formatted CLARION ID — skip
    if(sid && /^[A-Z]{3}\d{3}\/\d{2}$/.test(sid)){
      skipped++;
      return;
    }

    // Blank, numeric-only, or malformed — generate a new one
    try{
      var newId = _generateClarionStudentId(
        s.institution || s._institution || '',
        s.batch       || '',
        updated       // pass growing map so serials are unique within this run
      );

      // Safety: if somehow there's a collision, keep trying with incremented serial
      var attempts = 0;
      while(
        Object.values(updated).some(function(x){ return x.studentId === newId; }) &&
        attempts < 100
      ){
        // Increment serial manually for retry
        var m = newId.match(/^([A-Z]{3})(\d+)\/(\d{2})$/);
        if(m) newId = m[1] + String(parseInt(m[2])+1).padStart(3,'0') + '/' + m[3];
        attempts++;
      }

      // If oldKey !== newId, we need to re-key the storage entry
      var oldKey = key;
      updated[newId] = Object.assign({}, updated[oldKey], { studentId: newId });
      if(oldKey !== newId) delete updated[oldKey];

      console.log('[CLARION] generateMissingIds: '+oldKey+' → '+newId
        +' ('+s.name+')');
      generated++;
    } catch(err){
      errors.push(s.name + ': ' + err.message);
      skipped++;
    }
  });

  if(generated > 0){
    putStudents(updated);
    loadRegistry();
  }

  // Show summary in modal
  var overlay = document.getElementById('overlay');
  var body    = document.getElementById('modal-body');
  if(!overlay || !body) return;
  body.innerHTML =
    '<div style="padding:24px 20px">'+
    '<div class="card-lbl" style="margin-bottom:12px">Generate Missing Student IDs — Summary</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">'+
      '<div style="padding:12px;background:var(--bg);border-radius:var(--r);border:1px solid var(--border);text-align:center">'+
        '<div style="font-family:var(--mono);font-size:1.4rem;color:var(--ink)">'+processed+'</div>'+
        '<div style="font-size:.72rem;color:var(--muted)">Total scanned</div>'+
      '</div>'+
      '<div style="padding:12px;background:var(--bg);border-radius:var(--r);border:1px solid var(--green);text-align:center">'+
        '<div style="font-family:var(--mono);font-size:1.4rem;color:var(--green)">'+generated+'</div>'+
        '<div style="font-size:.72rem;color:var(--muted)">IDs generated</div>'+
      '</div>'+
      '<div style="padding:12px;background:var(--bg);border-radius:var(--r);border:1px solid var(--border);text-align:center">'+
        '<div style="font-family:var(--mono);font-size:1.4rem;color:var(--muted)">'+skipped+'</div>'+
        '<div style="font-size:.72rem;color:var(--muted)">Skipped (had ID)</div>'+
      '</div>'+
      (errors.length ?
      '<div style="padding:12px;background:var(--bg);border-radius:var(--r);border:1px solid var(--red);text-align:center">'+
        '<div style="font-family:var(--mono);font-size:1.4rem;color:var(--red)">'+errors.length+'</div>'+
        '<div style="font-size:.72rem;color:var(--muted)">Errors</div>'+
      '</div>' : '')+
    '</div>'+
    (errors.length ?
      '<div style="font-family:var(--mono);font-size:.72rem;color:var(--red);margin-bottom:12px;max-height:120px;overflow-y:auto">'+
        errors.map(function(e){ return '• '+e; }).join('<br>')+
      '</div>' : '')+
    (generated > 0 ?
      '<p style="font-size:.82rem;color:var(--green);margin-bottom:12px">✓ '+generated+' IDs written to local student store.</p>' :
      '<p style="font-size:.82rem;color:var(--muted);margin-bottom:12px">No IDs needed generating — all students already have valid IDs.</p>')+
    '<button class="btn-primary" onclick="closeModal();renderSetup();">Done</button>'+
    '</div>';
  overlay.classList.add('on');
}

function getDiagInterpretation(score100){
  if(score100<=30) return {level:'C0 / Survival',track:'LUM',intervention:'Level 2',readiness:'Not placement ready',priority:'Basic language control and sentence completion'};
  if(score100<=50) return {level:'C1 / Emerging',track:'LUM + PI',intervention:'Level 2',readiness:'Early stage — requires foundational work',priority:'Structure, clarity, and professional tone'};
  if(score100<=70) return {level:'B1 / Functional',track:'PI + GD',intervention:'Level 1 + Level 2',readiness:'Approaching functional readiness — gaps remain',priority:'Evidence specificity and business reasoning'};
  if(score100<=85) return {level:'B2 / Placement Ready',track:'PI + GD',intervention:'Level 1 + selective Level 3',readiness:'Placement ready with targeted coaching',priority:'Composure, executive language, and interview precision'};
  return {level:'A / Recruiter Facing',track:'Premium Placement Coaching',intervention:'Level 4',readiness:'Recruiter-facing — calibration and polish only',priority:'High-stakes pressure rounds and advanced positioning'};
}

function buildDiagnosticReport(email){
  const subs=getDiagSubs(email);
  const totalScore=DIAGNOSTIC_BANK.reduce(function(a,q){return a+(subs[q.id]?parseFloat(subs[q.id].score||0):0);},0);
  const maxScore=DIAGNOSTIC_BANK.reduce(function(a,q){return a+q.maxScore;},0);
  const score100=maxScore>0?Math.round(totalScore/maxScore*100):0;
  const interp=getDiagInterpretation(score100);

  // Derive strengths and gaps from per-question feedback
  const allFeedback=DIAGNOSTIC_BANK.map(function(q){return subs[q.id]||null;}).filter(Boolean);
  const improvements=allFeedback.map(function(s){return s.improvement;}).filter(Boolean);
  const candoStatements=allFeedback.map(function(s){return s.cando_fb;}).filter(Boolean);

  // Score by question for pattern detection
  const highScoringQs=allFeedback.filter(function(s){return s.maxScore>0&&s.score/s.maxScore>=0.7;});
  const lowScoringQs=allFeedback.filter(function(s){return s.maxScore>0&&s.score/s.maxScore<0.5;});

  const completedDate=allFeedback.length>0?(allFeedback[allFeedback.length-1].date||new Date().toISOString().split('T')[0]):'—';

  return {email,score100,totalScore,maxScore,interp,allFeedback,improvements,candoStatements,highScoringQs,lowScoringQs,completedDate};
}

function buildDiagReportText(rpt, studentName){
  const lines=[];
  lines.push('CLARION — DIAGNOSTIC REPORT');
  lines.push('Communication Readiness Calibration');
  lines.push('Student: '+(studentName||rpt.email));
  lines.push('Date: '+rpt.completedDate);
  lines.push('═══════════════════════════════════════════');
  lines.push('');
  lines.push('TOTAL DIAGNOSTIC SCORE');
  lines.push(rpt.score100+' / 100  ('+rpt.totalScore+' of '+rpt.maxScore+' raw points)');
  lines.push('');
  lines.push('COMMUNICATION LEVEL');
  lines.push(rpt.interp.level);
  lines.push('');
  lines.push('PLACEMENT READINESS');
  lines.push(rpt.interp.readiness);
  lines.push('');
  lines.push('───────────────────────────────────────────');
  lines.push('');
  lines.push('MAIN STRENGTHS');
  if(rpt.highScoringQs.length>0){
    rpt.highScoringQs.slice(0,3).forEach(function(s){
      if(s.cando_fb) lines.push('· '+s.cando_fb);
    });
  } else {
    lines.push('· Communication readiness is at an early calibration stage. Strengths are emerging.');
  }
  lines.push('');
  lines.push('MAIN COMMUNICATION GAPS');
  if(rpt.lowScoringQs.length>0){
    rpt.lowScoringQs.slice(0,3).forEach(function(s){
      if(s.improvement) lines.push('· '+s.improvement);
    });
  } else {
    lines.push('· No critical gaps at this stage. Focus on consistency and precision.');
  }
  lines.push('');
  lines.push('───────────────────────────────────────────');
  lines.push('');
  lines.push('RECOMMENDED TRAINING TRACK');
  lines.push(rpt.interp.track);
  lines.push('');
  lines.push('RECOMMENDED INTERVENTION LEVEL');
  lines.push(rpt.interp.intervention);
  lines.push('');
  lines.push('PRIORITY IMPROVEMENT AREA');
  lines.push(rpt.interp.priority);
  lines.push('');
  lines.push('CAN-DO STATEMENT');
  if(rpt.candoStatements.length>0) lines.push(rpt.candoStatements[rpt.candoStatements.length-1]);
  else lines.push('Communication readiness is at baseline calibration level.');
  lines.push('');
  lines.push('═══════════════════════════════════════════');
  lines.push('');
  lines.push('QUESTION-BY-QUESTION SUMMARY');
  rpt.allFeedback.forEach(function(s){
    lines.push('');
    lines.push('Q'+s.qnum+': '+s.qtext);
    lines.push('Score: '+s.score+'/'+s.maxScore);
    if(s.feedback) lines.push('Feedback: '+s.feedback);
    if(s.improvement) lines.push('Improve: '+s.improvement);
  });
  lines.push('');
  lines.push('═══════════════════════════════════════════');
  lines.push('This report is temporary and will not be permanently stored.');
  lines.push('Please download or copy it now.');
  return lines.join('\n');
}

function downloadDiagReport(email, studentName){
  const rpt=buildDiagnosticReport(email);
  const text=buildDiagReportText(rpt, studentName||email);
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='CLARION_Diagnostic_Report_'+(studentName||email).replace(/\s+/g,'_')+'_'+rpt.completedDate+'.txt';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  toast('Diagnostic Report downloaded','ok');
}

function copyDiagReport(email, studentName){
  const rpt=buildDiagnosticReport(email);
  const text=buildDiagReportText(rpt, studentName||email);
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){toast('Report copied','ok');}).catch(function(){fallbackCopy(text);});
  } else {fallbackCopy(text);}
}

function renderDiagnosticReport(emailArg, studentNameArg){

    return;
  }
  const rpt=buildDiagnosticReport(email);
  const interp=rpt.interp;

  // Colour coding for level
  const levelColor=score<=30?'var(--red)':score<=50?'var(--gold)':score<=70?'var(--blue)':score<=85?'var(--green)':'var(--green)';

  // Strengths block

  if(rpt.highScoringQs.length>0){

      '</div>'+

  const plcBank=bank==='ppi'?'PlacementPI':'PlacementGD';
  const backNav=bank==='ppi'?'stu-ppi':'stu-pgd';
  const typeLabel=bank==='ppi'?'Placement PI':'Placement GD';

  await _runSubmit({
    proc,
    driveLabel: plcBank+'_q'+q.num+'_'+new Date().toISOString().split('T')[0],
    rubricPrompt: RUBRIC_PROMPT.replace('{COACH}','').replace('{CANDO}','').replace('{Q}',q.text).replace('{T}','{T}'),
    backBtn: '<div style="margin-top:14px"><button class="btn-secondary" data-nav="'+backNav+'" onclick="nav(this.dataset.nav)">← Back to '+typeLabel+'</button></div>',
    buildSub: function(result, transcript, driveLink){
      return {qid:q.id,qnum:q.num,qtext:q.text,type:bank==='ppi'?'PI':'GD',score:result.score||0,criteria:result.criteria||{},feedback:result.feedback||{},cando:result.cando||'',flag:result.flag||'needs_improvement',transcript,duration:S.recSecs,date:new Date().toISOString().split('T')[0],driveLink:driveLink||''};
    },
    storeFn: function(sub){
      if(bank==='ppi') putPPISub(S.user.email,q.id,sub);
      else putPGDSub(S.user.email,q.id,sub);
    },
    renderFn: function(sub){ return renderScoreHTML(sub, true); }
  });
}

function renderDemo(){

function startDemoSequence(){

function startDemoQuestion(idx){
  const q = DEMO_BANK[idx];
  if(!q) { renderDemoComplete(); return; }
  S.currentQ = q;
  S.currentBank = 'demo';
  S._demoIdx = idx;
  S.recorded = false; S.recording = false; S.recSecs = 0;
  S.recLimit = q.limit; S.audioBlob = null; S.audioEl = null;

  const isLast = (idx === DEMO_BANK.length - 1);
  const progress = (idx + 1) + ' / ' + DEMO_BANK.length;

  set(
    '<div class="ph">'+
      '<div class="ph-title">Demo</div>'+
      '<div class="ph-sub">Question '+progress+' · '+q.type+' · No data stored</div>'+
    '</div>'+
    '<div class="q-hero">'+
      '<span class="q-badge '+(q.type==='PI'?'q-pi':'q-gd')+'">'+q.type+' · Demo Q'+q.num+'</span>'+
      '<div class="q-text">'+q.text+'</div>'+
      '<div class="q-inst"><div class="q-inst-lbl">Instructions</div>'+

      '<div class="q-meta"><span>⏱ '+q.limit+'s max</span><span>🎬 Demo</span><span>🤖 AI scored</span></div>'+
    '</div>'+
    renderRecorderHTML().replace('doSubmitDaily()','submitDemoQuestion()')+
    '<div id="proc-area"></div>'+
    '<div class="banner banner-info" style="margin-top:12px"><span class="banner-ic">💡</span>'+
      '<div><div class="banner-sub">Your response will be scored by AI instantly. Nothing is saved.</div></div>'+
    '</div>'
  );
}

async function submitDemoQuestion(){
  if(!S.recorded && S.recSecs===0){ toast('Record first','err'); return; }
  const q = S.currentQ; if(!q) return;
  const btn = document.getElementById('btn-submit'); if(btn) btn.disabled = true;
  const proc = document.getElementById('proc-area');
  if(proc) proc.innerHTML = '<div class="loader"><div class="spinner"></div><div class="loader-txt">Scoring…</div></div>';
  await sleep(1500);
  const result = demoScore();
  const sub = {
    date: new Date().toISOString().split('T')[0],
    type: q.type, qno: q.num, qtext: q.text,
    score: result.score, criteria: result.criteria,
    feedback: result.feedback, cando: result.cando,
    flag: result.flag, duration: S.recSecs || 30
  };

  const nextIdx = (S._demoIdx || 0) + 1;
  const isLast  = nextIdx >= DEMO_BANK.length;
  const nextBtn = isLast
    ? '<button class="btn-primary" style="margin-top:14px" onclick="renderDemoComplete()">See Results →</button>'
    : '<button class="btn-primary" style="margin-top:14px" onclick="startDemoQuestion('+nextIdx+')">Next Question →</button>';

  const rec = document.getElementById('recorder'); if(rec) rec.style.display='none';
  if(proc) proc.innerHTML = renderScoreHTML(sub, true) + '<div style="margin-top:14px">' + nextBtn + '</div>';
  toast('Scored — no data saved', 'ok');
}

function renderAdminDiag(){
  if(S.role!=='admin' && S.role!=='trainer'){nav(_safeDefaultPage());return;}
  loadRegistry();
  purgeAllStaleDiag(); // enforce 7-day retention policy on load
  const emails=ALL_STUDENT_EMAILS;

  // Filter state
  const filterScore=window._diagFilterScore||'all';
  const filterLevel=window._diagFilterLevel||'all';

  // Build per-student diagnostic metadata
  const diagRows=emails.map(function(email){
    const u=getStudents()[email]||{name:email};
    const subs=getDiagSubs(email);
    const done=Object.keys(subs).length;
    const complete=DIAGNOSTIC_BANK.length>0&&done>=DIAGNOSTIC_BANK.length;
    const totalScore=DIAGNOSTIC_BANK.reduce(function(a,q){return a+(subs[q.id]?parseFloat(subs[q.id].score||0):0);},0);
    const maxScore=DIAGNOSTIC_BANK.reduce(function(a,q){return a+q.maxScore;},0);
    const score100=maxScore>0?Math.round(totalScore/maxScore*100):0;
    const interp=complete?getDiagInterpretation(score100):null;
    const lastDate=Object.values(subs).map(function(s){return s.date||'';}).sort().reverse()[0]||'—';
    return {email,name:u.name,done,complete,score100,totalScore,maxScore,interp,lastDate};
  });

  // Apply filters
  const SCORE_RANGES=[
    {k:'all',lbl:'All scores'},
    {k:'0-30',lbl:'0–30 (C0)'},
    {k:'31-50',lbl:'31–50 (C1)'},
    {k:'51-70',lbl:'51–70 (B1)'},
    {k:'71-85',lbl:'71–85 (B2)'},
    {k:'86-100',lbl:'86–100 (A)'},
  ];
  const LEVEL_FILTERS=[
    {k:'all',lbl:'All levels'},
    {k:'C0',lbl:'C0 / Survival'},
    {k:'C1',lbl:'C1 / Emerging'},
    {k:'B1',lbl:'B1 / Functional'},
    {k:'B2',lbl:'B2 / Placement Ready'},
    {k:'A',lbl:'A / Recruiter Facing'},
  ];

  let filtered=diagRows.filter(function(r){return r.complete;});
  if(filterScore!=='all'){
    const [lo,hi]=filterScore.split('-').map(Number);
    filtered=filtered.filter(function(r){return r.score100>=lo&&r.score100<=hi;});
  }
  if(filterLevel!=='all'){
    filtered=filtered.filter(function(r){return r.interp&&r.interp.level.startsWith(filterLevel);});
  }
  const incomplete=diagRows.filter(function(r){return !r.complete;});

  let html='<div class="ph"><div class="ph-title">Diagnostic Results</div>'+
    '<div class="ph-sub">Communication readiness calibration reports · 7-day retention only</div></div>';

  if(DIAGNOSTIC_BANK.length===0){
    html+='<div class="banner banner-warn"><span class="banner-ic">⚠️</span><div><div class="banner-title">No diagnostic questions yet</div><div class="banner-sub">Add diagnostic questions to the DIAGNOSTIC_BANK array in the code.</div></div></div>';
    set(html); return;
  }

  // Retention policy notice
  html+='<div class="banner banner-info"><span class="banner-ic">⏱</span><div>'+
    '<div class="banner-title">7-Day Retention Policy</div>'+
    '<div class="banner-sub">Diagnostic submissions are automatically purged after 7 days. Download reports before expiry. Audio and transcripts are not stored. This data exists for intervention planning and calibration only.</div>'+
  '</div></div>';

  // Filters
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">'+
    '<span style="font-family:var(--mono);font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">Filter by score:</span>'+
    SCORE_RANGES.map(function(f){return '<button class="pb-filter'+(filterScore===f.k?' on':'')+'" onclick="window._diagFilterScore=\''+f.k+'\';window._diagFilterLevel=window._diagFilterLevel||\'all\';renderAdminDiag()">'+f.lbl+'</button>';}).join('')+
    '<span style="font-family:var(--mono);font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-left:8px">Level:</span>'+
    LEVEL_FILTERS.map(function(f){return '<button class="pb-filter'+(filterLevel===f.k?' on':'')+'" onclick="window._diagFilterLevel=\''+f.k+'\';window._diagFilterScore=window._diagFilterScore||\'all\';renderAdminDiag()">'+f.lbl+'</button>';}).join('')+
  '</div>';

  // Completed students table
  html+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>Student</th><th>Score /100</th><th>Level</th><th>Track</th><th>Intervention</th><th>Last Submitted</th><th>Actions</th>'+
    '</tr></thead><tbody>'+
    (filtered.length>0?filtered.map(function(r){
      const scoreColor=r.score100<=30?'var(--red)':r.score100<=50?'var(--gold)':r.score100<=70?'var(--blue)':'var(--green)';
      const pill=r.score100<=30?'pill-lo':r.score100<=50?'pill-mid':'pill-hi';
      return '<tr>'+
        '<td style="font-weight:600;font-size:.85rem">'+r.name+'</td>'+
        '<td><span class="pill '+pill+'">'+r.score100+'</span></td>'+
        '<td style="font-family:var(--mono);font-size:.72rem;color:'+scoreColor+'">'+r.interp.level+'</td>'+
        '<td style="font-family:var(--mono);font-size:.72rem">'+r.interp.track+'</td>'+
        '<td style="font-family:var(--mono);font-size:.72rem">'+r.interp.intervention+'</td>'+
        '<td style="font-family:var(--mono);font-size:.72rem">'+r.lastDate+'</td>'+
        '<td style="display:flex;gap:5px;flex-wrap:nowrap">'+
          '<button class="btn-secondary" style="font-size:.7rem;padding:4px 9px;white-space:nowrap" '+
            'data-email="'+r.email+'" data-name="'+r.name+'" '+
            'onclick="renderDiagnosticReport(this.dataset.email,this.dataset.name)">View</button>'+
          '<button class="btn-secondary" style="font-size:.7rem;padding:4px 9px;white-space:nowrap" '+
            'data-email="'+r.email+'" data-name="'+r.name+'" '+
            'onclick="downloadDiagReport(this.dataset.email,this.dataset.name)">⬇</button>'+
        '</td>'+
      '</tr>';
    }).join(''):'<tr><td colspan="7" style="text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--muted);padding:24px">No completed diagnostics match your filters.</td></tr>')+
  '</tbody></table></div>';

  // Incomplete students
  if(incomplete.length>0){
    html+='<div class="card" style="margin-top:8px"><div class="card-lbl">In Progress / Not Started ('+incomplete.length+')</div>'+
      '<table class="tbl" style="margin:-4px"><thead><tr><th>Student</th><th>Questions Done</th><th>Status</th></tr></thead><tbody>'+
      incomplete.map(function(r){
        return '<tr>'+
          '<td style="font-weight:600;font-size:.85rem">'+r.name+'</td>'+
          '<td style="font-family:var(--mono);font-size:.8rem">'+r.done+' / '+DIAGNOSTIC_BANK.length+'</td>'+
          '<td>'+(r.done===0?
            '<span style="font-family:var(--mono);font-size:.7rem;color:var(--red)">Not started</span>':
            '<span style="font-family:var(--mono);font-size:.7rem;color:var(--gold)">In progress</span>')+
          '</td>'+
        '</tr>';
      }).join('')+
    '</tbody></table></div>';
  }

  set(html);
}

function renderAdminAdvPI(){
  if(S.role!=='admin' && S.role!=='trainer'){nav(_safeDefaultPage());return;}
  loadRegistry();
  const emails=ALL_STUDENT_EMAILS;
  // Build category groups
  const bycat={};
  ADV_PI_CATEGORIES.forEach(function(c){bycat[c]=[];});
  ADVANCED_PI_BANK.forEach(function(q){if(bycat[q.cat])bycat[q.cat].push(q);});

  // Access summary
  const placementStudents=emails.filter(function(e){return (getStudents()[e]?.accessType||'lum')==='placement';});
  const enabledCount=placementStudents.filter(function(e){return getAdvPIAccess(e);}).length;
  const eligibleCount=placementStudents.filter(function(e){return hasFoundationalPIDone(e);}).length;

  let html='<div class="ph"><div class="ph-title">Advanced PI Bank</div>'+
    '<div class="ph-sub">'+ADVANCED_PI_BANK.length+' questions · 5 categories · TELW PI Rubric · Trainer-controlled access</div></div>'+
    '<div class="card" style="background:var(--gold-bg);border-color:var(--gold);margin-bottom:16px">'+
      '<div class="card-lbl">Access Summary</div>'+
      '<div style="display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;margin-bottom:8px">'+
        '<span>PI/GD students: <strong>'+placementStudents.length+'</strong></span>'+
        '<span style="color:var(--green)">Access ON: <strong>'+enabledCount+'</strong></span>'+
        '<span style="color:var(--blue)">Eligible (16 PI done): <strong>'+eligibleCount+'</strong></span>'+
      '</div>'+
      '<div style="font-size:.82rem;color:var(--ink2)">Advanced PI is <strong>OFF by default</strong>. Toggle per student from the <button class="btn-secondary" style="font-size:.75rem;padding:3px 10px;margin:0 4px" onclick="nav(\'adm-students\')">Students</button> page.</div>'+
    '</div>';

  ADV_PI_CATEGORIES.forEach(function(cat){
    const qs=bycat[cat]||[];
    if(!qs.length)return;
    const col=ADV_PI_CAT_COLORS[cat]||'var(--muted)';
    html+='<div class="card" style="border-left:3px solid '+col+';margin-bottom:12px">'+
      '<div class="card-lbl" style="color:'+col+'">'+cat+'</div>'+
      qs.map(function(q){
        // completion count across all placement students
        const doneCount=placementStudents.filter(function(e){return !!getAdvPISubs(e)[q.id];}).length;
        return '<div class="pb-item">'+
          '<div style="flex:1">'+
            '<span style="font-family:var(--mono);font-size:.68rem;color:var(--dim)">API '+q.num+'</span>'+
            (placementStudents.length>0?'<span style="font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-left:8px">'+doneCount+'/'+placementStudents.length+' attempted</span>':'')+
            '<div class="pb-q" style="margin-top:5px">'+q.text+'</div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>';
  });
  set(html);
}

let toastTmr=null;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast on'+(type?' '+type:'');
  clearTimeout(toastTmr);toastTmr=setTimeout(()=>el.className='toast',3500);
}

window.onload=()=>{
  // ── Migrate old cs2 key → new clarion_students key (run once, then remove old key)
  try{
    const oldData = localStorage.getItem('cs2');
    const newData = localStorage.getItem(STUDENT_STORE_KEY);
    if(oldData && !newData){
      // Old store exists but new one doesn't — migrate
      const parsed = JSON.parse(oldData);
      // Old cs2 was a delta; merge with embedded to get full records
      const migrated = JSON.parse(JSON.stringify(EMBEDDED_STUDENTS));
      for(const key of Object.keys(parsed)){
        if(migrated[key]){
          // For embedded students, only migrate non-auth fields unless __pwChanged
          const adminFields = ['batch','accessType','startDate','active'];
          for(const f of adminFields){
            if(parsed[key][f] !== undefined) migrated[key][f] = parsed[key][f];
          }
          if(parsed[key].__pwChanged && parsed[key].password){
            migrated[key].password = parsed[key].password;
          }
        } else {
          migrated[key] = parsed[key];
        }
      }
      localStorage.setItem(STUDENT_STORE_KEY, JSON.stringify(migrated));
      localStorage.removeItem('cs2');
    }
  }catch(e){ console.warn('Migration error:', e); }

  // ── Seed student store if completely empty
  _seedStudentsIfEmpty();

  const k=sessionStorage.getItem('clarion_key');
  if(k){ S.apiKey=k; }  // key restored from session; set via trainer Setup panel
  try{const du=localStorage.getItem('clarion_drive_url');if(du)S.driveUrl=du;}catch(e){}  // restore Drive URL
  try{const su=localStorage.getItem('clarion_sheet_url');if(su)S.sheetUrl=su;}catch(e){}  // restore Sheet URL

  // Bootstrap cloud config on every page load.
  // Uses DEFAULT_AUTOOPS_URL if no local URL is stored — no manual setup needed.
  // Runs first so sheet URL, scoring URL, and drive URL are populated before
  // the background syncs below attempt to use them.
  setTimeout(async function(){
    try{ await _cloudConfigLoad(); }catch(e){ console.warn('[CLARION] Startup config load:', e.message); }
  }, 500);

  // Background sync on page load — silently refreshes student list from sheet
  // Does nothing if no sheet URL is configured.
  setTimeout(function(){ triggerSheetSync(true); }, 2000);
  // AutoOps background sync — silent, does nothing if URL not configured
  setTimeout(function(){ autoOpsSyncNow(true); }, 3000);
  const savedPw=localStorage.getItem('clarion_trainer_pw');
  if(savedPw)window.__trainerPw=savedPw;
  // ── Credential restore on load ───────────────────────────────────────────
  try{
    // Remove all legacy keys from previous implementations
    localStorage.removeItem('clarion_remembered_login');

    // Purge any stale trainer-role data or known demo/seed IDs
    var _STALE_IDS = ['stu001','STU001','demo@clarion.com','trainer@clarion.com',
                      'demo','Demo','DEMO','Clarion@2026','Demo@2026'];
    var _remRaw = localStorage.getItem('clarion_rem');
    if(_remRaw){
      try{
        var _remParsed = JSON.parse(_remRaw);
        var _isStale = !_remParsed || !_remParsed.id
          || _remParsed.role === 'trainer'  // trainer creds must never persist
          || _STALE_IDS.indexOf(_remParsed.id) !== -1
          || _STALE_IDS.indexOf((_remParsed.id||'').toUpperCase()) !== -1;
        if(_isStale){
          localStorage.removeItem('clarion_rem');
          localStorage.removeItem('clarion_rem_pw');
        }
      }catch(e){ localStorage.removeItem('clarion_rem'); localStorage.removeItem('clarion_rem_pw'); }
    }

    // Set trainer username visible by default (trainer tab is default)
    var _emailEl = document.getElementById('a-email');
    if(_emailEl && authRole === 'trainer') _emailEl.value = TRAINER_EMAIL;
    _showRememberRow(false); // hidden on trainer tab by default

    // If valid student creds exist, applyRememberedLogin switches to student tab
    applyRememberedLogin();
  }catch(e){ console.warn('Credential restore error:', e); }
  // Enforce 7-day diagnostic retention policy on startup
  try{loadRegistry();purgeAllStaleDiag();}catch(e){}
  // Attach hidden admin long-press trigger to both logo elements
  try{_initAdminTrigger();}catch(e){}
};
