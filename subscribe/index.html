<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClarionPrep · Product access</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>:root{--n:#102a43;--b:#1f5f91;--g:#c17a13;--t:#243b53;--m:#6b7c8e;--l:#dce5ec;--bg:#f3f6f8;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:30px 20px}.shell{width:min(760px,calc(100% - 30px));margin:auto}h1{margin:0 0 7px}.lead{margin:0;color:#dbe7f1}.card{margin:24px auto;background:#fff;border:1px solid var(--l);border-radius:16px;padding:24px;box-shadow:0 12px 36px rgba(16,42,67,.07)}label{display:block;font-size:12px;font-weight:800;color:var(--n);margin:12px 0 6px}input{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:9px;font:inherit}.btn{display:inline-block;border:0;border-radius:9px;padding:12px 15px;background:var(--n);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.gold{background:var(--g)}.btn.soft{background:#edf3f8;color:var(--n)}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.status{min-height:20px;margin-top:12px;font-size:13px}.error{color:var(--bad)}.success{color:var(--ok)}.product h2{margin:0;color:var(--n)}.price{font-size:36px;font-weight:900;color:var(--n);margin:12px 0 4px}.meta{color:var(--m);line-height:1.6}.soon{font-size:24px;font-weight:900;color:var(--g);margin:16px 0 8px}.note{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f7f9fb;color:var(--m);font-size:13px;line-height:1.55}</style></head><body><header><div class="shell"><h1>ClarionPrep access</h1><p class="lead">Pay securely through Razorpay, then continue straight to the app.</p></div></header><main class="shell"><section class="card product"><h2 id="name">Loading product…</h2><div id="price" class="price">—</div><div id="meta" class="meta"></div><div id="soon" class="soon hidden">Coming soon</div><div id="fields"><label>Your full name</label><input id="fullName" autocomplete="name"><label>Email</label><input id="email" type="email" autocomplete="email"><label>Mobile number</label><input id="mobile" autocomplete="tel"></div><div class="note" id="note">Access is tied to this browser/device. Paid access cannot be shared to another device.</div><div class="actions"><button id="pay" class="btn gold" disabled>Continue to Razorpay</button><a id="back" class="btn soft" href="/">Back to ClarionPrep</a></div><div id="status" class="status"></div></section></main><script>const API='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-commerce',$=id=>document.getElementById(id),wanted=(new URLSearchParams(location.search).get('product')||'').toUpperCase();let product=null;function status(msg,type=''){const e=$('status');e.textContent=msg||'';e.className='status'+(type?' '+type:'')}function deviceId(){let d=localStorage.getItem('clarion_device_v1');if(!d){const a=new Uint8Array(24);crypto.getRandomValues(a);d=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('clarion_device_v1',d)}return d}async function call(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.message||'Request failed.');return d}function comingSoon(){document.title='ClarionPrep · Presentation Skills';$('name').textContent='Presentation Skills';$('price').textContent='';$('meta').textContent='This course is still being completed. Public access will open when it is ready.';$('soon').classList.remove('hidden');$('fields').classList.add('hidden');$('note').classList.add('hidden');$('pay').classList.add('hidden')}async function load(){if(wanted==='PRESENTATION'){comingSoon();return}try{if(!wanted)throw Error('Choose a ClarionPrep product from the main page.');const d=await call('CATALOG');product=d.products.find(x=>x.code===wanted);if(!product)throw Error('This product is not currently available.');$('name').textContent=product.display_name;$('price').textContent='₹'+(product.amount_paise/100).toLocaleString('en-IN');$('meta').textContent=product.code==='CAT_SIMULATOR'?`1 attempt · access valid for up to ${product.duration_days} days.`:`Up to 20 hours of AI-active use or ${product.duration_days} days, whichever comes first.`;$('pay').disabled=false}catch(e){status(e.message,'error')}}function launch(url,token){const u=new URL(url,location.origin);u.searchParams.set('clarion_token',token);u.searchParams.set('clarion_device',deviceId());u.searchParams.set('clarion_product',product.code);location.href=u.toString()}$('pay').onclick=async()=>{if(!product)return;const name=$('fullName').value.trim(),email=$('email').value.trim().toLowerCase(),mobile=$('mobile').value.trim();if(name.length<2||!email.includes('@')||mobile.length<8){status('Enter your name, email and mobile number.','error');return}status('Opening secure payment…');$('pay').disabled=true;try{const o=await call('CREATE_ORDER',{product_code:product.code,full_name:name,email,mobile,device_id:deviceId()});const rz=new Razorpay({key:o.razorpay_key_id,amount:o.amount_paise,currency:o.currency,name:'ClarionPrep',description:o.display_name,order_id:o.razorpay_order_id,prefill:{name,email,contact:mobile},handler:async p=>{try{status('Payment received. Opening your app…','success');const v=await call('VERIFY',{payment_order_uuid:o.payment_order_uuid,razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature});localStorage.setItem('clarion_entitlement_'+product.code,v.entitlement_token);launch(v.launch_url,v.entitlement_token)}catch(e){status(e.message,'error')}}});rz.on('payment.failed',()=>status('Payment was not completed.','error'));rz.open()}catch(e){status(e.message,'error')}finally{$('pay').disabled=false}};load();</script></body></html>
