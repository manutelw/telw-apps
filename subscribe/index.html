<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClarionPrep · Product access</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>:root{--n:#102a43;--b:#1f5f91;--g:#c17a13;--t:#243b53;--m:#6b7c8e;--l:#dce5ec;--bg:#f3f6f8;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:30px 20px}.shell{width:min(960px,calc(100% - 30px));margin:auto}h1{margin:0 0 7px}.lead{margin:0;color:#dbe7f1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:22px;box-shadow:0 12px 36px rgba(16,42,67,.07)}label{display:block;font-size:12px;font-weight:800;color:var(--n);margin:12px 0 6px}input{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}.btn.gold{background:var(--g)}.btn.soft{background:#edf3f8;color:var(--n)}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.hidden{display:none!important}.status{min-height:20px;margin-top:11px;font-size:13px}.error{color:var(--bad)}.success{color:var(--ok)}.product h2{margin:0;color:var(--n)}.price{font-size:34px;font-weight:900;color:var(--n);margin:12px 0 4px}.meta{color:var(--m);line-height:1.5}.account{font-size:13px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="shell"><h1>ClarionPrep access</h1><p class="lead">Create one account, pay securely, and use your product until its time or usage limit is reached.</p></div></header><main class="shell"><div class="grid">
<section class="card" id="authCard"><h2>ClarionPrep account</h2><p class="account">Sign in, or create an account if this is your first purchase.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password"><div class="actions"><button class="btn" id="login">Sign in</button><button class="btn soft" id="signup">Create account</button></div><div id="authStatus" class="status"></div></section>
<section class="card product"><h2 id="name">Loading product…</h2><div id="price" class="price">—</div><div id="meta" class="meta"></div><label>Your full name</label><input id="fullName" autocomplete="name"><label>Mobile number (optional)</label><input id="mobile" autocomplete="tel"><div class="actions"><button id="pay" class="btn gold" disabled>Pay securely</button><button id="open" class="btn hidden">Open product</button><button id="logout" class="btn soft hidden">Sign out</button></div><div id="payStatus" class="status"></div></section>
</div></main><script>
const SUPABASE_URL='https://vtqatrhwfvzyodiftvkc.supabase.co',KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',API=SUPABASE_URL+'/functions/v1/clarion-product-commerce',ACCESS=SUPABASE_URL+'/functions/v1/clarion-product-access';
const db=supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),wanted=(new URLSearchParams(location.search).get('product')||'PCL').toUpperCase();let product=null,session=null;
function setStatus(id,msg,type=''){const e=$(id);e.textContent=msg||'';e.className='status'+(type?' '+type:'')}
async function call(action,body={},token=''){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed.');return d}
async function access(){if(!session||!product)return false;const r=await fetch(ACCESS,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'CHECK',product_code:product.code})}),d=await r.json().catch(()=>({}));if(r.ok&&d.ok){$('pay').classList.add('hidden');$('open').classList.remove('hidden');setStatus('payStatus',`Access active until ${new Date(d.expires_at).toLocaleDateString('en-IN')}.`,'success');return true}return false}
function launch(){if(!session||!product)return;location.href=product.launch_url+'#clarion_access='+encodeURIComponent(session.access_token)}
async function refresh(){const {data}=await db.auth.getSession();session=data.session||null;$('logout').classList.toggle('hidden',!session);$('pay').disabled=!session||!product;if(session){$('authCard').classList.add('hidden');await access()}else $('authCard').classList.remove('hidden')}
async function load(){try{const d=await call('CATALOG'),p=d.products.find(x=>x.code===wanted);if(!p)throw Error('This product is not currently available.');product=p;$('name').textContent=p.display_name;$('price').textContent='₹'+(p.amount_paise/100).toLocaleString('en-IN');$('meta').textContent=`${p.duration_days} days · ${p.usage_limit===null?p.usage_label:`up to ${p.usage_limit} ${p.usage_label}`}. Access ends when the first applicable limit is reached.`;await refresh()}catch(e){setStatus('payStatus',e.message,'error')}}
$('login').onclick=async()=>{setStatus('authStatus','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error)setStatus('authStatus',error.message,'error');else await refresh()};
$('signup').onclick=async()=>{setStatus('authStatus','Creating account…');const {data,error}=await db.auth.signUp({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error)setStatus('authStatus',error.message,'error');else if(!data.session)setStatus('authStatus','Account created. Check your email, verify it, then sign in.','success');else await refresh()};
$('pay').onclick=async()=>{if(!session||!product)return;setStatus('payStatus','Preparing secure payment…');$('pay').disabled=true;try{const o=await call('CREATE_ORDER',{product_code:product.code,full_name:$('fullName').value.trim(),mobile:$('mobile').value.trim()},session.access_token);const rz=new Razorpay({key:o.razorpay_key_id,amount:o.amount_paise,currency:o.currency,name:'ClarionPrep',description:product.display_name,order_id:o.razorpay_order_id,prefill:{email:session.user.email,name:$('fullName').value.trim(),contact:$('mobile').value.trim()},handler:async p=>{try{setStatus('payStatus','Confirming payment…');await call('VERIFY',{payment_order_uuid:o.payment_order_uuid,razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature},session.access_token);await access()}catch(e){setStatus('payStatus',e.message,'error')}}});rz.on('payment.failed',()=>setStatus('payStatus','Payment was not completed.','error'));rz.open()}catch(e){setStatus('payStatus',e.message,'error')}finally{$('pay').disabled=false}};
$('open').onclick=launch;$('logout').onclick=async()=>{await db.auth.signOut();session=null;location.reload()};load();
</script></body></html>
