<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClarionPrep · Secure payment</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>:root{--n:#17395d;--b:#4d78a4;--g:#d2a04d;--t:#243b53;--m:#6b7c8e;--l:#dce5ec;--bg:#f6f8fa;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:#fff;border-bottom:1px solid var(--l);padding:22px 20px}.brand{font-size:25px;font-weight:800;color:var(--n)}.brand span{color:var(--g)}.shell{width:min(760px,calc(100% - 30px));margin:auto}.card{margin:34px auto;background:#fff;border:1px solid var(--l);border-radius:18px;padding:28px;box-shadow:0 16px 42px rgba(23,57,93,.08)}.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:900;color:var(--g)}h1{margin:7px 0 6px;color:var(--n)}.price{font-size:38px;font-weight:900;color:var(--n);margin:16px 0 6px}.meta{color:var(--m);line-height:1.6}.who{margin-top:18px;padding:14px;border-radius:12px;background:#f7fafc;color:var(--m);font-size:13px}.btn{display:inline-block;border:0;border-radius:10px;padding:13px 16px;background:var(--n);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.gold{background:linear-gradient(135deg,#e0b35c,#c99234);color:#17283c}.btn.soft{background:#edf3f8;color:var(--n)}.btn:disabled{opacity:.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.status{min-height:20px;margin-top:12px;font-size:13px}.error{color:var(--bad)}.success{color:var(--ok)}.soon{font-size:24px;font-weight:900;color:var(--g);margin:16px 0 8px}</style></head><body><header><div class="shell"><div class="brand">Clarion<span>Prep</span></div></div></header><main class="shell"><section class="card"><div class="eyebrow">Secure access</div><h1 id="name">Loading product…</h1><div id="price" class="price">—</div><div id="meta" class="meta"></div><div id="soon" class="soon hidden">Coming soon</div><div id="who" class="who">Checking your account…</div><div class="actions"><button id="pay" class="btn gold" disabled>Continue to Razorpay</button><a class="btn soft" href="/">Back</a></div><div id="status" class="status"></div></section></main><script>const COMMERCE='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-commerce',AUTH='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-auth',$=id=>document.getElementById(id),wanted=(new URLSearchParams(location.search).get('product')||'').toUpperCase();let product=null,user=null;function deviceId(){let d=localStorage.getItem('clarion_device_v1');if(!d){const a=new Uint8Array(24);crypto.getRandomValues(a);d=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('clarion_device_v1',d)}return d}function status(msg,type=''){const e=$('status');e.textContent=msg||'';e.className='status'+(type?' '+type:'')}async function call(url,action,body={}){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.message||'Request failed.');return d}function launch(url,token){const u=new URL(url,location.origin);u.searchParams.set('clarion_token',token);u.searchParams.set('clarion_device',deviceId());u.searchParams.set('clarion_product',product.code);location.href=u.toString()}function description(p){if(p.code==='CAT_SIMULATOR')return 'One full attempt.';if(p.code==='WCT')return 'One assessment and report.';if(p.code==='PI_PRACTICE'||p.code==='GD_PRACTICE'||p.code==='DIALOGUE_LAB')return p.duration_days+' days or '+p.usage_limit+' completed sessions, whichever comes first.';if(p.code==='PI_LAB'||p.code==='GD_LAB')return '3 complete lab sessions.';if(p.code==='LIVE_MOCK')return 'One complete AI mock interview and report.';if(p.code==='PCL')return '30 days access. Modules included.';if(p.code==='PLACEMENT_PASS')return 'One WCT · one CAT attempt · 10 PI practices · 10 GD practices · one AI Live Mock · 30-day validity.';return p.duration_days+' days access.'}async function load(){const session=localStorage.getItem('clarion_public_session');if(!session){location.replace('/account/?product='+encodeURIComponent(wanted));return}try{const s=await call(AUTH,'SESSION',{session_token:session,device_id:deviceId()});user=s.user;$('who').textContent='Signed in as '+user.full_name+' · '+user.email;if(wanted==='PRESENTATION'){document.title='ClarionPrep · Presentation Skills';$('name').textContent='Presentation Skills';$('price').textContent='';$('meta').textContent='Public access will open when the course is ready.';$('soon').classList.remove('hidden');$('pay').classList.add('hidden');return}const d=await call(COMMERCE,'CATALOG');product=d.products.find(x=>x.code===wanted);if(!product)throw Error('This product is not currently available.');$('name').textContent=product.display_name;$('price').textContent='₹'+(product.amount_paise/100).toLocaleString('en-IN');$('meta').textContent=description(product);$('pay').disabled=false}catch(e){if(String(e.message).includes('log in')){localStorage.removeItem('clarion_public_session');location.replace('/account/?product='+encodeURIComponent(wanted));return}status(e.message,'error')}}$('pay').onclick=async()=>{if(!product||!user)return;status('Opening secure payment…');$('pay').disabled=true;try{const o=await call(COMMERCE,'CREATE_ORDER',{product_code:product.code,full_name:user.full_name,email:user.email,mobile:user.mobile||'',device_id:deviceId(),account_session:localStorage.getItem('clarion_public_session')});const rz=new Razorpay({key:o.razorpay_key_id,amount:o.amount_paise,currency:o.currency,name:'ClarionPrep',description:o.display_name,order_id:o.razorpay_order_id,prefill:{name:user.full_name,email:user.email,contact:user.mobile||''},handler:async p=>{try{status('Payment verified. Opening your app…','success');const v=await call(COMMERCE,'VERIFY',{payment_order_uuid:o.payment_order_uuid,razorpay_payment_id:p.razorpay_payment_id,razorpay_order_id:p.razorpay_order_id,razorpay_signature:p.razorpay_signature});localStorage.setItem('clarion_entitlement_'+product.code,v.entitlement_token);launch(v.launch_url,v.entitlement_token)}catch(e){status(e.message,'error')}}});rz.on('payment.failed',()=>status('Payment was not completed.','error'));rz.open()}catch(e){status(e.message,'error')}finally{$('pay').disabled=false}};load();</script></body></html>
