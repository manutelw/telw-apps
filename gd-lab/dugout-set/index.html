<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GD DUGOUT Practice · ClarionPrep</title><style>:root{--n:#0e2344;--b:#2458d7;--ink:#172033;--mut:#667085;--line:#dfe5ee;--bg:#eef2f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--n);color:#fff;padding:18px 24px}header b{font-size:20px}.wrap{max-width:920px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.pill{display:inline-block;background:#eef3ff;color:#1d4cb5;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.muted{color:var(--mut);font-size:13px;line-height:1.5}.topics{display:grid;gap:10px;margin-top:14px}.topicbtn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);padding:14px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.topicbtn:hover{border-color:#9bb8db;background:#f8fbff}.status{padding:11px 13px;background:#fff6dd;border-radius:9px;margin-top:12px}.hidden{display:none!important}.footer{text-align:center;color:#8a94a4;font-size:12px;padding:14px}</style></head><body><header><b>ClarionPrep GD Lab · DUGOUT Practice</b></header><div class="wrap"><section class="card"><span class="pill">SELECT YOUR GD TOPIC</span><h2 id="setTitle" style="margin-bottom:4px"></h2><div id="setRole" class="muted"></div><div id="topicList" class="topics"></div><div id="setError" class="status hidden"></div></section></div><div class="footer">TELW The English Workshop · ClarionPrep</div><script>const params=new URLSearchParams(location.search);function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function decodeSet(v){try{let s=v.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}const data=decodeSet(params.get('set')||'');const setTitle=document.getElementById('setTitle'),setRole=document.getElementById('setRole'),topicList=document.getElementById('topicList'),setError=document.getElementById('setError');if(!data||!Array.isArray(data.topics)||!data.topics.length){setError.textContent='This GD practice link is incomplete or invalid.';setError.classList.remove('hidden')}else{setTitle.textContent=data.company||'GD DUGOUT Practice';setRole.textContent=data.role?('Role: '+data.role):'';topicList.innerHTML=data.topics.slice(0,10).map((t,i)=>'<button class="topicbtn" data-i="'+i+'">'+esc(t)+'</button>').join('');topicList.querySelectorAll('button').forEach(b=>b.onclick=()=>selectTopic(Number(b.dataset.i)))}function selectTopic(i){const topic=String(data.topics[i]||'').trim();if(!topic)return;location.href='../dugout/?topic='+encodeURIComponent(topic)}</script></body></html>
