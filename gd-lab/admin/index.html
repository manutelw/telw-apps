<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD Lab · ClarionPrep</title>
<style>
:root{--navy:#0e2344;--blue:#2458d7;--ink:#172033;--muted:#667085;--line:#dfe5ee;--bg:#eef2f7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:#fff;padding:18px 24px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.intro,.player{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.intro h1{margin:0 0 6px;font-size:24px}.intro p,.muted{color:var(--muted)}.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topic{width:100%;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;font:inherit}.topic:hover,.topic:focus-visible{border-color:var(--blue);box-shadow:0 0 0 2px rgba(36,88,215,.08)}.topic strong{display:block;font-size:15px;line-height:1.35}.topic span{display:block;margin-top:7px;color:var(--muted);font-size:12px}.player[hidden]{display:none}.player h2{margin:0 0 5px}.turn{padding:12px 14px;margin:10px 0;border:1px solid var(--line);border-radius:11px;background:#fbfdff}.turn b{color:var(--navy)}.turn p{margin:5px 0 0;line-height:1.5}.status{padding:14px;border-radius:11px;background:#fff;color:var(--muted)}.error{color:#b42318;background:#fff0ee;border:1px solid #f2c7c1}.play{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.back{display:inline-block;margin-top:10px;color:var(--blue);font-weight:700;text-decoration:none}@media(max-width:700px){.topics{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>ClarionPrep GD Lab — Admin</b></header>
<div class="wrap">
<section class="intro"><h1>Choose a GD topic</h1><p>Click a topic to hear the simulated group discuss it.</p></section>
<div id="statusBox" class="status">Loading topics…</div>
<div id="topicList" class="topics" hidden></div>
<section id="player" class="player" hidden>
  <h2 id="playerTitle"></h2><div id="playerContext" class="muted"></div>
  <div id="playerStatus" class="status">Preparing the group…</div>
  <div id="turns"></div>
  <button id="playAgain" class="play" type="button" hidden>Play discussion</button>
</section>
<a class="back" href="/ascent/admin-settings.html">← Back to Admin Hub</a>
</div>
<script>
(()=>{
const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/telw-gd-admin';
const KEYS=['ascent_admin_master_session','ascent_trainer_session'];
const el=id=>document.getElementById(id);let session=null,currentAudios=[];
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function getSession(){for(const key of KEYS){try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&x.sessionToken&&String(x.role||'').toUpperCase()==='ADMIN'&&new Date(x.expiresAt).getTime()>Date.now())return x}catch{}}return null}
async function api(action,data,timeout=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-ASCENT-ADMIN-SESSION':session.sessionToken},body:JSON.stringify(Object.assign({action},data||{})),signal:c.signal});const j=await r.json().catch(()=>({}));if(r.status===401)throw Error('Your administrator session has expired. Return to the Admin Hub and sign in again.');if(!r.ok)throw Error(j.error||'GD Lab request failed.');return j}finally{clearTimeout(t)}}
function showError(msg){el('statusBox').className='status error';el('statusBox').textContent=msg}
async function loadTopics(){session=getSession();if(!session){showError('GD Lab could not find a valid administrator session.');return}try{const j=await api('topic_list',{});el('statusBox').hidden=true;el('topicList').hidden=false;el('topicList').innerHTML=(j.topics||[]).map(x=>'<button class="topic" type="button" data-id="'+x.id+'"><strong>'+esc(x.title)+'</strong><span>Difficulty '+x.difficulty+'/5</span></button>').join('');el('topicList').querySelectorAll('.topic').forEach(b=>b.addEventListener('click',()=>openTopic(b.dataset.id,b.querySelector('strong').textContent)))}catch(e){showError(e.name==='AbortError'?'GD Lab took too long to load.':e.message)}}
async function openTopic(id,title){stopAll();el('player').hidden=false;el('playerTitle').textContent=title;el('playerContext').textContent='';el('turns').innerHTML='';el('playAgain').hidden=true;el('playerStatus').className='status';el('playerStatus').textContent='Preparing the group discussion…';el('player').scrollIntoView({behavior:'smooth',block:'start'});try{const j=await api('preview_topic',{topic_id:id},45000);el('playerTitle').textContent=j.topic.title;el('playerContext').textContent=j.topic.context||'';renderTurns(j.turns||[]);el('playerStatus').textContent='';el('playerStatus').hidden=true;await playSequence()}catch(e){el('playerStatus').hidden=false;el('playerStatus').className='status error';el('playerStatus').textContent=e.name==='AbortError'?'The group took too long to prepare. Please click the topic again.':e.message}}
function renderTurns(items){currentAudios=[];el('turns').innerHTML=items.map((x,i)=>'<div class="turn"><b>'+esc(x.speaker)+'</b><p>'+esc(x.text)+'</p></div>').join('');items.forEach(x=>{if(x.audio)currentAudios.push(new Audio('data:audio/mpeg;base64,'+x.audio))});el('playAgain').hidden=currentAudios.length===0}
function stopAll(){currentAudios.forEach(a=>{try{a.pause();a.currentTime=0}catch{}})}
async function playSequence(){if(!currentAudios.length)return;stopAll();for(const a of currentAudios){await new Promise((resolve,reject)=>{a.onended=resolve;a.onerror=reject;const p=a.play();if(p&&p.catch)p.catch(reject)}).catch(()=>{throw Error('Playback was blocked by the browser. Use Play discussion.')})}}
el('playAgain').addEventListener('click',()=>playSequence().catch(()=>{}));loadTopics();
})();
</script>
</body></html>
