<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GD Lab Admin · ClarionPrep</title><style>:root{--n:#0e2344;--b:#2458d7;--ink:#172033;--mut:#667085;--line:#dfe5ee;--bg:#eef2f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--n);color:#fff;padding:18px 24px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}button{border:0;border-radius:9px;padding:11px 15px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 12px;font:inherit}label{font-size:13px;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.muted{color:var(--mut);font-size:13px}.topic,.session{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checks label{font-weight:400}audio{width:100%;margin-top:10px}.error{color:#b42318;background:#fff0ee;border:1px solid #f2c7c1;border-radius:10px;padding:12px}.recording-slot{margin-top:10px}.recording-slot button{padding:8px 12px;font-size:13px}.retry-link{display:inline-block;margin-top:10px;color:#2458d7;font-weight:700;text-decoration:none}@media(max-width:650px){.row{display:block}.checks{grid-template-columns:1fr}}</style></head><body><header><b>ClarionPrep GD Lab — Admin</b></header><div class="wrap"><div id="statusBox" class="muted">Loading GD Lab…</div><div id="dash" hidden><div class="card"><h2>Post a GD topic</h2><label>Topic statement</label><textarea id="nt"></textarea><label>Context / angles</label><textarea id="nc"></textarea><label>Difficulty</label><select id="nd"><option>3</option><option>4</option><option>2</option><option>5</option><option>1</option></select><button id="postTopicButton" type="button">Post topic</button></div><div class="card"><h2>Create assignment</h2><div class="row"><div><label>Name</label><input id="an"></div><div><label>Student access code</label><input id="ac"></div></div><div class="row"><div><label>Mode</label><select id="am"><option value="practice">Practice</option><option value="assessed">Assessed</option></select></div><div><label>Student contributions</label><select id="au"><option>4</option><option>3</option><option>5</option><option>6</option></select></div></div><div id="checks" class="checks"></div><br><button id="createAssignmentButton" type="button">Create assignment</button></div><div class="card"><h2>Pre-fed topics</h2><div id="tt"></div></div><div class="card"><h2>Assignments</h2><div id="ta"></div></div><div class="card"><h2>Recent sessions & recordings</h2><div id="ts"></div></div></div></div><script>(()=>{const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/telw-gd-admin';const KEY='ascent_admin_master_session';const FALLBACK_KEY='ascent_trainer_session';const byId=id=>document.getElementById(id);const statusBox=byId('statusBox'),dash=byId('dash'),tt=byId('tt'),ta=byId('ta'),ts=byId('ts'),checks=byId('checks'),nt=byId('nt'),nc=byId('nc'),nd=byId('nd'),an=byId('an'),ac=byId('ac'),am=byId('am'),au=byId('au');let adminSession=null;function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function showError(message){statusBox.className='error';statusBox.innerHTML=esc(message)+'<br><a class="retry-link" href="/ascent/admin-settings.html">Return to Admin Hub</a>'}function getAdminSession(){for(const key of[KEY,FALLBACK_KEY]){try{const raw=localStorage.getItem(key);if(!raw)continue;const x=JSON.parse(raw);if(!x||!x.sessionToken||String(x.role||'').toUpperCase()!=='ADMIN')continue;const t=new Date(x.expiresAt).getTime();if(!Number.isFinite(t)||t<=Date.now())continue;return x}catch{}}return null}async function api(action,data){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-ASCENT-ADMIN-SESSION':adminSession.sessionToken},body:JSON.stringify(Object.assign({action},data||{})),signal:controller.signal});const j=await r.json().catch(()=>({}));if(r.status===401)throw Error('Your administrator session has expired. Please return to the Admin Hub and sign in again.');if(!r.ok)throw Error(j.error||'GD Lab request failed.');return j}catch(err){if(err&&err.name==='AbortError')throw Error('GD Lab did not respond within 12 seconds. Please return to the Admin Hub and reopen it.');throw err}finally{clearTimeout(timer)}}function renderSessions(items){ts.innerHTML=items.length?items.map(x=>'<div class="session"><b>'+esc(x.student_name)+' ('+esc(x.roll_no)+')</b><div class="muted">'+esc(x.topic_title)+'</div><div>'+(x.score?'Score '+x.score.total+'/25 • Next Fix: '+esc(x.next_fix):'In progress')+'</div>'+(x.has_recording?'<div class="recording-slot" id="rec-'+x.id+'"><button type="button" data-recording="'+x.id+'">Play full GD recording</button></div>':'<div class="muted">No full recording saved for this session.</div>')+'</div>').join(''):'No sessions yet.';ts.querySelectorAll('[data-recording]').forEach(btn=>btn.addEventListener('click',()=>playRecording(btn.dataset.recording,btn)))}async function loadDash(){adminSession=getAdminSession();if(!adminSession){showError('GD Lab could not find a valid administrator session.');return}try{statusBox.className='muted';statusBox.textContent='Loading GD Lab…';const j=await api('trainer_state',{});dash.hidden=false;statusBox.textContent='';tt.innerHTML=(j.topics||[]).map(x=>'<div class="topic"><b>'+esc(x.title)+'</b><div class="muted">Difficulty '+x.difficulty+'/5</div><div class="muted">'+esc(x.context)+'</div></div>').join('');checks.innerHTML=(j.topics||[]).map(x=>'<label><input style="width:auto" type="checkbox" name="cx" value="'+x.id+'"> '+esc(x.title)+'</label>').join('');ta.innerHTML=(j.assignments||[]).map(x=>'<div class="topic"><b>'+esc(x.name)+'</b><div>Code <b>'+esc(x.access_code)+'</b> • '+esc(x.mode)+' • '+x.student_turns+' student turns</div></div>').join('');renderSessions(j.sessions||[])}catch(err){showError(err.message||'GD Lab could not be opened.')}}async function playRecording(id,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Loading recording…';try{const j=await api('trainer_recording_url',{session_id:id});const slot=byId('rec-'+id);slot.innerHTML='<audio controls autoplay preload="metadata" src="'+esc(j.url)+'"></audio>'}catch(err){btn.disabled=false;btn.textContent=old;alert(err.message)}}async function addTopic(){try{await api('trainer_add_topic',{title:nt.value.trim(),context:nc.value.trim(),difficulty:Number(nd.value)});nt.value='';nc.value='';await loadDash()}catch(err){showError(err.message)}}async function addAssignment(){const ids=[...document.querySelectorAll('input[name=cx]:checked')].map(x=>x.value);try{await api('trainer_add_assignment',{name:an.value.trim(),code:ac.value.trim(),mode:am.value,student_turns:Number(au.value),topic_ids:ids});an.value='';ac.value='';await loadDash()}catch(err){showError(err.message)}}byId('postTopicButton').addEventListener('click',addTopic);byId('createAssignmentButton').addEventListener('click',addAssignment);loadDash()})();</script></body></html>
