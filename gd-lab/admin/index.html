<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD Lab Admin · ClarionPrep</title>
<style>
:root{--navy:#0e2344;--blue:#2458d7;--ink:#172033;--muted:#667085;--line:#dfe5ee;--bg:#eef2f7;--green:#137a48}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:#fff;padding:18px 24px;font-weight:700}.wrap{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.card h1{margin:0 0 14px;font-size:24px}.topic{display:flex;gap:10px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}.topic:last-child{border-bottom:0}.topic input{margin-top:3px}.topic strong{font-size:15px;line-height:1.35}.topic span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.start{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.start:disabled{opacity:.5;cursor:not-allowed}.status{margin:14px 0;color:var(--muted)}.error{color:#b42318}.live{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.live[hidden]{display:none}.live h2{margin:0 0 6px;font-size:20px}.bubble{padding:12px 14px;margin:9px 0;border-radius:11px;background:#f8fafc;border:1px solid var(--line)}.bubble.you{background:#eef4ff}.bubble.mod{background:#f3f4f6;color:#475467}.bubble b{display:block;margin-bottom:4px}.room-state{display:flex;align-items:center;gap:9px;margin:12px 0;padding:11px 13px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:#98a2b3}.dot.live{background:var(--green);box-shadow:0 0 0 4px rgba(19,122,72,.12)}.dot.ai{background:var(--blue);box-shadow:0 0 0 4px rgba(36,88,215,.12)}.small{font-size:12px;color:var(--muted);margin-top:8px}.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.back{display:inline-block;margin-top:16px;color:var(--blue);font-weight:700;text-decoration:none}.learn-link{display:inline-block;margin-top:16px;margin-right:18px;padding:10px 14px;border-radius:9px;background:#eef3ff;color:#1d4cb5;font-weight:800;text-decoration:none}@media(max-width:650px){.wrap{margin:14px auto}}
</style>
</head>
<body>
<header>ClarionPrep GD Lab — Admin</header>
<div class="wrap">
  <section class="card">
    <h1>Choose a GD topic</h1>
    <div id="status" class="status">Loading topics…</div>
    <div id="topics"></div>
    <button id="startBtn" class="start" type="button" disabled>START</button>
    <section id="live" class="live" hidden>
      <h2 id="liveTitle"></h2>
      <div class="small">A moderator introduces the topic and starts the clock. The group then runs naturally for about 8 minutes. Your microphone stays live; enter whenever you wish.</div>
      <div class="meta"><span id="clock">08:00</span><span id="stage">Opening</span></div>
      <div class="room-state"><span id="roomDot" class="dot"></span><span id="roomStatus">Starting the live GD…</span></div>
      <div id="chat"></div>
    </section>
  </section>
  <a class="learn-link" href="/gd-lab/learn/">▶ Learn the GD Moves</a>
  <a class="back" href="/ascent/admin-settings.html">← Back to Admin Hub</a>
</div>
<script>
(()=>{
const API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/telw-gd-admin';
const KEYS=['ascent_admin_master_session','ascent_trainer_session'];
const $=id=>document.getElementById(id);
let session=null,selected=null,history=[],stream=null,audioCtx=null,analyser=null,source=null,vadRAF=0;
let recorder=null,chunks=[],speechStartedAt=0,lastVoiceAt=0,busy=false,aiSpeaking=false,moderatorSpeaking=false,nextAiTimer=0,ended=false,currentAudio=null;
let roomStartedAt=0,clockTimer=0,bargeVoiceAt=0,prefetchedAi=null,prefetchEpoch=0;
const ROOM_MS=8*60*1000,VOICE_THRESHOLD=.035,BARGE_THRESHOLD=.055,SILENCE_MS=900,MIN_SPEECH_MS=420,AI_GAP_MS=450;
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function getSession(){for(const key of KEYS){try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&x.sessionToken&&String(x.role||'').toUpperCase()==='ADMIN'&&new Date(x.expiresAt).getTime()>Date.now())return x}catch{}}return null}
async function api(action,data,timeout=60000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-ASCENT-ADMIN-SESSION':session.sessionToken},body:JSON.stringify(Object.assign({action},data||{})),signal:c.signal});const j=await r.json().catch(()=>({}));if(r.status===401)throw Error('Your administrator session has expired. Return to the Admin Hub and sign in again.');if(!r.ok)throw Error(j.error||'GD Lab request failed.');return j}finally{clearTimeout(t)}}
function elapsed(){return roomStartedAt?Date.now()-roomStartedAt:0}
function stageKey(){const s=elapsed()/1000;if(s<60)return'opening';if(s<180)return'exploration';if(s<300)return'challenge';if(s<390)return'depth';if(s<450)return'convergence';return'close'}
function stageLabel(){return {opening:'Opening & framing',exploration:'Exploring positions',challenge:'Challenge & disagreement',depth:'Depth & implications',convergence:'Convergence',close:'Closing judgement'}[stageKey()]}
function updateClock(){if(!roomStartedAt)return;const left=Math.max(0,ROOM_MS-elapsed()),sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('stage').textContent=stageLabel();if(left<=0&&!ended)endRoom()}
function state(text,kind=''){ $('roomStatus').textContent=text;$('roomDot').className='dot'+(kind?' '+kind:'') }
function addBubble(speaker,text,isYou=false,isModerator=false){const d=document.createElement('div');d.className='bubble'+(isYou?' you':'')+(isModerator?' mod':'');d.innerHTML='<b>'+esc(speaker)+'</b><div>'+esc(text)+'</div>';$('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function loadTopics(){session=getSession();if(!session){$('status').className='status error';$('status').textContent='No active administrator session. Return to the Admin Hub.';return}try{const j=await api('topic_list',{},12000);$('status').textContent='';$('topics').innerHTML=(j.topics||[]).map(x=>'<label class="topic"><input type="radio" name="topic" value="'+x.id+'" data-title="'+esc(x.title)+'"><div><strong>'+esc(x.title)+'</strong><span>Difficulty '+x.difficulty+'/5</span></div></label>').join('');document.querySelectorAll('input[name=topic]').forEach(r=>r.addEventListener('change',()=>{selected={id:r.value,title:r.dataset.title};$('startBtn').disabled=false}))}catch(e){$('status').className='status error';$('status').textContent=e.message||'Could not load topics.'}}
async function openMic(){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=new (window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.25;source.connect(analyser);runVAD()}
function rms(){const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let sum=0;for(let i=0;i<a.length;i++){const v=(a[i]-128)/128;sum+=v*v}return Math.sqrt(sum/a.length)}
function cancelPrefetch(){prefetchEpoch++;prefetchedAi=null}
function prefetchNextAI(){if(ended||recorder||moderatorSpeaking)return;const epoch=prefetchEpoch;const snapshot=history.map(x=>({speaker:x.speaker,text:x.text}));prefetchedAi=api('admin_ai_turn',{topic_id:selected.id,history:snapshot,opener:false,stage:stageKey()},60000).then(j=>({epoch,reply:j.reply})).catch(()=>null)}
function interruptAI(){if(!aiSpeaking||moderatorSpeaking||ended)return;cancelPrefetch();try{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}}catch{}currentAudio=null;aiSpeaking=false;clearTimeout(nextAiTimer);state('You have the floor…','live');startSegment(true)}
function startSegment(fromBarge=false){if(recorder||busy||moderatorSpeaking||ended)return;cancelPrefetch();chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=processSegment;recorder.start();speechStartedAt=Date.now();lastVoiceAt=Date.now();clearTimeout(nextAiTimer);if(!fromBarge)state('Listening to you…','live')}
function finishSegment(){if(!recorder||recorder.state!=='recording')return;const duration=Date.now()-speechStartedAt;if(duration<MIN_SPEECH_MS){recorder.onstop=()=>{recorder=null;chunks=[];scheduleAI()};recorder.stop();return}state('Processing your contribution…','live');recorder.stop()}
function runVAD(){cancelAnimationFrame(vadRAF);const tick=()=>{if(analyser&&!ended&&!busy&&!moderatorSpeaking){const level=rms(),now=Date.now();if(aiSpeaking){if(level>BARGE_THRESHOLD){if(!bargeVoiceAt)bargeVoiceAt=now;if(now-bargeVoiceAt>220)interruptAI()}else bargeVoiceAt=0}else{bargeVoiceAt=0;if(level>VOICE_THRESHOLD){if(!recorder)startSegment();lastVoiceAt=now}else if(recorder&&now-lastVoiceAt>SILENCE_MS)finishSegment()}}vadRAF=requestAnimationFrame(tick)};vadRAF=requestAnimationFrame(tick)}
async function blobData(blob){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=rej;fr.readAsDataURL(blob)})}
async function playAudioB64(b64){if(!b64)return;const audio=new Audio('data:audio/mpeg;base64,'+b64);currentAudio=audio;await new Promise(resolve=>{let done=false;const fin=()=>{if(done)return;done=true;resolve()};audio.onended=fin;audio.onerror=fin;audio.play().catch(fin)});if(currentAudio===audio)currentAudio=null}
async function playModerator(phase){moderatorSpeaking=true;state(phase==='open'?'Moderator is introducing the topic…':'Moderator is closing the GD…','ai');try{const j=await api('admin_moderator',{topic_id:selected.id,phase},30000);addBubble(j.reply.speaker,j.reply.text,false,true);await playAudioB64(j.reply.audio)}finally{moderatorSpeaking=false}}
async function processSegment(){const local=recorder;recorder=null;if(!chunks.length){scheduleAI();return}busy=true;try{const blob=new Blob(chunks,{type:local.mimeType||'audio/webm'}),data=await blobData(blob);chunks=[];const j=await api('admin_human_turn',{topic_id:selected.id,audio:data,mime:blob.type,history,stage:stageKey()},60000);addBubble('You',j.student_text,true);history.push({speaker:'You',text:j.student_text});if(ended)return;busy=false;await deliverAI(j.reply)}catch(e){state(e.message||'I could not hear that clearly. The group will continue.','live');busy=false;scheduleAI()}finally{busy=false}}
async function deliverAI(reply){if(!reply||ended)return;clearTimeout(nextAiTimer);aiSpeaking=true;state(reply.speaker+' is speaking…','ai');addBubble(reply.speaker,reply.text);history.push({speaker:reply.speaker,text:reply.text});prefetchNextAI();if(reply.audio){const audio=new Audio('data:audio/mpeg;base64,'+reply.audio);currentAudio=audio;await new Promise(resolve=>{let done=false;const fin=()=>{if(done)return;done=true;resolve()};audio.onended=fin;audio.onerror=fin;audio.play().catch(fin);const poll=setInterval(()=>{if(!aiSpeaking||ended){clearInterval(poll);fin()}},80)});if(currentAudio===audio)currentAudio=null}if(ended)return;if(!aiSpeaking)return;aiSpeaking=false;state('Discussion continuing — enter whenever you wish.','live');scheduleAI()}
async function continueWithPrefetch(){if(ended||busy||aiSpeaking||moderatorSpeaking||recorder)return;const p=prefetchedAi;prefetchedAi=null;if(p){state('Discussion continuing…','ai');const x=await p;if(x&&x.epoch===prefetchEpoch&&!ended&&!busy&&!aiSpeaking&&!moderatorSpeaking&&!recorder){await deliverAI(x.reply);return}}if(!ended&&!recorder)nextAI()}
function scheduleAI(){if(ended||busy||aiSpeaking||moderatorSpeaking||recorder)return;clearTimeout(nextAiTimer);nextAiTimer=setTimeout(()=>{if(!recorder&&!busy&&!aiSpeaking&&!moderatorSpeaking&&!ended)continueWithPrefetch()},AI_GAP_MS)}
async function nextAI(opener=false){if(ended)return;busy=true;try{state(opener?'First participant is opening…':'Discussion continuing…','ai');const j=await api('admin_ai_turn',{topic_id:selected.id,history,opener,stage:stageKey()},60000);busy=false;await deliverAI(j.reply)}catch(e){busy=false;state(e.message||'The group could not continue.','live');scheduleAI()}}
async function endRoom(){if(ended)return;ended=true;cancelPrefetch();clearTimeout(nextAiTimer);clearInterval(clockTimer);try{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}}catch{}currentAudio=null;aiSpeaking=false;if(recorder&&recorder.state==='recording'){try{recorder.onstop=null;recorder.stop()}catch{}recorder=null;chunks=[]}try{await playModerator('close')}catch{}state('Discussion complete — 8 minutes finished.');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}}
async function startRoom(){if(!selected||busy)return;ended=false;history=[];cancelPrefetch();$('chat').innerHTML='';$('live').hidden=false;$('liveTitle').textContent=selected.title;$('startBtn').disabled=true;document.querySelectorAll('input[name=topic]').forEach(x=>x.disabled=true);$('live').scrollIntoView({behavior:'smooth',block:'start'});try{state('Turning on the microphone…','live');await openMic();await playModerator('open');roomStartedAt=Date.now();updateClock();clockTimer=setInterval(updateClock,500);state('Mic live. Discussion begins now.','live');await nextAI(true)}catch(e){state('Could not start the live GD. Please refresh and try again.','');$('startBtn').disabled=false;document.querySelectorAll('input[name=topic]').forEach(x=>x.disabled=false)}}
$('startBtn').addEventListener('click',startRoom);window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close().catch(()=>{})});loadTopics();
})();
</script>
</body>
</html>
