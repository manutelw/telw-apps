<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>Live Mock · Administrator Setup</title><style>:root{--navy:#143a60;--gold:#c67b00;--text:#24364a;--muted:#65768a;--border:#d7e1eb;--danger:#b42318;--success:#18794e}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(145deg,#102a46,#214d79);display:grid;place-items:center}.card{width:min(650px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 22px 65px rgba(0,0,0,.22)}h1{margin:0 0 8px;color:var(--navy)}p{color:var(--muted);line-height:1.6}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:800;font-size:13px}.field input{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font:inherit}.btn{min-height:46px;border:0;border-radius:10px;padding:0 16px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.status{margin-top:14px;min-height:22px}.error{color:var(--danger)}.success{color:var(--success)}</style></head><body><main class="card"><h1>Live Mock Administrator Setup</h1><p>This is a one-time setup for the independent Live Mock app. Choose the administrator password you want to use. Once the administrator account exists, this setup route will refuse any further administrator creation.</p><div class="field"><label>Administrator email</label><input id="email" type="email" value="manu@telw.co.in" readonly></div><div class="field"><label>Full name</label><input id="name" autocomplete="name"></div><div class="field"><label>Create password</label><input id="password" type="password" autocomplete="new-password"></div><button id="setup" class="btn">Create administrator account</button><div id="status" class="status"></div></main><script>const U='https://vtqatrhwfvzyodiftvkc.supabase.co',KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',AUTH=U+'/functions/v1/live-mock-auth',SESSION_KEY='live_mock_student_session',headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},$=id=>document.getElementById(id);$('setup').onclick=async()=>{const s=$('status');s.className='status';s.textContent='Creating administrator account…';$('setup').disabled=true;try{const r=await fetch(AUTH,{method:'POST',headers,body:JSON.stringify({action:'BOOTSTRAP_ADMIN',email:$('email').value,full_name:$('name').value.trim(),password:$('password').value})}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw new Error(d.message||'Administrator setup failed.');localStorage.setItem(SESSION_KEY,JSON.stringify({sessionToken:d.session_token,user:d.user,expiresAt:d.expires_at}));s.className='status success';s.textContent='Administrator account created. Opening Live Mock…';setTimeout(()=>location.replace('./index.html'),700)}catch(e){s.className='status error';s.textContent=e.message||'Administrator setup failed.';$('setup').disabled=false}};</script></body></html>
