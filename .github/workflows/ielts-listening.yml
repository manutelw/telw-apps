name: IELTS Listening standalone checks
on:
  pull_request:
    paths:
      - 'ielts-listening/**'
      - '.github/workflows/ielts-listening.yml'
  push:
    branches: [main]
    paths:
      - 'ielts-listening/**'
      - '.github/workflows/ielts-listening.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check standalone Listening handlers and public scripts
        run: |
          node --test ielts-listening/tests/*.test.mjs
          node --check ielts-listening/public/app.js
          node --check ielts-listening/public/admin.js
