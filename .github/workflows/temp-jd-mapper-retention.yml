name: Temporary JD mapper retention patch

on:
  push:
    branches:
      - jd-mapper-retention-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-retention-final
      - name: Patch temporary mapper warning and download
        shell: python
        run: |
          from pathlib import Path
          p=Path('ascent/jd-interview-mapper.html')
          s=p.read_text()
          old='''    <p>Paste the full JD and your CV. ASCENT will list the employer's requirements and suggest where your CV gives strong evidence, transferable evidence, or no evidence. Review every suggestion before your interview questions are built.</p>'''
          new=old+'''\n    <div class="status error" style="margin:16px 0 0"><strong>IMPORTANT — THIS JD–CV MAP IS TEMPORARY.</strong> ASCENT does not keep your pasted JD, CV, evidence map or fit analysis as a permanent learner record. Temporary working data is deleted when you create speaking practice, or automatically within 6 hours. <strong>If you want to keep this analysis, download your report before you leave.</strong></div>'''
          if old not in s: raise SystemExit('hero target not found')
          s=s.replace(old,new,1)

          old='''    <ol id="questions" class="questions"></ol>\n    <button id="practiceBtn" class="btn primary" type="button">Create my speaking practice</button>'''
          new='''    <ol id="questions" class="questions"></ol>\n    <div class="status error" style="margin:14px 0"><strong>KEEP THIS ANALYSIS?</strong> Download your report now. Creating speaking practice deletes this temporary JD–CV map from ASCENT.</div>\n    <div class="actions"><button id="downloadBtn" class="btn" type="button">Download My JD–CV Preparation Report</button><button id="practiceBtn" class="btn primary" type="button">Create my speaking practice</button></div>'''
          if old not in s: raise SystemExit('question buttons target not found')
          s=s.replace(old,new,1)

          old='''function renderQuestions(qs){$('questions').innerHTML=(qs||[]).map(q=>`<li><strong>${esc(q.type==='COMMON'?'Common':q.type)}</strong> — ${esc(q.question)}</li>`).join('');$('questionsCard').hidden=false;$('questionsCard').scrollIntoView({behavior:'smooth',block:'start'});}'''
          new=old+'''\nfunction downloadReport(){if(!currentCase?.requirements?.length){setStatus('practiceStatus','Build your interview set before downloading the report.','error');return}const maps=currentCase.mappings||[],by=new Map(maps.map(m=>[String(m.requirement_id),m])),fit=fitMetrics(currentCase.requirements,maps),cc={S:0,T:0,N:0};maps.forEach(m=>{if(cc[m.rating]!==undefined)cc[m.rating]++});const reqRows=currentCase.requirements.map((r,i)=>{const m=by.get(String(r.id))||{};return `<tr><td>${i+1}</td><td>${esc(r.capability)}</td><td>${esc(r.priority)}</td><td>${esc(r.requirement_type)}</td><td>${esc(m.rating||'—')}</td><td>${esc(m.cv_evidence||'No evidence mapped')}</td></tr>`}).join('');const qs=(currentCase.generated_questions||[]).map((q,i)=>`<li><strong>${esc(q.type||'Question')}:</strong> ${esc(q.question)}</li>`).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><title>ASCENT JD–CV Preparation Report</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;color:#24364a}h1,h2{color:#143a60}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{border:1px solid #ccd8e5;padding:8px;vertical-align:top;text-align:left}th{background:#edf4fb}.note{padding:12px;background:#fff8e8;border:1px solid #ead7af}.score{font-size:20px;font-weight:700}.small{font-size:12px;color:#5f7185}</style></head><body><h1>ASCENT JD–CV Preparation Report</h1><p><strong>Organisation:</strong> ${esc(currentCase.organisation||'Not detected')}<br><strong>Role:</strong> ${esc(currentCase.role_title||'Not detected')}</p><p class="score">Evidence Fit: ${fit?fit.score+'/100 · '+fit.band:'Not available'}${fit?' · CORE gaps '+fit.core.N:''}</p><p><strong>Evidence Map:</strong> S ${cc.S} · T ${cc.T} · N ${cc.N}</p><div class="note"><strong>Important:</strong> This Evidence Fit is a preparation indicator, not a selection probability. This report does not reproduce your full pasted CV.</div><h2>JD → CV Evidence Map</h2><table><thead><tr><th>#</th><th>Requirement</th><th>Priority</th><th>Type</th><th>S/T/N</th><th>Your CV evidence</th></tr></thead><tbody>${reqRows}</tbody></table><h2>Your Interview Questions</h2><ol>${qs||'<li>Questions not generated.</li>'}</ol><p class="small">Generated by ASCENT · JD Fit & Interview Practice</p></body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');const slug=String(currentCase.role_title||'Role').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,60)||'Role';a.href=url;a.download=`ASCENT_JD_CV_Preparation_${slug}.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('practiceStatus','Report downloaded. Keep this file if you want to retain the JD–CV analysis.','success');}'''
          if old not in s: raise SystemExit('renderQuestions target not found')
          s=s.replace(old,new,1)

          old="$('practiceBtn').onclick=async()=>{if(!currentCase?.id)return;const b=$('practiceBtn');"
          new="$('downloadBtn').onclick=downloadReport;$('practiceBtn').onclick=async()=>{if(!currentCase?.id)return;if(!confirm('Creating speaking practice will delete this temporary JD–CV map from ASCENT. Download your report first if you want to keep the analysis. Continue?'))return;const b=$('practiceBtn');"
          if old not in s: raise SystemExit('practice handler target not found')
          s=s.replace(old,new,1)

          old='''    <div class="heading-row"><div><h3>Your recent JD maps</h3><p>Use this to see whether you have already prepared a role.</p></div><button id="refreshHistory" class="btn" type="button">Refresh</button></div>'''
          new='''    <div class="heading-row"><div><h3>Your temporary JD maps</h3><p>These are working records only. They are deleted after speaking practice is created or automatically within 6 hours.</p></div><button id="refreshHistory" class="btn" type="button">Refresh</button></div>'''
          if old not in s: raise SystemExit('history heading target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('ascent/jd-interview-trainer.html')
          x=t.read_text()
          old='''<div class="head"><div><h2>JD Interview Mapper</h2><p>See how each learner has mapped the full JD to their own CV, where the evidence is strong or transferable, and where the gaps remain.</p></div><button id="refresh" class="btn" type="button">Refresh</button></div>'''
          new='''<div class="head"><div><h2>JD Interview Mapper</h2><p>See current learner JD–CV working maps. These mapper records are temporary: they are deleted after speaking practice is created or automatically within 6 hours. Normal ASCENT practice history is not affected.</p></div><button id="refresh" class="btn" type="button">Refresh</button></div>'''
          if old not in x: raise SystemExit('trainer heading target not found')
          x=x.replace(old,new,1)
          t.write_text(x)
      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html ascent/jd-interview-trainer.html
          git commit -m "Make JD mapper records temporary and downloadable"
          git push
