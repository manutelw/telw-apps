name: Remove duplicate GD Lab link
on:
  push:
    branches: [feature/remove-duplicate-gd-link]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[remove-duplicate-gd-link-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-duplicate-gd-link
      - name: Remove outer GD Lab navigation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/practice.html')
          s=p.read_text()
          old='<div class="live-mock-actions"><a class="fix-link" href="../gd-lab/">GD Lab</a><a class="coach-link" href="./coach.html">Ask ASCENT Coach</a><a class="fix-link" href="./coach.html?mode=fix&source=practice">Fix a problem</a></div>'
          new='<div class="live-mock-actions"><a class="coach-link" href="./coach.html">Ask ASCENT Coach</a><a class="fix-link" href="./coach.html?mode=fix&source=practice">Fix a problem</a></div>'
          assert old in s, 'duplicate GD Lab link not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/practice.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate GD Lab link [remove-duplicate-gd-link-applied]"
          git push origin HEAD:feature/remove-duplicate-gd-link
