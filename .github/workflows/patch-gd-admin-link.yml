name: Patch GD Admin Hub link
on:
  push:
    branches:
      - feature/gd-admin-builder-link
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gd-admin-builder-link
      - name: Patch Admin Hub GD card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          old='<a class="app-card gd" href="../gd-lab/admin/"><strong>GD Lab</strong><span>Open GD topics, assignments, full-session recordings and results</span></a>'
          new='<a class="app-card gd" href="../gd-lab/admin-builder.html"><strong>GD Lab</strong><span>Upload a JD, prepare role-specific GD topics and release student practice links</span></a>'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected GD Admin Hub card not found')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-gd-admin-link.yml
          git add ascent/admin-settings.html
          git commit -m "Connect Admin Hub GD card to assignment builder"
          git push
