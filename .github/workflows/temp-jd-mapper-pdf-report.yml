name: Temporary JD mapper PDF report patch

on:
  push:
    branches:
      - jd-mapper-pdf-report

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-pdf-report
      - name: Patch PDF report download
        shell: python
        run: |
          from pathlib import Path
          p=Path('ascent/jd-interview-mapper.html')
          s=p.read_text()
          old='''  <title>ASCENT · JD Fit & Interview Practice</title>'''
          new='''  <title>ASCENT · JD Fit & Interview Practice</title>\n  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>'''
          if old not in s: raise SystemExit('title target not found')
          s=s.replace(old,new,1)
          old='''<p>ASCENT has suggested S, T or N from your pasted CV. Check every item. Change any rating or evidence that does not match your real experience. S = direct proof. T = related proof that can transfer. N = no credible proof.</p>'''
          new='''<p>ASCENT has suggested S, T or N from your pasted CV. Check every item. Change any rating or evidence that does not match your real experience. <strong>S is Strong:</strong> your CV has direct proof. <strong>T is Transferable:</strong> your CV has related evidence that can transfer to this role. <strong>N is None:</strong> there is no clear proof in your CV.</p>'''
          if old not in s: raise SystemExit('STN target not found')
          s=s.replace(old,new,1)
          old='''    <div style="margin-top:16px"><button id="saveBtn" class="btn primary" type="button">Save my map and build questions</button></div>'''
          new='''    <div class="actions" style="margin-top:16px"><button id="saveBtn" class="btn primary" type="button">Save my map and build questions</button><button id="mapDownloadBtn" class="btn" type="button">Download Map PDF</button></div>'''
          if old not in s: raise SystemExit('mapping buttons target not found')
          s=s.replace(old,new,1)
          old='''<button id="downloadBtn" class="btn" type="button">Download My JD–CV Preparation Report</button>'''
          new='''<button id="downloadBtn" class="btn" type="button">Download Preparation Report (PDF)</button>'''
          if old not in s: raise SystemExit('question download button target not found')
          s=s.replace(old,new,1)
          start=s.index('function downloadReport(){')
          end=s.index("$('extractBtn').onclick", start)
          newfun=r'''function reportMappings(){const cards=[...document.querySelectorAll('.req')];if(cards.length)return cards.map(card=>({requirement_id:card.dataset.id,rating:card.querySelector('input[type="radio"]:checked')?.value||'N',cv_evidence:card.querySelector('.evidence')?.value.trim()||''}));return currentCase?.mappings||[];}
function downloadReport(){if(!currentCase?.requirements?.length){setStatus('mapStatus','Build the JD–CV map before downloading the PDF.','error');return}const jspdf=window.jspdf;if(!jspdf?.jsPDF){setStatus('mapStatus','The PDF tool did not load. Please refresh the page and try again.','error');return}const {jsPDF}=jspdf,doc=new jsPDF({unit:'pt',format:'a4'}),maps=reportMappings(),by=new Map(maps.map(m=>[String(m.requirement_id),m])),fit=fitMetrics(currentCase.requirements,maps),cc={S:0,T:0,N:0};maps.forEach(m=>{if(cc[m.rating]!==undefined)cc[m.rating]++});const left=42,right=553;doc.setTextColor(20,58,96);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('ASCENT JD-CV Preparation Report',left,50);doc.setTextColor(36,54,74);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(`Organisation: ${currentCase.organisation||'Not detected'}`,left,72);doc.text(`Role: ${currentCase.role_title||'Not detected'}`,left,88);doc.setDrawColor(215,225,235);doc.line(left,100,right,100);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(20,58,96);doc.text('Evidence Fit',left,126);doc.setFontSize(18);doc.text(fit?`${fit.score}/100 · ${fit.band}`:'Not available',left,150);doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(65,85,105);doc.text(`CORE gaps: ${fit?fit.core.N:'—'}     Strong: ${cc.S}     Transferable: ${cc.T}     None: ${cc.N}`,left,170);doc.setFillColor(247,249,252);doc.roundedRect(left,184,511,48,5,5,'F');doc.setFontSize(9);const note=doc.splitTextToSize('Use this report to guide your interview preparation. Evidence Fit is a preparation indicator, not a selection probability. The report does not reproduce your full pasted CV.',487);doc.text(note,left+12,201);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(20,58,96);doc.text('JD to CV Evidence Map',left,258);const body=currentCase.requirements.map((r,i)=>{const m=by.get(String(r.id))||{};return[i+1,r.capability,r.priority,r.requirement_type,m.rating||'—',m.cv_evidence||'No evidence mapped']});doc.autoTable({startY:270,head:[['#','Requirement','Priority','Type','Map','CV evidence']],body,margin:{left,right:42},theme:'grid',styles:{font:'helvetica',fontSize:7.8,cellPadding:4,valign:'top',textColor:[36,54,74],lineColor:[220,227,234],lineWidth:.4},headStyles:{fillColor:[237,244,251],textColor:[20,58,96],fontStyle:'bold'},columnStyles:{0:{cellWidth:22},1:{cellWidth:105},2:{cellWidth:52},3:{cellWidth:65},4:{cellWidth:32},5:{cellWidth:193}},showHead:'everyPage'});let y=doc.lastAutoTable.finalY+24;const qs=currentCase.generated_questions||[];if(qs.length){if(y>730){doc.addPage();y=48}doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(20,58,96);doc.text('Interview Questions',left,y);y+=18;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(36,54,74);qs.forEach((q,i)=>{const label=`${i+1}. ${q.type||'Question'} — ${q.question}`;const lines=doc.splitTextToSize(label,500);const h=lines.length*11+5;if(y+h>790){doc.addPage();y=48}doc.text(lines,left,y);y+=h});}const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110,125,140);doc.text('ASCENT · JD Fit & Interview Practice',left,820);doc.text(`Page ${i} of ${pages}`,right,820,{align:'right'});}const slug=String(currentCase.role_title||'Role').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,60)||'Role';doc.save(`ASCENT_JD_CV_Preparation_${slug}.pdf`);const target=$('questionsCard').hidden?'mapStatus':'practiceStatus';setStatus(target,'PDF downloaded. Keep this file if you want to retain the JD–CV analysis.','success');}
'''
          s=s[:start]+newfun+s[end:]
          old="$('downloadBtn').onclick=downloadReport;"
          new="$('mapDownloadBtn').onclick=downloadReport;$('downloadBtn').onclick=downloadReport;"
          if old not in s: raise SystemExit('download handler target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html
          git commit -m "Add readable PDF download to JD mapper"
          git push
