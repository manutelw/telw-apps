name: ORACY Level C Listening Display
on:
  pull_request:
    paths:
      - 'oracy/**'
      - '.github/workflows/oracy-level-c-listening-display.yml'
  push:
    branches: [main]
    paths:
      - 'oracy/**'
      - '.github/workflows/oracy-level-c-listening-display.yml'
jobs:
  listening-display-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate genre-aware listening display
        run: |
          node --check oracy/level-c-listening-display.js
          python - <<'PY'
          from pathlib import Path
          js=Path('oracy/level-c-listening-display.js').read_text()
          html=Path('oracy/unit-c.html').read_text()
          unit1=Path('oracy/unit-31.html').read_text()
          for level in ('C1A','C1B','C2A','C2B'): assert level in js
          for genre in ("'presentation'","'voice note'","'announcement'","'story'","'monologue'","'advertisement'","'conversation'","'interview'","'podcast'","'group discussion'"):
              assert genre in js
          assert "SINGLE.has(genre)?proseHtml(segs):dialogueHtml(segs)" in js
          assert "Listen: ${label}" in js
          assert 'local<1||local>30' in js
          assert 'level-c-listening-display.js' in html and 'level-c-listening-display.js' in unit1
          assert html.rindex('level-c-listening-display.js') > html.rindex('level-c-own-words-prompt.js'), 'shared Level C formatter must load last'
          assert unit1.rindex('level-c-listening-display.js') > unit1.rindex('level-c-own-words-prompt.js'), 'Unit 1 formatter must load last'
          print('All four Level C sublevels use the final genre-aware listening display contract')
          PY
