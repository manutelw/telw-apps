name: LUM Unit 1 dialogue trigger
on:
  pull_request:
    paths:
      - 'dialogue-lab/lum1-v3.html'
      - 'dialogue-lab/lum1-v4.html'
      - 'dialogue-lab/lum1-v5.html'
      - 'dialogue-lab/lum1-v6.html'
      - 'dialogue-lab/lum1-v7.html'
      - 'dialogue-lab/home.html'
      - '.github/workflows/lum1-v3-trigger.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unit 1 v7 route, ambience and reactions
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dialogue-lab/home.html').read_text()
          v7=Path('dialogue-lab/lum1-v7.html').read_text()
          assert './lum1-v7.html' in h
          required=[
            "dialogue[3].afterSfx='arjun_chuckle'",
            "dialogue[10].afterSfx='arjun_chuckle'",
            "dialogue[11].beforeSfx='neeti_chuckle'",
            'sfxCache',
            "speak('heh',role)",
            'const park=',
            'const chirp=',
            "replaceAll('(a light laugh)','')",
            "replaceAll('(Chuckles)','')",
            "replaceAll('(Chuckling) ','')",
            'I came here yesterday.',
            'I’m staying in a hotel.'
          ]
          missing=[x for x in required if x not in v7]
          if missing: raise SystemExit('Missing from v7 '+repr(missing))
          print('LUM Unit 1 v7 integrity OK')
          PY
