name: LUM Unit 1 dialogue trigger
on:
  pull_request:
    paths:
      - 'dialogue-lab/lum1-v3.html'
      - 'dialogue-lab/lum1-v4.html'
      - 'dialogue-lab/lum1-v5.html'
      - 'dialogue-lab/lum1-v6.html'
      - 'dialogue-lab/lum1-v7.html'
      - 'dialogue-lab/home.html'
      - '.github/workflows/lum1-v3-trigger.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unit 1 clean audio route
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dialogue-lab/home.html').read_text()
          v6=Path('dialogue-lab/lum1-v6.html').read_text()
          v7=Path('dialogue-lab/lum1-v7.html').read_text()
          assert './lum1-v7.html' in h
          assert "fetch('./lum1-v6.html'" in v7
          assert 'const park=' in v6
          assert 'trafficCtx.__bird=' in v6
          assert 'trafficCtx?.__bird?.()' in v6
          assert "replaceAll('(a light laugh)','')" in v6
          assert "replaceAll('(Chuckles)','')" in v6
          assert "replaceAll('(Chuckling) ','')" in v6
          assert "replaceAll('I joined yesterday. I came here yesterday.','I came here yesterday.')" in v6
          print('LUM Unit 1 clean audio integrity OK')
          PY
