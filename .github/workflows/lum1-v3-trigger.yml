name: LUM Unit 1 dialogue trigger
on:
  pull_request:
    paths:
      - 'dialogue-lab/lum1-v3.html'
      - 'dialogue-lab/lum1-v4.html'
      - 'dialogue-lab/lum1-v5.html'
      - 'dialogue-lab/lum1-v6.html'
      - 'dialogue-lab/lum1-v7.html'
      - 'dialogue-lab/lum1-v8.html'
      - 'dialogue-lab/home.html'
      - '.github/workflows/lum1-v3-trigger.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unit 1 real park ambience route
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dialogue-lab/home.html').read_text()
          v6=Path('dialogue-lab/lum1-v6.html').read_text()
          v8=Path('dialogue-lab/lum1-v8.html').read_text()
          assert './lum1-v8.html' in h
          assert "fetch('./lum1-v6.html'" in v8
          for x in ['birds-isaiah658.ogg','children.wav','group_giggling.ogg','amb_outdoor1_loop.mp3','parkSpeech','parkGap']:
            assert x in v8, x
          assert "replaceAll('I joined yesterday. I came here yesterday.','I came here yesterday.')" in v6
          print('LUM Unit 1 real park ambience integrity OK')
          PY
