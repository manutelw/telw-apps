name: LUM Unit 1 dialogue trigger
on:
  pull_request:
    paths:
      - 'dialogue-lab/lum1-v3.html'
      - 'dialogue-lab/lum1-v4.html'
      - 'dialogue-lab/home.html'
      - '.github/workflows/lum1-v3-trigger.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unit 1 dialogue route and content
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dialogue-lab/home.html').read_text()
          v3=Path('dialogue-lab/lum1-v3.html').read_text()
          v4=Path('dialogue-lab/lum1-v4.html').read_text()
          assert './lum1-v4.html' in h
          required_v3=[
            'Hi! I’ve never seen you here before. My name’s Neeti.',
            'I’m a roadways engineer working with Critical Path Builders.',
            'So, how many roads have you built here?',
            'I’ve built over 8 kilometers so far.',
            'Wow! That’s a fast clip!',
            'So, where are you originally from?',
            'I’ve been there once.',
            'A 250 kilometer highway stretch is waiting for me.',
            'All the best for you! Maybe I’ll see you in Chandigarh!',
            'Promise.all',
            'setTimeout(r,turn.r===s.dialogue[i+1].r?70:120)'
          ]
          missing=[x for x in required_v3 if x not in v3]
          if missing: raise SystemExit('Missing from v3 '+repr(missing))
          required_v4=[
            'I came here yesterday.',
            "Wow! That’s a fast clip! So, where are you originally from?",
            's.dialogue.filter(x=>x.show)',
            'ascent-dialogue-voice'
          ]
          missing=[x for x in required_v4 if x not in v4]
          if missing: raise SystemExit('Missing from v4 '+repr(missing))
          print('LUM Unit 1 dialogue integrity OK')
          PY
