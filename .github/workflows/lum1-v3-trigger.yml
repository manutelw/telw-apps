name: LUM Unit 1 dialogue trigger
on:
  pull_request:
    paths:
      - 'dialogue-lab/lum1-v3.html'
      - 'dialogue-lab/lum1-v4.html'
      - 'dialogue-lab/lum1-v5.html'
      - 'dialogue-lab/lum1-v6.html'
      - 'dialogue-lab/lum1-v7.html'
      - 'dialogue-lab/lum1-v8.html'
      - 'dialogue-lab/lum1-v9.html'
      - 'dialogue-lab/lum1-v10.html'
      - 'dialogue-lab/lum2-v2.html'
      - 'dialogue-lab/lum2-v3.html'
      - 'dialogue-lab/lum2-v4.html'
      - 'dialogue-lab/lum2-v5.html'
      - 'dialogue-lab/lum2-v6.html'
      - 'dialogue-lab/lum2-v7.html'
      - 'dialogue-lab/lum3.html'
      - 'dialogue-lab/home.html'
      - '.github/workflows/lum1-v3-trigger.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical LUM units and direct KP navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dialogue-lab/home.html').read_text()
          v8=Path('dialogue-lab/lum1-v8.html').read_text()
          v9=Path('dialogue-lab/lum1-v9.html').read_text()
          u1n=Path('dialogue-lab/lum1-v10.html').read_text()
          u2=Path('dialogue-lab/lum2-v7.html').read_text()
          u3=Path('dialogue-lab/lum3.html').read_text()
          assert "fetch('./lum1-v9.html'" in v8
          assert "fetch('./lum1-v3.html'" in v9
          for x in ["It’s a road-building company. I came here yesterday.",'birds-isaiah658.ogg','parkSpeech','parkGap']:
            assert x in v9, x
          for x in ['Choose a Key Point','data-kp="1"','data-kp="3"','data-kp="4"',"p.get('kp')"]:
            assert x in u1n, x
          for x in ["fetch('./lum2.html'",'placement prep coming along?','neeti_student','arjun_student','setTimeout(r,85)','Choose a Key Point','const startMap={1:1,2:3,3:5}','let sess,si="+startScene+",pi=0']:
            assert x in u2, x
          for x in ["fetch('./lum2.html'",'Present Perfect Continuous: What have you been doing?','You’re still working on that SIP report?','You look exhausted. What have you been doing?','How’s the company research going?','HOW LONG · FOR · SINCE','Delay · urgency · resource need','Present Perfect Continuous vs Present Perfect','neeti_student','arjun_student','setTimeout(r,85)','const startMap={1:1,2:3,3:5}','module:3']:
            assert x in u3, x
          assert './lum1-v10.html' in h and './lum2-v7.html' in h and './lum3.html' in h
          for x in ['Communicating to prioritise correctly and reduce follow-ups','Signalling Delay, Urgency, or Resource Need','Communicating to decide what’s done and what’s next']:
            assert x in h, x
          print('LUM Units 1–3 integrity OK')
          PY
