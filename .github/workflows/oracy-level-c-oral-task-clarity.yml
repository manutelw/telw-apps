name: ORACY Level C Oral Task Clarity
on:
  pull_request:
    paths:
      - 'oracy/level-c-oral-task-clarity.js'
      - 'oracy/level-c-plain-rule-snapshot.js'
      - 'oracy/level-c-plain-rule-apply.js'
      - 'oracy/unit-c.html'
      - '.github/workflows/oracy-level-c-oral-task-clarity.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check oracy/level-c-oral-task-clarity.js
          node --check oracy/level-c-plain-rule-snapshot.js
          node --check oracy/level-c-plain-rule-apply.js
      - name: Audit Units 2-30 oral rules
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['oracy/level-c-units-2-30-specs.js','oracy/level-c-source-16-30.js','oracy/level-c-source-audit-fixes.js','oracy/rules-c1a.js','oracy/rules-c1b.js','oracy/rules-c2a.js','oracy/rules-c2b.js','oracy/level-c-unit-builder.js','oracy/level-c-unit-enhance.js','oracy/level-c-learner-friendly.js','oracy/level-c-plain-rule-snapshot.js','oracy/level-c-all-structures-friendly.js','oracy/level-c-unit6-reps-teaching.js','oracy/level-c-jargon-scrub.js','oracy/level-c-oral-task-clarity.js','oracy/level-c-plain-rule-apply.js'];
          for(let n=2;n<=30;n++){
            const ctx={window:{},location:{search:`?u=${n}`},URLSearchParams};vm.createContext(ctx);
            for(const f of files)vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
            const U=ctx.window.ORACY_UNIT;
            for(const id of ['q5','q10']){
              const q=U.oral[id];if(!q)throw new Error(`Unit ${n} ${id} missing`);
              if(!q.question.startsWith('Situation:'))throw new Error(`Unit ${n} ${id} lacks clear situation`);
              if(/What you are learning|Why practise it|The aim is to make/i.test(q.key))throw new Error(`Unit ${n} ${id} contains abstract coaching language`);
              if(!q.key||q.key.length<12)throw new Error(`Unit ${n} ${id} lacks a usable rule`);
            }
          }
          const ctx={window:{},location:{search:'?u=6'},URLSearchParams};vm.createContext(ctx);
          for(const f of files)vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          const rule=ctx.window.ORACY_UNIT.oral.q5.key;
          if(!rule.includes('If the situation can really happen'))throw new Error('Unit 6 real-possibility rule missing');
          if(!rule.includes('If you are imagining a different or unlikely situation'))throw new Error('Unit 6 imagined-situation rule missing');
          console.log('Units 2-30 use plain learner rules with no abstract learning labels.');
          NODE
