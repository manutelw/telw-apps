name: Remove obsolete PCL opening screen

on:
  push:
    branches: [pcl-remove-opening-screen]
    paths:
      - '.github/workflows/pcl-remove-opening-screen-once.yml'

permissions:
  contents: write

jobs:
  remove-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-remove-opening-screen
          fetch-depth: 0
      - name: Redirect obsolete preview route immediately
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('functions/ascent/_middleware.js')
          s=p.read_text()
          needle="  const url = new URL(context.request.url);\n"
          insert="  const url = new URL(context.request.url);\n  if (url.pathname.endsWith('/ascent/professional-communication-trainer-preview.html')) {\n    return new Response(null,{status:302,headers:{location:'https://pcl-professional-communication-lab.pages.dev/','cache-control':'no-store'}});\n  }\n"
          if insert not in s:
              if needle not in s: raise SystemExit('middleware insertion point not found')
              s=s.replace(needle,insert,1)
          p.write_text(s)
          wf=Path('.github/workflows/pcl-remove-opening-screen-once.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Verify narrow change
        run: |
          grep -q "professional-communication-trainer-preview.html" functions/ascent/_middleware.js
          grep -q "pcl-professional-communication-lab.pages.dev" functions/ascent/_middleware.js
          test ! -f .github/workflows/pcl-remove-opening-screen-once.yml
          git status --short
      - name: Commit redirect
        run: |
          git config user.name 'manutelw'
          git config user.email 'manutelw@gmail.com'
          git add functions/ascent/_middleware.js .github/workflows/pcl-remove-opening-screen-once.yml
          git commit -m 'Redirect obsolete PCL opening screen directly to index'
          git push origin HEAD:pcl-remove-opening-screen
