name: Patch JD mapper clarity

on:
  push:
    branches:
      - jd-mapper-clarity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-clarity
      - name: Patch learner mapper clarity
        shell: python
        run: |
          from pathlib import Path
          p = Path('ascent/jd-interview-mapper.html')
          s = p.read_text()

          s = s.replace(
            '<span class="pill ${r.priority===\'CORE\'?\'core\':\'\'}">${esc(r.priority)}</span><span class="pill">${esc(r.requirement_type)}</span>',
            '<span class="pill ${r.priority===\'CORE\'?\'core\':\'\'}">Priority: ${esc(r.priority)}</span><span class="pill">Type: ${esc(r.requirement_type)}</span>'
          )

          s = s.replace(
            "${m.source==='ASCENT_SUGGESTION'?`<div class=\"suggestion\"><strong>ASCENT suggests: ${esc(rating)}</strong>${m.note?' — '+esc(m.note):''}<br>Review this suggestion. Change the rating or evidence if it does not match your real experience.</div>`:''}",
            "${(m.source==='ASCENT_SUGGESTION'||(c.status==='MAPPING'&&rating))?`<div class=\"suggestion\"><strong>ASCENT SUGGESTION — ${esc(rating)}</strong>${m.note?' — '+esc(m.note):''}<br><strong>Your check:</strong> Keep it if it is accurate. Change the rating or evidence if it does not match your real experience.</div>`:''}"
          )

          old = "async function loadHistory(){try{const d=await call('MY_CASES');const rows=d.cases||[];$('history').innerHTML=rows.length?rows.map(c=>{const cc={S:0,T:0,N:0};(c.mappings||[]).forEach(m=>{if(cc[m.rating]!==undefined)cc[m.rating]++});return `<div class=\"history-item\"><div><strong>${esc(c.role_title||'Role')}</strong><div class=\"hint\">${esc(c.organisation||'Organisation not detected')} · ${esc(c.status)}</div></div><div class=\"summary\"><span class=\"pill\">S ${cc.S}</span><span class=\"pill\">T ${cc.T}</span><span class=\"pill\">N ${cc.N}</span></div></div>`}).join(''):'<div class=\"hint\">No JD maps yet.</div>';}catch(e){$('history').innerHTML=`<div class=\"status error\">${esc(e.message)}</div>`;}}"
          new = "async function loadHistory(){try{const d=await call('MY_CASES');const rows=d.cases||[];$('history').innerHTML=rows.length?rows.map(c=>{const maps=c.mappings||[],cc={S:0,T:0,N:0};maps.forEach(m=>{if(cc[m.rating]!==undefined)cc[m.rating]++});const evidence=maps.length?`<div class=\"summary\"><span class=\"pill\">Evidence Map</span><span class=\"pill\">S ${cc.S}</span><span class=\"pill\">T ${cc.T}</span><span class=\"pill\">N ${cc.N}</span></div>`:`<div class=\"summary\"><span class=\"pill\">Not mapped</span></div>`;return `<div class=\"history-item\"><div><strong>${esc(c.role_title||'Role')}</strong><div class=\"hint\">${esc(c.organisation||'Organisation not detected')} · ${esc(c.status)}</div></div>${evidence}</div>`}).join(''):'<div class=\"hint\">No JD maps yet.</div>';}catch(e){$('history').innerHTML=`<div class=\"status error\">${esc(e.message)}</div>`;}}"
          if old not in s:
            raise SystemExit('history target not found')
          s = s.replace(old, new)
          p.write_text(s)

      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clarify JD mapper suggestions and evidence labels"
          git push
