name: One-time PI audio preload patch
on:
  push:
    branches:
      - feature/pi-audio-preload
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-audio-preload
      - name: Patch PI audio preloading
        run: python .github/scripts/patch_pi_audio_preload.py
      - name: Remove one-time patch files
        run: rm .github/scripts/patch_pi_audio_preload.py .github/workflows/patch-pi-audio-preload.yml
      - name: Commit patched PI Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pi-lab/index.html .github/scripts/patch_pi_audio_preload.py .github/workflows/patch-pi-audio-preload.yml
          git commit -m "Preload PI audio for faster playback"
          git push origin HEAD:feature/pi-audio-preload
