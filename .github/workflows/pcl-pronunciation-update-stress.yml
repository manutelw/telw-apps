name: Fix PCL pronunciation stress and pace

on:
  push:
    paths:
      - '.github/workflows/pcl-pronunciation-update-stress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Module 1 pronunciation model
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/professional-communication-module-1.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="model"><h3>Voice focus · London English</h3><p class="notice">Notice the stress change in <b>update</b>: <b>an UP-date</b> (noun), but <b>to up-DATE</b> (verb). Keep it natural — no exaggerated RP.</p><div class="actions"><button class="btn ghost" id="pronounceBtn">▶ Hear the pronunciation</button></div></div>'''
          new='''<div class="model"><h3>Voice focus · London English</h3><p class="notice">Notice the stress change in <b>update</b>: <b>an UP-date</b> (noun), but <b>to up-DATE</b> (verb). In the verb, the first syllable is lighter and the main beat is clearly on <b>DATE</b>. Listen at a clear B1-friendly pace.</p><div class="actions"><button class="btn ghost" id="pronounceBtn">▶ Hear the pronunciation</button></div></div>'''
          assert old in s, 'voice-focus block not found'
          s=s.replace(old,new,1)
          old_js="""document.getElementById('pronounceBtn').onclick=async()=>{const b=document.getElementById('pronounceBtn'),old=b.textContent;b.disabled=true;b.textContent='Playing…';try{await speak('Here is an update. I will update you tomorrow. An update. To update. Here is an update. I will update you tomorrow.','coach')}catch(e){document.getElementById('trainStatus').textContent=e.message}finally{b.disabled=false;b.textContent=old}};"""
          new_js="""document.getElementById('pronounceBtn').onclick=async()=>{const b=document.getElementById('pronounceBtn'),old=b.textContent;b.disabled=true;b.textContent='Playing…';try{const text='Listen to the contrast. Noun: update. Put the main stress on the first syllable: UP-date. An update. Now the verb: update. Put the main stress clearly on the second syllable, DATE; keep the first syllable light. To update. I will update you tomorrow.';const clips=await prepareClips([['coach',text]]);player.playbackRate=.84;await playBlob(clips[0].blob)}catch(e){document.getElementById('trainStatus').textContent=e.message}finally{player.playbackRate=1;b.disabled=false;b.textContent=old}};"""
          assert old_js in s, 'pronunciation handler not found'
          s=s.replace(old_js,new_js,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/pcl-pronunciation-update-stress.yml
          git config user.name "manutelw"
          git config user.email "manu@telw.co.in"
          git add ascent/professional-communication-module-1.html .github/workflows/pcl-pronunciation-update-stress.yml
          git commit -m "Fix Module 1 update stress model and B1 pace"
          git push origin main
