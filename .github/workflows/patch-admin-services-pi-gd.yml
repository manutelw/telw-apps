name: Patch admin and services PI/GD links

on:
  push:
    branches:
      - feature/admin-services-pi-gd
    paths:
      - .github/workflows/patch-admin-services-pi-gd.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-services-pi-gd
      - name: Patch links and labels
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('ascent/admin-settings.html')
          text = admin.read_text()
          old = '<a class="app-card gd" href="../gd-lab/admin/"><strong>GD Lab</strong><span>Open GD topics, assignments, full-session recordings and results</span></a>'
          new = '<a class="app-card gd" href="../gd-lab/admin-builder.html"><strong>GD Lab</strong><span>Upload a JD, prepare GD topics and manage targeted student release</span></a>'
          assert text.count(old) == 1, f'Expected one Admin Hub GD card, found {text.count(old)}'
          text = text.replace(old, new)
          admin.write_text(text)

          home = Path('index.html')
          text = home.read_text()
          old_menu = '<a href="./gd-lab/">GD Lab</a><a data-admin-only="1" data-admin-href="./ascent/pcl.html">PCL · Admin only</a><a data-admin-only="1" data-admin-href="./ascent/live-mock.html">Live Mock Interview · Admin only</a><a data-admin-only="1" data-admin-href="./dugout/">Dugout PI Listening Lab · Admin only</a>'
          new_menu = '<a href="./gd-lab/">GD Lab</a><a href="./pi-lab/">PI Lab</a><a data-admin-only="1" data-admin-href="./ascent/pcl.html">PCL · Admin only</a><a data-admin-only="1" data-admin-href="./ascent/live-mock.html">Live Mock Interview · Admin only</a>'
          assert text.count(old_menu) == 1, f'Expected one services menu block, found {text.count(old_menu)}'
          text = text.replace(old_menu, new_menu)

          old_cards = '<a class="service-card" href="./ascent/cv-builder.html"><span class="service-icon">✓</span><h3>CV Builder &amp; Evaluator</h3><p>Diagnose CV quality, role fit, weak evidence and correction priorities.</p><span class="go">See the guide →</span></a><a class="service-card" data-admin-only="1" data-admin-href="./ascent/pcl.html">'
          new_cards = '<a class="service-card" href="./ascent/cv-builder.html"><span class="service-icon">✓</span><h3>CV Builder &amp; Evaluator</h3><p>Diagnose CV quality, role fit, weak evidence and correction priorities.</p><span class="go">See the guide →</span></a><a class="service-card" href="./gd-lab/"><span class="service-icon">GD</span><h3>GD Lab</h3><p>Listen, practise and prepare for JD-relevant group discussion topics.</p><span class="go">Open GD Lab →</span></a><a class="service-card" href="./pi-lab/"><span class="service-icon">PI</span><h3>PI Lab</h3><p>Listen to interview questions and model answers, then practise your own response.</p><span class="go">Open PI Lab →</span></a><a class="service-card" data-admin-only="1" data-admin-href="./ascent/pcl.html">'
          assert text.count(old_cards) == 1, f'Expected one services card insertion point, found {text.count(old_cards)}'
          text = text.replace(old_cards, new_cards)
          home.write_text(text)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/patch-admin-services-pi-gd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/admin-settings.html index.html .github/workflows/patch-admin-services-pi-gd.yml
          git commit -m "Connect PI and GD labs in admin and services"
          git push origin feature/admin-services-pi-gd
