name: Repair only incomplete unpublished Listening upload
on:
  push:
    branches: [telw-listening-deploy]
    paths: ['.github/workflows/ielts-listening-deploy.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the verified truncated draft audio metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import json,os,urllib.request
          sql="DELETE FROM listening_audio WHERE set_id=? AND part=1 AND size=2097152 AND EXISTS(SELECT 1 FROM listening_sets s WHERE s.id=listening_audio.set_id AND s.published_at IS NULL) RETURNING set_id,part,size"
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/b71ca81dd57b4ede28dfe80b68a3d9ba/d1/database/9a4570fd-7691-4d9d-abe2-7dbd9b0bbbaf/query',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'].strip(),'Content-Type':'application/json'},data=json.dumps({'sql':sql,'params':['listening-production-04-v2']}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if not data.get('success'): raise RuntimeError('Draft repair failed')
          print(json.dumps(data['result']))
