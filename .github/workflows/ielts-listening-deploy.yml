name: Clear only the identified Listening QA attempt
on:
  push:
    branches: [telw-listening-deploy]
    paths: ['.github/workflows/ielts-listening-deploy.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing credentials and identify only the QA attempt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import json,os,urllib.request
          print('Existing OpenAI Actions key configured: '+str(bool(os.environ.get('OPENAI_API_KEY','').strip())))
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/b71ca81dd57b4ede28dfe80b68a3d9ba/d1/database/9a4570fd-7691-4d9d-abe2-7dbd9b0bbbaf/query',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=json.dumps({'sql':"UPDATE listening_attempts SET status='abandoned' WHERE id='056059e5-78c0-4c61-b7be-c11a654acbd0' AND status='active' AND answers_json='{\"1\":\"QA preview\"}' AND learner_id IN (SELECT id FROM listening_learners WHERE email=?) RETURNING id,status,set_id",'params':['manutelw@gmail.com']}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if not data.get('success'): raise RuntimeError('Listening inspection failed')
          for result in data['result']:
              for row in result.get('results',[]):
                  print(json.dumps(row))
