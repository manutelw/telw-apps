name: Listening voice correction preflight
on:
  push:
    branches: [telw-listening-deploy]
    paths: ['.github/workflows/ielts-listening-deploy.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing credentials and identify only the QA attempt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import json,os,urllib.request
          print('Existing OpenAI Actions key configured: '+str(bool(os.environ.get('OPENAI_API_KEY','').strip())))
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/b71ca81dd57b4ede28dfe80b68a3d9ba/d1/database/9a4570fd-7691-4d9d-abe2-7dbd9b0bbbaf/query',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=json.dumps({'sql':"SELECT a.id,a.status,a.set_id,a.answers_json,a.playback_json,a.deadline FROM listening_attempts a JOIN listening_learners l ON l.id=a.learner_id WHERE l.email=? ORDER BY a.started_at DESC LIMIT 3",'params':['manutelw@gmail.com']}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if not data.get('success'): raise RuntimeError('Listening inspection failed')
          for result in data['result']:
              for row in result.get('results',[]):
                  answers=json.loads(row.pop('answers_json'))
                  row['is_exact_QA_attempt']=answers=={'1':'QA preview'}
                  row['answer_count']=len(answers)
                  print(json.dumps(row))
