name: Build PCL Module 9

on:
  push:
    paths:
      - '.github/workflows/pcl-module9.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-dev
      - name: Build Module 9 from verified Module 8 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('ascent/professional-communication-module-8.html')
          dst=Path('ascent/professional-communication-module-9.html')
          s=src.read_text(encoding='utf-8')
          s=s.replace('ASCENT · Professional Communication Lab · Module 8','ASCENT · Professional Communication Lab · Module 9',1)

          hero='''<section class="hero"><div class="eyebrow">Module 9</div><h1>Own a Mistake and Repair Confidence</h1><p class="lead">When something has gone wrong, take useful responsibility, explain the impact briefly, show what you are doing now and make the prevention step clear.</p><div class="steps"><div class="step active">1 · Train</div><div class="step">2 · Practise</div><div class="step">3 · Test</div><div class="step">4 · Review</div></div></section>'''
          s=re.sub(r'<section class="hero">.*?</section>',hero,s,count=1,flags=re.S)

          train='''<section class="panel" id="trainPanel"><div class="stage-title"><div><h2>Train</h2><p><b>Owning a mistake is not the same as making a long apology.</b> Your manager needs four things: what went wrong, what the impact is, what you are doing now, and how you will reduce the chance of a repeat.</p></div><span class="badge">Show me</span></div>
<div class="grid"><div class="card focus-card"><h3>The mistake-repair framework</h3><p>Keep the response short enough to sound professional, but complete enough to rebuild confidence.</p><div class="framework"><div class="fw"><b>1. Own</b><span>What specifically was my mistake or missed responsibility?</span></div><div class="fw"><b>2. Impact</b><span>What did it affect?</span></div><div class="fw"><b>3. Repair</b><span>What am I doing now to put it right?</span></div><div class="fw"><b>4. Prevent</b><span>What will I change so it is less likely to happen again?</span></div></div><div class="flow">Own → Impact → Repair → Prevent</div></div><div class="card"><h3>What to notice</h3><ul><li>Name the mistake directly. Do not hide it inside a long explanation.</li><li>Keep the impact factual. Do not exaggerate or minimise it.</li><li>Move quickly to the repair action already under way.</li><li>Give one realistic prevention step you can actually control.</li><li>If the manager asks why it happened, explain briefly without turning the explanation into an excuse.</li></ul></div><div class="card"><h3>Keep the relationship right</h3><ul><li>Avoid repeated apologies. One clear apology is enough when appropriate.</li><li>Do not blame pressure, another team or unclear instructions before owning your part.</li><li>Do not promise that the problem will “never happen again”.</li><li>Do not disappear into detail. The manager first needs confidence that the issue is contained.</li></ul></div></div>
<div class="model"><h3>Weak exchange</h3><div class="dialogue"><div class="turn manager"><b>Manager:</b> “The client received the old version of the pricing sheet. That created confusion on their side. What happened?”</div><div class="turn employee"><b>Employee:</b> “There were several files in the folder, and I was also rushing because the meeting had moved forward. I thought I had attached the latest one.”</div><div class="turn manager"><b>Manager:</b> “What have you done about it?”</div><div class="turn employee"><b>Employee:</b> “I’ve sent the correct file now. Sorry about that.”</div></div><p class="notice"><b>Why this is weak:</b> the explanation comes before ownership. The correction is mentioned, but the manager still does not know what the learner will change to prevent the same error.</p><div class="actions"><button class="btn ghost dialogue-play" data-dialogue="weak">▶ Hear the dialogue</button></div></div>
<div class="model"><h3>Stronger exchange</h3><div class="dialogue"><div class="turn manager"><b>Manager:</b> “The client received the old version of the pricing sheet. That created confusion on their side. What happened?”</div><div class="turn employee"><b>Employee:</b> “That was my mistake. I attached the older pricing sheet instead of the final version, so the client received incorrect information. I’ve already sent the correct file and asked them to use that version. Before I send the next client file, I’ll check the version number against the final folder.”</div><div class="turn manager"><b>Manager:</b> “All right. Why did the wrong file get picked up?”</div><div class="turn employee"><b>Employee:</b> “There were two similarly named files and I selected the wrong one. I should still have checked the version before sending. I’ll use the final folder and version check from now on.”</div></div><div class="framework-answer"><h4>See the framework inside the answer</h4><div class="framework-line"><span class="framework-tag">Own</span><span>“That was my mistake. I attached the older pricing sheet instead of the final version.”</span></div><div class="framework-line"><span class="framework-tag">Impact</span><span>“...so the client received incorrect information.”</span></div><div class="framework-line"><span class="framework-tag">Repair</span><span>“I’ve already sent the correct file and asked them to use that version.”</span></div><div class="framework-line"><span class="framework-tag">Prevent</span><span>“I’ll check the version number against the final folder.”</span></div></div><p class="notice"><b>Notice the shift:</b> the stronger response accepts the controllable mistake first, contains the problem, and gives the manager a reason to trust the next attempt.</p><div class="actions"><button class="btn primary dialogue-play" data-dialogue="strong">▶ Hear the dialogue</button></div></div>
<div class="compare-card"><h3>What changed?</h3><div class="compare-grid"><div class="compare-col"><h4>Weak response</h4><ul><li>Starts with circumstances</li><li>Ownership is blurred</li><li>Repair is incomplete</li><li>No prevention step</li></ul></div><div class="compare-col"><h4>Professional response</h4><ul><li>Names the mistake clearly</li><li>States the impact without drama</li><li>Shows immediate repair</li><li>Adds one realistic prevention step</li></ul></div></div><p class="notice"><b>Confidence is repaired by useful ownership and action, not by the number of times you say sorry.</b></p></div><div class="actions"><button class="btn primary" id="toPractice">I’m ready to practise</button></div><div class="status" id="trainStatus"></div></section>'''
          s=re.sub(r'<section class="panel" id="trainPanel">.*?</section>\n<section class="panel" id="practicePanel"',train+'\n<section class="panel" id="practicePanel"',s,count=1,flags=re.S)

          practice='''<section class="panel" id="practicePanel" hidden><div class="stage-title"><div><h2>Practise</h2><p>Your manager will raise a mistake. Listen, respond, then handle the follow-up. You may retry after feedback.</p></div><span class="badge">Help me practise</span></div><div class="scenario"><h3>Your situation</h3><p>You sent a meeting note to the team but left out one action owner. Because of that, the task was not picked up until the next day. Your manager asks what happened and what you will change.</p></div><div class="conversation-box"><div class="prompt-line" id="practicePrompt">Press “Begin dialogue”. Listen to your manager, then respond naturally.</div><div class="timer" id="practiceTimer">00:00</div><button class="btn primary" id="practiceBegin">Begin dialogue</button><button class="btn primary" id="practiceRecord" disabled>Record my response</button><button class="btn secondary" id="practiceStop" disabled>Stop</button><div class="status" id="practiceStatus"></div></div><div class="feedback" id="practiceFeedback" hidden></div><div class="actions"><button class="btn secondary" id="practiceRetry" hidden>Try the dialogue again</button><button class="btn primary" id="toTest" hidden>Move to the test</button></div></section>'''
          s=re.sub(r'<section class="panel" id="practicePanel".*?</section>\n<section class="panel" id="testPanel"',practice+'\n<section class="panel" id="testPanel"',s,count=1,flags=re.S)

          test='''<section class="panel" id="testPanel" hidden><div class="stage-title"><div><h2>Test</h2><p>Fresh situation. Two manager questions. No coaching before you answer.</p></div><span class="badge">Test me</span></div><div class="scenario"><h3>Your situation</h3><p>You updated a tracker but entered the wrong due date for one deliverable. A colleague followed that date and the work started late. Your manager asks you to respond and say how you will prevent a repeat.</p></div><div class="conversation-box"><div class="prompt-line" id="testPrompt">Press “Begin test dialogue”. Listen carefully and respond as you would at work.</div><div class="timer" id="testTimer">00:00</div><button class="btn primary" id="testBegin">Begin test dialogue</button><button class="btn primary" id="testRecord" disabled>Record my response</button><button class="btn secondary" id="testStop" disabled>Stop</button><div class="status" id="testStatus"></div></div><div class="feedback" id="testFeedback" hidden></div><div class="actions"><button class="btn primary" id="toReview" hidden>See my review</button></div></section>'''
          s=re.sub(r'<section class="panel" id="testPanel".*?</section>\n<section class="panel" id="reviewPanel"',test+'\n<section class="panel" id="reviewPanel"',s,count=1,flags=re.S)

          s=re.sub(r"const weakDialogue=.*?;\nconst strongDialogue=.*?;",'''const weakDialogue=[['manager','The client received the old version of the pricing sheet. That created confusion on their side. What happened?'],['employee','There were several files in the folder, and I was also rushing because the meeting had moved forward. I thought I had attached the latest one.'],['manager','What have you done about it?'],['employee','I’ve sent the correct file now. Sorry about that.']];\nconst strongDialogue=[['manager','The client received the old version of the pricing sheet. That created confusion on their side. What happened?'],['employee','That was my mistake. I attached the older pricing sheet instead of the final version, so the client received incorrect information. I’ve already sent the correct file and asked them to use that version. Before I send the next client file, I’ll check the version number against the final folder.'],['manager','All right. Why did the wrong file get picked up?'],['employee','There were two similarly named files and I selected the wrong one. I should still have checked the version before sending. I’ll use the final folder and version check from now on.']];''',s,count=1,flags=re.S)

          s=re.sub(r"function q\(mode,n\)\{.*?\}\nfunction scenario\(mode\)\{.*?\}",'''function q(mode,n){if(mode==='practice')return n===1?`${firstName}, yesterday’s meeting note did not name an owner for one action, so the task was only picked up today. What happened?`:'What will you change in the next meeting note?';return n===1?`${firstName}, the tracker showed the wrong due date for one deliverable, and the work started late. What happened?`:'How will you prevent that date error next time?'}\nfunction scenario(mode){return mode==='practice'?'The learner sent a meeting note but left out one action owner. The task was not picked up until the next day. The learner needs to own the mistake, explain the impact, repair the issue and state a realistic prevention step.':'The learner entered the wrong due date in a tracker. A colleague followed that date and the work started late. The learner needs to respond with useful ownership and a prevention step.'}''',s,count=1,flags=re.S)

          s=s.replace("form.append('module','8')","form.append('module','9')",1)
          s=re.sub(r"function saveProgress\(r,total\)\{.*?\}\nfunction renderReview\(\)\{.*?\}\nloadProfile\(\);",'''function saveProgress(r,total){let p={};try{p=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')}catch{}p['9']={completedAt:new Date().toISOString(),score:total,priority:r.priority_improvement,title:'Own a Mistake and Repair Confidence'};p.currentPriority=r.priority_improvement;p.nextModule=10;localStorage.setItem(PROGRESS_KEY,JSON.stringify(p))}\nfunction renderReview(){if(!testResult)return;const r=testResult.result,total=r.message.score+r.voice.score+r.people.score+r.judgement.score;let compare='Complete practice to compare it with the test.';if(practiceResult){const p=practiceResult.result,pt=p.message.score+p.voice.score+p.people.score+p.judgement.score;compare=`Practice ${pt}/20 → Test ${total}/20.`}saveProgress(r,total);document.getElementById('reviewContent').innerHTML=`<div class="review-box"><h3>Your test profile</h3><div class="big-score">${total}/20</div><p>${compare}</p><div class="scores"><div class="score"><span>Message</span><b>${r.message.score}/5</b></div><div class="score"><span>Voice</span><b>${r.voice.score}/5</b></div><div class="score"><span>People</span><b>${r.people.score}/5</b></div><div class="score"><span>Judgement</span><b>${r.judgement.score}/5</b></div></div><div class="progress-card"><h4>Carry this forward</h4><p>${escapeHtml(r.priority_improvement)}</p></div></div><div class="review-box"><h3>What your scores mean</h3><div class="capability-questions"><div class="capability-question"><b>Message:</b> Did I own the mistake, state the impact, show the repair action and name a prevention step?</div><div class="capability-question"><b>Voice:</b> Was my wording and pace calm, clear and easy to follow?</div><div class="capability-question"><b>People:</b> Did I avoid blame, over-apology and defensiveness?</div><div class="capability-question"><b>Judgement:</b> Did my repair and prevention steps genuinely reduce the business risk?</div></div><h4 style="color:var(--navy);margin:18px 0 6px">Priority improvement</h4><p>${escapeHtml(r.priority_improvement)}</p><h4 style="color:var(--navy);margin:16px 0 6px">What to change next time</h4><p>${escapeHtml(r.what_to_change)}</p><div class="progress-card"><h4>Next recommended unit</h4><p>Module 10 will build on this by helping you explain a decision when there is no perfect option.</p></div></div>`}\nloadProfile();''',s,count=1,flags=re.S)

          dst.write_text(s,encoding='utf-8')
          PY
      - name: Commit Module 9 and remove one-shot workflow
        run: |
          rm .github/workflows/pcl-module9.yml
          git config user.name "manutelw"
          git config user.email "manu@telw.co.in"
          git add ascent/professional-communication-module-9.html .github/workflows/pcl-module9.yml
          git commit -m "Build PCL Module 9 mistake repair"
          git push origin pcl-dev
