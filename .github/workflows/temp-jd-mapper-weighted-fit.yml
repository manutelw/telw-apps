name: Temporary JD mapper weighted fit patch

on:
  push:
    branches:
      - jd-mapper-weighted-fit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-weighted-fit
      - name: Patch learner and trainer weighted fit
        shell: python
        run: |
          from pathlib import Path
          p=Path('ascent/jd-interview-mapper.html');s=p.read_text()
          old="function updateSummary(){const c=counts();const total=currentCase?.requirements?.length||0;$('mappingSummary').innerHTML=`<span class=\"pill\">${total} requirements</span><span class=\"pill\">S ${c.S}</span><span class=\"pill\">T ${c.T}</span><span class=\"pill\">N ${c.N}</span>`;}"
          new="function fitMetrics(requirements,mappings){const byId=new Map((mappings||[]).map(m=>[String(m.requirement_id),m]));let earned=0,max=0,mapped=0;const core={S:0,T:0,N:0},secondary={S:0,T:0,N:0};(requirements||[]).forEach(r=>{const rating=byId.get(String(r.id))?.rating;if(!['S','T','N'].includes(rating))return;mapped++;const isCore=r.priority==='CORE',bucket=isCore?core:secondary;if(bucket[rating]!==undefined)bucket[rating]++;if(isCore){max+=3;earned+=rating==='S'?3:rating==='T'?2:0}else{max+=1;earned+=rating==='S'?1:rating==='T'?.5:0}});if(!mapped||!max)return null;const score=Math.round(earned/max*100),band=score>=75?'Strong':score>=55?'Moderate':'Limited';return{score,band,core,secondary,mapped};}function updateSummary(){const c=counts();const total=currentCase?.requirements?.length||0;const maps=[...document.querySelectorAll('.req')].map(card=>({requirement_id:card.dataset.id,rating:card.querySelector('input[type=\"radio\"]:checked')?.value}));const f=fitMetrics(currentCase?.requirements||[],maps);$('mappingSummary').innerHTML=`<span class=\"pill\">${total} requirements</span>${f?`<span class=\"pill\">Evidence Fit ${f.score}/100 · ${f.band}</span><span class=\"pill core\">CORE gaps ${f.core.N}</span>`:''}<span class=\"pill\">S ${c.S}</span><span class=\"pill\">T ${c.T}</span><span class=\"pill\">N ${c.N}</span>`;}"
          if old not in s: raise SystemExit('learner summary target not found')
          s=s.replace(old,new)
          old='<div id="requirements" class="req-list"></div>'
          new='<div class="status info" style="margin:0 0 14px"><strong>How Evidence Fit is calculated:</strong> CORE S = 3, T = 2, N = 0. SECONDARY S = 1, T = 0.5, N = 0. The result is converted to 0–100. It is a preparation indicator, not a selection probability.</div><div id="requirements" class="req-list"></div>'
          if old not in s: raise SystemExit('learner formula target not found')
          s=s.replace(old,new,1)
          old="const evidence=maps.length?`<div class=\"summary\"><span class=\"pill\">Evidence Map</span><span class=\"pill\">S ${cc.S}</span><span class=\"pill\">T ${cc.T}</span><span class=\"pill\">N ${cc.N}</span></div>`:`<div class=\"summary\"><span class=\"pill\">Not mapped</span></div>`;"
          new="const f=fitMetrics(c.requirements||[],maps);const evidence=maps.length?`<div class=\"summary\">${f?`<span class=\"pill\">Evidence Fit ${f.score}/100 · ${f.band}</span><span class=\"pill core\">CORE gaps ${f.core.N}</span>`:''}<span class=\"pill\">S ${cc.S}</span><span class=\"pill\">T ${cc.T}</span><span class=\"pill\">N ${cc.N}</span></div>`:`<div class=\"summary\"><span class=\"pill\">Not mapped</span></div>`;"
          if old not in s: raise SystemExit('learner history target not found')
          s=s.replace(old,new);p.write_text(s)

          p=Path('ascent/jd-interview-trainer.html');s=p.read_text()
          old="function mappingCounts(c){const x={S:0,T:0,N:0};(c.mappings||[]).forEach(m=>{if(x[m.rating]!==undefined)x[m.rating]++});return x}"
          new="function mappingCounts(c){const x={S:0,T:0,N:0};(c.mappings||[]).forEach(m=>{if(x[m.rating]!==undefined)x[m.rating]++});return x}function fitMetrics(c){const byId=new Map((c.mappings||[]).map(m=>[String(m.requirement_id),m]));let earned=0,max=0,mapped=0;const core={S:0,T:0,N:0};(c.requirements||[]).forEach(r=>{const rating=byId.get(String(r.id))?.rating;if(!['S','T','N'].includes(rating))return;mapped++;const isCore=r.priority==='CORE';if(isCore&&core[rating]!==undefined)core[rating]++;if(isCore){max+=3;earned+=rating==='S'?3:rating==='T'?2:0}else{max+=1;earned+=rating==='S'?1:rating==='T'?.5:0}});if(!mapped||!max)return null;const score=Math.round(earned/max*100),band=score>=75?'Strong':score>=55?'Moderate':'Limited';return{score,band,core};}"
          if old not in s: raise SystemExit('trainer metrics target not found')
          s=s.replace(old,new)
          old='<th>Student</th><th>Role</th><th>Requirements</th><th>Mapping</th><th>Status</th><th>Updated</th><th></th>'
          new='<th>Student</th><th>Role</th><th>Requirements</th><th>Mapping</th><th>Evidence Fit</th><th>Status</th><th>Updated</th><th></th>'
          if old not in s: raise SystemExit('trainer header target not found')
          s=s.replace(old,new)
          old="const m=mappingCounts(c);return `<tr><td class=\"student\"><strong>${esc(studentOf(c).full_name||'Student')}</strong><div class=\"small\">${esc(studentOf(c).student_id||'')} ${studentOf(c).batch?'· '+esc(studentOf(c).batch):''}</div></td><td class=\"role\"><strong>${esc(c.role_title||'Role not detected')}</strong><div class=\"small\">${esc(c.organisation||'Organisation not detected')}</div></td><td>${(c.requirements||[]).length}</td><td><div class=\"summary\"><span class=\"pill\">S ${m.S}</span><span class=\"pill\">T ${m.T}</span><span class=\"pill\">N ${m.N}</span></div></td><td>${esc(c.status)}</td>"
          new="const m=mappingCounts(c),f=fitMetrics(c);return `<tr><td class=\"student\"><strong>${esc(studentOf(c).full_name||'Student')}</strong><div class=\"small\">${esc(studentOf(c).student_id||'')} ${studentOf(c).batch?'· '+esc(studentOf(c).batch):''}</div></td><td class=\"role\"><strong>${esc(c.role_title||'Role not detected')}</strong><div class=\"small\">${esc(c.organisation||'Organisation not detected')}</div></td><td>${(c.requirements||[]).length}</td><td><div class=\"summary\"><span class=\"pill\">S ${m.S}</span><span class=\"pill\">T ${m.T}</span><span class=\"pill\">N ${m.N}</span></div></td><td>${f?`<strong>${f.score}/100 · ${f.band}</strong><div class=\"small\">CORE gaps ${f.core.N}</div>`:'Not mapped'}</td><td>${esc(c.status)}</td>"
          if old not in s: raise SystemExit('trainer row target not found')
          s=s.replace(old,new).replace("'<tr><td colspan=\"7\">No matching JD maps.</td></tr>'","'<tr><td colspan=\"8\">No matching JD maps.</td></tr>'")
          old="$('detailMeta').textContent=[c.organisation,studentOf(c).student_id,studentOf(c).batch,c.status].filter(Boolean).join(' · ');"
          new="const fit=fitMetrics(c);$('detailMeta').textContent=[c.organisation,studentOf(c).student_id,studentOf(c).batch,c.status,fit?`Evidence Fit ${fit.score}/100 · ${fit.band}`:null,fit?`CORE gaps ${fit.core.N}`:null].filter(Boolean).join(' · ');"
          if old not in s: raise SystemExit('trainer detail target not found')
          s=s.replace(old,new);p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html ascent/jd-interview-trainer.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add weighted JD CV evidence fit"
          git push