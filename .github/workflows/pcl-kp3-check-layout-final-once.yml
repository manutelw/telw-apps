name: PCL KP3 final comprehension layout once

on:
  push:
    branches: [pcl-standalone]
    paths:
      - '.github/workflows/pcl-kp3-check-layout-final-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-standalone
          fetch-depth: 0
      - name: Change only KP3 instruction and audio placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-1-3.html')
          s=p.read_text(encoding='utf-8')
          old='<section class="panel" id="checkPanel" hidden><div class="title"><div style="width:100%"><div class="actions" style="margin-top:0;margin-bottom:16px"><button class="listen" id="checkModelAudio">Hear the passage again</button></div></div><div><h2>2. Check your understanding</h2><p>Answer from the passage, and include the managerial elements shown.</p></div><span class="badge">3 questions</span></div>'
          new='<section class="panel" id="checkPanel" hidden><div class="title"><div><h2>2. Check your understanding</h2><p>Listen to the same passage once again and answer the following comprehension questions</p></div><div class="actions" style="margin-top:0;justify-content:flex-end"><button class="listen" id="checkModelAudio">Hear the passage again</button><span class="badge">3 questions</span></div></div>'
          if old not in s:
              raise RuntimeError('Expected current KP3 comprehension header not found; aborting without change')
          t=s.replace(old,new,1)
          if t.count('Listen to the same passage once again and answer the following comprehension questions') != 1:
              raise RuntimeError('Instruction replacement count invalid')
          p.write_text(t,encoding='utf-8')
          Path('.github/workflows/pcl-kp3-check-layout-final-once.yml').unlink()
          PY
      - name: Verify exact scope
        run: |
          git diff -- module-1-3.html | grep -q 'Listen to the same passage once again and answer the following comprehension questions'
          git diff -- module-1-3.html | grep -q 'justify-content:flex-end'
          git diff -- module-1-3.html | grep -q 'Hear the passage again'
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' .github/workflows/pcl-kp3-check-layout-final-once.yml module-1-3.html | sort)
          test "$changed" = "$expected"
      - name: Commit
        run: |
          git config user.name 'manutelw'
          git config user.email 'manutelw@gmail.com'
          git add module-1-3.html .github/workflows/pcl-kp3-check-layout-final-once.yml
          git commit -m 'Finalize KP3 comprehension instruction and audio placement'
          git push origin HEAD:pcl-standalone
