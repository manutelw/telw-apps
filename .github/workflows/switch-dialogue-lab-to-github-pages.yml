name: Switch Dialogue Lab To GitHub Pages
on:
  push:
    branches: [dialogue-lab-github-pages-launcher-20260831]
    paths: ['.github/workflows/switch-dialogue-lab-to-github-pages.yml']
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-lab-github-pages-launcher-20260831
      - name: Replace Cloudflare launcher with GitHub Pages launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          old='https://ascent-dialogue-lab-pages.pages.dev/dialogue-lab/#handoff='
          new='https://manutelw.github.io/telw-apps/dialogue-lab/#handoff='
          if old not in s:
              raise SystemExit('Expected Cloudflare Dialogue Lab launcher not found')
          if s.count(old) != 1:
              raise SystemExit('Unexpected launcher count')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ascent/admin-settings.html').read_text()
          assert 'https://manutelw.github.io/telw-apps/dialogue-lab/#handoff=' in s
          assert 'https://ascent-dialogue-lab-pages.pages.dev/dialogue-lab/#handoff=' not in s
          print('Dialogue Lab launcher now bypasses Cloudflare Access')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/switch-dialogue-lab-to-github-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ascent/admin-settings.html .github/workflows/switch-dialogue-lab-to-github-pages.yml
          git commit -m 'Bypass Cloudflare Access for Dialogue Lab launcher'
          git push
