name: Patch PI builder finish
on:
  push:
    branches: [feature/pi-lab-finish]
    paths: ['.github/workflows/patch-pi-builder-finish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-lab-finish
      - name: Patch PI builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pi-lab/admin-builder.html')
          s=p.read_text()
          s=s.replace('<title>PI Assignment Builder · ClarionPrep</title>','<title>PI Lab Admin · ClarionPrep</title>')
          s=s.replace('<script>','<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>\n<script>',1)
          s=s.replace('<section class="card"><span class="badge">TEST BUILDER</span><h1 style="margin-top:10px">Create a targeted PI assignment</h1><p>For this first test, you can upload the JD, enter up to 10 PI questions, and prepare a test recipient. Nothing is released to students yet.</p></section>','<section class="card"><span class="badge">PI LAB ADMIN</span><h1 style="margin-top:10px">Create a targeted PI question set</h1><p>Upload the JD. The builder will try to identify the company and role automatically. Review those details, then add up to 10 PI questions. Release remains unavailable until the secure backend is connected.</p></section>')
          s=s.replace('<div class="field"><label for="assignmentName">Assignment name</label><input id="assignmentName" placeholder="Example: Evalueserve PI Prep"></div>\n','')
          s=s.replace('<div class="field full"><label for="jdFile">Upload JD</label><input id="jdFile" type="file" accept=".pdf,.doc,.docx,.txt"><div id="jdMeta" class="help">Accepted for this draft: PDF, DOC, DOCX or TXT. The secure backend will later extract and store the JD.</div></div>','<div class="field full"><label for="jdFile">Upload JD</label><input id="jdFile" type="file" accept=".pdf,.doc,.docx,.txt"><div id="jdMeta" class="help">PDF, DOCX and TXT can be read in this browser. Older .DOC files may need to be saved as PDF or DOCX first. Company and Role remain editable.</div></div>')
          s=s.replace("function collect(){return{assignmentName:document.getElementById('assignmentName').value.trim(),companyName:document.getElementById('companyName').value.trim(),roleName:document.getElementById('roleName').value.trim(),testEmail:document.getElementById('testEmail').value.trim(),jdName:document.getElementById('jdFile').files[0]?.name||document.getElementById('jdFile').dataset.savedName||'',questions:qValues(),savedAt:new Date().toISOString()}}","function collect(){return{companyName:document.getElementById('companyName').value.trim(),roleName:document.getElementById('roleName').value.trim(),testEmail:document.getElementById('testEmail').value.trim(),jdName:document.getElementById('jdFile').files[0]?.name||document.getElementById('jdFile').dataset.savedName||'',questions:qValues(),savedAt:new Date().toISOString()}}")
          s=s.replace("assignmentName.value=d.assignmentName||'';companyName.value=d.companyName||'';","companyName.value=d.companyName||'';")
          s=s.replace("const head=[d.assignmentName,d.companyName,d.roleName].filter(Boolean).join(' · ')||'Untitled PI assignment';","const head=[d.companyName,d.roleName].filter(Boolean).join(' — ')||'Untitled PI question set';")
          old="jdFile.onchange=()=>{const f=jdFile.files[0];if(f){jdMeta.textContent='Selected JD: '+f.name+' ('+Math.ceil(f.size/1024)+' KB)'}};testEmail.oninput=()=>{sendTest.textContent='Send test link to '+(testEmail.value.trim()||'recipient')}}"
          new="jdFile.onchange=async()=>{const f=jdFile.files[0];if(!f)return;jdMeta.textContent='Reading '+f.name+'…';try{const text=await readJD(f);const found=extractCompanyRole(text);if(found.company&&!companyName.value.trim())companyName.value=found.company;if(found.role&&!roleName.value.trim())roleName.value=found.role;const bits=[];if(found.company)bits.push('Company: '+found.company);if(found.role)bits.push('Role: '+found.role);jdMeta.textContent=bits.length?'JD read successfully · '+bits.join(' · ')+' · Please review/edit these fields.':'JD read successfully, but Company/Role were not clear enough to fill automatically. Please enter them above.'}catch(err){jdMeta.textContent=err.message||'JD could not be read. Please enter Company and Role manually.'}};testEmail.oninput=()=>{sendTest.textContent='Send test link to '+(testEmail.value.trim()||'recipient')}}\nasync function readJD(file){const n=file.name.toLowerCase();if(n.endsWith('.txt'))return await file.text();if(n.endsWith('.pdf')){if(!window.pdfjsLib)throw Error('PDF reader did not load. Please try again or use DOCX/TXT.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),c=await page.getTextContent();out+='\\n'+c.items.map(x=>x.str).join(' ')}return out}if(n.endsWith('.docx')){if(!window.mammoth)throw Error('DOCX reader did not load. Please try again or use PDF/TXT.');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value||''}if(n.endsWith('.doc'))throw Error('Older .DOC files cannot be read reliably in the browser. Save this JD as PDF or DOCX and upload it again.');throw Error('Unsupported JD file type.')}\nfunction cleanLine(v){return String(v||'').replace(/\\s+/g,' ').replace(/^[\\-–—:|]+|[\\-–—:|]+$/g,'').trim()}\nfunction extractCompanyRole(text){const raw=String(text||'').replace(/\\r/g,'\\n');const lines=raw.split(/\\n+/).map(cleanLine).filter(Boolean).slice(0,180);const joined=lines.join('\\n');const pick=(patterns)=>{for(const re of patterns){const m=joined.match(re);if(m&&cleanLine(m[1]).length>1&&cleanLine(m[1]).length<140)return cleanLine(m[1])}return''};let company=pick([/(?:company(?: name)?|organisation|organization|employer)\\s*[:\\-]\\s*([^\\n]{2,120})/i,/(?:about)\\s+([A-Z][^\\n]{2,100})\\s*[:\\-]/]);let role=pick([/(?:position|role|job title|designation|position title)\\s*[:\\-]\\s*([^\\n]{2,120})/i,/(?:hiring for|opening for)\\s*[:\\-]?\\s*([^\\n]{2,120})/i]);if(!role){const r=lines.find(x=>/\\b(?:associate|analyst|manager|trainee|consultant|specialist|officer|executive|intern|lead|engineer|developer|researcher|coordinator)\\b/i.test(x)&&x.length<100);if(r)role=r}return{company,role}}"
          if old not in s:
              raise SystemExit('target init block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name manutelw
          git config user.email manutelw@gmail.com
          git add pi-lab/admin-builder.html
          git rm .github/workflows/patch-pi-builder-finish.yml
          git commit -m "Finish PI builder front-end workflow"
          git push origin feature/pi-lab-finish
