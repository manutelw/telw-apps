name: Add Dialogue Lab admin link temp

on:
  push:
    branches:
      - admin-link-dialogue-lab-20260830

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-link-dialogue-lab-20260830
      - name: Patch Admin Hub and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text(encoding='utf-8')
          if 'id="dialogueLabAppLink"' not in s:
              css='    .app-card.dialogue { background:linear-gradient(135deg,#3c4f76,#637aa8); }\n'
              needle='    .app-card.live { background:linear-gradient(135deg,#8d2638,#c24a5c); }\n'
              if needle not in s:
                  raise SystemExit('CSS insertion point not found')
              s=s.replace(needle, needle+css, 1)
              card='        <a id="dialogueLabAppLink" class="app-card dialogue" href="https://deploy-preview-43--telw-clarion-app.netlify.app/dialogue-lab/" target="_blank" rel="noopener noreferrer"><strong>Dialogue Lab – Test</strong><span>Open the separate Below-5 video and speaking-practice site</span></a>\n'
              needle2='        <button id="liveMockAppButton" class="app-card live" type="button"><strong>Live Mock Interview</strong><span>Open Live Mock with administrator access</span></button>\n'
              if needle2 not in s:
                  raise SystemExit('App card insertion point not found')
              s=s.replace(needle2, needle2+card, 1)
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/add-dialogue-lab-admin-link-temp.yml').unlink()
          PY
      - name: Commit final Admin Hub change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add separate Dialogue Lab test link to Admin Hub"
          git push origin HEAD:admin-link-dialogue-lab-20260830
