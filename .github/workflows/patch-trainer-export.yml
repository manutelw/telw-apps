name: Patch live trainer leaderboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Results task dropdown at source
        run: python .github/scripts/patch_results_task_filter.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/trainer.html
          if git diff --cached --quiet; then
            echo "No source change required"
            exit 0
          fi
          git commit -m "Fix Results task dropdown at source"
          git pull --rebase origin main
          git push origin HEAD:main
