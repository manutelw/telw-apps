name: Patch live trainer leaderboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch trainer leaderboard
        run: python .github/scripts/patch_trainer_leaderboard.py
      - name: Fix incomplete-response due count
        run: python .github/scripts/fix_incomplete_response_due.py
      - name: Commit trainer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/trainer.html
          if git diff --cached --quiet; then
            echo "No trainer changes required"
            exit 0
          fi
          git commit -m "Fix live dashboard and Excel leaderboard"
          git pull --rebase origin main
          git push origin HEAD:main
