name: Patch live trainer leaderboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Custom dashboard metrics
        run: python .github/scripts/patch_dashboard_custom_metrics.py
      - name: Remove extra Excel compliance tabs
        run: python .github/scripts/remove_excel_compliance_tabs.py
      - name: Add dashboard mean median mode and insight
        run: python .github/scripts/patch_dashboard_batch_stats.py
      - name: Add Weekly Completion navigation
        run: python .github/scripts/patch_weekly_completion_nav.py
      - name: Commit trainer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/trainer.html
          if git diff --cached --quiet; then
            echo "No trainer changes required"
            exit 0
          fi
          git commit -m "Update trainer dashboard and weekly completion navigation"
          git pull --rebase origin main
          git push origin HEAD:main
