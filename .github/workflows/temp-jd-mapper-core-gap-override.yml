name: Temporary JD mapper CORE gap override

on:
  push:
    branches:
      - jd-mapper-core-gap-override

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-core-gap-override
      - name: Apply CORE gap band override
        shell: python
        run: |
          from pathlib import Path

          files = [Path('ascent/jd-interview-mapper.html'), Path('ascent/jd-interview-trainer.html')]
          for p in files:
              s = p.read_text()
              old = "const score=Math.round(earned/max*100),band=score>=75?'Strong':score>=55?'Moderate':'Limited';"
              new = "const score=Math.round(earned/max*100);let band=score>=75?'Strong':score>=55?'Moderate':'Limited';if(score>=75&&core.N>=2)band='Moderate';"
              if old not in s:
                  raise SystemExit(f'band target not found in {p}')
              s = s.replace(old, new)
              p.write_text(s)

          p = Path('ascent/jd-interview-mapper.html')
          s = p.read_text()
          old = 'The result is converted to 0–100. It is a preparation indicator, not a selection probability.'
          new = 'The result is converted to 0–100. Strong requires at least 75/100 and no more than 1 CORE N gap; 2 or more CORE N gaps cap the band at Moderate. It is a preparation indicator, not a selection probability.'
          if old not in s:
              raise SystemExit('formula explanation target not found')
          p.write_text(s.replace(old, new, 1))

      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html ascent/jd-interview-trainer.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add CORE gap override to Evidence Fit bands"
          git push
