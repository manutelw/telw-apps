name: Patch learner bulk question readability

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch learner practice page
        run: python .github/scripts/patch_practice_bulk_question.py
      - name: Commit learner practice fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/practice-core.html
          git diff --cached --quiet && exit 0
          git commit -m "Make released learner questions readable"
          git pull --rebase origin main
          git push origin HEAD:main
