name: Apply GD ASCENT Gate
on:
  push:
    branches: [feature/gd-ascent-gate]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[gd-gate-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gd-ascent-gate
      - name: Apply access gate links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gd-lab/index.html')
          s=p.read_text()
          old='<title>GD Lab · ClarionPrep</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new='<title>GD Lab · ClarionPrep</title><script src="./access-gate.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if './access-gate.js' not in s:
              assert old in s
              s=s.replace(old,new,1)
              p.write_text(s)

          p=Path('gd-lab/learn/index.html')
          s=p.read_text()
          old='<title>GD Basics · ClarionPrep</title>'
          new='<title>GD Basics · ClarionPrep</title><script src="../access-gate.js"></script>'
          if '../access-gate.js' not in s:
              assert old in s
              s=s.replace(old,new,1)
              p.write_text(s)

          p=Path('ascent/dashboard.html')
          s=p.read_text()
          anchor='<a class="nav-button" href="./jd-interview-mapper.html">JD Interview</a>'
          add=anchor+'\n        <a class="nav-button" href="../gd-lab/">GD Lab</a>'
          if 'href="../gd-lab/">GD Lab</a>' not in s:
              assert anchor in s
              s=s.replace(anchor,add,1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gd-lab/index.html gd-lab/learn/index.html ascent/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Gate GD Lab behind ASCENT student login [gd-gate-applied]"
          git push origin HEAD:feature/gd-ascent-gate
