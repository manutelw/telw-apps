name: Clean Dialogue Lab PR Isolation
on:
  push:
    branches: [dialogue-lab-separate-site-20260830]
    paths: ['.github/workflows/rebuild-dialogue-lab-access.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-lab-separate-site-20260830
          fetch-depth: 0
      - name: Keep only the separate Dialogue Lab app in this PR
        run: |
          git fetch origin main
          git checkout origin/main -- ascent/admin-settings.html
          rm -f .github/workflows/add-dialogue-lab-admin-link.yml
          rm -f .github/workflows/rebuild-dialogue-lab-access.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Dialogue Lab PR isolated from ASCENT'
          git push origin dialogue-lab-separate-site-20260830
