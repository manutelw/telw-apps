name: One-time Results Summary Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-results-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add protected Results summary script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/trainer.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./trainer-results-summary.js?v=20260827-summary1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('trainer.html has no closing body tag')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify Results summary guard
        run: |
          grep -F 'trainer-results-summary.js?v=20260827-summary1' ascent/trainer.html
          grep -F 'window.renderResultsTable=renderStudentSummaryResults' ascent/trainer-results-summary.js
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-results-summary.yml
          git config user.name "ASCENT Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/trainer.html ascent/trainer-results-summary.js .github/workflows/one-time-results-summary.yml
          git commit -m "Keep Results page student-level only"
          git push origin main
