name: Patch Stable Dialogue Lab Launcher
on:
  push:
    branches: [dialogue-lab-admin-launcher-stable-20260830]
    paths: ['.github/workflows/patch-dialogue-lab-stable-launcher.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-lab-admin-launcher-stable-20260830
      - name: Replace old relay handoff with verified endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          const_marker='    const LIVE_MOCK_ADMIN_HANDOFF_URL = SUPABASE_URL + "/functions/v1/live-mock-admin-handoff";'
          new_const=const_marker+'\n    const DIALOGUE_LAB_ADMIN_HANDOFF_URL = SUPABASE_URL + "/functions/v1/dialogue-lab-admin-handoff";'
          if 'DIALOGUE_LAB_ADMIN_HANDOFF_URL' not in s:
              if const_marker not in s: raise SystemExit('Live Mock handoff constant not found')
              s=s.replace(const_marker,new_const,1)
          start=s.find('    async function openDialogueLabAdmin() {')
          end=s.find('    async function enterDemoStudent(demoMode) {',start)
          if start<0 or end<0: raise SystemExit('Dialogue Lab admin function markers not found')
          fn='''    async function openDialogueLabAdmin() {\n      const button = document.getElementById("dialogueLabAppLink");\n      button.disabled = true;\n      setAppHubStatus("Opening Dialogue Lab with free administrator access…");\n      try {\n        const response = await fetch(DIALOGUE_LAB_ADMIN_HANDOFF_URL,{method:"POST",headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({ascent_session_token:session.sessionToken})});\n        const result = await response.json().catch(()=>({}));\n        if(!response.ok || result.ok!==true || !result.session_token) throw new Error(result.message||"Dialogue Lab administrator access could not be opened.");\n        const url = "https://ascent-dialogue-lab-pages.pages.dev/dialogue-lab/#handoff=" + encodeURIComponent(result.session_token);\n        setAppHubStatus("Dialogue Lab administrator access ready.","success");\n        window.open(url,"_blank","noopener,noreferrer");\n      } catch(error) {\n        setAppHubStatus(error.message||"Dialogue Lab administrator access could not be opened.","error");\n      } finally {\n        button.disabled = false;\n      }\n    }\n\n'''
          s=s[:start]+fn+s[end:]
          if 'deploy-preview-43--telw-clarion-app.netlify.app' in s: raise SystemExit('Old preview URL still present')
          if 'admin-entry.html#handoff=' in s: raise SystemExit('Old relay still present')
          if 'ascent-dialogue-lab-pages.pages.dev/dialogue-lab/#handoff=' not in s: raise SystemExit('Stable Dialogue Lab URL missing')
          p.write_text(s)
          PY
      - name: Commit only ASCENT launcher change
        run: |
          rm -f .github/workflows/patch-dialogue-lab-stable-launcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use stable verified Dialogue Lab admin launcher'
          git push origin dialogue-lab-admin-launcher-stable-20260830
