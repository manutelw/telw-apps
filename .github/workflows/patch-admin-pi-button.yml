name: One-time Admin PI button patch
on:
  push:
    branches: [feature/admin-pi-button]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-pi-button
      - name: Add PI Lab button to Admin Hub
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          css="    .app-card.gd { background:linear-gradient(135deg,#244f63,#3b7f97); }"
          css_new=css+"\n    .app-card.pi { background:linear-gradient(135deg,#6f3d85,#9b63b7); }"
          if s.count(css)!=1:
              raise SystemExit('PI CSS anchor not found exactly once')
          s=s.replace(css,css_new,1)
          anchor='        <a class="app-card gd" href="../gd-lab/admin/"><strong>GD Lab</strong><span>Open GD topics, assignments, full-session recordings and results</span></a>'
          button=anchor+'\n        <a class="app-card pi" href="../pi-lab/" target="_blank" rel="noopener noreferrer"><strong>PI Lab</strong><span>Open PI learn-and-repeat practice with administrator access</span></a>'
          if s.count(anchor)!=1:
              raise SystemExit('GD Lab anchor not found exactly once')
          s=s.replace(anchor,button,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/admin-settings.html
          git commit -m "Add PI Lab to Admin Hub"
          git rm .github/workflows/patch-admin-pi-button.yml
          git commit -m "Remove one-time Admin PI button workflow"
          git push origin feature/admin-pi-button
