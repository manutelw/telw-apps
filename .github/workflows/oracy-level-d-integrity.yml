name: ORACY Level D Integrity
on:
  pull_request:
    paths:
      - 'oracy/unit-61.html'
      - 'oracy/unit-61-content.js'
      - 'oracy/unit-61.js'
      - 'oracy/unit-6*.html'
      - 'oracy/unit-6*-content.js'
      - 'oracy/unit-6*.js'
      - 'oracy/unit-7*.html'
      - 'oracy/unit-7*-content.js'
      - 'oracy/unit-7*.js'
      - 'oracy/unit-8*.html'
      - 'oracy/unit-8*-content.js'
      - 'oracy/unit-8*.js'
      - 'oracy/unit-90.html'
      - 'oracy/unit-90-content.js'
      - 'oracy/unit-90.js'
      - 'oracy/level-d-units-2-30.js'
      - 'oracy/level-d-vocabulary-runtime.js'
      - 'oracy/level-system-d-2-30.js'
      - 'oracy/level-system-d.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
      - 'supabase/functions/oracy-voice/index.ts'
      - 'supabase/functions/oracy-voice/course-units-62-90.ts'
      - '.github/scripts/build_oracy_level_d_units_2_30.py'
      - '.github/oracy-d1a-unit1.lock'
      - '.github/scripts/oracy_d1a_unit1_freeze_check.py'
      - '.github/workflows/oracy-level-d-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'oracy/unit-61.html'
      - 'oracy/unit-61-content.js'
      - 'oracy/unit-61.js'
      - 'oracy/unit-6*.html'
      - 'oracy/unit-6*-content.js'
      - 'oracy/unit-6*.js'
      - 'oracy/unit-7*.html'
      - 'oracy/unit-7*-content.js'
      - 'oracy/unit-7*.js'
      - 'oracy/unit-8*.html'
      - 'oracy/unit-8*-content.js'
      - 'oracy/unit-8*.js'
      - 'oracy/unit-90.html'
      - 'oracy/unit-90-content.js'
      - 'oracy/unit-90.js'
      - 'oracy/level-d-units-2-30.js'
      - 'oracy/level-d-vocabulary-runtime.js'
      - 'oracy/level-system-d-2-30.js'
      - 'oracy/level-system-d.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
      - 'supabase/functions/oracy-voice/index.ts'
      - 'supabase/functions/oracy-voice/course-units-62-90.ts'
      - '.github/scripts/build_oracy_level_d_units_2_30.py'
      - '.github/oracy-d1a-unit1.lock'
      - '.github/scripts/oracy_d1a_unit1_freeze_check.py'
      - '.github/workflows/oracy-level-d-integrity.yml'
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify D1A Unit 1 and frozen courses
        run: |
          python .github/scripts/oracy_course_integrity_check.py
          python .github/scripts/oracy_d1a_unit1_freeze_check.py
          python .github/scripts/build_oracy_level_d_units_2_30.py
          git diff --exit-code
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}};vm.createContext(s);
          vm.runInContext(fs.readFileSync('oracy/unit-61-content.js','utf8'),s);
          const u=s.window.ORACY_UNIT;
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          ok(u.unitNo===61&&u.localUnitNo===1&&u.level==='D1A','Unit identity');
          ok(u.title==='The Story So Far','Unit title');
          ok(u.keyPoints.length===3,'Three Key Points');
          ok(u.checks.length===12&&Object.keys(u.oral).length===2&&Object.keys(u.pron).length===5,'15-check architecture');
          ok(u.passages.kp1.length>=10&&u.passages.kp1.length<=12,'Media interview turn count');
          ok(u.passages.kp2.length>=10&&u.passages.kp2.length<=12,'Conversation turn count');
          const radioWords=u.passages.kp3[0][2].trim().split(/\s+/).length;
          ok(radioWords>=225&&radioWords<=275,'Radio profile length');
          ok(Object.keys(u.speaking).length===5&&u.speaking.s5.prompt.includes('75–90-second'),'Speaking tasks');
          ok(u.conversation.maxLearnerTurns===4&&u.speaking.s4.title==='You Thought You Knew Me','Four-turn AI conversation');
          const page=fs.readFileSync('oracy/unit-61.html','utf8');
          ok(page.includes('unit-renderer-c.js')&&page.includes('unit-shared.js')&&page.includes('conversation-shared.js')&&page.includes('level-system-d.js'),'Shared shell');
          ok(page.includes('unit-61.js'),'Unit vocabulary runtime');
          ok(!/textarea|contenteditable|type=["']text/i.test(page+fs.readFileSync('oracy/unit-61-content.js','utf8')),'Spoken-only rule');
          const vocab=fs.readFileSync('oracy/unit-61.js','utf8');
          ok((vocab.match(/\{w:\[/g)||[]).length===3,'One vocabulary bank per Key Point');
          ok((vocab.match(/class=\"u61record\"/g)||[]).length===1,'Per-item recording control template');
          for(const rule of ['Hear my sentence','Now make your own sentence.','data-attempt="0"','Good.','one improved attempt','Number(btn.dataset.attempt||0)>=2'])ok(vocab.includes(rule),'Vocabulary recording rule: '+rule);
          ok(!vocab.includes('Tap test')&&!vocab.includes('Check each meaning in context')&&!vocab.includes('u61opts'),'No passive vocabulary meaning quiz');
          ok(vocab.includes("form.append('action','evaluate')")&&vocab.includes("form.append('unit_no','61')"),'Protected voice feedback route');
          const index=fs.readFileSync('oracy/index.html','utf8'),admin=fs.readFileSync('oracy/admin.html','utf8'),voice=fs.readFileSync('supabase/functions/oracy-voice/index.ts','utf8');
          for(const x of ['D1A','D1B','D2A','D2B','from:61,to:67','availableTo:90'])ok(index.includes(x),'Index: '+x);
          ok(admin.includes('Open Level D · D1A Unit 1')&&admin.includes("preview('/oracy/unit-61.html')"),'Admin preview');
          ok(voice.includes('61:{')&&voice.includes('make one reasonable but inaccurate assumption'),'Voice configuration');
          const source=fs.readFileSync('oracy/level-d-units-2-30.js','utf8'),vocabRuntime=fs.readFileSync('oracy/level-d-vocabulary-runtime.js','utf8'),voiceUnits=fs.readFileSync('supabase/functions/oracy-voice/course-units-62-90.ts','utf8');
          for(let local=2;local<=30;local++){
            const n=local+60,ctx={window:{ORACY_D_LOCAL_UNIT:local}};vm.createContext(ctx);vm.runInContext(source,ctx,{filename:'level-d-units-2-30.js'});const d=ctx.window.ORACY_UNIT;
            ok(d.unitNo===n&&d.localUnitNo===local&&d.level===(local<=7?'D1A':local<=15?'D1B':local<=22?'D2A':'D2B'),`Unit ${local} identity`);
            ok(d.keyPoints.length===3&&d.checks.length===12&&Object.keys(d.oral).length===2&&Object.keys(d.pron).length===5,`Unit ${local} 15-check architecture`);
            ok(d.passages.kp1.length>=10&&d.passages.kp1.length<=12&&d.passages.kp2.length>=10&&d.passages.kp2.length<=12,`Unit ${local} conversation turn counts`);
            const radio=d.passages.kp3[0][2],words=radio.trim().split(/\s+/).length;ok(words>=225&&words<=275&&radio.length<=2000,`Unit ${local} radio profile length`);
            ok(d.vocabulary.length===3&&d.vocabulary.every(x=>x.words.length>=5&&x.idioms.length>=2&&x.idioms.length<=3),`Unit ${local} vocabulary banks`);
            ok(Object.keys(d.speaking).length===5&&d.speaking.s5.prompt.includes('75–90-second'),`Unit ${local} speaking architecture`);
            ok(d.conversation.maxLearnerTurns===4,`Unit ${local} four-turn conversation`);
            const html=fs.readFileSync(`oracy/unit-${n}.html`,'utf8'),content=fs.readFileSync(`oracy/unit-${n}-content.js`,'utf8'),boot=fs.readFileSync(`oracy/unit-${n}.js`,'utf8');
            for(const file of ['unit-renderer-c.js','unit-shared.js','conversation-shared.js','level-d-vocabulary-runtime.js','level-system-d-2-30.js'])ok(html.includes(file),`Unit ${local} shared shell: ${file}`);
            ok(!/textarea|contenteditable|type=["']text/i.test(html+content),'Spoken-only unit page');
            ok(boot.includes('initLevelDVocabulary'),'Per-unit protected vocabulary bootstrap');
            ok(voiceUnits.includes(`[${n},`),`Unit ${local} voice configuration`);
          }
          for(const rule of ['Hear my sentence','Now make your own sentence.','Good.','one improved attempt','Number(btn.dataset.attempt||0)>=2'])ok(vocabRuntime.includes(rule),'Shared Level D vocabulary rule: '+rule);
          ok(!vocabRuntime.includes('Tap test')&&!vocabRuntime.includes('Check each meaning in context'),'No passive vocabulary quizzes in Units 2-30');
          ok(index.includes('availableTo:67')&&index.includes('availableTo:75')&&index.includes('availableTo:82')&&index.includes('availableTo:90'),'All Level D units available in index');
          ok(admin.includes('Level D learner assignment')&&admin.includes("action:'admin_set_assignment'"),'Protected Level D assignment controls');
          ok(voice.includes('COURSE_UNITS_62_90')&&voice.includes('unitNo>=61&&unitNo<=90'),'All Level D voice units use learner-facing numbering');
          console.log('ORACY D1A Unit 1 integrity OK');
          NODE
