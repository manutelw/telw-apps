name: PCL Release Bootstrap
on:
  push:
    branches: [pcl-standalone]
    paths: ['.github/workflows/pcl-release-bootstrap.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-standalone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore tested PCL release sources
        shell: bash
        run: |
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/units.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/build-modules.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/generate-audio.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/test-unit.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/freeze-unit.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/verify-frozen.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/live-e2e.mjs'
          mkdir -p 'pcl'
          printf '%s' '' | base64 -d > 'pcl/update-index.mjs'
          mkdir -p 'supabase/functions/pcl-pilot-1'
          printf '%s' '' | base64 -d > 'supabase/functions/pcl-pilot-1/index.ts'
          mkdir -p 'supabase/functions/pcl-pilot-1'
          printf '%s' '' | base64 -d > 'supabase/functions/pcl-pilot-1/module-specs.ts'
          mkdir -p '.github/workflows'
          printf '%s' '' | base64 -d > '.github/workflows/pcl-units-seal.yml'
      - name: Build, test and freeze Units 2-14
        shell: bash
        run: |
          set -euo pipefail
          node pcl/build-modules.mjs
          for attempt in 1 2 3 4; do
            node pcl/generate-audio.mjs && break
            test "$attempt" -lt 4 || exit 1
            sleep 10
          done
          node pcl/update-index.mjs
          for unit in {2..14}; do
            node pcl/test-unit.mjs "$unit"
            node pcl/freeze-unit.mjs "$unit"
          done
          node pcl/verify-frozen.mjs
          git fetch origin pcl-unit1-frozen-2026-09-08
          git diff --exit-code origin/pcl-unit1-frozen-2026-09-08 -- module-1-1.html module-1-2.html module-1-3.html audio/unit-1
          test "$(find . -maxdepth 1 -type f -name 'module-*-*.html' | wc -l)" -eq 42
          test "$(find audio -type f -name '*.mp3' | wc -l)" -eq 252
          test "$(find pcl/frozen -type f -name 'unit-*.sha256' | wc -l)" -eq 13
          test "$(grep -oE 'href="./module-[0-9]+-[0-9]+.html"' index.html | wc -l)" -eq 42
          if grep -Eni 'serviceWorker|speechSynthesis|heygen|localStorage|indexedDB|/ascent/|download[[:space:]]*=' module-{2..14}-*.html; then exit 1; fi
      - name: Commit sealed units and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex PCL Release"
          git config user.email "actions@users.noreply.github.com"
          git add pcl/units.mjs pcl/build-modules.mjs pcl/generate-audio.mjs pcl/test-unit.mjs pcl/freeze-unit.mjs pcl/verify-frozen.mjs pcl/live-e2e.mjs supabase/functions/pcl-pilot-1 module-2-*.html audio/unit-2 pcl/frozen/unit-2.sha256
          git commit -m "Build and freeze PCL Unit 2"
          for unit in {3..14}; do
            git add "module-${unit}-1.html" "module-${unit}-2.html" "module-${unit}-3.html" "audio/unit-${unit}" "pcl/frozen/unit-${unit}.sha256"
            git commit -m "Build and freeze PCL Unit ${unit}"
          done
          git add index.html pcl/update-index.mjs
          git commit -m "Complete PCL 14-unit production release"
          git push origin HEAD:pcl-standalone
