name: One-time PI GD voice patch
on:
  push:
    branches:
      - feature/pi-gd-voices
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-gd-voices
      - name: Patch PI voice roles
        run: python .github/scripts/patch_pi_gd_voices.py
      - name: Remove one-time patch files
        run: rm .github/scripts/patch_pi_gd_voices.py .github/workflows/patch-pi-gd-voices.yml
      - name: Commit patched PI Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pi-lab/index.html .github/scripts/patch_pi_gd_voices.py .github/workflows/patch-pi-gd-voices.yml
          git commit -m "Use GD voices in PI Lab"
          git push origin HEAD:feature/pi-gd-voices
