name: One-off landing page Placement Pass visual patch
on:
  push:
    branches: [landing-pass-human-banner-20260912]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing-pass-human-banner-20260912
      - name: Replace only the Placement Readiness Pass visual
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=""".bundle-image-wrap{margin:18px 0 0;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 16px 38px rgba(23,57,93,.13);line-height:0}.bundle-image-learn{display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer;line-height:0}.bundle-image-learn img{display:block;width:100%;height:auto}.bundle-register-hit{position:absolute;left:48.6%;top:61.5%;width:16.7%;height:20%;z-index:4;border-radius:9px;background:transparent}@media(max-width:760px){.bundle-image-wrap{border-radius:12px}.bundle-register-hit{left:48.2%;top:60.5%;width:17.4%;height:22%}}"""
          if '.bundle-image-wrap{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          b64='''[... ELLIPSIZATION ...]'''
          replacement=f'''<section id="bundle" class="bundle-image-wrap"><button class="bundle-image-learn learn" data-product="PASS" type="button" aria-label="Learn more about the Placement Readiness Pass"><img src="data:image/jpeg;base64,{b64}" alt="Placement Readiness Pass — ₹3,999"></button><a class="bundle-register-hit" href="/account/?product=PLACEMENT_PASS" aria-label="Register and unlock the Placement Readiness Pass"></a></section>'''
          s,n=re.subn(r'<section id="bundle" class="bundle">.*?</section>',replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Placement Readiness Pass section not found exactly once; no file changed.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit only landing page
        shell: bash
        run: |
          git rm .github/workflows/landing-pass-human-oneoff.yml
          git add index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Use human Placement Readiness Pass banner on landing page"
          git push
