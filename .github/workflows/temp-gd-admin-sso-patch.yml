name: Temporary GD Admin Hub Patch
on:
  push:
    branches: [feature/gd-admin-sso]
    paths:
      - '.github/workflows/temp-gd-admin-sso-patch.yml'
      - 'gd-lab/admin/index.html'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gd-admin-sso
      - name: Add direct GD Lab admin tile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          if 'class="app-card gd"' not in s:
              s=s.replace('.app-card.dialogue { background:linear-gradient(135deg,#3c4f76,#637aa8); }', '.app-card.dialogue { background:linear-gradient(135deg,#3c4f76,#637aa8); }\n    .app-card.gd { background:linear-gradient(135deg,#244f63,#3b7f97); }')
              anchor='<button id="dialogueLabAppLink" class="app-card dialogue" type="button"><strong>Dialogue Lab – Test</strong><span>Open the separate Below-5 video and speaking-practice site with free admin access</span></button>'
              tile=anchor+'\n        <a class="app-card gd" href="../gd-lab/admin/"><strong>GD Lab</strong><span>Open GD topics, assignments, full-session recordings and results</span></a>'
              if anchor not in s:
                  raise SystemExit('Admin app-grid anchor not found')
              s=s.replace(anchor,tile,1)
              p.write_text(s)
          PY
          if git diff --quiet -- ascent/admin-settings.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ascent/admin-settings.html
          git commit -m 'Add direct GD Lab access to Admin Hub'
          git push origin HEAD:feature/gd-admin-sso