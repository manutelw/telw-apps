name: Remove duplicate Resume service
on:
  push:
    branches: [feature/remove-resume-service]
    paths: ['.github/workflows/remove-resume-service.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-resume-service
      - name: Remove duplicate Resume service entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          menu='<a href="./ascent/resume.html">Résumé</a>'
          card='<a class="service-card" href="./ascent/resume.html"><span class="service-icon">CV</span><h3>Résumé</h3><p>Strengthen positioning, relevance, evidence and interview defence.</p><span class="go">See the guide →</span></a>'
          if menu not in s:
              raise SystemExit('Resume menu entry not found')
          if card not in s:
              raise SystemExit('Resume service card not found')
          s=s.replace(menu,'',1).replace(card,'',1)
          p.write_text(s)
          PY
          rm .github/workflows/remove-resume-service.yml
      - name: Commit cleanup
        run: |
          git config user.name "manutelw"
          git config user.email "manutelw@gmail.com"
          git add index.html .github/workflows/remove-resume-service.yml
          git commit -m "Remove duplicate Resume service entry"
          git push
