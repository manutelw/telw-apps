name: One-time trainer PI access patch
on:
  push:
    branches:
      - feature/trainer-pi-access
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-pi-access
      - name: Patch trainer PI access
        run: python .github/scripts/patch_trainer_pi_access.py
      - name: Remove one-time patch files
        run: rm .github/scripts/patch_trainer_pi_access.py .github/workflows/patch-trainer-pi-access.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/trainer-results-summary.js pi-lab/index.html .github/scripts/patch_trainer_pi_access.py .github/workflows/patch-trainer-pi-access.yml
          git commit -m "Connect PI question bank to trainer portal"
          git push origin HEAD:feature/trainer-pi-access
