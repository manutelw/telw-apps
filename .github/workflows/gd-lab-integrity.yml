name: GD Lab Integrity
on:
  pull_request:
    paths:
      - 'gd-lab/**'
      - '.github/workflows/gd-lab-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'gd-lab/**'
      - '.github/workflows/gd-lab-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GD Lab standalone files
        run: |
          test -f gd-lab/index.html
          test -f gd-lab/admin/index.html
          grep -q "gd-session-recordings" gd-lab/index.html
          grep -q "admin_turn" gd-lab/admin/index.html
          grep -q "telw-gd-admin" gd-lab/admin/index.html
          ! grep -R "functions/ascent\|ascent/recording-vault" gd-lab
