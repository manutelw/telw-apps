name: PCL Module 1 five refinements

on:
  push:
    paths:
      - '.github/workflows/pcl-module1-five-refinements.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine Module 1
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/professional-communication-module-1.html')
          s=p.read_text(encoding='utf-8')

          # 1) Extra visual treatment for tagged framework inside Ravi's answer + comparison/review blocks.
          old='.smallnote{font-size:12px;color:#7a8998;line-height:1.5;margin-top:12px}'
          new='''.smallnote{font-size:14px;color:#7a8998;line-height:1.55;margin-top:12px}.framework-answer{margin-top:14px;padding:16px;border:2px solid #9fc2df;border-radius:12px;background:#f5f9fd}.framework-answer h4{margin:0 0 12px;color:var(--navy);font-size:18px}.framework-line{display:grid;grid-template-columns:165px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid #d6e4ef;font-size:16px;line-height:1.55}.framework-line:last-child{border-bottom:0}.framework-tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#143a60;color:#fff;font-size:13px;font-weight:800;text-align:center}.compare-card{margin-top:18px;padding:18px;border:1px solid #b9cfe1;border-radius:14px;background:#f7fbff}.compare-card h3{margin:0 0 10px;color:var(--navy);font-size:19px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-col{padding:14px;border-radius:11px;background:#fff;border:1px solid var(--border)}.compare-col h4{margin:0 0 8px;color:var(--navy);font-size:17px}.compare-col ul{margin:0;padding-left:20px;color:#4f6579;font-size:16px;line-height:1.6}.compare-message{margin:14px 0 0;font-size:17px;line-height:1.6;color:#40586e;font-weight:700}.capability-questions{display:grid;gap:10px;margin-top:12px}.capability-question{padding:12px 14px;border-radius:10px;background:#f4f8fc;border:1px solid #d9e3ed;font-size:15px;line-height:1.5}.capability-question b{color:var(--navy)}'''
          assert old in s, 'CSS anchor missing'
          s=s.replace(old,new,1)
          s=s.replace('@media(max-width:760px){.steps,.scores{grid-template-columns:1fr 1fr}', '@media(max-width:760px){.steps,.scores{grid-template-columns:1fr 1fr}.compare-grid{grid-template-columns:1fr}.framework-line{grid-template-columns:1fr}',1)

          # 2) Explain why the weak version is weak.
          old='''<div class="model"><h3>Weak exchange</h3><div class="dialogue"><div class="turn manager"><b>Manager:</b> “Ravi, can you give me a quick update on the report, please? Are we still on track?”</div><div class="turn employee"><b>Employee:</b> “Well, there’s been a bit of a problem with the report. I was waiting for some figures from the other team and, yeah, I’m following up with them. So hopefully I should have it done soon.”</div><div class="turn manager"><b>Manager:</b> “Right. When do you expect to have it?”</div><div class="turn employee"><b>Employee:</b> “I’m not completely sure yet. I’m waiting to hear back from them.”</div></div><div class="actions"><button class="btn ghost dialogue-play" data-dialogue="weak">▶ Hear the dialogue</button></div></div>'''
          new='''<div class="model"><h3>Weak exchange</h3><div class="dialogue"><div class="turn manager"><b>Manager:</b> “Ravi, can you give me a quick update on the report, please? Are we still on track?”</div><div class="turn employee"><b>Employee:</b> “Well, there’s been a bit of a problem with the report. I was waiting for some figures from the other team and, yeah, I’m following up with them. So hopefully I should have it done soon.”</div><div class="turn manager"><b>Manager:</b> “Right. When do you expect to have it?”</div><div class="turn employee"><b>Employee:</b> “I’m not completely sure yet. I’m waiting to hear back from them.”</div></div><p class="notice"><b>Why this update is weak:</b> the current position is vague, the background takes too much space, there is no firm next step, and ownership is unclear. The manager has to ask another question just to discover when the work may be ready.</p><div class="actions"><button class="btn ghost dialogue-play" data-dialogue="weak">▶ Hear the dialogue</button></div></div>'''
          assert old in s, 'weak exchange anchor missing'
          s=s.replace(old,new,1)

          # 3) Show the framework visibly inside the stronger answer itself.
          old='''<p class="notice"><b>See the framework in Ravi’s first answer:</b> “The report’s running about a day behind” = <b>current position</b>; “because the final data came in late” = <b>reason</b>; “I’ve finished the sections I could, and I’ve followed up” = <b>action taken</b>; “I should have the full report across by tomorrow afternoon” = <b>next step</b>.</p><p class="notice"><b>Then notice the follow-up:</b> the manager asks about risk and support. Ravi does not restart the update. He answers the new question: <b>risk → action already taken → when he will involve the manager.</b></p>'''
          new='''<div class="framework-answer"><h4>See the framework inside Ravi’s answer</h4><div class="framework-line"><span class="framework-tag">Current position</span><span>“The report’s running about a day behind.”</span></div><div class="framework-line"><span class="framework-tag">Reason / risk</span><span>“...because the final data came in late.”</span></div><div class="framework-line"><span class="framework-tag">Action taken</span><span>“I’ve finished the sections I could, and I’ve followed up for the missing figures.”</span></div><div class="framework-line"><span class="framework-tag">Next step</span><span>“At this rate, I should have the full report across by tomorrow afternoon.”</span></div></div><p class="notice"><b>Then notice the follow-up:</b> the manager asks about risk and support. Ravi does not restart the update. He answers the new question: <b>risk → action already taken → when he will involve the manager.</b></p>'''
          assert old in s, 'strong framework anchor missing'
          s=s.replace(old,new,1)

          # 4) Add a short weak-vs-strong comparison.
          anchor='''<div class="model"><h3>Voice focus · London English</h3>'''
          comparison='''<div class="compare-card"><h3>What changed?</h3><div class="compare-grid"><div class="compare-col"><h4>Weak update</h4><ul><li>Vague current position</li><li>Too much background before the point</li><li>No clear delivery time or next step</li><li>Manager must pull out the information</li></ul></div><div class="compare-col"><h4>Stronger update</h4><ul><li>Position comes first</li><li>Reason is brief and relevant</li><li>Action shows ownership</li><li>Next step gives the manager something useful to work with</li></ul></div></div><p class="compare-message">The stronger update is not better because it is longer. It is better because the manager gets the information in the order needed to understand the situation and decide what to do next. That is why a good update is a conversation, not a speech.</p></div>\n'''
          assert anchor in s, 'voice focus anchor missing'
          s=s.replace(anchor,comparison+anchor,1)

          # 5) Make feedback wording explicitly framework-aware on screen.
          old='''<h4>Priority improvement</h4><p>${escapeHtml(r.priority_improvement)}</p><h4>What to change</h4><p>${escapeHtml(r.what_to_change)}</p>'''
          new='''<h4>Priority improvement</h4><p>${escapeHtml(r.priority_improvement)}</p><h4>Framework check</h4><p>${escapeHtml(r.message.feedback)}</p><h4>What to change</h4><p>${escapeHtml(r.what_to_change)}</p>'''
          assert old in s, 'feedback anchor missing'
          s=s.replace(old,new,1)

          # 6) Strengthen Review with learner-facing capability questions and one recommendation.
          old='''<div class="review-box"><h3>What to work on next</h3><h4 style="color:var(--navy);margin-bottom:6px">Priority improvement</h4><p>${escapeHtml(r.priority_improvement)}</p><h4 style="color:var(--navy);margin:16px 0 6px">What to change</h4><p>${escapeHtml(r.what_to_change)}</p></div>'''
          new='''<div class="review-box"><h3>What your scores mean</h3><div class="capability-questions"><div class="capability-question"><b>Message:</b> Can I give the manager a useful update with the current position, reason or risk, action taken and next step?</div><div class="capability-question"><b>Voice:</b> Do I sound natural, professional and easy to follow?</div><div class="capability-question"><b>People:</b> Do I listen and respond to the manager instead of delivering a prepared speech?</div><div class="capability-question"><b>Judgement:</b> Do I flag risk, show ownership and make the next action or escalation clear?</div></div><h4 style="color:var(--navy);margin:18px 0 6px">Priority improvement</h4><p>${escapeHtml(r.priority_improvement)}</p><h4 style="color:var(--navy);margin:16px 0 6px">What to change next time</h4><p>${escapeHtml(r.what_to_change)}</p></div>'''
          assert old in s, 'review anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refined Module 1 and remove one-shot workflow
        run: |
          rm .github/workflows/pcl-module1-five-refinements.yml
          git config user.name "manutelw"
          git config user.email "manu@telw.co.in"
          git add ascent/professional-communication-module-1.html .github/workflows/pcl-module1-five-refinements.yml
          git commit -m "Refine Professional Communication Module 1 coaching design"
          git push origin main
