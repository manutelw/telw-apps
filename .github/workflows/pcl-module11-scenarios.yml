name: Correct PCL Module 11 scenarios
on:
  push:
    branches: [pcl-dev]
    paths: ['.github/workflows/pcl-module11-scenarios.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-dev
      - name: Correct practice and test content
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/professional-communication-module-11.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('A client deck is due at 3:00 p.m. An internal summary is due at 4:00 p.m. You have enough time to complete only one properly. The client deadline is fixed; the internal summary can move if the team is informed early.','A cross-functional team has not approved a client item needed for tomorrow. You have followed up twice and supplied everything requested, but only their team lead can approve it.')
          s=s.replace('A report is due to a customer at noon. A senior colleague has asked for an extra analysis this morning. You can either deliver the agreed report on time without the extra analysis, or include the extra analysis and send the report about ninety minutes late. The customer has not asked for the extra analysis.','A system access request is blocking a task due today. You have completed the work that does not need access and followed up with support, but only your manager can approve the access level.')
          old="function q(mode,n){if(mode==='practice')return n===1?`${firstName}, we cannot finish both the client deck and the internal summary properly by their current deadlines. What is the position now, and what do you need from me?`:'If I contact the team lead, what will you do next?';return n===1?`${firstName}, adding the extra analysis will make the customer report about ninety minutes late. What is the position now, and what do you need from me?`:'What is the main risk in your choice, and how will you manage it?'}function scenario(mode){return mode==='practice'?'A client deck is due at 3:00 p.m. An internal summary is due at 4:00 p.m. There is enough time to complete only one properly. The client deadline is fixed; the internal summary can move if the team is informed early.':'A customer report is due at noon. A senior colleague requested extra analysis this morning. Including it would delay the report by about ninety minutes. The customer did not request the extra analysis.'}"
          new="function q(mode,n){if(mode==='practice')return n===1?`${firstName}, the client item is still waiting for approval and it is needed tomorrow. What is the position now, and what do you need from me?`:'If I contact the team lead, what will you do next?';return n===1?`${firstName}, your task is blocked by system access and the deadline is today. What is the position now, and what do you need from me?`:'If I approve the access now, what will you do next?'}function scenario(mode){return mode==='practice'?'A cross-functional team has not approved a client item needed for tomorrow. You have followed up twice and supplied everything requested, but only their team lead can approve it.':'A system access request is blocking a task due today. You have completed the work that does not need access and followed up with support, but only your manager can approve the access level.'}"
          if old not in s: raise SystemExit('q/scenario anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('<h2>Test</h2><p>Fresh decision. No coaching before you answer.</p>','<h2>Test</h2><p>Fresh escalation. No coaching before you answer.</p>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'cross-functional team has not approved' ascent/professional-communication-module-11.html
          grep -q 'system access request is blocking' ascent/professional-communication-module-11.html
          grep -q 'If I approve the access now' ascent/professional-communication-module-11.html
          grep -q 'Fresh escalation' ascent/professional-communication-module-11.html
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/pcl-module11-scenarios.yml
          git config user.name "manutelw"
          git config user.email "manu@telw.co.in"
          git add ascent/professional-communication-module-11.html .github/workflows/pcl-module11-scenarios.yml
          git commit -m 'Correct PCL Module 11 practice and test scenarios'
          git push origin pcl-dev
