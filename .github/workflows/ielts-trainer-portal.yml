name: TELW IELTS Trainer Portal
on:
  pull_request:
    paths:
      - 'workers/ielts/trainer-portal.mjs'
      - 'tests/ielts/trainer-portal.test.mjs'
      - 'worker-host-router.js'
      - 'telw-site/landing-page.html'
      - 'wrangler.jsonc'
      - '.github/workflows/ielts-trainer-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trainer-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check workers/ielts/trainer-portal.mjs
      - run: node --test tests/ielts/trainer-portal.test.mjs
