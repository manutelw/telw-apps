name: ORACY Level C Integrity
on:
  pull_request:
    paths:
      - 'oracy/unit-3*.html'
      - 'oracy/unit-3*-content.js'
      - 'oracy/unit-renderer-c.js'
      - 'oracy/level-system-c.js'
      - 'oracy/unit-speaking-c-runtime.js'
      - 'oracy/unit-speaking-c-natural-audio.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
      - '.github/workflows/oracy-level-c-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'oracy/unit-3*.html'
      - 'oracy/unit-3*-content.js'
      - 'oracy/unit-renderer-c.js'
      - 'oracy/level-system-c.js'
      - 'oracy/unit-speaking-c-runtime.js'
      - 'oracy/unit-speaking-c-natural-audio.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate C1A Unit 1 speaking-first flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          raw=(root/'oracy/unit-31-content.js').read_text()
          assert raw.startswith('window.ORACY_UNIT=') and raw.rstrip().endswith(';')
          u=json.loads(raw[len('window.ORACY_UNIT='):].rstrip()[:-1])
          assert u['unitNo']==31 and u['localUnitNo']==1 and u['level']=='C1A'
          assert u['title']=='Speaking Across India'
          assert len(u['keyPoints'])==3
          assert len(u['checks'])==12
          assert set(u['oral'])=={'q5','q10'}
          assert set(u['pron'])=={'q11','q12','q13','q14','q15'}
          assert set(u['speaking'])=={'s1','s2','s3','s4','s5'}
          text=raw.lower()
          for place in ('pune','jaipur','new delhi railway station'): assert place in text
          for structure in ('-ing and -ed adjectives','the more/less..., the more/less...','since/as meaning because'): assert structure.lower() in text
          for banned in ('placement','interview','client','manager','workplace','inlingua'): assert banned not in text, f'Banned drift term in learner content: {banned}'
          assert 'cefr b range' in text or 'cefr b-range' in text

          renderer=(root/'oracy/unit-renderer-c.js').read_text()
          assert 'Rule before you answer' in renderer
          assert 'Understand the structure' not in renderer
          assert 'Get the pattern clear before you practise it' not in renderer
          assert "q.rule||U.notes?.[q.id]" in renderer
          assert 'ruleTip(q.key)' in renderer

          runtime=(root/'oracy/unit-speaking-c-runtime.js').read_text()
          required=[
            'Vocabulary speaking drill ${vi+1} of 5 · three repetitions',
            'Vocabulary in use · 5 drills · 15 spoken turns',
            'Speaking Gym · Key Point ${kp+1} · five repetitions',
            'Speak → repeat → change → react → finish',
            'Three repetitions complete.',
            'Five repetitions complete.',
            'Listen to model conversation',
            "if(!U||Number(U.unitNo)!==31)return"
          ]
          for x in required: assert x in runtime, f'Missing Level C speaking invariant: {x}'
          for x in ('captivating','bewildered','reassuring','articulate','hesitant','pick up','brush up on','keep up with','open up','get by','gradually','noticeably','take in','work out','come across as'):
            assert x in runtime, f'Missing C1A Unit 1 vocabulary: {x}'
          assert runtime.count("{w:")==15, 'C1A Unit 1 must contain exactly 15 vocabulary drill targets'
          for banned in ('placement','interview','client','manager','workplace','inlingua'):
            assert banned not in runtime.lower(), f'Banned drift term in speaking runtime: {banned}'

          natural=(root/'oracy/unit-speaking-c-natural-audio.js').read_text()
          assert 'RATE=1.00' in natural
          assert 'GAP=.07' in natural
          assert 'natural, enthusiastic adults' in natural
          assert 'Do not rush' in natural
          assert 'rising pitch on the final stressed word' in natural
          assert 'D’you' in natural
          for marker in ('You bet!','Absolutely!','Actually,','Fair enough.','Exactly.','Hang on.'):
            assert marker in natural, f'Missing discourse marker: {marker}'
          assert "filter(x=>/^\\s*[AB]\\s*:/i.test(x))" in natural
          assert "playbackRate.value=RATE" in natural
          assert "QUESTION_STYLE" in natural
          assert "hash(text)" in natural
          assert "playQuestion(q)" in natural
          assert "IntersectionObserver" in natural
          assert "captivating" in natural and "come across as" in natural
          assert "inlingua" not in natural.lower()

          html=(root/'oracy/unit-31.html').read_text()
          for f in ('unit-31-content.js','unit-renderer-c.js','unit-shared.js','conversation-shared.js','level-system-c.js','unit-speaking-c-runtime.js','unit-speaking-c-natural-audio.js'): assert f in html
          assert 'unit-speaking-c-dialogue-audio.js' not in html
          assert 'unit-speaking-c-natural-audio.js?v=20260910d' in html
          index=(root/'oracy/index.html').read_text()
          for label in ('Level B','Level C','Level D'): assert label in index
          assert "from:31,to:37" in index and "availableTo:31" in index
          assert 'login-panel' not in index
          assert 'Login ID' not in index and 'Log in' not in index
          assert 'currentAdmin' in index and 'openAdminPreview' in index
          admin=(root/'oracy/admin.html').read_text()
          assert 'previewC1A1' in admin and '/oracy/unit-31.html' in admin
          print('ORACY C1A Unit 1 natural enthusiastic dialogue and intonation rules OK')
          PY
