name: ORACY Level C Integrity
on:
  pull_request:
    paths:
      - 'oracy/unit-3*.html'
      - 'oracy/unit-3*-content.js'
      - 'oracy/unit-renderer-c.js'
      - 'oracy/level-system-c.js'
      - 'oracy/unit-speaking-c-runtime.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
      - '.github/workflows/oracy-level-c-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'oracy/unit-3*.html'
      - 'oracy/unit-3*-content.js'
      - 'oracy/unit-renderer-c.js'
      - 'oracy/level-system-c.js'
      - 'oracy/unit-speaking-c-runtime.js'
      - 'oracy/index.html'
      - 'oracy/admin.html'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate C1A Unit 1 and Level C shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          raw=(root/'oracy/unit-31-content.js').read_text()
          assert raw.startswith('window.ORACY_UNIT=') and raw.rstrip().endswith(';')
          u=json.loads(raw[len('window.ORACY_UNIT='):].rstrip()[:-1])
          assert u['unitNo']==31 and u['localUnitNo']==1 and u['level']=='C1A'
          assert len(u['keyPoints'])==3
          assert len(u['checks'])==12
          assert set(u['oral'])=={'q5','q10'}
          assert set(u['pron'])=={'q11','q12','q13','q14','q15'}
          assert set(u['speaking'])=={'s1','s2','s3','s4','s5'}
          assert len(u['passages']['kp2'])==15
          text=raw.lower()
          for place in ('bengaluru','gurugram','hyderabad'): assert place in text
          assert 'cefr b-range' in text
          assert 'organise' in text and 'practise' in text

          html=(root/'oracy/unit-31.html').read_text()
          for f in ('unit-31-content.js','unit-renderer-c.js','unit-shared.js','conversation-shared.js','level-system-c.js','unit-speaking-c-runtime.js'): assert f in html

          runtime=(root/'oracy/unit-speaking-c-runtime.js').read_text()
          required=[
            'Vocabulary speaking drill ${vi+1} of 5',
            'Vocabulary in use · 5 drills · 3 turns each',
            'Question 1 of 3',
            'Respond to statement',
            'Speaking Gym · Key Point ${kp+1} · 5 reps',
            'Free → Compress → Target language → React → Pressure finish',
            '1. Target vocabulary:',
            '2. Pronunciation & stress:',
            '3. Key Point structure:',
            '4. Conversation markers:',
            'Listen to model conversation',
            "const DATA=[",
            "if(!U||Number(U.unitNo)!==31)return"
          ]
          for x in required: assert x in runtime, f'Missing Level C speaking invariant: {x}'
          # 3 Key Points x 5 explicitly authored vocabulary items.
          for x in ('overwhelming','settle into','hesitant','brush up on','hold back','demanding','spontaneous','precise','think on your feet','come across as'):
            assert x in runtime, f'Missing C1A Unit 1 vocabulary: {x}'
          assert runtime.count("{w:") == 15, 'C1A Unit 1 must contain exactly 15 vocabulary drill targets'

          index=(root/'oracy/index.html').read_text()
          for label in ('Level B','Level C','Level D'): assert label in index
          assert "from:31,to:37" in index and "availableTo:31" in index
          admin=(root/'oracy/admin.html').read_text()
          assert 'previewC1A1' in admin and '/oracy/unit-31.html' in admin
          print('ORACY C1A Unit 1 native vocabulary + speaking contract OK')
          PY
