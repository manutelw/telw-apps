name: PCL KP3 comprehension layout once

on:
  push:
    branches: [pcl-standalone]
    paths:
      - '.github/workflows/pcl-kp3-check-layout-once.yml'

permissions:
  contents: write

jobs:
  patch-kp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pcl-standalone
          fetch-depth: 0

      - name: Update KP3 comprehension header only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-1-3.html')
          s=p.read_text(encoding='utf-8')
          old='<section class="panel" id="checkPanel" hidden><div class="title"><div style="width:100%"><div class="actions" style="margin-top:0;margin-bottom:16px"><button class="listen" id="checkModelAudio">Hear the passage again</button></div></div><div><h2>2. Check your understanding</h2><p>Answer from the passage, and include the managerial elements shown.</p></div><span class="badge">3 questions</span></div>'
          new='<section class="panel" id="checkPanel" hidden><div class="title"><div><h2>2. Check your understanding</h2><p>Listen to the same passage once again and answer the following comprehension questions</p></div><div class="actions" style="margin-top:0;justify-content:flex-end"><button class="listen" id="checkModelAudio">Hear the passage again</button><span class="badge">3 questions</span></div></div>'
          if old not in s:
              raise RuntimeError('Expected KP3 comprehension header not found; no changes made.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          wf=Path('.github/workflows/pcl-kp3-check-layout-once.yml')
          if wf.exists(): wf.unlink()
          PY

      - name: Verify only requested KP3 changes
        run: |
          grep -q 'Listen to the same passage once again and answer the following comprehension questions' module-1-3.html
          grep -q 'justify-content:flex-end' module-1-3.html
          grep -q 'id="checkModelAudio"' module-1-3.html
          grep -q 'PCL_REPEAT_CHECK_AUDIO' module-1-3.html
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' module-1-3.html | sort)
          test "$changed" = "$expected"

      - name: Commit KP3 layout refinement
        run: |
          git config user.name 'manutelw'
          git config user.email 'manutelw@gmail.com'
          git add module-1-3.html .github/workflows/pcl-kp3-check-layout-once.yml
          git commit -m 'Refine KP3 comprehension instruction and audio layout'
          git push origin HEAD:pcl-standalone
