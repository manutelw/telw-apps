name: Patch CV Builder Always Score

on:
  push:
    branches:
      - fix/cv-always-score
    paths:
      - '.cv-always-score-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-always-score
      - name: Fix patch-script replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch_cv_always_score.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ledger_pattern.subn(ledger_replacement, text, count=1)', 'ledger_pattern.subn(lambda m: ledger_replacement, text, count=1)')
          s = s.replace('evidence_pattern.subn(evidence_replacement, text, count=1)', 'evidence_pattern.subn(lambda m: evidence_replacement, text, count=1)')
          s = s.replace('catch_pattern.subn(catch_replacement, text, count=1)', 'catch_pattern.subn(lambda m: catch_replacement, text, count=1)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply CV Builder scoring patch
        run: python .github/scripts/patch_cv_always_score.py
      - name: Check JavaScript syntax
        run: node --check workers/profile-review.js
      - name: Commit patched worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/profile-review.js
          git diff --cached --quiet && exit 0
          git commit -m "Make CV-JD match always return a score"
          git push origin HEAD:fix/cv-always-score
