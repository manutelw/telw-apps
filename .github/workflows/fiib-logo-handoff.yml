name: FIIB Logo Handoff
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fiib-logo-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official FIIB logo from official disclosure
        run: |
          curl --fail --location 'https://www.fiib.edu.in/compliance/Mandatory-Disclosure.pdf' --output fiib.pdf
          pdftoppm -f 1 -singlefile -png -r 180 fiib.pdf first
          python - <<'PY'
          from PIL import Image, ImageChops
          im=Image.open('first.png').convert('RGB')
          w,h=im.size
          crop=im.crop((0,0,int(w*0.45),int(h*0.16)))
          # trim plain white margins while preserving the official logo lockup
          bg=Image.new('RGB',crop.size,'white')
          diff=ImageChops.difference(crop,bg)
          bbox=diff.getbbox()
          if bbox:
              x0,y0,x1,y1=bbox
              pad=18
              crop=crop.crop((max(0,x0-pad),max(0,y0-pad),min(crop.width,x1+pad),min(crop.height,y1+pad)))
          crop.save('fiib-logo.png')
          print('crop',crop.size)
          PY
          file fiib-logo.png
      - name: Upload logo artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiib-logo
          path: fiib-logo.png
          retention-days: 1
