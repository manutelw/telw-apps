name: FIIB Logo Handoff
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fiib-logo-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official FIIB logo
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          page='https://www.fiib.edu.in/fiib-events'
          html=requests.get(page,timeout=30).text
          img=None
          tags=re.findall(r'<img\b[^>]*>',html,flags=re.I)
          for tag in tags:
              low=tag.lower()
              if 'fiib logo' in low or ('fiib' in low and 'logo' in low):
                  m=re.search(r'(?:src|data-src)=["\']([^"\']+)',tag,flags=re.I)
                  if m:
                      img=urljoin(page,m.group(1)); break
          if not img:
              for tag in tags:
                  m=re.search(r'(?:src|data-src)=["\']([^"\']+)',tag,flags=re.I)
                  if m and 'logo' in m.group(1).lower():
                      img=urljoin(page,m.group(1)); break
          if not img:
              open('page.html','w').write(html)
              raise SystemExit('FIIB logo image not found')
          print('LOGO',img)
          r=requests.get(img,timeout=30); r.raise_for_status()
          ct=r.headers.get('content-type','')
          ext='.svg' if 'svg' in ct or img.lower().endswith('.svg') else '.png' if 'png' in ct or img.lower().endswith('.png') else '.jpg'
          open('fiib-logo'+ext,'wb').write(r.content)
          open('logo-url.txt','w').write(img+'\n')
          PY
          file fiib-logo.*
      - name: Upload logo artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiib-logo
          path: |
            fiib-logo.*
            logo-url.txt
          retention-days: 1
