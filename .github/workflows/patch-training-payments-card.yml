name: Patch Training Payments card

on:
  push:
    branches:
      - clarion-admin-training-payment-static-fix

permissions:
  contents: write

jobs:
  patch-admin-hub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clarion-admin-training-payment-static-fix
      - name: Insert Training Payments card only
        shell: python
        run: |
          from pathlib import Path
          p = Path('ascent/admin-settings.html')
          s = p.read_text(encoding='utf-8')
          if 'id="trainingPaymentsAppButton"' not in s:
              marker = '<button id="catSimulatorAdminButton"'
              i = s.find(marker)
              if i < 0:
                  raise SystemExit('CAT Simulator marker not found; refusing to modify file')
              card = '<button id="trainingPaymentsAppButton" class="app-card ascent" type="button"><strong>Training Payments</strong><span>Create locked learner payment links for agreed programmes and fees</span></button>\n        '
              s = s[:i] + card + s[i:]
          handler_marker = 'document.getElementById("catSimulatorAdminButton")'
          if 'trainingPaymentsAppButton").addEventListener' not in s:
              j = s.find(handler_marker)
              if j < 0:
                  raise SystemExit('CAT Simulator handler marker not found; refusing to modify file')
              line_start = s.rfind('\n', 0, j) + 1
              handler = '    document.getElementById("trainingPaymentsAppButton").addEventListener("click",()=>{window.location.href="/ascent/training-payments.html";});\n'
              s = s[:line_start] + handler + s[line_start:]
          p.write_text(s, encoding='utf-8')
      - name: Verify scope and remove temporary workflow
        shell: bash
        run: |
          grep -q 'id="trainingPaymentsAppButton"' ascent/admin-settings.html
          grep -q '/ascent/training-payments.html' ascent/admin-settings.html
          rm .github/workflows/patch-training-payments-card.yml
          git diff -- ascent/admin-settings.html
          git status --short
      - name: Commit surgical Admin Hub change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ascent/admin-settings.html .github/workflows/patch-training-payments-card.yml
          git commit -m 'Add Training Payments card directly to Admin Hub'
          git push origin HEAD:clarion-admin-training-payment-static-fix
