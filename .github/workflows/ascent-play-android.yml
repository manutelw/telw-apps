name: Build ASCENT Play Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-ascent-play/**'
      - '.github/workflows/ascent-play-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-ascent-play

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore upload keystore
        env:
          ASCENT_UPLOAD_KEYSTORE_B64: ${{ secrets.ASCENT_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$ASCENT_UPLOAD_KEYSTORE_B64"
          printf '%s' "$ASCENT_UPLOAD_KEYSTORE_B64" | base64 --decode > app/ascent-upload-key.jks

      - name: Build signed release app bundle
        env:
          ASCENT_KEYSTORE_PATH: ascent-upload-key.jks
          ASCENT_KEYSTORE_PASSWORD: ${{ secrets.ASCENT_UPLOAD_STORE_PASSWORD }}
          ASCENT_KEY_ALIAS: ${{ secrets.ASCENT_UPLOAD_KEY_ALIAS }}
          ASCENT_KEY_PASSWORD: ${{ secrets.ASCENT_UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASCENT-Play-release-aab
          path: android-ascent-play/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
