name: Patch JD mapper suggestion UI

on:
  push:
    branches:
      - jd-mapper-auto-suggestions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-mapper-auto-suggestions
      - name: Patch learner mapper UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('ascent/jd-interview-mapper.html')
          s = p.read_text()
          s = s.replace(
            '.evidence-hint{padding:8px 10px;border-radius:9px;background:var(--soft);color:#3f5d79;font-size:11px;line-height:1.45}.map-grid',
            '.evidence-hint{padding:8px 10px;border-radius:9px;background:var(--soft);color:#3f5d79;font-size:11px;line-height:1.45}.suggestion{margin-top:9px;padding:10px 11px;border:1px solid #ead7af;border-radius:9px;background:#fff8e8;color:#684900;font-size:11px;line-height:1.5}.suggestion strong{color:#7b5500}.map-grid'
          )
          s = s.replace(
            "<p>Paste the full JD and your CV. ASCENT will list the employer's requirements. You then decide where your CV gives strong evidence, transferable evidence, or no evidence. Your interview questions are built from that map.</p>",
            "<p>Paste the full JD and your CV. ASCENT will list the employer's requirements and suggest where your CV gives strong evidence, transferable evidence, or no evidence. Review every suggestion before your interview questions are built.</p>"
          )
          s = s.replace(
            '<div class="steps"><div class="step"><strong>1 · Paste</strong>Full JD + your CV</div><div class="step"><strong>2 · Map</strong>Mark every item S, T or N</div><div class="step"><strong>3 · Build</strong>Get questions based on your map</div><div class="step"><strong>4 · Speak</strong>Practise 45–60 second answers</div></div>',
            '<div class="steps"><div class="step"><strong>1 · Paste</strong>Full JD + your CV</div><div class="step"><strong>2 · Review</strong>Check ASCENT’s S / T / N suggestions</div><div class="step"><strong>3 · Build</strong>Get questions based on your final map</div><div class="step"><strong>4 · Speak</strong>Practise 45–60 second answers</div></div>'
          )
          s = s.replace(
            '<div class="heading-row"><div><h3>Step 2 · Map every JD requirement to your CV</h3><p>S = direct proof. T = something similar that can transfer. N = no credible proof. N is allowed; invented evidence is not.</p></div><div id="mappingSummary" class="summary"></div></div>',
            '<div class="heading-row"><div><h3>Step 2 · Review ASCENT’s JD-to-CV map</h3><p>ASCENT has suggested S, T or N from your pasted CV. Check every item. Change any rating or evidence that does not match your real experience. S = direct proof. T = related proof that can transfer. N = no credible proof.</p></div><div id="mappingSummary" class="summary"></div></div>'
          )
          old = "<div class=\"evidence-hint\"><strong>Where you might look in your CV:</strong> ${esc(r.cv_evidence_hint)}</div><div class=\"map-grid\">"
          new = "<div class=\"evidence-hint\"><strong>Where you might look in your CV:</strong> ${esc(r.cv_evidence_hint)}</div>${m.source==='ASCENT_SUGGESTION'?`<div class=\"suggestion\"><strong>ASCENT suggests: ${esc(rating)}</strong>${m.note?' — '+esc(m.note):''}<br>Review this suggestion. Change the rating or evidence if it does not match your real experience.</div>`:''}<div class=\"map-grid\">"
          if old not in s:
            raise SystemExit('renderRequirements target not found')
          s = s.replace(old, new)
          s = s.replace(
            "setStatus('extractStatus','ASCENT is separating the JD into its distinct requirements.','info')",
            "setStatus('extractStatus','ASCENT is reading the JD and comparing each requirement with your CV.','info')"
          )
          s = s.replace(
            "setStatus('extractStatus',`Found ${(d.case.requirements||[]).length} distinct requirements. Now map every one to your CV.`,'success')",
            "setStatus('extractStatus',`Found ${(d.case.requirements||[]).length} distinct requirements and suggested a CV match for each. Review every suggestion before you continue.`,'success')"
          )
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-mapper.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show ASCENT S T N suggestions in JD mapper"
          git push