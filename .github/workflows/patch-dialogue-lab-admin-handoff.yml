name: Patch Dialogue Lab admin handoff
on:
  push:
    branches: [dialogue-lab-admin-handoff-20260830]
    paths: ['.github/workflows/patch-dialogue-lab-admin-handoff.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dialogue-lab-admin-handoff-20260830
      - name: Patch admin hub
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          old='<a id="dialogueLabAppLink" class="app-card dialogue" href="https://deploy-preview-43--telw-clarion-app.netlify.app/dialogue-lab/" target="_blank" rel="noopener noreferrer"><strong>Dialogue Lab – Test</strong><span>Open the separate Below-5 video and speaking-practice site</span></a>'
          new='<button id="dialogueLabAppLink" class="app-card dialogue" type="button"><strong>Dialogue Lab – Test</strong><span>Open the separate Below-5 video and speaking-practice site with free admin access</span></button>'
          if old not in s:
              raise SystemExit('Dialogue Lab card not found')
          s=s.replace(old,new,1)
          marker='    async function enterDemoStudent(demoMode) {'
          fn='''    async function openDialogueLabAdmin() {\n      const button = document.getElementById("dialogueLabAppLink");\n      button.disabled = true;\n      setAppHubStatus("Opening Dialogue Lab with free administrator access…");\n      try {\n        const result = await callAdminRpc(ADMIN_DEMO_STUDENT_URL,{p_session_token:session.sessionToken,p_demo_mode:"PRIVATE"});\n        const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(result)))));\n        const url = "https://deploy-preview-43--telw-clarion-app.netlify.app/dialogue-lab/admin-entry.html#handoff=" + encoded;\n        setAppHubStatus("Dialogue Lab administrator access ready.","success");\n        window.open(url,"_blank","noopener,noreferrer");\n      } catch(error) {\n        setAppHubStatus(error.message||"Dialogue Lab administrator access could not be opened.","error");\n      } finally {\n        button.disabled = false;\n      }\n    }\n\n'''
          if marker not in s:
              raise SystemExit('Function insertion marker not found')
          s=s.replace(marker,fn+marker,1)
          bind='document.getElementById("dialogueLabAppLink")?.addEventListener("click",openDialogueLabAdmin);'
          insert='document.getElementById("liveMockAppButton")?.addEventListener("click",openLiveMockAdmin);'
          if insert in s:
              s=s.replace(insert,insert+'\n    '+bind,1)
          else:
              s=s.replace('</script>', '    '+bind+'\n  </script>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ascent/admin-settings.html
          git commit -m 'Give admin free Dialogue Lab handoff'
          git push
