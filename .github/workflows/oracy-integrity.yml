name: ORACY Integrity
on:
  pull_request:
    paths:
      - 'oracy/**'
      - 'functions/oracy/**'
      - 'supabase/functions/oracy-voice/**'
      - 'functions/ascent/admin-settings.html.js'
      - 'worker.js'
      - 'worker-oracy.js'
      - 'wrangler.jsonc'
      - '.github/oracy-unit1.lock'
      - '.github/oracy-unit2.lock'
      - '.github/oracy-unit*.lock'
      - '.github/oracy-level-*.lock'
      - '.github/oracy-b1a-b2b-package.lock'
      - '.github/CODEOWNERS'
      - '.github/workflows/oracy-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FINAL frozen ORACY B1A Unit 1 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lock = Path('.github/oracy-unit1.lock')
          assert lock.exists(), 'ORACY B1A Unit 1 lock file is missing'
          protected = {}
          for raw in lock.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              expected, path = line.split(None, 1)
              protected[path.strip()] = expected.strip()

          required = {
              'oracy/unit-1.html',
              'oracy/unit-1.js',
              'oracy/unit-1-coach.js',
              'oracy/unit-1-oral-qa.js',
              'oracy/unit-1-feedback-examples.js',
              'oracy/unit-1-audio-controls.js',
              'oracy/unit-1-vocab-drills.js',
              'oracy/unit-1-vocab-audio.js',
          }
          assert set(protected) == required, 'BALLISTIC LOCK: protected Unit 1 file set changed'

          for path, expected in protected.items():
              assert Path(path).exists(), f'BALLISTIC LOCK: protected Unit 1 file missing: {path}'
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (
                  f'BALLISTIC LOCK: {path} changed. ORACY B1A Unit 1 is FINAL and frozen. '
                  'Do not alter it unless Manu explicitly requests that B1A Unit 1 be unlocked.'
              )

          coach = Path('oracy/unit-1-coach.js').read_text()
          vocab = Path('oracy/unit-1-vocab-drills.js').read_text()
          audio = Path('oracy/unit-1-vocab-audio.js').read_text()
          wrapper = Path('worker-oracy.js').read_text()

          assert coach.count("title:'") >= 3, 'BALLISTIC LOCK: three Key Point speaking gyms missing'
          for phrase in [
              '3 Key Points · 5 vocabulary items per Key Point · 5 core speaking reps per Key Point · 5 vocabulary drills per Key Point',
              "s.src='./unit-1-vocab-drills.js?v=20260910'",
              'for(let kp=0;kp<3;kp++)',
          ]:
              assert phrase in coach, f'BALLISTIC LOCK: Unit 1 coach invariant missing: {phrase}'

          for phrase in [
              'Vocabulary speaking drill ${itemIndex+1} of 5',
              'Question 1 of 3',
              'Respond to statement',
              'Target vocabulary:',
              'Pronunciation & stress:',
              'Key Point structure:',
              'Conversation markers:',
          ]:
              assert phrase in vocab, f'BALLISTIC LOCK: Unit 1 vocabulary invariant missing: {phrase}'

          for phrase in [
              'Listen to model conversation',
              'oracyRestoreKeyPointFlow',
              "document.querySelectorAll('.oracy-vocab-drill').length===15",
              "document.querySelectorAll('.oracy-vocab-model-audio').length===15",
              'oracyPrepareVocabModel',
          ]:
              assert phrase in audio, f'BALLISTIC LOCK: Unit 1 audio/flow invariant missing: {phrase}'

          for x in [
              'unit-1-oral-qa.js',
              'unit-1-feedback-examples.js',
              'unit-1-audio-controls.js',
              'unit-1-vocab-audio.js?v=20260910',
              'ensureUnit1MarkerGuidance',
              'applyTelwLevelBranding',
          ]:
              assert x in wrapper, f'BALLISTIC LOCK: Unit 1 runtime hook missing: {x}'

          print('ORACY B1A Unit 1 FINAL military-grade ballistic lock intact')
          PY
      - name: Verify frozen ORACY B1A Unit 2 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          protected = {}
          for raw in Path('.github/oracy-unit2.lock').read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              expected, path = line.split(None, 1)
              protected[path.strip()] = expected.strip()

          assert set(protected) == {'oracy/unit-2.html', 'oracy/unit-2-content.js'}
          for path, expected in protected.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, f'APPROVED UNIT 2 LOCK: {path} changed'
          print('ORACY B1A Unit 2 approved content lock intact')
          PY
      - name: Verify ORACY B1 Unit 1 and Cloudflare Worker access controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('oracy/unit-1.html').read_text()
          j=Path('oracy/unit-1.js').read_text()
          gate=Path('functions/oracy/_middleware.js').read_text()
          session=Path('functions/oracy/session.js').read_text()
          worker=Path('worker.js').read_text()
          wrapper=Path('worker-oracy.js').read_text()
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          index=Path('oracy/index.html').read_text()
          admin=Path('oracy/admin.html').read_text()
          register=Path('oracy/register.html').read_text()
          hub=Path('functions/ascent/admin-settings.html.js').read_text()
          for x in ['Key Point 1 · Vocabulary','Key Point 2 · Grammar','Key Point 3 · Pronunciation','Speaking 1','Speaking 5','/w/ and /v/']:
              assert x in h, x
          for x in ["const EDGE='/oracy/session'",'passage_id','unit_no','MediaRecorder']:
              assert x in j, x
          for x in ['oracy_session','validLearnerUnit','/oracy/?locked=1','clarion_admin_session']:
              assert x in gate, x
          for x in ['oracy_session','ORACY_ACCESS','ORACY_VOICE','session_token','unit_no']:
              assert x in session, x
          for x in ['/oracy/session','/oracy/logout','/oracy/admin-handoff','validLearnerUnit','validAdmin','env.ASSETS.fetch','ORACY_VOICE','ORACY_ACCESS','clarion_admin_session']:
              assert x in worker, x
          for x in ['/oracy/admin-preview','admin_preview','oracy_session','oracyDirectIndexScript','/oracy/admin-handoff','<strong>ORACY</strong>']:
              assert x in wrapper, x
          assert not Path('oracy/admin-open.html').exists(), 'Obsolete ORACY admin launcher must stay removed'
          assert cfg['main']=='worker-oracy.js'
          assert cfg['assets']['binding']=='ASSETS'
          assert cfg['assets']['run_worker_first'] is True
          for x in ['Level B','Level C','Level D','currentAdmin','openAdminPreview']:
              assert x in index, x
          for x in ['Assigned learner access','Login ID','Log in','Register & pay for access']:
              assert x not in index, f'ORACY course index must not show learner login block: {x}'
          for x in ['Assign ORACY to learners','admin_set_assignment','admin_save_learner','Paid learner access','Send payment links']:
              assert x in admin, x
          for x in ['checkout.razorpay.com','CREATE_ORDER','VERIFY','30-day learner access']:
              assert x in register, x
          assert 'oracyAdminHubCard' in hub
          print('ORACY Unit 1 Cloudflare Worker access-control integrity OK')
          PY
      - name: Verify approved ORACY B1A Unit 2
        run: python .github/scripts/oracy_unit2_review_check.py
      - name: Verify ORACY B1A Unit 3 review candidate
        run: python .github/scripts/oracy_unit3_review_check.py
      - name: Verify Units 2-30 speaking-gym rollout
        run: python .github/scripts/oracy_speaking_gym_v2_check.py
      - name: Verify frozen ORACY Units 1-30 and level/package locks
        run: python .github/scripts/oracy_course_integrity_check.py
