name: ORACY Integrity
on:
  pull_request:
    paths:
      - 'oracy/**'
      - 'functions/oracy/**'
      - 'functions/ascent/admin-settings.html.js'
      - 'worker.js'
      - 'worker-oracy.js'
      - 'wrangler.jsonc'
      - '.github/oracy-unit1.lock'
      - '.github/CODEOWNERS'
      - '.github/workflows/oracy-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen ORACY B1A Unit 1 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lock = Path('.github/oracy-unit1.lock')
          assert lock.exists(), 'ORACY B1A Unit 1 lock file is missing'
          protected = {}
          for raw in lock.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              expected, path = line.split(None, 1)
              protected[path.strip()] = expected.strip()

          required = {
              'oracy/unit-1.html',
              'oracy/unit-1.js',
              'oracy/unit-1-coach.js',
              'oracy/unit-1-oral-qa.js',
              'oracy/unit-1-feedback-examples.js',
              'oracy/unit-1-audio-controls.js',
          }
          assert set(protected) == required, 'Protected Unit 1 file set changed'

          for path, expected in protected.items():
              assert Path(path).exists(), f'Protected Unit 1 file missing: {path}'
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (
                  f'BALLISTIC LOCK: {path} changed. ORACY B1A Unit 1 is frozen. '
                  'Do not alter it unless Manu explicitly requests that Unit 1 be unlocked.'
              )

          wrapper = Path('worker-oracy.js').read_text()
          for x in [
              'unit-1-oral-qa.js',
              'unit-1-feedback-examples.js',
              'unit-1-audio-controls.js',
              'ensureUnit1MarkerGuidance',
              'applyTelwLevelBranding',
          ]:
              assert x in wrapper, f'BALLISTIC LOCK: Unit 1 runtime hook missing: {x}'

          print('ORACY B1A Unit 1 ballistic lock intact')
          PY
      - name: Verify ORACY B1 Unit 1 and Cloudflare Worker access controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('oracy/unit-1.html').read_text()
          j=Path('oracy/unit-1.js').read_text()
          gate=Path('functions/oracy/_middleware.js').read_text()
          session=Path('functions/oracy/session.js').read_text()
          worker=Path('worker.js').read_text()
          wrapper=Path('worker-oracy.js').read_text()
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          login=Path('oracy/index.html').read_text()
          admin=Path('oracy/admin.html').read_text()
          hub=Path('functions/ascent/admin-settings.html.js').read_text()
          for x in ['Key Point 1 · Vocabulary','Key Point 2 · Grammar','Key Point 3 · Pronunciation','Speaking 1','Speaking 5','/w/ and /v/']:
              assert x in h, x
          for x in ["const EDGE='/oracy/session'",'passage_id','unit_no','MediaRecorder']:
              assert x in j, x
          for x in ['oracy_session','validLearnerUnit','/oracy/?locked=1','clarion_admin_session']:
              assert x in gate, x
          for x in ['oracy_session','ORACY_ACCESS','ORACY_VOICE','session_token','unit_no']:
              assert x in session, x
          for x in ['/oracy/session','/oracy/logout','/oracy/admin-handoff','validLearnerUnit','validAdmin','env.ASSETS.fetch','ORACY_VOICE','ORACY_ACCESS','clarion_admin_session']:
              assert x in worker, x
          for x in ['/oracy/admin-preview','admin_preview','oracy_session','/oracy/admin-open.html','<strong>ORACY</strong>']:
              assert x in wrapper, x
          assert cfg['main']=='worker-oracy.js'
          assert cfg['assets']['binding']=='ASSETS'
          assert cfg['assets']['run_worker_first'] is True
          for x in ['Assigned learner access','./session','A unit link will not open']:
              assert x in login, x
          for x in ['Assign ORACY to learners','admin_set_assignment','admin_save_learner']:
              assert x in admin, x
          assert 'oracyAdminHubCard' in hub
          print('ORACY Unit 1 Cloudflare Worker access-control integrity OK')
          PY
