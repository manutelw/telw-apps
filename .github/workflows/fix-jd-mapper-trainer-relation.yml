name: Fix JD mapper trainer relation

on:
  push:
    branches:
      - jd-interview-mapper

permissions:
  contents: write

jobs:
  fix-relation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jd-interview-mapper
      - name: Patch trainer mapper relation name
        shell: python
        run: |
          from pathlib import Path
          path = Path("ascent/jd-interview-trainer.html")
          text = path.read_text(encoding="utf-8")
          marker = "let session=null,cases=[];const $=id=>document.getElementById(id);"
          replacement = "let session=null,cases=[];const $=id=>document.getElementById(id);function studentOf(c){return c.student||c.ascent_students||{}}"
          if "function studentOf(c)" not in text:
              if marker not in text:
                  raise SystemExit("Trainer mapper session marker not found")
              text = text.replace(marker, replacement, 1)
          text = text.replace("c.student?.full_name", "studentOf(c).full_name")
          text = text.replace("c.student?.student_id", "studentOf(c).student_id")
          text = text.replace("c.student?.batch", "studentOf(c).batch")
          path.write_text(text, encoding="utf-8")
      - name: Commit relation fix
        run: |
          if git diff --quiet; then
            echo "Fix already present."
            exit 0
          fi
          git config user.name "ASCENT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ascent/jd-interview-trainer.html
          git commit -m "Fix trainer mapper student relation"
          git push origin HEAD:jd-interview-mapper
