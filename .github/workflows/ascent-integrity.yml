name: ASCENT Integrity Guard

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ascent/**'
      - 'ascent-play/**'
      - 'android-ascent-play/**'
      - 'live-mock/**'
      - 'functions/ascent/**'
      - '.github/scripts/ascent_integrity_check.py'
      - '.github/scripts/ascent_trainer_integrity_check.py'
      - '.github/workflows/**'
  push:
    branches: [main, ascent-staging]
    paths:
      - 'index.html'
      - 'ascent/**'
      - 'ascent-play/**'
      - 'android-ascent-play/**'
      - 'live-mock/**'
      - 'functions/ascent/**'
      - '.github/scripts/ascent_integrity_check.py'
      - '.github/scripts/ascent_trainer_integrity_check.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ASCENT core integrity checks
        run: python .github/scripts/ascent_integrity_check.py
      - name: Run ASCENT trainer integrity checks
        run: python .github/scripts/ascent_trainer_integrity_check.py
      - name: Check JavaScript syntax
        run: |
          node --check ascent/practice-access-v2.js
          node --check ascent/recording-vault.js
          node --check ascent/trainer-results-summary.js
          if [ -f functions/ascent/submit-response.js ]; then node --check functions/ascent/submit-response.js; fi
  telw-video-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download short-lived private audio bundle
        run: |
          curl --fail --location 'https://vtqatrhwfvzyodiftvkc.supabase.co/storage/v1/object/sign/telw-video-render/bundles/1788152660598-audio-bundle.mp3?token=eyJraWQiOiIwZDU2Mzk2NS0yYWZmLTQ0ZGItOGI1Yi0yYTU2NTU1ZmQ4MDgiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ0ZWx3LXZpZGVvLXJlbmRlci9idW5kbGVzLzE3ODgxNTI2NjA1OTgtYXVkaW8tYnVuZGxlLm1wMyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODgxNTI2NjEsImV4cCI6MTc4ODE1MzI2MX0.pkl5u0vqRDkS2OnUacckQGuc6nR2PsRw3RzmQKHTgSQ' --output upgrad-audio.zip
