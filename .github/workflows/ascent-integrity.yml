# Dialogue Lab change: trigger required integrity guard
name: ASCENT Integrity Guard

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ascent/**'
      - 'ascent-play/**'
      - 'android-ascent-play/**'
      - 'live-mock/**'
      - 'functions/ascent/**'
      - 'workers/profile-review.js'
      - '.github/scripts/ascent_integrity_check.py'
      - '.github/scripts/ascent_trainer_integrity_check.py'
      - '.github/workflows/**'
  push:
    branches: [main, ascent-staging]
    paths:
      - 'index.html'
      - 'ascent/**'
      - 'ascent-play/**'
      - 'android-ascent-play/**'
      - 'live-mock/**'
      - 'functions/ascent/**'
      - 'workers/profile-review.js'
      - '.github/scripts/ascent_integrity_check.py'
      - '.github/scripts/ascent_trainer_integrity_check.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ASCENT core integrity checks
        run: python .github/scripts/ascent_integrity_check.py
      - name: Run ASCENT trainer integrity checks
        run: python .github/scripts/ascent_trainer_integrity_check.py
      - name: Check JavaScript syntax
        run: |
          node --check ascent/practice-access-v2.js
          node --check ascent/recording-vault.js
          node --check ascent/trainer-results-summary.js
          if [ -f functions/ascent/submit-response.js ]; then node --check functions/ascent/submit-response.js; fi
