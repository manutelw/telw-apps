name: One-time PI admin builder link patch
on:
  push:
    branches: [feature/pi-admin-builder]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-admin-builder
      - name: Point PI Lab admin card to assignment builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/admin-settings.html')
          s=p.read_text()
          old='<a class="app-card pi" href="../pi-lab/" target="_blank" rel="noopener noreferrer"><strong>PI Lab</strong><span>Open PI learn-and-repeat practice with administrator access</span></a>'
          new='<a class="app-card pi" href="../pi-lab/admin-builder.html"><strong>PI Lab</strong><span>Upload a JD, add PI questions and prepare targeted assignments</span></a>'
          if s.count(old)!=1: raise SystemExit('PI admin card target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-pi-admin-builder.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/admin-settings.html .github/workflows/patch-pi-admin-builder.yml
          git commit -m "Connect Admin Hub PI card to assignment builder"
          git push origin HEAD:feature/pi-admin-builder
