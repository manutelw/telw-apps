name: Patch trainer cache bust

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch trainer login redirect
        run: python .github/scripts/patch_trainer_cache_bust.py
      - name: Commit trainer cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/trainer-login.html
          git diff --cached --quiet && exit 0
          git commit -m "Force trainers onto current portal build"
          git pull --rebase origin main
          git push origin HEAD:main
