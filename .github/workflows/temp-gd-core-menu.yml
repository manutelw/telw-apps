name: Add GD Lab to ASCENT Student Menu
on:
  push:
    branches: [feature/gd-link-practice-core]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[gd-core-menu-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gd-link-practice-core
      - name: Add GD Lab navigation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ascent/practice-core.html')
          s=p.read_text()
          marker='''        <a\n          class="performance-button"\n          href="./jd-interview-mapper.html"'''
          idx=s.find(marker)
          assert idx!=-1, 'JD Interview menu item not found'
          # Find the end of this anchor, then insert GD Lab immediately after it.
          end=s.find('</a>', idx)
          assert end!=-1
          end += len('</a>')
          gd='''\n\n        <a\n          class="performance-button"\n          href="../gd-lab/"\n          aria-label="Open GD Lab"\n        >\n          GD Lab\n        </a>'''
          if 'href="../gd-lab/"' not in s[idx:end+500]:
              s=s[:end]+gd+s[end:]
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascent/practice-core.html
          git diff --cached --quiet && exit 0
          git commit -m "Add GD Lab to ASCENT student menu [gd-core-menu-applied]"
          git push origin HEAD:feature/gd-link-practice-core
