name: ORACY Level C Units 2-30 Integrity
on:
  pull_request:
    paths:
      - 'oracy/level-c-units-2-30-specs.js'
      - 'oracy/level-c-source-16-30.js'
      - 'oracy/level-c-source-audit-fixes.js'
      - 'oracy/level-c-listen-speak.js'
      - 'oracy/level-c-unit6-listening-fix.js'
      - 'oracy/level-c-unit6-comprehension-vocab.js'
      - 'oracy/level-c-vocab-meaning-ui.js'
      - 'oracy/level-c-unit-builder.js'
      - 'oracy/level-c-unit-enhance.js'
      - 'oracy/rules-c1a.js'
      - 'oracy/rules-c1b.js'
      - 'oracy/rules-c2a.js'
      - 'oracy/rules-c2b.js'
      - 'oracy/unit-c.html'
      - 'oracy/unit-speaking-c-units2-30-runtime.js'
      - 'oracy/level-c-progress.js'
      - 'oracy/progress-c.html'
      - 'oracy/index.html'
      - '.github/workflows/oracy-level-c-units2-30-integrity.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check oracy/level-c-units-2-30-specs.js
          node --check oracy/level-c-source-16-30.js
          node --check oracy/level-c-source-audit-fixes.js
          node --check oracy/level-c-listen-speak.js
          node --check oracy/level-c-unit6-listening-fix.js
          node --check oracy/level-c-unit6-comprehension-vocab.js
          node --check oracy/level-c-vocab-meaning-ui.js
          node --check oracy/level-c-unit-builder.js
          node --check oracy/level-c-unit-enhance.js
          node --check oracy/unit-speaking-c-units2-30-runtime.js
          node --check oracy/level-c-progress.js
          node --check oracy/rules-c1a.js
          node --check oracy/rules-c1b.js
          node --check oracy/rules-c2a.js
          node --check oracy/rules-c2b.js
      - name: Curriculum and architecture checks
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path('oracy/level-c-units-2-30-specs.js'),Path('oracy/level-c-source-16-30.js'),Path('oracy/level-c-source-audit-fixes.js'),Path('oracy/level-c-listen-speak.js'),Path('oracy/level-c-unit6-listening-fix.js'),Path('oracy/level-c-unit6-comprehension-vocab.js'),Path('oracy/level-c-vocab-meaning-ui.js'),Path('oracy/level-c-unit-builder.js'),Path('oracy/level-c-unit-enhance.js'),Path('oracy/unit-speaking-c-units2-30-runtime.js'),Path('oracy/level-c-progress.js'),Path('oracy/unit-c.html')]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          assert 'window.ORACY_C_SPECS=' in text
          specs=Path('oracy/level-c-units-2-30-specs.js').read_text(encoding='utf-8')
          for n in range(2,31): assert f'"{n}":' in specs, f'missing Unit {n}'
          src=Path('oracy/level-c-source-16-30.js').read_text(encoding='utf-8')
          for n in range(16,31): assert f'{n}:' in src, f'missing source correction Unit {n}'
          for required in ('festivals, celebrations and traditions','the Internet and quantities','informal spoken register','weights, measures and currency values','newspapers and journalistic register','school days, adult education and training','letter writing and personality','advertising','the animal world and strong opinions','complaining and apologising','politics and government','British and American English and international usage','going on a cruise and future events','past experiences and memories','famous quotations, proverbs and famous mistakes'):
              assert required in src, required
          assert src.count('listenSpeak:{') == 15, 'Units 16-30 must each have a listenSpeak conversation'
          assert src.count("['A'") >= 75 and src.count("['B'") >= 75, 'Units 16-30 listening conversations became too short'
          audit=Path('oracy/level-c-source-audit-fixes.js').read_text(encoding='utf-8')
          for required in ('harbour','lifeboat','forehead','maternal aunt','procession','first-aid point','kilometre','sociology','stray animal'):
              assert required in audit, required
          u6=Path('oracy/level-c-unit6-listening-fix.js').read_text(encoding='utf-8')
          for required in ('car-free Sundays','four-day teaching week','water-saving rules','provided that','Were the authorities to','I wish'):
              assert required in u6, required
          assert u6.count("['A'") == 15 and u6.count("['B'") == 15, 'Unit 6 must keep three substantial 10-turn listening dialogues'
          cv=Path('oracy/level-c-unit6-comprehension-vocab.js').read_text(encoding='utf-8')
          assert cv.count("label:'Listening comprehension'") == 12, 'Unit 6 needs four genuine comprehension MCQs per Key Point'
          for required in ('Why does Speaker B think car-free Sundays','What condition does Speaker B give','What possible benefit of a four-day teaching week','What water-saving rule','feasible','possible and practical enough to be done','unrealistic','worthwhile','controversial','sustainable','provided that','on condition that','were I to','should it happen','I wish','back up','rule out','think through','go along with','push back on'):
              assert required in cv, required
          meaning=Path('oracy/level-c-vocab-meaning-ui.js').read_text(encoding='utf-8')
          for required in ('Understand the word from context','What does','Check meaning','Choose a meaning first','Now listen to the conversation and use the word yourself'):
              assert required in meaning, required
          listen=Path('oracy/level-c-listen-speak.js').read_text(encoding='utf-8')
          for required in ('Listen to full conversation','read the suggested line','say it your way','The next response can change','evaluate','transcript','adaptiveLead','preload'):
              assert required.lower() in listen.lower(), required
          assert 'Question → Answer' in text
          assert 'Statement → Response' in text
          assert 'Hint' in text
          assert 'Evaluate within CEFR B range' in text
          assert 'Natural, enthusiastic adult conversation in clear UK English' in text
          html=Path('oracy/unit-c.html').read_text(encoding='utf-8')
          for f in ('level-c-source-16-30.js','level-c-source-audit-fixes.js','level-c-unit6-listening-fix.js','level-c-unit6-comprehension-vocab.js','level-c-vocab-meaning-ui.js','level-c-listen-speak.js','level-c-static-audio-preload.js'): assert f in html
          assert html.index('level-c-unit-builder.js') < html.index('level-c-unit6-listening-fix.js') < html.index('level-c-unit6-comprehension-vocab.js') < html.index('unit-renderer-c.js') < html.index('level-c-audio-binding.js')
          assert html.index('unit-speaking-c-units2-30-runtime.js') < html.index('level-c-vocab-meaning-ui.js')
          assert 'progress-c.html?level=' in Path('oracy/index.html').read_text(encoding='utf-8')
          banned='inlingua'
          for p in files+[Path('oracy/rules-c1a.js'),Path('oracy/rules-c1b.js'),Path('oracy/rules-c2a.js'),Path('oracy/rules-c2b.js')]:
              assert banned not in p.read_text(encoding='utf-8').lower(), f'banned term in {p}'
          print('Level C integrity OK; Unit 6 genuine comprehension and context-first vocabulary meaning work guarded')
          PY
