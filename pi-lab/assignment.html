<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PI Assignment · ClarionPrep</title>
<style>
:root{--n:#0e2344;--b:#2458d7;--ink:#172033;--mut:#667085;--line:#dfe5ee;--bg:#eef2f7;--soft:#f7f9fc;--red:#b42318;--gold:#c67b00}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--n);color:#fff;padding:18px 24px}header b{font-size:20px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.intro h1{margin:0 0 8px;font-size:28px}.intro p{margin:6px 0;color:var(--mut);line-height:1.55}.pill{display:inline-block;background:#eef3ff;color:#1d4cb5;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.qcard{padding:16px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff}.q{font-weight:800;color:var(--n);font-size:18px;line-height:1.4}.model{margin-top:12px;padding:12px 14px;border-left:4px solid var(--b);background:var(--soft);line-height:1.55}.model b{display:block;margin-bottom:5px}.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.step{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.step b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gold);margin-bottom:6px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.btn.secondary{background:#eaf2f9;color:var(--n)}.btn.recording{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.status{font-size:12px;color:var(--mut);margin-top:7px;min-height:18px}.playback{width:100%;margin-top:8px;display:none}.playback.show{display:block}.gate{max-width:700px;margin:40px auto;text-align:center}.footer{text-align:center;color:#8a94a4;font-size:12px;padding:14px}@media(max-width:760px){.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>ClarionPrep PI Lab</b></header>
<div id="gate" class="card gate"><h2 id="gateTitle">Preparing your PI practice…</h2><p id="gateText">The app is preparing the JD-based questions and model answers.</p></div>
<main id="app" class="wrap" style="display:none">
<section class="card intro"><span class="pill">Hear the question. Hear a strong answer. Answer it yourself.</span><h1 id="title"></h1><p id="intro"></p></section>
<section class="card"><div id="questions"></div></section>
</main>
<div class="footer">TELW The English Workshop · ClarionPrep</div>
<audio id="audio"></audio>
<script>
const SUPABASE_URL='https://vtqatrhwfvzyodiftvkc.supabase.co';
const KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643';
const MODELS=SUPABASE_URL+'/functions/v1/pi-assignment-models';
const VOICE=SUPABASE_URL+'/functions/v1/pi-assignment-voice';
const TOKEN=new URLSearchParams(location.search).get('assignment')||'';
const audio=document.getElementById('audio');
let ITEMS=[],currentUrl='',rec=null,chunks=[],stream=null;
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function load(){if(!TOKEN)throw Error('This PI assignment link is incomplete.');const r=await fetch(MODELS,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'This PI assignment is unavailable.');const qs=d.assignment.questions||[],as=d.assignment.model_answers||[];ITEMS=qs.map((q,i)=>({q:String(q),a:String(as[i]||'')}));title.textContent=d.assignment.company+' — '+d.assignment.role;intro.textContent=(d.recipient?.name?'For '+d.recipient.name+'. ':'')+'For each JD-based question, hear the interviewer, then hear a strong model answer in a male candidate voice. After that, record your own answer and listen back. Your recording stays in this browser and is not stored. This link expires '+new Date(d.assignment.expires_at).toLocaleDateString()+'.';build();gate.style.display='none';app.style.display='block';startAudioPreload()}
function build(){questions.innerHTML=ITEMS.map((x,i)=>'<div class="qcard"><div class="q">'+esc(x.q)+'</div><div class="model"><b>Model answer</b>'+esc(x.a)+'</div><div class="steps"><div class="step"><b>1 · Hear the interviewer</b><button class="btn" onclick="playText('+i+',\'q\',this)">▶ Play question</button></div><div class="step"><b>2 · Hear the model candidate</b><button class="btn secondary" onclick="playText('+i+',\'a\',this)">▶ Play model answer</button></div><div class="step"><b>3 · Answer it yourself</b><button class="btn" onclick="toggleRecord('+i+',this)">Record your answer</button><audio id="p'+i+'" class="playback" controls></audio></div></div><div id="s'+i+'" class="status">Ready.</div></div>').join('')}
const cache=new Map(),inFlight=new Map();function key(i,kind){return i+':'+kind}
async function getAudio(i,kind){const r=await fetch(VOICE,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,index:i,kind})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'Audio could not be prepared.');const bin=atob(d.audio_base64),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return new Blob([u],{type:d.audio_mime||'audio/mpeg'})}
function prepareAudio(i,kind){const k=key(i,kind);if(cache.has(k))return Promise.resolve(cache.get(k));if(inFlight.has(k))return inFlight.get(k);const job=getAudio(i,kind).then(blob=>{cache.set(k,blob);inFlight.delete(k);return blob}).catch(e=>{inFlight.delete(k);throw e});inFlight.set(k,job);return job}
async function preloadWorker(queue){while(queue.length){const task=queue.shift();if(!task)break;try{await prepareAudio(task.i,task.kind)}catch{}}}
function startAudioPreload(){const queue=[];if(ITEMS.length){queue.push({i:0,kind:'q'},{i:0,kind:'a'})}for(let i=1;i<ITEMS.length;i++){queue.push({i,kind:'q'},{i,kind:'a'})}const workers=[];for(let n=0;n<Math.min(3,queue.length);n++)workers.push(preloadWorker(queue));Promise.allSettled(workers)}
async function playText(i,kind,btn){const status=document.getElementById('s'+i);try{btn.disabled=true;const k=key(i,kind);status.textContent=cache.has(k)?'Playing…':kind==='q'?'Preparing interviewer audio…':'Preparing male model candidate audio…';const blob=await prepareAudio(i,kind);if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(blob);audio.src=currentUrl;status.textContent=kind==='q'?'Interviewer speaking…':'Model candidate speaking…';await audio.play();status.textContent='Ready.'}catch(e){status.textContent=e.message||'Audio unavailable.'}finally{btn.disabled=false}}
async function toggleRecord(i,btn){const player=document.getElementById('p'+i),status=document.getElementById('s'+i);if(rec){rec.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];rec=new MediaRecorder(stream,MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());stream=null;rec=null;btn.textContent='Record your answer';btn.classList.remove('recording');player.src=URL.createObjectURL(blob);player.classList.add('show');status.textContent='Listen back. Record again if you want another attempt. Nothing is uploaded or stored.'};rec.start();btn.textContent='Stop recording';btn.classList.add('recording');status.textContent='Speak now. Give your own answer.'}catch(e){status.textContent='Microphone access is needed for this practice.'}}
load().catch(e=>{gateTitle.textContent='PI assignment unavailable';gateText.textContent=e.message||'This link is invalid or expired.'});
</script>
</body>
</html>
