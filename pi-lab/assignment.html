<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PI Assignment · ClarionPrep</title><style>:root{--n:#0e2344;--b:#2458d7;--ink:#172033;--mut:#667085;--line:#dfe5ee;--bg:#eef2f7;--soft:#f7f9fc;--red:#b42318;--gold:#c67b00}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--n);color:#fff;padding:18px 24px}header b{font-size:20px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.intro h1{margin:0 0 8px;font-size:28px}.intro p{margin:6px 0;color:var(--mut);line-height:1.55}.pill{display:inline-block;background:#eef3ff;color:#1d4cb5;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.qcard{padding:16px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff}.q{font-weight:800;color:var(--n);font-size:18px;line-height:1.4}.model{margin-top:12px;padding:12px 14px;border-left:4px solid var(--b);background:var(--soft);line-height:1.55}.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.step{padding:12px;border:1px solid var(--line);border-radius:10px}.step b{display:block;font-size:12px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.btn.secondary{background:#eaf2f9;color:var(--n)}.btn.recording{background:var(--red)}.btn:disabled{opacity:.5}.status{font-size:12px;color:var(--mut);margin-top:7px;min-height:18px}.playback{width:100%;margin-top:8px;display:none}.playback.show{display:block}.gate{max-width:700px;margin:40px auto;text-align:center}.footer{text-align:center;color:#8a94a4;font-size:12px;padding:14px}@media(max-width:760px){.steps{grid-template-columns:1fr}}</style></head><body><header><b>ClarionPrep PI Lab</b></header><div id="gate" class="card gate"><h2 id="gateTitle">Opening your PI practice…</h2><p id="gateText">Loading your released question set.</p></div><main id="app" class="wrap" style="display:none"><section class="card intro"><span class="pill">Hear the question. Hear a strong answer. Answer it yourself.</span><h1 id="title"></h1><p id="intro"></p></section><section class="card"><div id="questions"></div></section></main><div class="footer">TELW The English Workshop · ClarionPrep</div><audio id="audio"></audio><script>
const U='https://vtqatrhwfvzyodiftvkc.supabase.co',K='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',ACCESS=U+'/functions/v1/pi-assignment-access',MODELS=U+'/functions/v1/pi-assignment-models',VOICE=U+'/functions/v1/pi-assignment-voice',TOKEN=new URLSearchParams(location.search).get('assignment')||'';let ITEMS=[],rec=null,chunks=[],stream=null,currentUrl='';const cache=new Map(),inFlight=new Map(),audio=document.getElementById('audio');
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'Request failed.');return d}
function render(meta){title.textContent=meta.company+' — '+meta.role;intro.textContent=(meta.name?'For '+meta.name+'. ':'')+'Hear each JD-based question, hear a strong model answer in a male candidate voice, then record your own answer. Your recording stays in this browser and is not stored. This link expires '+new Date(meta.expires_at).toLocaleDateString()+'.';questions.innerHTML=ITEMS.map((x,i)=>'<div class="qcard"><div class="q">'+esc(x.q)+'</div><div class="model"><b>Model answer</b><span id="m'+i+'">'+esc(x.a||'Preparing model answer…')+'</span></div><div class="steps"><div class="step"><b>1 · Hear the interviewer</b><button class="btn" onclick="playText('+i+',\'q\',this)">▶ Play question</button></div><div class="step"><b>2 · Hear the model candidate</b><button id="a'+i+'" class="btn secondary" '+(x.a?'':'disabled')+' onclick="playText('+i+',\'a\',this)">▶ Play model answer</button></div><div class="step"><b>3 · Answer it yourself</b><button class="btn" onclick="toggleRecord('+i+',this)">Record your answer</button><audio id="p'+i+'" class="playback" controls></audio></div></div><div id="s'+i+'" class="status">Ready.</div></div>').join('');gate.style.display='none';app.style.display='block'}
async function load(){if(!TOKEN)throw Error('This PI assignment link is incomplete.');const d=await post(ACCESS,{token:TOKEN});const qs=d.assignment.questions||[],as=d.assignment.model_answers||[];ITEMS=qs.map((q,i)=>({q:String(q),a:String(as[i]||'')}));render({company:d.assignment.company,role:d.assignment.role,name:d.recipient?.name||'',expires_at:d.assignment.expires_at});setTimeout(()=>startAudioPreload(),400);if(as.length!==qs.length)hydrateModels()}
async function hydrateModels(){try{const d=await post(MODELS,{token:TOKEN});const as=d.assignment.model_answers||[];ITEMS.forEach((x,i)=>{if(as[i]){x.a=String(as[i]);const m=document.getElementById('m'+i),b=document.getElementById('a'+i);if(m)m.textContent=x.a;if(b)b.disabled=false}});setTimeout(()=>startAudioPreload(),200)}catch(e){console.warn(e)}}
function k(i,kind){return i+':'+kind}async function getAudio(i,kind){const d=await post(VOICE,{token:TOKEN,index:i,kind});const bin=atob(d.audio_base64),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return new Blob([u],{type:d.audio_mime||'audio/mpeg'})}
function prepare(i,kind){const x=k(i,kind);if(cache.has(x))return Promise.resolve(cache.get(x));if(inFlight.has(x))return inFlight.get(x);const p=getAudio(i,kind).then(b=>{cache.set(x,b);inFlight.delete(x);return b}).catch(e=>{inFlight.delete(x);throw e});inFlight.set(x,p);return p}
async function worker(q){while(q.length){const t=q.shift();try{await prepare(t.i,t.kind)}catch{}}}function startAudioPreload(){const q=[];for(let i=0;i<ITEMS.length;i++){q.push({i,kind:'q'});if(ITEMS[i].a)q.push({i,kind:'a'})}if(!q.length)return;worker(q);if(q.length)worker(q)}
async function playText(i,kind,btn){const s=document.getElementById('s'+i);try{btn.disabled=true;s.textContent=cache.has(k(i,kind))?'Playing…':'Preparing audio…';const b=await prepare(i,kind);if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(b);audio.src=currentUrl;s.textContent=kind==='q'?'Interviewer speaking…':'Model candidate speaking…';await audio.play();s.textContent='Ready.'}catch(e){s.textContent=e.message||'Audio unavailable.'}finally{btn.disabled=false}}
async function toggleRecord(i,btn){const p=document.getElementById('p'+i),s=document.getElementById('s'+i);if(rec){rec.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];rec=new MediaRecorder(stream,MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());stream=null;rec=null;btn.textContent='Record your answer';btn.classList.remove('recording');p.src=URL.createObjectURL(b);p.classList.add('show');s.textContent='Listen back. Record again if you want another attempt. Nothing is uploaded or stored.'};rec.start();btn.textContent='Stop recording';btn.classList.add('recording');s.textContent='Speak now. Give your own answer.'}catch{ s.textContent='Microphone access is needed for this practice.'}}
