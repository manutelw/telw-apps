<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PI Practice · ClarionPrep</title><style>:root{--n:#0e2344;--b:#2458d7;--ink:#172033;--mut:#667085;--line:#dfe5ee;--bg:#eef2f7;--soft:#f7f9fc;--green:#137a48;--red:#b42318;--gold:#c67b00}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--n);color:#fff;padding:18px 24px}header b{font-size:20px}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.intro h1{margin:0 0 8px;font-size:28px}.intro p{margin:6px 0;color:var(--mut);line-height:1.55}.pill{display:inline-block;background:#eef3ff;color:#1d4cb5;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.qcard{padding:16px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.q{font-weight:800;color:var(--n);font-size:18px;line-height:1.4}.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.step{padding:12px;border:1px solid var(--line);border-radius:10px}.step b{display:block;font-size:12px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.btn.recording{background:var(--red)}.status{font-size:12px;color:var(--mut);margin-top:7px;min-height:18px}.playback{width:100%;margin-top:8px;display:none}.playback.show{display:block}.gate{max-width:700px;margin:40px auto;text-align:center}.footer{text-align:center;color:#8a94a4;font-size:12px;padding:14px}@media(max-width:760px){.steps{grid-template-columns:1fr}}</style></head><body><header><b>ClarionPrep PI Lab</b></header><div id="gate" class="card gate"><h2 id="gateTitle">Checking PI Lab access…</h2><p id="gateText">Preparing your question set.</p></div><main id="app" class="wrap" style="display:none"><section class="card intro"><span class="pill">Hear it. Answer it. Listen back.</span><h1 id="title">PI Practice</h1><p id="sub"></p></section><div id="content"></div></main><div class="footer">TELW The English Workshop · ClarionPrep</div><script>
const URL='https://vtqatrhwfvzyodiftvkc.supabase.co',KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',ACCESS=URL+'/functions/v1/pi-assignment-access';
const PARAMS=new URLSearchParams(location.search),TOKEN=PARAMS.get('assignment')||'';let rec=null,chunks=[],stream=null;
const GENERIC=['Tell me about yourself and connect your profile to this role.','What are the two strengths you would bring to this role?','Why are you interested in this role?','Why do you want to work with this company?','Tell me about a time you had to work with others to get something done.','Tell me about a time something did not go as planned. What did you do?','What would you do if two urgent tasks were due at the same time?','What would you do if you were given a task you had never handled before?','Are you comfortable with the location, timings, travel and work arrangement required for this role?','How soon can you join, and is there anything that could affect your joining?','What do you understand about how this company makes money?','What is one change affecting this industry, and why does it matter?','Why did you choose your MBA specialisation?','There is a gap or change in your profile. How would you explain it?','What would you do if you noticed an error that others had missed just before a client submission?','What would you do if a senior asked you to present a number you were not confident was correct?','Why should we hire you when you do not have much experience?','What is one reason we should not hire you?'];
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function speak(text){return new Promise((resolve,reject)=>{if(!('speechSynthesis'in window))return reject(Error('Audio is unavailable in this browser.'));speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.96;u.onend=resolve;u.onerror=()=>reject(Error('Audio could not play.'));speechSynthesis.speak(u)})}
async function toggleRecord(i,btn){const p=document.getElementById('p'+i),s=document.getElementById('s'+i);if(rec){rec.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];rec=new MediaRecorder(stream,MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());stream=null;rec=null;btn.textContent='Record your answer';btn.classList.remove('recording');p.src=URL.createObjectURL(blob);p.classList.add('show');s.textContent='Listen back. Record again if you want another attempt. Nothing is uploaded or stored.'};rec.start();btn.textContent='Stop recording';btn.classList.add('recording');s.textContent='Speak now.'}catch{s.textContent='Microphone access is needed for this practice.'}}
function build(qs){content.innerHTML=qs.map((q,i)=>`<section class="card qcard"><div class="q">Q${i+1}. ${esc(q)}</div><div class="steps"><div class="step"><b>1 · Hear the question</b><button class="btn" onclick="playQ(${i})">▶ Play question</button></div><div class="step"><b>2 · Practise your answer</b><button class="btn" onclick="toggleRecord(${i},this)">Record your answer</button><audio id="p${i}" class="playback" controls></audio></div></div><div id="s${i}" class="status">Ready.</div></section>`).join('')}
window.playQ=async i=>{const q=window.currentQuestions[i],s=document.getElementById('s'+i);try{s.textContent='Playing question…';await speak(q);s.textContent='Ready.'}catch(e){s.textContent=e.message||'Audio unavailable.'}};window.toggleRecord=toggleRecord;
async function init(){if(TOKEN){try{const r=await fetch(ACCESS,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||'This PI assignment is unavailable.');window.currentQuestions=d.assignment.questions||[];gate.style.display='none';app.style.display='block';title.textContent=d.assignment.company+' — '+d.assignment.role;sub.textContent=(d.recipient?.name?'For '+d.recipient.name+'. ':'')+'Practise the released interview questions. Your recordings stay only in this browser session and are not stored in PI Lab. Link expires '+new Date(d.assignment.expires_at).toLocaleDateString()+'.';build(window.currentQuestions);return}catch(e){gateTitle.textContent='PI assignment unavailable';gateText.textContent=e.message;return}}
window.currentQuestions=GENERIC;gate.style.display='none';app.style.display='block';title.textContent='PI Basics: 18 common interview questions';sub.textContent='Use this generic practice set to hear each question and rehearse your response. Recordings remain local to this browser and are not stored.';build(GENERIC)}
init();
</script></body></html>
