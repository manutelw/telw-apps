<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialogue Lab · Admin Access</title></head><body><p style="font-family:Arial;padding:24px">Opening your free administrator test session…</p><script>(()=>{try{const raw=location.hash.startsWith('#handoff=')?location.hash.slice(9):'';if(!raw)throw new Error('No administrator handoff was supplied.');const b64=decodeURIComponent(raw);const json=decodeURIComponent(escape(atob(b64)));const session=JSON.parse(json);if(!session||!session.sessionToken)throw new Error('The administrator handoff is invalid.');localStorage.setItem('ascent_student_session',JSON.stringify(session));history.replaceState(null,'',location.pathname);location.replace('./');}catch(e){document.body.innerHTML='<div style="font-family:Arial;padding:24px"><h2>Administrator access could not be opened</h2><p>'+String(e.message||e)+'</p><p>Please return to ASCENT Admin and click <strong>Dialogue Lab – Test</strong> again.</p></div>';}})();</script></body></html>
