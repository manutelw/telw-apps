<!doctype html><meta charset="utf-8"><title>ASCENT Dialogue Lab · LUM Unit 3</title>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const hp=new URLSearchParams(location.hash.replace(/^#/,''));
  const kp=Number(params.get('kp')||hp.get('kp')||1);
  const startMap={1:1,2:3,3:5};
  const startScene=startMap[kp]||1;

  const r=await fetch('./lum2.html',{cache:'no-store'});
  let h=await r.text();

  h=h.replaceAll('LUM Unit 2','LUM Unit 3');
  h=h.replaceAll('Reviewing Recent Experience and Current Activity','Present Perfect Continuous: What have you been doing?');
  h=h.replace('Give clear progress updates, talk about duration honestly, and choose the right form for finished and unfinished time.','Explain what you have been busy with, how long it has been going on, and what has actually been achieved.');
  h=h.replace(/module:2/g,'module:3');
  h=h.replace("speak(x[1],x[0])","speak(x[1],x[0]==='neeti'?'neeti_student':'arjun_student')");
  h=h.replace("await new Promise(r=>setTimeout(r,280))","await new Promise(r=>setTimeout(r,85))");

  const block=String.raw`const D1=[['neeti','You’re still working on that SIP report?'],['arjun','Don’t remind me. I’ve been working on it since Monday.'],['neeti','Since Monday? I thought you started yesterday.'],['arjun','I wish. I’ve been cleaning up the data for four days now.'],['neeti','Four days! What’s taking so long?'],['arjun','The responses are all over the place. What about your presentation?'],['neeti','I’ve been working on that for about two weeks.'],['arjun','Two weeks? And you were laughing at me?'],['neeti','Mine’s a group project. Half my time has been spent chasing people.'],['arjun','Ah. Say no more.'],['neeti','How long have you been preparing for placements, by the way?'],['arjun','Seriously? Since the beginning of this term. You?'],['neeti','For about a month. Before that, I was mostly pretending.'],['arjun','That sounds familiar.']];
const D2=[['arjun','You look exhausted. What have you been doing?'],['neeti','I’ve been fixing our presentation since breakfast.'],['arjun','Since breakfast? What happened?'],['neeti','The numbers changed this morning, so I’ve been reworking half the slides.'],['arjun','Ouch. Finished now?'],['neeti','Almost. I need another twenty minutes. Why? Do you need the laptop?'],['arjun','Yeah, but it can wait. I’ve been trying to finish an application on my phone.'],['neeti','That explains the angry face.'],['arjun','I do not have an angry face.'],['neeti','You’ve been glaring at your screen for ten minutes.'],['arjun','Okay, maybe a slightly angry face.'],['neeti','What’s the problem?'],['arjun','The portal keeps throwing me out. I’ve filled the same section in three times.'],['neeti','Give me twenty minutes. Then take the laptop.'],['arjun','Deal. Coffee?'],['neeti','Please. I’ve definitely earned one.']];
const D3=[['neeti','How’s the company research going?'],['arjun','Pretty well. I’ve been working on it all afternoon.'],['neeti','That tells me you’ve been busy. What have you actually finished?'],['arjun','Fair question. I’ve completed profiles for three companies.'],['neeti','Three? Not bad.'],['arjun','What about you?'],['neeti','I’ve been practising HR questions for the last hour.'],['arjun','How many have you done?'],['neeti','Six properly. I recorded each one twice.'],['arjun','Okay, now I feel lazy.'],['neeti','You just said you’ve completed three company profiles.'],['arjun','True. I take it back.'],['neeti','See the difference, though? “I’ve been practising” tells you what I’ve been spending time on.'],['arjun','And “I’ve done six” tells me what came out of that time.'],['neeti','Exactly.'],['arjun','That sounded suspiciously like something a teacher would say.'],['neeti','Eat your samosa.']];
const S=[
{k:'OPENING',t:'Activity · duration · result',b:['At work, time has to be accounted for clearly.','You often need to explain what you have been busy with, how long it has been going on, and what has been achieved.'],n:'In this unit, you will learn to account for your time clearly. You need to show three things: what you have been busy with, how long it has been going on, and what result has come from that time.'},
{k:'KP1 · WATCH FIRST',t:'How long has this been going on?',d:D1,p:[R('Comprehension','How long has Arjun been working on the SIP report?','Give the starting point.',3,14,'Use the correct starting point.'),R('Comprehension','How long has Neeti been working on her presentation?','Give the duration.',3,14,'Use the correct duration.')]},
{k:'KP1 · NOTICE',t:'HOW LONG · FOR · SINCE',b:['HOW LONG asks about duration.','SINCE gives the starting point: since Monday, since the term began.','FOR gives the length of time: for four days, for two weeks.','The activity started in the past and is still continuing.'],n:'Use how long to ask about duration. Use since for the starting point and for for the length of time. This helps a manager, interviewer or teammate understand how long your effort has been continuing.',p:[R('Duration update','Choose one current activity and say how long you have been doing it.','I’ve been ___ since ___.\nI’ve been ___ for ___.',8,30,'Use since and for accurately.'),R('Placement transfer','How long have you been preparing seriously for placements?','Give one clear answer and one useful detail.',8,30,'Use Present Perfect Continuous naturally.')]},
{k:'KP2 · WATCH FIRST',t:'Explaining the present situation',d:D2,p:[R('Comprehension','Why does Neeti look exhausted?','Explain what she has been doing.',3,16,'Connect the recent activity to the present situation.'),R('Comprehension','Why does Arjun need the laptop?','State what he has been trying to do.',3,16,'Use the correct activity.')]},
{k:'KP2 · NOTICE',t:'Delay · urgency · resource need',b:['Recent activity can explain a present result: “You look tired.” → “I’ve been working on the deck.”','It can account for how your time has been occupied without blaming anyone.','For an ongoing task, add what comes next: “I’ve been clearing the data for two hours. I’ll need another half hour.”','Good workplace communication gives context for the next decision.'],n:'This form is useful when the activity explains the situation now. It can show why you are tired, delayed, busy or still using a resource. The point is not to complain. The point is to account for your time and make the next step clear.',p:[R('Account for time','What have you been doing for the last hour or this morning?','I’ve been ___.\nI finished / I still need ___.',8,32,'Explain the activity and the next step.'),R('Resource need','You are still using a shared laptop or meeting room. Explain why and say how much longer you need.','I’ve been ___ for ___.\nI’ll need another ___.',10,35,'Give context without blaming and state the next step.')]},
{k:'KP3 · WATCH FIRST',t:'Activity or finished output?',d:D3,p:[R('Comprehension','How long has Arjun been doing company research?','Give the duration.',3,14,'State the activity duration accurately.'),R('Comprehension','What has Arjun actually completed?','Give the finished output.',3,14,'State the completed result accurately.')]},
{k:'KP3 · NOTICE',t:'Present Perfect Continuous vs Present Perfect',b:['ACTIVITY / TIME SPENT → “I’ve been working on the report for two hours.”','FINISHED OUTPUT / QUANTITY → “I’ve completed four sections.”','Managers need both: useful activity and visible output.','Do not confuse being busy with getting something done.'],n:'At work, separate activity from output. Present Perfect Continuous shows what you have been spending time on. Present Perfect shows what has been completed or how much has been achieved. A strong update often gives both.',p:[R('Activity + output','Give one update about a task you are working on.','I’ve been working on ___ for ___.\nI’ve completed ___.',8,32,'Separate time invested from output achieved.'),R('Placement version','Give a placement-preparation update with one activity and one measurable result.','I’ve been ___.\nI’ve completed / submitted / practised ___.',10,35,'Show both activity and result clearly.')]},
{k:'FINAL PRODUCTION',t:'Account for your time clearly',b:['What have you been working on?','How long have you been doing it?','What has been completed?','What is still pending?','What happens next?'],n:'Now give one complete workplace-style update. Show what you have been doing, how long it has been going on, what you have achieved, and what you will do next. Build the message first. Use the grammar only where it fits naturally.',p:[R('Mastery','Give a 45 to 60 second update on your current placement, project or assignment work.','No sentence starters. Cover activity, duration, result and next step.',15,60,'Give a clear, connected update using Unit 3 language naturally.')]},
{k:'TAKEAWAY',t:'Activity · duration · result',b:['HOW LONG asks about duration.','FOR = length of time.','SINCE = starting point.','Present Perfect Continuous = activity / time invested.','Present Perfect = completed output / quantity.','Explain delays or resource needs with context and a clear next step.'],n:'The main idea is simple. Account for your time. Say what you have been doing, how long it has been going on, what has been achieved, and what happens next.'}
];`;

  h=h.replace(/const D1=\[.*?\];const S=\[.*?\];function esc/s,block+'function esc');
  h=h.replace("let sess,si=0,pi=0","let sess,si="+startScene+",pi=0");

  const nav=`<style>#kpNav{position:sticky;top:0;z-index:9998;background:#edf5fc;border:1px solid #9bbcd7;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-family:Arial;box-shadow:0 4px 14px #0002}#kpNav b{color:#143a60;margin-right:10px}#kpNav button{margin:3px 4px 3px 0;border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;background:#143a60;color:white}#adminSkipPractice{display:none;background:#fff!important;color:#143a60!important;border:1px solid #b9ccdd!important}</style><div id="kpNav"><b>Choose a Key Point</b><button data-kp="1">KP1</button><button data-kp="3">KP2</button><button data-kp="5">KP3</button><button id="adminSkipPractice">Admin: Skip current exercise</button></div>`;
  h=h.replace('<div class="card"><div id="start">',nav+'<div class="card"><div id="start">');

  const route=`<script>(function(){
    const jump=(idx)=>{try{if(typeof ambStop==='function')ambStop();audio.pause();playing=false;}catch(e){}document.getElementById('start').hidden=true;document.getElementById('lesson').hidden=false;si=idx;pi=0;attempt=1;render();window.scrollTo({top:0,behavior:'smooth'});};
    document.querySelectorAll('#kpNav [data-kp]').forEach(b=>b.addEventListener('click',()=>jump(Number(b.dataset.kp))));
    let a=null;try{a=JSON.parse(localStorage.getItem('ascent_student_session')||'null')}catch(e){};const sk=document.getElementById('adminSkipPractice');if(a&&a.adminDemo===true&&sk){sk.style.display='inline-block';sk.addEventListener('click',()=>{try{if(typeof ambStop==='function')ambStop();audio.pause();playing=false;}catch(e){}const pr=document.getElementById('practice'),fb=document.getElementById('feedback'),nx=document.getElementById('next');if(pr)pr.hidden=true;if(fb)fb.hidden=true;if(nx)nx.disabled=false;const cs=document.getElementById('coachState');if(cs)cs.textContent='Admin test: exercise skipped.'})}
    if(${startScene}!==1){let tries=0;const t=setInterval(()=>{tries++;if(typeof render==='function'&&document.getElementById('lesson')){clearInterval(t);jump(${startScene})}else if(tries>40)clearInterval(t)},50)}
  })();<\/script>`;
  h=h.replace('</body>',route+'</body>');

  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:Arial;padding:24px">Unit 3 could not load. Please refresh.</p>';console.error(e)});
</script>
