<!doctype html><meta charset="utf-8"><title>ASCENT Dialogue Lab · LUM Unit 1</title>
<script>
(async()=>{
  const r=await fetch('./lum1-v5.html',{cache:'no-store'});
  let h=await r.text();

  h=h.replaceAll('(a light laugh)','');
  h=h.replaceAll('(Chuckles)','');
  h=h.replaceAll('(Chuckling) ','');
  h=h.replaceAll('[light laugh]','');
  h=h.replaceAll('[chuckles]','');
  h=h.replaceAll('[chuckling] ','');

  // Keep only the natural arrival line.
  h=h.replaceAll('I joined yesterday. I came here yesterday.','I came here yesterday.');

  // Park ambience: soft outdoor air stays underneath; louder bird calls happen only between spoken turns.
  const oldStart=/function startTraffic\(\)\{.*?\}function stopTraffic\(\)\{.*?trafficCtx=null\}/s;
  const park=`function startTraffic(){try{trafficCtx=new (window.AudioContext||window.webkitAudioContext)();const master=trafficCtx.createGain();master.gain.value=.2;master.connect(trafficCtx.destination);const dur=3,buf=trafficCtx.createBuffer(1,trafficCtx.sampleRate*dur,trafficCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.05;const air=trafficCtx.createBufferSource();air.buffer=buf;air.loop=true;const lp=trafficCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;const airGain=trafficCtx.createGain();airGain.gain.value=.2;air.connect(lp).connect(airGain).connect(master);air.start();trafficNodes=[air,master];trafficCtx.__bird=()=>{if(!trafficCtx)return;const t=trafficCtx.currentTime+.015;const make=(delay,base,peak)=>{const osc=trafficCtx.createOscillator(),g=trafficCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(base,t+delay);osc.frequency.exponentialRampToValueAtTime(base*1.45,t+delay+.08);osc.frequency.exponentialRampToValueAtTime(base*.92,t+delay+.17);g.gain.setValueAtTime(0,t+delay);g.gain.linearRampToValueAtTime(peak,t+delay+.018);g.gain.exponentialRampToValueAtTime(.001,t+delay+.19);osc.connect(g).connect(master);osc.start(t+delay);osc.stop(t+delay+.21)};const base=2100+Math.random()*1000;make(0,base,.28);if(Math.random()>.35)make(.13,base*1.12,.2)}}catch{}}function stopTraffic(){try{for(const n of trafficNodes)try{n?.stop?.()}catch{}trafficCtx?.close()}catch{}trafficNodes=[];trafficCtx=null}`;
  h=h.replace(oldStart,park);

  // Let a bird call occupy the short pause between speakers instead of competing with speech.
  h=h.replace("if(i<s.dialogue.length-1)await new Promise(r=>setTimeout(r,turn.r===s.dialogue[i+1].r?70:120))","if(i<s.dialogue.length-1){trafficCtx?.__bird?.();await new Promise(r=>setTimeout(r,turn.r===s.dialogue[i+1].r?230:310))}");

  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:Arial;padding:24px">Unit 1 could not load. Please refresh.</p>';console.error(e)});
</script>
