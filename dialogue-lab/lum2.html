<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCENT Dialogue Lab · LUM Unit 2</title><style>body{margin:0;font:16px Arial;background:#eaf1f7;color:#24364a}.top{background:#17436b;color:white;padding:18px}.wrap{max-width:1120px;margin:20px auto;padding:0 18px}.card{background:white;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 10px 35px #143a6022}h1,h2{color:#143a60}.ey{font-size:12px;font-weight:700;color:#c67b00;text-transform:uppercase}.bar{display:flex;gap:12px;align-items:center}.prog{height:8px;background:#e5ecf2;flex:1;border-radius:8px}.prog span{display:block;height:100%;background:#c67b00;border-radius:8px}.stage{min-height:470px;border:1px solid #ccd9e4;border-radius:14px;padding:26px;margin-top:15px}.turn{padding:10px 12px;border-radius:10px;margin:8px 0}.neeti{background:#f5f0fb;border-left:4px solid #8162b5}.arjun{background:#eef5fb;border-left:4px solid #27679d}.line{font-size:17px;line-height:1.5;margin:9px 0}.coach,.practice,.feedback{margin-top:14px;padding:14px;border:1px solid #d7e1eb;border-radius:12px;background:#f7fafc}.practice{background:#f5fbff}.cloze{white-space:pre-line;background:white;border-left:4px solid #c67b00;padding:10px;margin-top:8px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.p{background:#143a60;color:white}.s{background:#edf4fb;color:#143a60}.d{background:#b42318;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.score{text-align:center;background:white;padding:7px;border-radius:8px}.score span{display:block;font-size:10px}.next{border-left:4px solid #c67b00;background:#fff8e8;padding:10px;margin-top:10px}@media(max-width:700px){.scores{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><b style="font-size:22px">ASCENT</b><div>Dialogue Lab · Level 5–6 · LUM</div></div><div class="wrap"><div class="card"><div class="ey">LUM Unit 2</div><h1>Reviewing Recent Experience and Current Activity</h1><p>Give clear progress updates, talk about duration honestly, and choose the right form for finished and unfinished time.</p></div><div class="card"><div id="start"><h2>Ready for Unit 2?</h2><button id="startBtn" class="btn p" disabled>Start Unit 2</button><div id="startStatus"></div></div><div id="lesson" hidden><div class="bar"><b id="count"></b><div class="prog"><span id="fill"></span></div><button id="replay" class="btn s">Hear again</button></div><div class="stage"><div id="k" class="ey"></div><h2 id="t"></h2><div id="body"></div></div><div class="coach"><b>ASCENT Coach</b><div id="coachState">Ready.</div></div><div id="practice" class="practice" hidden><div id="label" class="ey"></div><b id="prompt"></b><div id="cloze" class="cloze"></div><div id="think"></div><div id="timer"></div><div id="recordState"></div><div class="actions"><button id="record" class="btn p" hidden>🎤 Record my answer</button><button id="stop" class="btn d" hidden>Stop & get feedback</button></div></div><div id="feedback" class="feedback" hidden></div><div class="actions"><button id="prev" class="btn s">← Previous</button><button id="next" class="btn p" disabled>Next →</button></div><div id="status"></div></div></div></div><audio id="audio"></audio><script>const SK='ascent_student_session',API='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/ascent-dialogue-lab',VAPI='https://vtqatrhwfvzyodiftvkc.supabase.co/functions/v1/ascent-dialogue-voice',KEY='sb_publishable_IJJ9AW79DhOsWlsPK_8pkg_q5Fh7643',$=x=>document.getElementById(x),audio=$('audio');let sess,si=0,pi=0,stream,rec,chunks=[],started=0,tick,maxStop,attempt=1,url='',playing=false,cache=new Map(),amb=[];const R=(label,q,c,think,secs,target)=>({label,q,c,think,secs,target});const D1=[['neeti','Did you finally get something to eat?'],['arjun','Just about. The queue was ridiculous.'],['neeti','Same. Anyway, how’s the placement prep going?'],['arjun','Better. I’ve updated my CV and practised most of the HR questions so far.'],['neeti','That’s more than I’ve done. I haven’t fixed my summary yet.'],['arjun','Really? I thought you’d already finished the CV.'],['neeti','Almost. What about company research?'],['arjun','I’ve already looked at the three companies coming next week.'],['neeti','Okay! You’re ahead of me there. I haven’t started that yet.'],['arjun','Well, I still haven’t worked on their likely interview questions.'],['neeti','Good. So I’m not completely behind.']];const D2=[['arjun','How long have you been preparing properly?'],['neeti','Properly? For about three weeks. Before that I was just telling myself I was preparing.'],['arjun','I know that kind of preparation.'],['neeti','What about you?'],['arjun','Since the beginning of the term, more or less. So, about six weeks now.'],['neeti','Have you had any actual interviews yet?'],['arjun','No. Only mock interviews so far.'],['neeti','Same here. I guess I haven’t done that badly then.'],['arjun','Not at all. The mocks have helped me a lot.'],['neeti','In what way?'],['arjun','My answers are clearer now, and I’m giving better examples.']];const D3=[['neeti','What did you work on last week?'],['arjun','Mostly my CV. I rewrote the summary and fixed the project section.'],['neeti','And this week?'],['arjun','This week I’ve researched two companies and done two timed answers.'],['neeti','That’s decent. I only started company research yesterday.'],['arjun','How much have you done today?'],['neeti','I’ve read one company profile and made a page of notes so far.'],['arjun','Nice. What’s next?'],['neeti','One more company tonight. Then I’m done for the day.'],['arjun','Coffee before that?'],['neeti','Definitely.']];const S=[{k:'OPENING',t:'Where do things stand now?',b:['A manager may ask: “Where are we with the presentation?”','A useful answer explains what is finished, what is pending, what has already happened, and what comes next.'],n:'Imagine your manager asks, “Where are we with the presentation?” You probably cannot answer with just “done” or “not done”. You need to explain what is finished, what is still pending, what you have already done, and what happens next. That is what we are going to practise today.'},{k:'KP1 · WATCH FIRST',t:'Giving a progress update',d:D1,p:[R('Comprehension','What has Arjun completed so far?','Give two details.',4,18,'Use accurate details from the conversation.'),R('Comprehension','What has Neeti not completed yet?','Answer in one clear sentence.',4,16,'Use the correct pending detail.')]},{k:'KP1 · NOTICE',t:'SO FAR · YET · ALREADY',b:['SO FAR = progress up to this point. The work is still continuing.','YET = it has not happened, but it is still expected.','ALREADY = it has happened earlier than the listener may expect; it can reassure.','Do not force ALREADY. Use it when it adds meaning.'],n:'So far means up to this point, while the activity is still continuing. Yet tells us something has not happened but is still expected. Already tells the listener that some work is done, often earlier than expected. Use already only when it adds meaning; do not force it into every answer.',p:[R('Your update','Give a short update on one project, assignment or placement task.','I’ve completed ___ so far.\nI haven’t ___ yet.\nI’ve already ___.',10,35,'Use so far, yet and already naturally.')]},{k:'KP2 · WATCH FIRST',t:'Talking about duration and limits',d:D2,p:[R('Comprehension','How long has Neeti been preparing properly?','Answer with the duration.',3,12,'Use the correct duration.'),R('Comprehension','What interview exposure has Arjun had so far?','State the limitation accurately.',3,15,'Use the correct detail.')]},{k:'KP2 · NOTICE',t:'FOR · SINCE · ONLY',b:['SINCE = starting point: since June, since Monday, since the term began.','FOR = length of time: for six weeks, for two months, for an hour.','ONLY = narrows a claim honestly when the limitation matters.','Do not use ONLY when it weakens a readiness answer unnecessarily.'],n:'Since gives the starting point. For gives the length of time. Only can narrow a claim honestly. For example, “I’ve worked only on academic projects so far.” But do not use only when it makes a perfectly good readiness answer sound weaker than it is.',p:[R('Duration','How long have you been preparing for placements, working on a project, or studying your specialisation?','I’ve been ___ since ___.\nI’ve been ___ for ___.',8,28,'Use since for a starting point and for for a duration.'),R('Honest limitation','What practical exposure have you had so far?','Use ONLY only if the limitation matters.',8,28,'Use only accurately without unnecessary self-weakening.')]},{k:'KP3 · WATCH FIRST',t:'Finished time vs time still continuing',d:D3,p:[R('Comprehension','What did Arjun work on last week?','Give the two CV tasks.',4,16,'Use accurate past details.'),R('Comprehension','What has Arjun done this week?','Give the two current-week activities.',4,18,'Use accurate unfinished-time details.')]},{k:'KP3 · NOTICE',t:'Simple Past or Present Perfect?',b:['FINISHED TIME → Simple Past: “I applied to one company last week.”','TIME STILL CONTINUING → Present Perfect: “I’ve applied to three companies this week.”','Yesterday is finished. Today is still continuing.','Last semester is finished. This semester is still continuing.'],n:'Use the Simple Past with a finished time period. Use the Present Perfect when the time period is still continuing. So we say, “I studied for four hours yesterday,” but “I have studied for two hours today.”',p:[R('Compare the time periods','Compare one finished period with one period that is still continuing.','Last week, I ___.\nThis week, I’ve ___.',8,30,'Use Simple Past for finished time and Present Perfect for continuing time.')]},{k:'FINAL PRODUCTION',t:'Where are you currently with your placement or career preparation?',b:['What have you completed?','What is still pending?','How long have you been preparing?','Is there any honest limitation that matters?','What will you do next?'],n:'Now give one complete progress update. Do not try to use every expression. Build the message first, then use the grammar that naturally fits.',p:[R('Mastery','Where are you currently with your placement or career preparation?','Speak for 45 to 60 seconds. No sentence starters.',15,60,'Give a clear current-status update using Unit 2 language naturally.')]},{k:'TAKEAWAY',t:'Build the message first',b:['SO FAR — progress up to now','YET — something is pending','ALREADY — earlier than expected or reassurance','FOR — length of time','SINCE — starting point','ONLY — honest limitation','Finished time → Simple Past','Continuing time → Present Perfect'],n:'Do not build your message around the grammar. Build the message first. Then use the grammar that naturally fits.'}];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{sess=JSON.parse(localStorage.getItem(SK)||'null')}catch{}return !!sess?.sessionToken}async function valid(){if(!load())return false;try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({action:'PROFILE',session_token:sess.sessionToken})}),d=await r.json();return r.ok&&d.ok}catch{return false}}async function speak(text,role='coach'){let r=await fetch(VAPI,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({action:'SPEAK',session_token:sess.sessionToken,text,role})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Voice failed');let s=atob(d.audio_base64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:'audio/mpeg'})}async function play(b){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);audio.src=url;await audio.play();return new Promise(r=>{audio.onended=r;audio.onerror=r})}const C=[['https://opengameart.org/sites/default/files/children.wav',.018,.036],['https://opengameart.org/sites/default/files/group_giggling.ogg',.006,.018],['https://opengameart.org/sites/default/files/amb_outdoor1_loop.mp3',.018,.03]];function ambStart(){amb=C.map(x=>{let a=new Audio(x[0]);a.loop=true;a.preload='auto';a.volume=x[1];a.dataset.s=x[1];a.dataset.g=x[2];a.play().catch(()=>{});return a})}function ambVol(gap=false){for(let a of amb)a.volume=+(gap?a.dataset.g:a.dataset.s)}function ambStop(){for(let a of amb){a.pause();a.src=''}amb=[]}async function dialog(s){if(playing)return;playing=true;$('replay').disabled=true;try{let clips=cache.get(si);if(!clips){$('coachState').textContent='Preparing the canteen conversation…';clips=await Promise.all(s.d.map(x=>speak(x[1],x[0])));cache.set(si,clips)}ambStart();for(let i=0;i<s.d.length;i++){ambVol(false);$('coachState').textContent=(s.d[i][0]=='neeti'?'Neeti':'Arjun')+' is speaking…';await play(clips[i]);if(i<s.d.length-1){ambVol(true);await new Promise(r=>setTimeout(r,280))}}$('coachState').textContent='Conversation complete. Now answer the questions.';pi=0;practice()}catch(e){$('status').textContent=e.message}finally{ambStop();playing=false;$('replay').disabled=false}}function render(){let s=S[si];$('count').textContent=`Unit 2 · Part ${si+1} of ${S.length}`;$('fill').style.width=((si+1)/S.length*100)+'%';$('k').textContent=s.k;$('t').textContent=s.t;$('feedback').hidden=true;$('practice').hidden=true;$('next').disabled=true;$('prev').disabled=si==0;pi=0;if(s.d){$('body').innerHTML=s.d.map(x=>`<div class="turn ${x[0]}"><b>${x[0]=='neeti'?'Neeti':'Arjun'}:</b> ${esc(x[1])}</div>`).join('');dialog(s)}else{$('body').innerHTML=(s.b||[]).map(x=>`<div class=line>${esc(x)}</div>`).join('');narrate()}}async function narrate(){let s=S[si];try{if(s.n){$('coachState').textContent='Listen. You can read while Marin speaks.';await play(await speak(s.n))}s.p?.length?practice():$('next').disabled=false}catch(e){$('status').textContent=e.message;s.p?.length?practice():$('next').disabled=false}}function practice(){let s=S[si],p=s.p?.[pi];if(!p){$('practice').hidden=true;$('next').disabled=false;return}$('practice').hidden=false;$('label').textContent=p.label;$('prompt').textContent=p.q;$('cloze').textContent=p.c||'';$('feedback').hidden=true;$('record').hidden=true;$('stop').hidden=true;attempt=1;let left=p.think;$('think').textContent=`Think first: ${left} seconds`;let iv=setInterval(()=>{if(--left>0)$('think').textContent=`Think first: ${left} seconds`;else{clearInterval(iv);$('think').textContent='Ready. Record your answer.';$('record').hidden=false;$('record').disabled=false;$('recordState').textContent=`You have up to ${p.secs} seconds.`}},1000)}async function recStart(){let p=S[si].p[pi];try{if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();started=Date.now();$('record').disabled=true;$('stop').hidden=false;let left=p.secs;$('timer').textContent=left+'s';tick=setInterval(()=>{$('timer').textContent=(--left)+'s';if(left<=0)recStop()},1000);maxStop=setTimeout(recStop,(p.secs+1)*1000)}catch{$('recordState').textContent='Microphone access is blocked.'}}async function recStop(){if(!rec||rec.state=='inactive')return;clearInterval(tick);clearTimeout(maxStop);let duration=Date.now()-started,done=new Promise(r=>rec.addEventListener('stop',r,{once:true}));rec.stop();await done;$('recordState').textContent='Preparing feedback…';await evaluate(new Blob(chunks,{type:rec.mimeType}),duration)}async function evaluate(blob,duration){let p=S[si].p[pi],fd=new FormData();for(let [k,v] of [['action','EVALUATE'],['session_token',sess.sessionToken],['duration_ms',duration],['pathway','lum5_6'],['module','2'],['title','Reviewing Recent Experience and Current Activity'],['stage',`${si+1}.${pi+1} ${p.label}`],['prompt',p.q],['cloze',p.c||''],['feedback_focus','Fluency, continuity, task response and LUM Unit 2 language use.'],['target_check',p.target],['attempt_no',attempt]])fd.append(k,String(v));fd.append('audio',blob,'response.webm');try{let r=await fetch(API,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY},body:fd}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Feedback failed');feedback(d,p)}catch(e){$('recordState').textContent=e.message;$('record').disabled=false}}function sb(n,o){return `<div class=score><span>${n}</span><b>${o.score}/5</b></div>`}function feedback(d,p){$('feedback').hidden=false;$('feedback').innerHTML=`<div class=scores>${sb('Clarity',d.clarity)}${sb('Fluency',d.fluency)}${sb('Structure',d.structure)}${sb('Grammar',d.grammar)}${sb('Task',d.task_completion)}${sb('LUM target',d.target_accuracy)}</div><div class=next><b>ONE Next Fix</b><br>${esc(d.next_fix)}<br><br><b>Do this now</b><br>${esc(d.retry_instruction)}</div><div class=actions id=fa></div>`;let b=document.createElement('button');b.className='btn p';if(attempt==1){b.textContent='Retry the SAME answer';b.onclick=()=>{attempt=2;$('feedback').hidden=true;$('record').hidden=false;$('record').disabled=false}}else{b.textContent=pi<S[si].p.length-1?'Next question':'Continue lesson';b.onclick=()=>{pi++;practice()}};$('fa').appendChild(b)}$('record').onclick=recStart;$('stop').onclick=recStop;$('replay').onclick=()=>S[si].d?dialog(S[si]):narrate();$('next').onclick=()=>{if(si<S.length-1){si++;render()}else location.href='./home.html'};$('prev').onclick=()=>{if(si){si--;render()}};$('startBtn').onclick=()=>{$('start').hidden=true;$('lesson').hidden=false;render()};(async()=>{let ok=await valid();$('startBtn').disabled=!ok;$('startStatus').textContent=ok?'Administrator test access active.':'Open Dialogue Lab from ASCENT Admin first.'})();</script></body></html>
