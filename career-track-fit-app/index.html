<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Track Fit | Placement Readiness Diagnostic</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">CT</div>
      <div>
        <div class="brand-name">Career Track Fit</div>
        <div class="brand-sub">Placement Readiness Diagnostic</div>
      </div>
    </div>
    <div class="top-actions"><div id="globalTimer" class="timer hidden" aria-live="polite">60:00</div><button id="restartBtn" class="ghost hidden">Start again</button></div>
  </header>

  <main id="app" class="shell"></main>

  <template id="welcomeTemplate">
    <section class="hero card">
      <span class="eyebrow">For second-year placement preparation</span>
      <h1>How ready are you for the career track you are targeting?</h1>
      <p class="lead">A strict 60-minute diagnostic of reasoning, role-fit, communication and work-style alignment.</p>
      <div class="callout">
        <strong>The clock starts only after you choose your target career track.</strong>
        <span>The assessment auto-submits at 60:00. Each section also has its own fixed time limit, so move steadily and do not leave the browser.</span>
      </div>
      <div class="flow-grid">
        <div><b>30</b><span>min · Common core</span></div>
        <div><b>10</b><span>min · Track module</span></div>
        <div><b>12</b><span>min · Writing tasks</span></div>
        <div><b>8</b><span>min · Work-style</span></div>
      </div>
      <p class="fineprint"><strong>Communication:</strong> the writing tasks test TELW 1.0 structure and TELW 2.0 adaptation when new information changes the situation.</p>
      <button id="beginBtn" class="primary">Choose my target track</button>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="expanded-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
