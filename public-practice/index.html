<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ClarionPrep · Practice</title><style>:root{--n:#102a43;--b:#27679d;--g:#c67b00;--t:#243b53;--m:#687a8d;--l:#d7e1eb;--bg:#f3f7fa;--ok:#176b44;--bad:#a43d3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:22px}.shell{width:min(860px,calc(100% - 30px));margin:auto}.card{margin:22px 0;background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 14px 38px rgba(16,42,67,.08)}h1,h2{margin-top:0}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--g)}.question{font-size:22px;line-height:1.5;color:var(--n);font-weight:800;margin:12px 0 18px}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--n);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#edf4f9;color:var(--n)}.btn.red{background:#a43d3d}.btn:disabled{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:12px;color:var(--m);line-height:1.5}.meter{height:12px;border-radius:99px;background:#e7edf2;overflow:hidden;margin:8px 0}.meter>div{height:100%;background:var(--b);width:0}.usage{font-size:13px;color:var(--m)}.feedback{margin-top:18px;padding:18px;border-radius:14px;background:#f7fafc;border:1px solid var(--l)}.score{font-size:38px;font-weight:900;color:var(--n)}.feedback p{line-height:1.6}.transcript{padding:12px;border-radius:10px;background:#fff;border:1px solid var(--l);font-size:14px;line-height:1.55}.error{color:var(--bad)}.success{color:var(--ok)}[hidden]{display:none!important}</style></head><body><header><div class="shell"><strong>CLARIONPREP</strong><div id="sub">Paid practice</div></div></header><main class="shell"><section class="card"><div id="eyebrow" class="eyebrow"></div><h1 id="title"></h1><div id="question" class="question">Checking access…</div><div class="row"><button id="hear" class="btn secondary" disabled>Hear prompt</button><button id="record" class="btn" disabled>Start recording</button><button id="stop" class="btn red" disabled>Stop</button><button id="next" class="btn secondary" disabled>Next</button></div><audio id="playback" controls hidden style="width:100%;margin-top:14px"></audio><div id="status" class="status"></div></section><section class="card"><div class="eyebrow">Usage</div><div class="meter"><div id="meterFill"></div></div><div id="usage" class="usage">Checking usage…</div></section><section id="feedback" class="card" hidden><div class="eyebrow">Feedback</div><div id="score" class="score"></div><p><strong>Strongest point:</strong> <span id="strong"></span></p><p><strong>Priority improvement:</strong> <span id="priority"></span></p><p><strong>Next tip:</strong> <span id="tip"></span></p><p><strong>Improved version:</strong></p><div id="improved" class="transcript"></div><p><strong>What you said:</strong></p><div id="transcript" class="transcript"></div></section></main><script>const API='https://zmopmjosykiwctrvhsmo.supabase.co/functions/v1/clarion-public-practice',$=id=>document.getElementById(id),q=new URLSearchParams(location.search),raw=(q.get('mode')||'pi').toLowerCase(),mode=raw==='gd'?'gd':raw==='pcl'?'pcl':'pi',product=mode==='gd'?'GD_PRACTICE':mode==='pcl'?'PCL':'PI_PRACTICE';let token=q.get('clarion_token')||localStorage.getItem('clarion_entitlement_'+product)||'',device=q.get('clarion_device')||localStorage.getItem('clarion_device_v1')||'',idx=0,question='',rec=null,stream=null,chunks=[],startedAt=0;function setStatus(m,t=''){const e=$('status');e.textContent=m||'';e.className='status'+(t?' '+t:'')}async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,mode,product_code:product,entitlement_token:token,device_id:device,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.message||'Practice could not continue.');return d}function usage(u){if(!u)return;const lim=Number(u.usage_limit||1200),used=Number(u.usage_used||0),rem=Math.max(0,lim-used);$('meterFill').style.width=Math.min(100,used/lim*100)+'%';$('usage').textContent=`${Math.floor(rem/60)}h ${rem%60}m remaining · access ends ${new Date(u.expires_at).toLocaleDateString('en-IN')}`;}async function loadQuestion(){setStatus('Loading…');$('feedback').hidden=true;try{const d=await call('QUESTION',{index:idx});question=d.question;$('question').textContent=question;usage(d.usage);$('hear').disabled=false;$('record').disabled=false;$('next').disabled=false;setStatus('Record your response when ready.')}catch(e){setStatus(e.message,'error');$('question').textContent='Access unavailable.'}}function speak(){if(!question||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(question);u.lang='en-IN';speechSynthesis.speak(u)}async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';rec=new MediaRecorder(stream,{mimeType:mime});chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onstop=submit;startedAt=Date.now();rec.start(400);$('record').disabled=true;$('stop').disabled=false;$('next').disabled=true;setStatus('Recording…','success')}catch(e){setStatus('Microphone access is required.','error')}}function stop(){if(rec&&rec.state!=='inactive')rec.stop()}function toBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(blob)})}async function submit(){const blob=new Blob(chunks,{type:rec?.mimeType||'audio/webm'});stream?.getTracks().forEach(t=>t.stop());$('stop').disabled=true;setStatus('Transcribing and evaluating…');$('playback').src=URL.createObjectURL(blob);$('playback').hidden=false;try{const b64=await toBase64(blob),d=await call('EVALUATE',{question,audio_base64:b64,audio_mime:blob.type,duration_seconds:Math.max(1,Math.round((Date.now()-startedAt)/1000))}),f=d.feedback||{};$('score').textContent=(f.score??'—')+'/100';$('strong').textContent=f.strongest_point||'';$('priority').textContent=f.priority_improvement||'';$('tip').textContent=f.next_tip||'';$('improved').textContent=f.improved_version||'';$('transcript').textContent=d.transcript||'';$('feedback').hidden=false;usage(d.usage);setStatus('Feedback ready.','success')}catch(e){setStatus(e.message,'error')}finally{$('record').disabled=false;$('next').disabled=false}}$('hear').onclick=speak;$('record').onclick=start;$('stop').onclick=stop;$('next').onclick=()=>{idx++;loadQuestion()};const labels=mode==='gd'?['Group Discussion Practice','GD Practice']:mode==='pcl'?['Professional Communication Lab','PCL']:['Personal Interview Practice','PI Practice'];$('title').textContent=labels[0];$('eyebrow').textContent=labels[1];$('sub').textContent=labels[0];if(token&&device){localStorage.setItem('clarion_entitlement_'+product,token);localStorage.setItem('clarion_device_v1',device);history.replaceState(null,'',location.pathname+'?mode='+mode);loadQuestion()}else{location.replace('/subscribe/?product='+product)}</script></body></html>
