<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Presentation Skills · Access</title><style>:root{--n:#122d49;--g:#d79c2f;--bg:#edf3f7;--line:#d7e1e9;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(140deg,#0d263e,#224e73);color:#20364b}.card{width:min(460px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 26px 70px #07172688}.brand{font-weight:900;color:var(--n);font-size:25px}.brand span{color:var(--g)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:900;color:#8b641c;margin-top:32px}h1{font-size:34px;line-height:1.05;color:var(--n);margin:9px 0}p{line-height:1.55;color:#607181}label{display:block;font-size:12px;font-weight:800;color:var(--n);margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--n);color:#fff;font-weight:900;font-size:15px;margin-top:18px;cursor:pointer}.status{min-height:22px;margin-top:12px;color:var(--red);font-weight:700;font-size:13px}</style></head><body><main class="card"><div class="brand">CLARION<span>PREP</span></div><p class="eyebrow">Private learning app</p><h1>Presentation Skills</h1><p>Use the login details assigned to you. Signing in on a new device will sign out the previous device.</p><form id="form"><label for="login">Login ID</label><input id="login" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button>Open my course</button><div id="status" class="status" aria-live="polite"></div></form></main><script>const DEVICE='presentation_skills_device';function device(){let d=localStorage.getItem(DEVICE);if(!d){d=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem(DEVICE,d)}return d}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),s=document.getElementById('status');b.disabled=true;s.textContent='Checking access…';try{const r=await fetch('/presentation-skills/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({login_id:document.getElementById('login').value,password:document.getElementById('password').value,device_id:device()})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Access could not be opened.');location.replace('/presentation-skills/unit-1.html')}catch(x){s.textContent=x.message||'Access could not be opened.';b.disabled=false}};</script></body></html>
